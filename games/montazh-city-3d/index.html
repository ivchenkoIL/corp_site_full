function roundRect(x, c, rx, ry, w, h, r) {
  c.beginPath();
  c.moveTo(rx + r, ry);
  c.arcTo(rx + w, ry, rx + w, ry + h, r);
  c.arcTo(rx + w, ry + h, rx, ry + h, r);
  c.arcTo(rx, ry + h, rx, ry, r);
  c.arcTo(rx, ry, rx + w, ry, r);
  c.closePath();
}
const Mini = {
  g: null, cv: null, cx: null, w: 0, h: 0, dpr: 1, onDone: null, t: 0,
  open(game, onDone) {
    this.g = game; this.onDone = onDone; this.t = 0;
    this.cv = $('miniCanvas'); this.cx = this.cv.getContext('2d');
    S.screen = 'mini';
    $('mini').classList.add('show');
    $('miniTitle').textContent = game.title;
    this.resize();
    game.layout(this.w, this.h);
    if (game.init) game.init();
    this.sync();
    Audio2.select();
  },
  resize() {
    const r = $('stage').getBoundingClientRect();
    this.dpr = Math.min(2, window.devicePixelRatio || 1);
    this.w = Math.max(320, Math.floor(r.width)); this.h = Math.max(240, Math.floor(r.height));
    this.cv.width = Math.floor(this.w * this.dpr); this.cv.height = Math.floor(this.h * this.dpr);
    this.cv.style.width = this.w + 'px'; this.cv.style.height = this.h + 'px';
    this.cx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    if (this.g && this.g.layout) this.g.layout(this.w, this.h);
  },
  close() {
    $('mini').classList.remove('show');
    $('miniBtns').innerHTML = '';
    this.g = null; S.screen = 'play';
  },
  finish(q) {
    const cb = this.onDone; const qq = clamp(Math.round(q), 0, 100);
    this.close();
    if (cb) cb(qq);
  },
  sync() {
    const g = this.g; if (!g) return;
    $('miniPhase').textContent = g.phaseName();
    $('miniHint').innerHTML = g.hint();
    const q = clamp(g.q, 0, 100);
    $('miniQBar').style.width = q + '%';
    $('miniQNum').textContent = Math.round(q);
    const btns = g.buttons ? g.buttons() : [];
    const box = $('miniBtns');
    const sig = btns.map(b => b.label + (b.disabled ? '!' : '')).join('|');
    if (box.dataset.sig !== sig) {
      box.dataset.sig = sig; box.innerHTML = '';
      btns.forEach(b => {
        const el = document.createElement('button');
        el.className = 'btn sm ' + (b.cls || '');
        el.type = 'button'; el.textContent = b.label; el.disabled = !!b.disabled;
        el.addEventListener('click', e => { e.stopPropagation(); Audio2.click(); b.fn(); });
        box.appendChild(el);
      });
    }
  },
  update(dt) {
    if (!this.g) return;
    this.t += dt;
    /* «пьяный» курсор и усталость */
    const p = S.player;
    const jx = p.drunk > 5 ? Math.sin(this.t * 3.7) * p.drunk * 0.16 + Math.sin(this.t * 9.1) * p.drunk * 0.06 : 0;
    const jy = p.drunk > 5 ? Math.cos(this.t * 3.1) * p.drunk * 0.14 : 0;
    const tired = p.stamina < 25 ? Math.sin(this.t * 5.3) * (25 - p.stamina) * 0.12 : 0;
    this.mx = Input.mx + jx + tired; this.my = Input.my + jy;
    this.g.update(dt, this);
    this.sync();
  },
  draw() {
    if (!this.g) return;
    const c = this.cx;
    c.clearRect(0, 0, this.w, this.h);
    const bg = c.createLinearGradient(0, 0, 0, this.h);
    bg.addColorStop(0, '#241041'); bg.addColorStop(0.55, '#160a2a'); bg.addColorStop(1, '#0b0518');
    c.fillStyle = bg; c.fillRect(0, 0, this.w, this.h);
    c.save();
    c.globalAlpha = 0.1; c.strokeStyle = '#8a2be2'; c.lineWidth = 1;
    for (let x = 0; x < this.w; x += 40) { c.beginPath(); c.moveTo(x, 0); c.lineTo(x, this.h); c.stroke(); }
    for (let y = 0; y < this.h; y += 40) { c.beginPath(); c.moveTo(0, y); c.lineTo(this.w, y); c.stroke(); }
    c.restore();
    this.g.draw(c, this.w, this.h, this);
    /* курсор */
    if (this.mx != null) {
      c.save();
      c.strokeStyle = '#ffd23f'; c.lineWidth = 2;
      c.beginPath(); c.arc(this.mx, this.my, 9, 0, TAU); c.stroke();
      c.beginPath(); c.moveTo(this.mx - 14, this.my); c.lineTo(this.mx - 4, this.my);
      c.moveTo(this.mx + 4, this.my); c.lineTo(this.mx + 14, this.my);
      c.moveTo(this.mx, this.my - 14); c.lineTo(this.mx, this.my - 4);
      c.moveTo(this.mx, this.my + 4); c.lineTo(this.mx, this.my + 14); c.stroke();
      c.restore();
    }
  },
  click() { return Input.mclick && this.my < this.h - 74 && this.my > 58; }
};

function startDoorGame(onDone) {
  const DEVS = [
    { id: 'ctrl', name: 'Контроллер', tok: '' },
    { id: 'read', name: 'Считыватель', tok: 'B' },
    { id: 'exit', name: 'Кнопка выхода', tok: 'C' },
    { id: 'lock', name: 'Замок', tok: 'D' }
  ];
  const g = {
    title: 'МОНТАЖ СКУД: ДВЕРЬ', q: 100, phase: 0, t: 0,
    devs: DEVS.map(d => Object.assign({ placed: false }, d)),
    slots: [], tray: [], held: null, sel: 0, slotSel: 0,
    nodes: [], links: [], selNode: null, shorts: 0, misses: 0,
    test: -1, log: [], finished: false,
    layout(w, h) {
      const bw = Math.min(880, w - 120), bh = Math.min(430, h - 210);
      const bx = (w - bw) / 2, by = 74 + (h - 150 - bh) / 2;
      this.board = { x: bx, y: by, w: bw, h: bh };
      const doorW = bw * 0.32;
      this.door = { x: bx + 34, y: by + 62, w: doorW, h: bh - 132 };
      const px = bx + doorW + 96, pw = bw - doorW - 130;
      this.panel = { x: px, y: by + 62, w: pw, h: bh - 132 };
      const sw = 108, sh = 62;
      this.slots = [
        { id: 'ctrl', label: 'Контроллер', x: px + pw / 2 - sw / 2, y: by + 82, w: sw, h: sh },
        { id: 'read', label: 'Считыватель', x: this.door.x + this.door.w + 12, y: this.door.y + 70, w: sw * 0.72, h: sh * 0.72 },
        { id: 'exit', label: 'Кнопка выхода', x: this.door.x + 14, y: this.door.y + this.door.h - 84, w: sw * 0.66, h: sh * 0.66 },
        { id: 'lock', label: 'Замок', x: this.door.x + this.door.w / 2 - sw * 0.4, y: this.door.y + 12, w: sw * 0.8, h: sh * 0.42 }
      ];
      const tw = 128, ty = by + bh - 4;
      this.tray = this.devs.map((d, i) => ({ id: d.id, x: bx + 20 + i * (tw + 12), y: ty, w: tw, h: 44 }));
      this.psu = { x: px + pw - 92, y: by + bh - 150, w: 76, h: 54 };
      this.rebuildNodes();
    },
    rebuildNodes() {
      const s = id => this.slots.find(v => v.id === id);
      const c = s('ctrl');
      this.nodes = [
        { id: 'c_A', tok: 'A', x: c.x + 14, y: c.y + c.h + 12, own: 'ctrl' },
        { id: 'c_B', tok: 'B', x: c.x + 42, y: c.y + c.h + 12, own: 'ctrl' },
        { id: 'c_C', tok: 'C', x: c.x + 70, y: c.y + c.h + 12, own: 'ctrl' },
        { id: 'c_D', tok: 'D', x: c.x + 96, y: c.y + c.h + 12, own: 'ctrl' },
        { id: 'psu_A', tok: 'A', x: this.psu.x + this.psu.w / 2, y: this.psu.y - 10, own: 'psu' },
        { id: 'read_B', tok: 'B', x: s('read').x + s('read').w / 2, y: s('read').y + s('read').h + 10, own: 'read' },
        { id: 'exit_C', tok: 'C', x: s('exit').x + s('exit').w + 13, y: s('exit').y + s('exit').h / 2, own: 'exit' },
        { id: 'lock_D', tok: 'D', x: s('lock').x + s('lock').w + 13, y: s('lock').y + s('lock').h / 2, own: 'lock' }
      ];
    },
    phaseName() { return ['ЭТАП 1 — РАЗМЕЩЕНИЕ', 'ЭТАП 2 — КОММУТАЦИЯ', 'ЭТАП 3 — ПРОВЕРКА'][this.phase] || 'ГОТОВО'; },
    hint() {
      if (this.phase === 0) return 'Расставь оборудование по местам: клик по прибору внизу, затем клик по контуру. С клавиатуры: <b>←/→</b> — прибор, <b>↑/↓</b> — место, <b>E</b> — поставить. Ошибка стоит качества.';
      if (this.phase === 1) return 'Соедини одинаковые метки: <b>A</b>—питание, <b>B</b>—считыватель, <b>C</b>—кнопка, <b>D</b>—замок. Разные метки = короткое замыкание. Замыканий: <b>' + this.shorts + '/3</b>';
      if (this.phase === 2) return 'Жми <b>«Запустить проверку»</b> — посмотрим, откроется ли дверь и запишется ли проход.';
      return 'Готово.';
    },
    buttons() {
      if (this.phase === 1) return [{ label: 'Сбросить последний провод', cls: '', disabled: !this.links.length, fn: () => { this.links.pop(); this.q = clamp(this.q - 2, 0, 100); } }];
      if (this.phase === 2 && this.test < 0) return [{ label: 'Запустить проверку', cls: 'c', fn: () => { this.test = 0; this.log = []; Audio2.click(); } }];
      if (this.phase === 3) return [{ label: 'Закончить и сдать', cls: 'y', fn: () => Mini.finish(this.q) }];
      return [];
    },
    init() { this.t = 0; },
    update(dt, M) {
      this.t += dt;
      const click = Mini.click();
      if (this.phase === 0) {
        /* клавиатура */
        const freeDevs = this.devs.filter(d => !d.placed);
        if (freeDevs.length && this.devs[this.sel].placed) {
          this.sel = this.devs.indexOf(freeDevs[0]);
        }
        if (Input.anyHit(K.left) || Input.anyHit(K.right)) {
          const dir = Input.anyHit(K.right) ? 1 : -1;
          for (let i = 0; i < this.devs.length; i++) {
            this.sel = (this.sel + dir + this.devs.length) % this.devs.length;
            if (!this.devs[this.sel].placed) break;
          }
          Audio2.click();
        }
        if (Input.anyHit(K.up) || Input.anyHit(K.down)) {
          const dir = Input.anyHit(K.down) ? 1 : -1;
          this.slotSel = (this.slotSel + dir + this.slots.length) % this.slots.length;
          Audio2.click();
        }
        if (Input.anyHit(K.act)) this.tryPlace(this.devs[this.sel].id, this.slots[this.slotSel].id);
        if (click) {
          const tr = this.tray.find(t => hitRect(M.mx, M.my, t) && !this.devs.find(d => d.id === t.id).placed);
          if (tr) { this.held = tr.id; Audio2.click(); }
          else if (this.held) {
            const sl = this.slots.find(s => hitRect(M.mx, M.my, s, 12));
            if (sl) { this.tryPlace(this.held, sl.id); this.held = null; }
          }
        }
        if (this.devs.every(d => d.placed)) {
          this.phase = 1; Audio2.ok();
          toast('Оборудование на местах. Теперь коммутация', 'good', 2200);
        }
      } else if (this.phase === 1) {
        if (click) {
          const n = this.nodes.find(n => dist(M.mx, M.my, n.x, n.y) < 20);
          if (n) {
            if (!this.selNode) { this.selNode = n; Audio2.click(); }
            else if (this.selNode.id === n.id) { this.selNode = null; }
            else this.tryLink(this.selNode, n);
          } else this.selNode = null;
        }
        if (this.links.length >= 4) { this.phase = 2; Audio2.ok(); }
      } else if (this.phase === 2) {
        if (this.test >= 0) {
          const prev = this.test;
          this.test += dt;
          const stages = [0.1, 1.0, 1.9, 2.8, 3.8];
          const msgs = [
            'Подношу карту к считывателю…',
            'Контроллер думает. Думает хорошо.',
            this.q >= 55 ? 'Замок щёлкнул. Дверь открылась.' : 'Замок щёлкнул. Со второй попытки.',
            'Журнал: «' + clockStr() + ' — проход зафиксирован, карта №001».',
            'Кнопка выхода отработала. Дверь закрылась, как приличная.'
          ];
          for (let i = 0; i < stages.length; i++) {
            if (prev < stages[i] && this.test >= stages[i]) {
              this.log.push(msgs[i]);
              if (i === 2) Audio2.lock(); else Audio2.click();
            }
          }
          if (this.test > 5) { this.phase = 3; Audio2.ok(); }
        }
      } else if (this.phase === 3) {
        if (Input.anyHit(K.act)) Mini.finish(this.q);
      }
    },
    tryPlace(devId, slotId) {
      const dev = this.devs.find(d => d.id === devId);
      if (!dev || dev.placed) return;
      if (devId === slotId) {
        dev.placed = true; Audio2.screwdr();
        const sl = this.slots.find(s => s.id === slotId);
        fxMini(sl.x + sl.w / 2, sl.y + sl.h / 2);
      } else {
        this.misses++; this.q = clamp(this.q - 7, 0, 100);
        Audio2.nope();
        toast(pick(['Не туда. Совсем не туда', 'Замок на кнопку выхода — смело, но нет', 'Оно, конечно, влезет. Но не должно']), 'bad', 1600);
      }
    },
    tryLink(a, b) {
      const key = [a.id, b.id].sort().join('|');
      if (this.links.some(l => l.key === key)) { this.selNode = null; return; }
      if (this.links.some(l => l.a.id === a.id || l.b.id === a.id || l.a.id === b.id || l.b.id === b.id)) {
        toast('Эта клемма уже занята', 'bad', 1400); Audio2.nope(); this.selNode = null; return;
      }
      if (a.tok === b.tok && a.own !== b.own) {
        this.links.push({ a, b, key, tok: a.tok, spark: 0 });
        Audio2.ok(); this.selNode = null;
        fxMini((a.x + b.x) / 2, (a.y + b.y) / 2);
      } else {
        this.shorts++; this.q = clamp(this.q - 11, 0, 100);
        Audio2.spark(); shake(4);
        this.selNode = null;
        this.sparkAt = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2, t: 0.5 };
        toast(pick(['Короткое замыкание! Пахнет опытом', 'Искра, буря, безумие. И запах', 'Так делать не надо. Уже не надо']), 'bad', 1800);
        if (this.shorts >= 3) {
          this.links.length = 0; this.shorts = 0;
          this.q = clamp(this.q - 8, 0, 100);
          toast('Автомат выбило. Начинаем коммутацию заново', 'bad', 2600);
        }
      }
    },
    draw(c, w, h, M) {
      const b = this.board;
      c.save();
      /* панель схемы */
      c.fillStyle = 'rgba(12,7,24,.86)'; c.strokeStyle = 'rgba(37,232,220,.5)'; c.lineWidth = 2;
      roundRect(0, c, b.x, b.y, b.w, b.h, 10); c.fill(); c.stroke();
      c.fillStyle = 'rgba(185,166,214,.6)'; c.font = '700 11px "Trebuchet MS", sans-serif';
      c.fillText('УСЛОВНАЯ МОНТАЖНАЯ СХЕМА · ИГРОВАЯ ГОЛОВОЛОМКА', b.x + 14, b.y + 20);

      /* дверь */
      const d = this.door;
      c.fillStyle = '#2a2338'; roundRect(0, c, d.x, d.y, d.w, d.h, 4); c.fill();
      c.strokeStyle = '#6b5a86'; c.lineWidth = 3; c.stroke();
      const openAmt = this.phase === 2 && this.test > 1.9 ? clamp((this.test - 1.9) / 0.8, 0, 1) : (this.phase === 3 ? 1 : 0);
      c.fillStyle = '#0d0a16'; c.fillRect(d.x + 6, d.y + 6, d.w - 12, d.h - 12);   /* тёмный проём */
      if (openAmt > 0.05) {
        c.fillStyle = 'rgba(255,210,63,.10)';
        c.fillRect(d.x + 6, d.y + 6, (d.w - 12) * openAmt, d.h - 12);
      }
      c.save();
      c.translate(d.x + 6, d.y + 6);
      c.scale(clamp(1 - openAmt * 0.72, 0.05, 1), 1);
      c.fillStyle = '#3c3350'; c.fillRect(0, 0, d.w - 12, d.h - 12);
      c.strokeStyle = '#8f7fae'; c.lineWidth = 2; c.strokeRect(8, 8, d.w - 28, d.h - 28);
      c.fillStyle = '#ffd23f'; c.beginPath(); c.arc(d.w - 30, (d.h - 12) / 2, 5, 0, TAU); c.fill();
      c.restore();
      c.fillStyle = 'rgba(185,166,214,.55)'; c.font = '700 10px "Trebuchet MS", sans-serif';
      c.fillText('ДВЕРЬ ПОДЪЕЗДА', d.x + 4, d.y - 8);

      /* блок питания */
      c.fillStyle = '#1c1430'; c.strokeStyle = '#ff8a1f'; c.lineWidth = 2;
      roundRect(0, c, this.psu.x, this.psu.y, this.psu.w, this.psu.h, 5); c.fill(); c.stroke();
      c.fillStyle = '#ff8a1f'; c.font = '700 10px "Trebuchet MS", sans-serif';
      c.fillText('БЛОК ПИТАНИЯ', this.psu.x + 6, this.psu.y + 18);
      c.fillStyle = '#b9a6d6'; c.fillText('метка A', this.psu.x + 6, this.psu.y + 34);

      /* слоты */
      for (const s of this.slots) {
        const dev = this.devs.find(v => v.id === s.id);
        const on = dev.placed;
        c.setLineDash(on ? [] : [7, 5]);
        const aimed = this.phase === 0 && (this.held === s.id || this.slots[this.slotSel] === s);
        c.strokeStyle = on ? '#4be36b' : (aimed ? '#ffd23f' : 'rgba(185,166,214,.5)');
        c.lineWidth = on ? 2 : 2;

      const gap = Math.min(200, (w * 0.52) / n);
      const y = h / 2 - 10;
      for (let i = 0; i < n; i++) {
        const x = w * 0.62 + (i - (n - 1) / 2) * gap;
        const b = this.bolts[i], r = 66;
        c.save(); c.translate(x, y);
        c.strokeStyle = 'rgba(185,166,214,.35)'; c.lineWidth = 16;
        c.beginPath(); c.arc(0, 0, r, Math.PI * 0.75, Math.PI * 2.25); c.stroke();
        const arc = (t) => Math.PI * 0.75 + t * Math.PI * 1.5;
        c.strokeStyle = 'rgba(255,210,63,.5)'; c.lineWidth = 16;
        c.beginPath(); c.arc(0, 0, r, arc(0.3), arc(0.72)); c.stroke();
        c.strokeStyle = '#4be36b';
        c.beginPath(); c.arc(0, 0, r, arc(0.42), arc(0.6)); c.stroke();
        c.strokeStyle = '#ff4d5e'; c.lineWidth = 16;
        c.beginPath(); c.arc(0, 0, r, arc(0.72), arc(1)); c.stroke();
        if (i === this.boltIdx) {
          const a = arc(b.a);
          c.strokeStyle = '#fff'; c.lineWidth = 4;
          c.beginPath(); c.moveTo(0, 0); c.lineTo(Math.cos(a) * (r + 14), Math.sin(a) * (r + 14)); c.stroke();
        }
        c.fillStyle = b.state === 1 ? '#4be36b' : b.state === 2 ? '#ffd23f' : b.state === 3 ? '#ff4d5e' : '#2a2338';
        c.beginPath(); c.arc(0, 0, 26, 0, TAU); c.fill();
        c.strokeStyle = '#0b0518'; c.lineWidth = 3;
        c.beginPath(); c.moveTo(-13, 0); c.lineTo(13, 0); c.stroke();
        c.fillStyle = '#e9dcff'; c.font = '900 13px "Arial Black",sans-serif'; c.textAlign = 'center';
        c.fillText('КРЕПЁЖ ' + (i + 1), 0, r + 44);
        if (b.state) c.fillText(['', 'ОТЛИЧНО', 'НОРМ', 'СОРВАНО'][b.state], 0, r + 64);
        c.textAlign = 'left'; c.restore();
      }
      c.fillStyle = '#e9dcff'; c.font = '900 16px "Arial Black",sans-serif'; c.textAlign = 'center';
      c.fillText('ЗАТЯНИ КРЕПЛЕНИЯ — F В ЗЕЛЁНОМ СЕКТОРЕ', w * 0.62, 96); c.textAlign = 'left';
    },
    drawPlugs(c, w, h, M) {
      this.drawRig(c, w, h);
      const cx = w * 0.64, cy = h / 2;
      c.fillStyle = 'rgba(12,7,24,.8)'; c.strokeStyle = 'rgba(37,232,220,.4)'; c.lineWidth = 2;
      roundRect(0, c, cx - 210, cy - 120, 420, 240, 10); c.fill(); c.stroke();
      drawCamIcon(c, cx, cy - 74, 1.3, 0.15);
      this.sockets = [
        { id: 'pwr', px: cx - 90, py: cy + 10, name: 'Гнездо питания', c: '#ff8a1f' },
        { id: 'net', px: cx + 90, py: cy + 10, name: 'Гнездо сети', c: '#25e8dc' }
      ];
      /* перемешиваем расположение гнёзд один раз */
      if (this.swapSockets === undefined) this.swapSockets = Math.random() < 0.5;
      if (this.swapSockets) { const a = this.sockets[0].px; this.sockets[0].px = this.sockets[1].px; this.sockets[1].px = a; }
      for (const s of this.sockets) {
        const done = this.plugs.find(p => p.id === s.id).done;
        c.strokeStyle = s.c; c.lineWidth = 3; c.fillStyle = done ? s.c : 'rgba(0,0,0,.4)';
        c.beginPath(); c.arc(s.px, s.py, 22, 0, TAU); c.fill(); c.stroke();
        c.fillStyle = '#e9dcff'; c.font = '700 11px "Trebuchet MS",sans-serif'; c.textAlign = 'center';
        c.fillText(s.name, s.px, s.py + 40); c.textAlign = 'left';
      }
      this.plugs.forEach((p, i) => {
        p.px = cx - 120 + i * 240; p.py = cy + 110;
        if (p.done) return;
        const sel = this.plugSel === p;
        c.fillStyle = sel ? '#fff' : p.c; c.strokeStyle = p.c; c.lineWidth = 2;
        roundRect(0, c, p.px - 30, p.py - 16, 60, 32, 6); c.fill();
        c.fillStyle = '#0b0518'; c.font = '700 11px "Trebuchet MS",sans-serif'; c.textAlign = 'center';
        c.fillText(p.name, p.px, p.py + 4); c.textAlign = 'left';
        if (sel) { c.strokeStyle = '#ffd23f'; c.setLineDash([5, 4]); c.beginPath(); c.moveTo(p.px, p.py); c.lineTo(M.mx, M.my); c.stroke(); c.setLineDash([]); }
      });
      c.fillStyle = '#e9dcff'; c.font = '900 16px "Arial Black",sans-serif'; c.textAlign = 'center';
      c.fillText('ПОДКЛЮЧИ ПИТАНИЕ И СЕТЬ', cx, 96); c.textAlign = 'left';
    },
    drawAim(c, w, h) {
      /* вид сверху */
      const cx = w * 0.34, cy = h * 0.62, ppm = Math.min(13, (h * 0.4) / 16);
      c.fillStyle = 'rgba(10,6,20,.6)'; c.strokeStyle = 'rgba(185,166,214,.25)'; c.lineWidth = 1;
      for (let r = 4; r <= 16; r += 4) {
        c.beginPath(); c.arc(cx, cy, r * ppm, 0, TAU); c.stroke();
        c.fillStyle = 'rgba(185,166,214,.45)'; c.font = '600 10px "Consolas",monospace';
        c.fillText(r + ' м', cx + r * ppm + 3, cy - 3);
      }
      /* конус */
      const a0 = this.ang - (this.fovH * Math.PI / 180) / 2, a1 = this.ang + (this.fovH * Math.PI / 180) / 2;
      const LIM = 19;                                  /* дальше диаграмму не рисуем */
      const clipped = this.far > LIM;
      const nr = clamp(this.near, 0, LIM) * ppm, fr = Math.min(this.far, LIM) * ppm;
      const grad = c.createRadialGradient(cx, cy, nr, cx, cy, Math.max(nr + 1, fr));
      grad.addColorStop(0, 'rgba(37,232,220,.34)'); grad.addColorStop(1, 'rgba(37,232,220,.05)');
      c.fillStyle = grad;
      c.beginPath(); c.arc(cx, cy, fr, a0, a1); c.arc(cx, cy, nr, a1, a0, true); c.closePath(); c.fill();
      c.strokeStyle = 'rgba(37,232,220,.8)'; c.lineWidth = 2;
      c.beginPath(); c.moveTo(cx + Math.cos(a0) * nr, cy + Math.sin(a0) * nr); c.lineTo(cx + Math.cos(a0) * fr, cy + Math.sin(a0) * fr);
      c.moveTo(cx + Math.cos(a1) * nr, cy + Math.sin(a1) * nr); c.lineTo(cx + Math.cos(a1) * fr, cy + Math.sin(a1) * fr);
      c.stroke();
      c.beginPath(); c.arc(cx, cy, nr, a0, a1); c.stroke();
      c.setLineDash(clipped ? [7, 6] : []);
      c.beginPath(); c.arc(cx, cy, fr, a0, a1); c.stroke();
      c.setLineDash([]);
      if (clipped) {
        c.fillStyle = 'rgba(37,232,220,.75)'; c.font = '700 10px "Trebuchet MS",sans-serif'; c.textAlign = 'center';
        c.fillText('дальше — до горизонта', cx + Math.cos(this.ang) * (fr + 16), cy + Math.sin(this.ang) * (fr + 16));
        c.textAlign = 'left';
      }
      c.fillStyle = 'rgba(255,77,94,.16)';
      c.beginPath(); c.arc(cx, cy, nr, a0, a1); c.lineTo(cx, cy); c.closePath(); c.fill();
      /* зона */
      const z = this.zone, zx = cx + Math.cos(z.bear) * z.dist * ppm, zy = cy + Math.sin(z.bear) * z.dist * ppm;
      c.save(); c.translate(zx, zy); c.rotate(z.bear);
      c.fillStyle = this.cover >= 0.9 ? 'rgba(75,227,107,.3)' : 'rgba(255,45,149,.28)';
      c.strokeStyle = this.cover >= 0.9 ? '#4be36b' : '#ff2d95'; c.lineWidth = 2;
      c.fillRect(-z.d / 2 * ppm, -z.w / 2 * ppm, z.d * ppm, z.w * ppm);
      c.strokeRect(-z.d / 2 * ppm, -z.w / 2 * ppm, z.d * ppm, z.w * ppm);
      c.restore();
      c.fillStyle = '#e9dcff'; c.font = '700 11px "Trebuchet MS",sans-serif'; c.textAlign = 'center';
      c.fillText(this.zoneName.toUpperCase(), zx, zy - z.w / 2 * ppm - 8); c.textAlign = 'left';
      /* опора */
      c.fillStyle = '#8f7fae'; c.beginPath(); c.arc(cx, cy, 8, 0, TAU); c.fill();
      c.strokeStyle = '#ffd23f'; c.lineWidth = 3;
      c.beginPath(); c.moveTo(cx, cy); c.lineTo(cx + Math.cos(this.ang) * 30, cy + Math.sin(this.ang) * 30); c.stroke();
      c.fillStyle = 'rgba(185,166,214,.85)'; c.font = '700 11px "Trebuchet MS",sans-serif';
      c.fillText('ВИД СВЕРХУ · высота ' + (this.hSet || 5).toFixed(1) + ' м · наклон ' + Math.round(this.tilt) + '°', cx - 90, cy + h * 0.2);

      /* превью «что видит камера» */
      const p = this.prev;
      c.save();
      c.beginPath(); roundRect(0, c, p.x, p.y, p.w, p.h, 8); c.clip();
      const horizon = p.y + p.h / 2 - ((this.tilt * Math.PI / 180) / ((this.fovV * Math.PI / 180) / 2)) * (p.h / 2);
      const sky = c.createLinearGradient(0, p.y, 0, horizon);
      sky.addColorStop(0, '#ff8a1f'); sky.addColorStop(1, '#8a2be2');
      c.fillStyle = sky; c.fillRect(p.x, p.y, p.w, Math.max(0, horizon - p.y));
      const gr = c.createLinearGradient(0, horizon, 0, p.y + p.h);
      gr.addColorStop(0, '#3a3448'); gr.addColorStop(1, '#221c30');
      c.fillStyle = gr; c.fillRect(p.x, Math.max(p.y, horizon), p.w, p.y + p.h - Math.max(p.y, horizon));
      /* проекция зоны */
      const proj = (px, py) => {
        const r = Math.hypot(px, py);
        let da = Math.atan2(py, px) - this.ang;
        da = ((da + Math.PI) % TAU + TAU) % TAU - Math.PI;
        const e = Math.atan((this.hSet || 5) / Math.max(0.3, r));
        const u = da / ((this.fovH * Math.PI / 180) / 2);
        const v = (e - this.tilt * Math.PI / 180) / ((this.fovV * Math.PI / 180) / 2);
        return { x: p.x + p.w / 2 + u * p.w / 2, y: p.y + p.h / 2 + v * p.h / 2 };
      };
      const ux = Math.cos(z.bear), uy = Math.sin(z.bear);
      const corners = [[-1, -1], [1, -1], [1, 1], [-1, 1]].map(([i, j]) => {
        const px = Math.cos(z.bear) * z.dist + ux * i * (z.d / 2) - uy * j * (z.w / 2);
        const py = Math.sin(z.bear) * z.dist + uy * i * (z.d / 2) + ux * j * (z.w / 2);
        return proj(px, py);
      });
      c.beginPath(); c.moveTo(corners[0].x, corners[0].y);
      for (let i = 1; i < 4; i++) c.lineTo(corners[i].x, corners[i].y);
      c.closePath();
      c.fillStyle = this.cover >= 0.9 ? 'rgba(75,227,107,.35)' : 'rgba(255,45,149,.3)';
      c.strokeStyle = this.cover >= 0.9 ? '#4be36b' : '#ff2d95'; c.lineWidth = 2;
      c.fill(); c.stroke();
      /* сетка «видеокадра» */
      c.strokeStyle = 'rgba(255,255,255,.12)'; c.lineWidth = 1;
      for (let i = 1; i < 3; i++) {
        c.beginPath(); c.moveTo(p.x + p.w * i / 3, p.y); c.lineTo(p.x + p.w * i / 3, p.y + p.h); c.stroke();
        c.beginPath(); c.moveTo(p.x, p.y + p.h * i / 3); c.lineTo(p.x + p.w, p.y + p.h * i / 3); c.stroke();
      }
      c.fillStyle = '#4be36b'; c.font = '700 11px "Consolas",monospace';
      c.fillText('REC ' + clockStr(), p.x + 10, p.y + 20);
      c.fillStyle = 'rgba(255,77,94,.9)'; c.beginPath(); c.arc(p.x + p.w - 16, p.y + 16, 5, 0, TAU); c.fill();
      c.restore();
      c.strokeStyle = this.aimOk ? '#4be36b' : 'rgba(185,166,214,.6)'; c.lineWidth = 2;
      roundRect(0, c, p.x, p.y, p.w, p.h, 8); c.stroke();
      c.fillStyle = '#b9a6d6'; c.font = '700 11px "Trebuchet MS",sans-serif';
      c.fillText('ЧТО ВИДИТ КАМЕРА', p.x, p.y - 6);
      if (this.sky > 0.3) {
        c.fillStyle = '#ff4d5e'; c.font = '900 13px "Arial Black",sans-serif';
        c.fillText('СЛИШКОМ МНОГО НЕБА', p.x, p.y + p.h + 20);
      } else if (this.cover < 0.9) {
        c.fillStyle = '#ffd23f'; c.font = '900 13px "Arial Black",sans-serif';
        c.fillText('ЗОНА НЕ ЦЕЛИКОМ В КАДРЕ', p.x, p.y + p.h + 20);
      } else {
        c.fillStyle = '#4be36b'; c.font = '900 13px "Arial Black",sans-serif';
        c.fillText('ЗОНА В КАДРЕ — МОЖНО ПОДТВЕРЖДАТЬ (E)', p.x, p.y + p.h + 20);
      }
      if (this.shakeT > 0) {
        c.save(); c.translate(rnd(-4, 4), rnd(-4, 4));
        c.fillStyle = 'rgba(255,77,94,.9)'; c.font = '900 18px "Arial Black",sans-serif'; c.textAlign = 'center';
        c.fillText('ОПОРУ РАСКАЧИВАЮТ! F — ОТОГНАТЬ', w / 2, h - 110); c.textAlign = 'left';
        c.restore();
      }
    }
  };
  Mini.open(g, q => onDone(applyWorkMods(q)));
}

  Radio.timer -= dt;

    Radio.timer = 13;

/* вспомогательная плоская отрисовка для мини-игр и интерфейса */
function wrapText(c, text, x, y, maxW, lh) {
  const words = String(text).split(' ');
  let line = '', yy = y;
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (c.measureText(test).width > maxW && line) { c.fillText(line, x, yy); line = w; yy += lh; }
    else line = test;
  }
  c.fillText(line, x, yy);
}

function drawPerson(c, x, y, o) {
  const ph = o.phase || 0, dir = o.dir || 0;
  const facing = Math.cos(dir) >= 0 ? 1 : -1;
  const bob = Math.sin(ph * 2) * 1.4;
  const legA = Math.sin(ph * 2) * 6, legB = -legA;
  c.save(); c.translate(x, y);
  c.fillStyle = 'rgba(10,6,20,.38)';
  c.beginPath(); c.ellipse(3, 2, 11, 5, 0, 0, TAU); c.fill();
  c.strokeStyle = o.pants || '#2f3550'; c.lineWidth = 4.4; c.lineCap = 'round';
  c.beginPath(); c.moveTo(-2, -12); c.lineTo(-2 + legA * 0.5, 0); c.moveTo(3, -12); c.lineTo(3 + legB * 0.5, 0); c.stroke();
  c.fillStyle = o.body || '#ff8a1f';
  roundRect(0, c, -8, -30 + bob, 17, 20, 4); c.fill();
  if (o.vest) { c.fillStyle = 'rgba(255,255,255,.5)'; c.fillRect(-8, -24 + bob, 17, 2.6); c.fillRect(-8, -19 + bob, 17, 2.6); }
  c.strokeStyle = o.body || '#ff8a1f'; c.lineWidth = 4;
  const armA = Math.sin(ph * 2 + Math.PI) * 5;
  c.beginPath(); c.moveTo(-6, -26 + bob); c.lineTo(-9 + armA * 0.4, -16 + bob); c.stroke();
  c.beginPath(); c.moveTo(7, -26 + bob); c.lineTo(10 - armA * 0.4, -16 + bob); c.stroke();
  if (o.bag) { c.fillStyle = '#3a2a22'; roundRect(0, c, 6 * facing, -22 + bob, 11, 12, 3); c.fill(); c.fillStyle = '#ffd23f'; c.fillRect(6 * facing + 2, -19 + bob, 7, 2); }
  c.fillStyle = o.skin || '#e8b48a';
  c.beginPath(); c.arc(0.5, -36 + bob, 8, 0, TAU); c.fill();
  c.fillStyle = o.hair || '#4a3a2a';
  c.beginPath(); c.arc(0.5, -38 + bob, 8, Math.PI, TAU); c.fill();
  if (o.cap) { c.fillStyle = o.cap; c.beginPath(); c.arc(0.5, -39 + bob, 8.4, Math.PI, TAU); c.fill(); c.fillRect(0.5 + (facing > 0 ? 0 : -10), -40 + bob, 10, 3); }
  c.fillStyle = '#1b1226';
  c.beginPath(); c.arc(0.5 + 2.6 * facing, -36 + bob, 1.4, 0, TAU); c.fill();
  if (o.tool) { c.fillStyle = '#ffd23f'; c.fillRect(9 * facing, -25 + bob, 8, 4); }
  c.restore();
}
function drawToolIcon(c, x, y, id, on) {

    case 'drill':

    case 'ties':

function moveWithCollision(e, dt, r, isBike) {
  e.x += e.vx * dt; e.z += e.vz * dt;
  let hard = null, impact = 0;
  for (const s of solidsNear(e.x, e.z, r + 1)) {
    const c = circleRect(e.x, e.z, r, s);
    if (!c || s.soft) continue;
    e.x += c.nx * c.push; e.z += c.nz * c.push;
    const vn = e.vx * c.nx + e.vz * c.nz;
    if (vn < 0) {
      const bounce = isBike ? 0.18 : 0.05;
      e.vx -= (1 + bounce) * vn * c.nx; e.vz -= (1 + bounce) * vn * c.nz;
      if (-vn > impact) { impact = -vn; hard = s; }
    }
  }
  if (hard && impact > 4.2) {
    if (isBike) {
      S.bike.speed *= 0.25;
      damageBike(impact * 0.9);
      hurt(impact * 0.5, 'Олег познакомился со стеной ближе, чем планировал.');
      S.stats.crashes++;
      Audio2.crash(); shake(9);
      fx3(e.x, 0.8, e.z, 'spark', 9);
      if (hard.fragile) breakProp(hard);
    } else { Audio2.thud(); shake(3); }
  } else if (hard && impact > 1.6 && isBike) {
    Audio2.thud(); shake(2);
    if (hard.fragile && impact > 3) breakProp(hard);
  }
  e.x = clamp(e.x, 0.6, W.x - 0.6); e.z = clamp(e.z, 0.6, W.z - 0.6);
  return { impact, hit: hard };
}
function damageBike(v) {
  S.bike.cond = clamp(S.bike.cond - v, 0, 100);
  if (S.bike.cond < 20) toast('Велосипед скрипит как обвинение', 'bad', 1800);
}
function breakProp(s) {
  if (s.ref && s.ref.broken) return;
  if (s.ref) s.ref.broken = true;
  fx3(s.x + s.w / 2, 0.8, s.z + s.d / 2, 'spark', 12, [1, .55, .2]);
  Audio2.crash();
  addHeat(s.kind === 'kiosk' ? 26 : 12, s.kind === 'kiosk' ? 'Ты снёс киоск. Владелец уже звонит всем' : 'Порча чужого имущества');
  witnessed(s.x, s.z);
  addMoney(s.kind === 'kiosk' ? -45 : -15, 'Ущерб');
  toast(pick(['«Это был не я, это был бордюр»', '«Оно само стояло на пути»', '«Запишите на бригаду»']), 'bad', 2200);
}
function inputVec() {
  let f = 0, r = 0;
  if (Input.any(K.up)) f += 1;
  if (Input.any(K.down)) f -= 1;
  if (Input.any(K.left)) r -= 1;
  if (Input.any(K.right)) r += 1;
  const p = S.player;
  if (p.drunk > 45 && Math.sin(S.t * 0.9) > 0.72) r *= -1;
  const l = Math.hypot(f, r);
  if (l > 0) { f /= l; r /= l; }
  return { f, r, len: l ? 1 : 0 };
}
function movePlayerOnFoot(dt) {
  const p = S.player, v = inputVec();
  const yaw = S.cam.yaw;
  /* направление относительно камеры */
  const fx = -Math.sin(yaw), fz = -Math.cos(yaw);
  const rx = Math.cos(yaw), rz = -Math.sin(yaw);
  let dx = fx * v.f + rx * v.r, dz = fz * v.f + rz * v.r;
  const drunkF = p.drunk / 100;
  const sprint = Input.any(K.sprint) && p.stamina > 3 && v.len > 0;
  let maxSp = (sprint ? BAL.sprint : BAL.walk) * (1 - drunkF * 0.22) * (p.stamina < 15 ? 0.72 : 1) * (p.health < 30 ? 0.85 : 1);

  if (Input.anyHit(K.brake) && p.dodgeCd <= 0 && p.stamina >= BAL.dodgeCost && v.len > 0) {
    p.dodge = 0.26; p.dodgeCd = 0.85; p.stamina -= BAL.dodgeCost; p.invuln = 0.34;
    p.vx = dx * 9; p.vz = dz * 9; Audio2.noise(0.12, 0.13, 300, 1800);
    fx3(p.x, 0.2, p.z, 'dust', 7);
  }
  const acc = BAL.walkAcc * (p.dodge > 0 ? 0.2 : 1);
  p.vx += dx * acc * dt; p.vz += dz * acc * dt;
  if (drunkF > 0.15) { p.vx += Math.sin(S.t * 3.1) * 1.6 * drunkF * dt; p.vz += Math.cos(S.t * 2.3) * 1.5 * drunkF * dt; }
  const sp = Math.hypot(p.vx, p.vz);
  const lim = p.dodge > 0 ? 10 : maxSp;
  if (sp > lim) { p.vx = p.vx / sp * lim; p.vz = p.vz / sp * lim; }
  const fr = Math.exp(-BAL.walkFric * dt);
  p.vx *= fr; p.vz *= fr;
  if (sprint) p.stamina = clamp(p.stamina - BAL.stamDrain * dt, 0, 100);
  else p.stamina = clamp(p.stamina + BAL.stamRegen * (v.len > 0 ? 0.45 : 1) * dt * staminaMult(), 0, 100);
  if (v.len > 0) { p.yaw = angLerp(p.yaw, Math.atan2(dx, dz), 1 - Math.exp(-16 * dt)); }
  p.phase += Math.hypot(p.vx, p.vz) * dt * 3.4;
  moveWithCollision(p, dt, p.r, false);
  p.dodge = Math.max(0, p.dodge - dt); p.dodgeCd = Math.max(0, p.dodgeCd - dt);
  S.bike.x = S.bike.x; /* велосипед стоит на месте */
}
function moveBike(dt) {
  const p = S.player, b = S.bike;
  const drunkF = p.drunk / 100, cond = b.cond / 100;
  const boost = Input.any(K.sprint) && p.stamina > 2;
  let maxSp = (boost ? BAL.bikeBoost : BAL.bikeMax) * (0.62 + 0.38 * cond);
  if (S.upgrades.frame) maxSp *= 1.14;
  if (S.upgrades.tires) maxSp *= 1.05;
  maxSp *= (1 - drunkF * 0.18) * (p.stamina < 12 ? 0.75 : 1);

  let thr = 0;
  if (Input.any(K.up)) thr = 1;
  if (Input.any(K.down)) thr = -0.5;
  let steer = 0;
  if (Input.any(K.left)) steer -= 1;
  if (Input.any(K.right)) steer += 1;
  if (drunkF > 0.45 && Math.sin(S.t * 0.9) > 0.72) steer *= -1;

  b.speed += thr * BAL.bikeAcc * (0.6 + 0.4 * cond) * dt;
  if (Input.any(K.brake)) {
    const before = b.speed;
    b.speed -= Math.sign(b.speed) * BAL.bikeBrake * dt;
    if (Math.sign(before) !== Math.sign(b.speed)) b.speed = 0;
    if (Math.abs(before) > 4 && Math.random() < 0.25) Audio2.skid();
  }
  b.speed *= Math.exp(-BAL.bikeDrag * dt);
  b.speed = clamp(b.speed, -3, maxSp);
  const turn = BAL.bikeTurn * (S.upgrades.tires ? 1.16 : 1) * clamp(Math.abs(b.speed) / 4, 0, 1.25);
  b.yaw -= steer * turn * dt * Math.sign(b.speed || 1);
  b.yaw += Math.sin(S.t * 5.5) * (drunkF * 0.5 + (1 - cond) * 0.3) * 0.4 * dt;
  b.lean = lerp(b.lean, -steer * clamp(Math.abs(b.speed) / 8, 0, 1) * 0.32, dt * 6);

  if (boost && Math.abs(b.speed) > 1.5) p.stamina = clamp(p.stamina - BAL.stamDrain * 0.85 * dt, 0, 100);
  else p.stamina = clamp(p.stamina + BAL.stamRegen * 0.55 * dt * staminaMult(), 0, 100);

  if (b.cond < 45 && b.chain <= 0 && Math.random() < 0.06 * dt * (1 - cond)) {
    b.chain = 1; toast('Слетела цепь! F — поправить', 'bad'); Audio2.nope();
  }
  if (b.chain > 0) {
    b.speed *= Math.exp(-3.4 * dt);
    if (Input.anyHit(K.tool)) {
      b.chain = 0; toast('Цепь на месте. «Она просто хотела внимания»', 'good');
      Audio2.screwdr(); p.stamina = clamp(p.stamina - 6, 0, 100);
    }
  }
  p.vx = Math.sin(b.yaw) * b.speed; p.vz = Math.cos(b.yaw) * b.speed;
  b.wheel += b.speed * dt * 2.6;
  S.stats.dist += Math.abs(b.speed) * dt;
  p.yaw = b.yaw;
  moveWithCollision(p, dt, p.r + 0.14, true);
  b.x = p.x; b.z = p.z;
  for (const h of POTHOLES) {
    if (dist2(p.x, p.z, h.x, h.z) < (h.r + 0.5) * (h.r + 0.5) && Math.abs(b.speed) > 3) {
      if (!h.cd || S.t - h.cd > 1.4) {
        h.cd = S.t;
        b.speed *= 0.55; damageBike(rnd(3, 8)); shake(7); Audio2.thud();
        p.stamina = clamp(p.stamina - 5, 0, 100);
        fx3(p.x, 0.2, p.z, 'dust', 8);
        if (Math.random() < 0.3) floater(p.x, 2, p.z, pick(['Ой', 'Яма!', 'Спасибо, город']), '#ff8a1f');
      }
    }
  }
}

function initHud2() { HUD2.cv = $('hud2d'); HUD2.c = HUD2.cv.getContext('2d'); }

function project(x, y, z) {

function updateHeat(dt) {
  S.heat = clamp(S.heat - BAL.heatDecay * dt * (S.player.onBike ? 0.8 : 1), 0, 100);
  const want = S.heat >= 70 ? 2 : S.heat >= 42 ? 1 : 0;
  while (S.guards.length < want) {
    const p = S.player;
    let gx = p.x, gz = p.z, best = -1;
    for (let i = 0; i < 10; i++) {
      const a = rnd(0, TAU), r = 40;
      const tx = clamp(p.x + Math.sin(a) * r, 3, W.x - 3), tz = clamp(p.z + Math.cos(a) * r, 3, W.z - 3);
      const d = dist(tx, tz, p.x, p.z);
      if (d > best) { best = d; gx = tx; gz = tz; }
      if (d > 33) break;
    }
    S.guards.push({ x: gx, z: gz, vx: 0, vz: 0, yaw: 0, phase: 0, siren: 0, catchCd: 0 });
    toast('ЧОП «Бдительный сосед» выехал по вызову', 'bad', 3000); Audio2.siren();
  }
  while (S.guards.length > want) S.guards.pop();
  for (const g of S.guards) {
    const p = S.player;
    const a = Math.atan2(p.x - g.x, p.z - g.z);
    const sp = 5.5 + S.heat * 0.03;
    g.vx = lerp(g.vx, Math.sin(a) * sp, 1 - Math.exp(-2.4 * dt));
    g.vz = lerp(g.vz, Math.cos(a) * sp, 1 - Math.exp(-2.4 * dt));
    g.x += g.vx * dt; g.z += g.vz * dt;
    g.yaw = angLerp(g.yaw, a, 1 - Math.exp(-8 * dt));
    g.phase += dt * 6;
    for (const s of solidsNear(g.x, g.z, 1)) { const c = circleRect(g.x, g.z, 0.5, s); if (c && !s.soft) { g.x += c.nx * c.push; g.z += c.nz * c.push; } }
    g.siren -= dt;
    if (g.siren <= 0 && dist(g.x, g.z, p.x, p.z) < 44) { g.siren = 1.6; Audio2.siren(); }
    g.catchCd = Math.max(0, g.catchCd - dt);
    if (dist(g.x, g.z, p.x, p.z) < 1.9 && g.catchCd <= 0 && !Dlg.open) {
      g.catchCd = 8;
      const fine = Math.round(clamp(120 + S.heat * 5, 120, 700));
      addMoney(-fine, 'Штраф от ЧОП'); S.stats.fines++; S.heat = 18;
      S.player.vx = -g.vx * 0.6; S.player.vz = -g.vz * 0.6;
      if (S.player.onBike) S.bike.speed *= 0.3;
      Dlg.one('guard', pick([
        'Вы кто? Монтажник? А наряд-допуск? А совесть? Штраф ' + fine + ' рублей, распишитесь мысленно.',
        'Бабушки жаловались. Бабушки не ошибаются. ' + fine + ' рублей.',
        'Я вас не задерживаю. Я вас штрафую. Это разные вещи.']));
    }
  }
}

function payoutMission() {

function startCableDefense() {
  const m = S.mission;
  m.data.timer = 62;
  m.data.coils = [
    { x: 131.2, z: 118.7, saved: false, lost: false, prog: 0 },
    { x: 123.7, z: 101.2, saved: false, lost: false, prog: 0 },
    { x: 151.2, z: 120.6, saved: false, lost: false, prog: 0 }
  ];
  m.data.raiders = m.data.coils.map((c, i) => ({
    x: c.x + rnd(-26, 26), z: c.z + rnd(19, 29), target: i, speed: 2.7 + i * 0.45, phase: 0, yaw: 0, done: false, scared: 0,
    mesh: i % 3

  Dlg.one('sanya', 'Олег! К бухтам идут «оценщики»! Их трое, ты один, но у тебя велосипед!');

function updateCableDefense(dt) {
  const m = S.mission, p = S.player, D = m.data;
  if (!D.coils) return;
  D.timer -= dt;
  for (const r of D.raiders) {
    const c = D.coils[r.target];
    if (r.done || c.lost || c.saved) continue;
    if (r.scared > 0) {
      r.scared -= dt;
      const a = Math.atan2(r.x - p.x, r.z - p.z);
      r.x += Math.sin(a) * 5 * dt; r.z += Math.cos(a) * 5 * dt;
      r.yaw = a; r.phase += dt * 8;
      if (r.scared <= 0) { r.done = true; c.saved = true; }
      continue;
    }
    const a = Math.atan2(c.x - r.x, c.z - r.z);
    const d = dist(r.x, r.z, c.x, c.z);
    if (d > 1) { r.x += Math.sin(a) * r.speed * dt; r.z += Math.cos(a) * r.speed * dt; r.yaw = a; r.phase += r.speed * dt * 3; }
    else {
      c.prog += dt * 0.2;
      if (c.prog >= 1) { c.lost = true; r.done = true; toast('Бухту унесли! «Это был не кабель, это была надежда»', 'bad', 3000); Audio2.nope(); }
    }
    if (dist(r.x, r.z, p.x, p.z) < 4.4 && (Input.anyHit(K.tool) || Input.anyHit(K.act))) {
      r.scared = 1.4; c.saved = true;
      delete Input.hit['KeyF']; delete Input.hit['KeyE'];
      Audio2.thud(); fx3(r.x, 0.8, r.z, 'dust', 8);
      floater(r.x, 2, r.z, pick(['Всё-всё!', 'Мы мимо шли', 'Тут не наше']), '#ffd23f');
      toast('Бухта спасена', 'good', 1800);
    }
  }
  const open = D.coils.filter(c => !c.saved && !c.lost).length;
  if (open === 0 || D.timer <= 0) {
    D.coils.forEach(c => { if (!c.saved && !c.lost) c.lost = true; });
    const saved = D.coils.filter(c => c.saved).length;
    D.step = 6;
    const base = D.parts.reduce((a, b) => a + b, 0) / Math.max(1, D.parts.length);
    m.quality = clamp(base * 0.8 + saved / D.coils.length * 20, 0, 100);
    S.stats.bestQ = Math.max(S.stats.bestQ, m.quality);
    m.stage = 'verify';
    Dlg.one('oleg', saved === 3 ? 'Кабель на месте. Все три бухты. Борисыч даже не поверит.'
      : saved > 0 ? 'Часть кабеля спасли. Часть ушла в народное хозяйство.'
      : 'Кабель ушёл. Скажу, что это был провод с неопределённым будущим.');
    saveGame(true);
  }
}

function currentInteraction() {
  const p = S.player, M = S.mission;
  const near = (x, z, r) => dist2(p.x, p.z, x, z) < r * r;
  const slow = !p.onBike || Math.abs(S.bike.speed) < 3;
  if (M && slow) {
    const d = M.def;
    if (M.stage === 'travel' && near(d.site.x, d.site.z, 4.6)) return { label: 'начать работу: ' + d.site.label, fn: () => tryStartWork() };
    if (M.stage === 'verify' && near(d.site.x, d.site.z, 5.6)) return { label: 'проверить оборудование', fn: () => doVerify() };
    if (M.stage === 'report' && d.client && near(d.client.x, d.client.z, 5.2)) return { label: 'сдать работу: ' + d.client.name, fn: () => payoutMission() };
    if (M.stage === 'work') {
      if (d.kind === 'search' && M.data.spots)
        for (const sp of M.data.spots) if (near(sp.x, sp.z, 3.6) && !sp.searched) return { label: 'обыскать: ' + sp.label, fn: () => searchSpot(sp) };
      if (d.kind === 'night' && M.data.poles) {
        for (const e of M.data.poles) {
          if (!near(e.p.x, e.p.z, 4.6)) continue;
          const isBroken = M.data.poles.indexOf(e) === M.data.broken;
          if (M.data.found && isBroken) return { label: 'чинить камеру', fn: () => startCameraGame({ zone: d.zone || 'въезд' }, q => { e.p.installed = true; e.p.camYaw = 0.2; finishWork(q); }) };
          if (!M.data.found) return { label: 'осмотреть камеру', fn: () => inspectPole(e) };
        }
      }
      if (d.kind === 'final') {
        const st = M.data.step;
        if (st === 0 && near(d.site.x, d.site.z, 5)) return { label: 'монтаж СКУД на входе', fn: () => startFinalStep() };
        if (st >= 1 && st <= 4) { const cam = M.data.cams[st - 1]; if (near(cam.p.x, cam.p.z, 5)) return { label: 'ставить камеру на опору ' + cam.p.mount, fn: () => startFinalStep() }; }
      }
    }
  }
  for (const poi of POIS) if (near(poi.x, poi.z, poi.r) && slow) return { label: poi.act, fn: () => openPoi(poi.id) };

function buildShadowTex(gl) {
  const { c, x } = cv2d(64);
  const g = x.createRadialGradient(32, 32, 2, 32, 32, 31);
  g.addColorStop(0, 'rgba(0,0,0,1)'); g.addColorStop(0.55, 'rgba(0,0,0,.55)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  x.fillStyle = g; x.fillRect(0, 0, 64, 64);
  TX.shadow = texFromCanvas(gl, c, { clamp: true });
}
function drawShadow(x, z, size, alpha) {
  const gl = GL.gl, P = R3.glow;
  gl.useProgram(P.p);
  gl.uniformMatrix4fv(P.u.uProj, false, R3.proj);
  gl.uniformMatrix4fv(P.u.uView, false, R3.view);
  gl.uniform3f(P.u.uRight, 1, 0, 0);
  gl.uniform3f(P.u.uUp, 0, 0, 1);
  gl.uniform3f(P.u.uPos, x, 0.05, z);
  gl.uniform2f(P.u.uSize, size, size);
  gl.uniform4f(P.u.uColor, 0, 0, 0, alpha);
  gl.uniform1f(P.u.uHard, 1.6);
  gl.uniform1f(P.u.uMode, 1);
  gl.bindVertexArray(R3.glowVAO);
  gl.drawArrays(gl.TRIANGLES, 0, 6);
  gl.uniform1f(P.u.uMode, 0);
}
function pedMesh(i) { return CHAR_MESHES.peds[i % CHAR_MESHES.peds.length]; }

  for (const g of S.guards) if (vis(g.x, g.z, 90)) {

  } else {
    drawBike(S.bike.x, 0, S.bike.z, S.bike.yaw + 0.4, 0, 0.6);

      speed: clamp(Math.hypot(p.vx, p.vz) / 3.6, 0, 1),
      armR: p.swing > 0 ? -1.6 : undefined, lean: p.hurt > 0 ? 0.25 : 0 });
  }
  /* установленные камеры на опорах */
  const gl2 = GL.gl, PP = R3.main;
  for (const pole of POLES) {
    if (!pole.installed || !vis(pole.x, pole.z, 70)) continue;
    m4compose(BONES[0], pole.x - 0.7, (pole.lamp ? 7.2 : 6.2) - 0.5, pole.z, 0, (pole.camYaw || 0) + Math.PI, 0, 1);
    BONEBUF.set(BONES[0], 0);

function drawDog3(d) {
  const gl = GL.gl, P = R3.main;
  const run = Math.sin(d.phase * 2) * 0.5;
  m4compose(BONES[0], d.x, 0.42, d.z, 0, d.yaw, 0, 1);
  m4compose(SCRATCH[6], 0, 0, 0.34, 0, 0, 0, 1);
  m4mul(BONES[1], BONES[0], SCRATCH[6]);
  m4compose(SCRATCH[6], 0, -0.12, -0.28, run, 0, 0, 1);
  m4mul(BONES[2], BONES[0], SCRATCH[6]);
  m4compose(SCRATCH[6], 0, -0.12, 0.24, -run, 0, 0, 1);
  m4mul(BONES[3], BONES[0], SCRATCH[6]);
  for (let i = 0; i < 4; i++) BONEBUF.set(BONES[i], i * 16);
  gl.uniformMatrix4fv(P.u.uBones, false, BONEBUF);
  drawMesh(VEH.dog, TX.paint, BONES[0], { skin: true });
}

function drawGlows() {

    for (let i = 0; i < 5; i++)
      drawGlow([t.x, 0.6 + i * 1.1, t.z], 1.5 - i * 0.16, [1, .82, .25], 0.30 * pulse, 2.2);

function drawOverlay2D() {

  c.clearRect(0, 0, HUD2.w, HUD2.h);
  if (S.screen !== 'play' && S.screen !== 'pause') return;
  const p = S.player;
  for (const q of S.peds) if (q.say > 0 && dist2(q.x, q.z, p.x, p.z) < 30 * 30) bubble3(q.x, 2.1, q.z, q.line);
  for (const h of S.hools) if (h.say > 0 && dist2(h.x, h.z, p.x, p.z) < 30 * 30) bubble3(h.x, 2.1, h.z, h.line, 'rgba(138,43,226,.8)');

  for (const n of S.npcs) {
    if (n.say > 0) bubble3(n.x, 2.15, n.z, n.line, 'rgba(37,232,220,.8)');

  }
  /* точки поиска и тёмные опоры */
  const M = S.mission;
  if (M && M.stage === 'work' && M.def.kind === 'search' && M.data.spots)
    for (const sp of M.data.spots) label3(sp.x, 1.4, sp.z, sp.searched ? '· осмотрено ·' : '⌕ ' + sp.label, sp.searched ? '#9a8fb0' : '#25e8dc', 12);
  if (M && M.def.kind === 'final' && M.data.coils)
    for (const coil of M.data.coils)
      label3(coil.x, 1.2, coil.z, coil.lost ? 'УНЕСЛИ' : coil.saved ? 'ЦЕЛА' : 'КАБЕЛЬ ' + Math.round((1 - coil.prog) * 100) + '%',
        coil.lost ? '#ff4d5e' : coil.saved ? '#4be36b' : '#ffd23f', 13);
  /* всплывающий текст */
  for (const f of S.fx) if (f.kind === 'text') {
    const pr = project(f.x, f.y, f.z);
    if (!pr) continue;
    c.save(); c.globalAlpha = clamp(f.life / f.max, 0, 1);
    c.font = '900 16px "Arial Black",sans-serif'; c.textAlign = 'center';
    c.lineWidth = 4; c.strokeStyle = 'rgba(8,4,18,.85)';

    c.restore();
  }
  /* указатель на цель */
  const t = M && M.target;
  if (t) {
    const d = dist(t.x, t.z, p.x, p.z);
    const pr = project(t.x, 3.2, t.z);
    const onScreen = pr && pr[0] > 40 && pr[0] < HUD2.w - 40 && pr[1] > 40 && pr[1] < HUD2.h - 40;
    if (onScreen) label3(t.x, 3.6, t.z, t.label.toUpperCase() + ' · ' + Math.round(d) + ' м', '#ffd23f', 13);
    else {
      const ang = Math.atan2(t.x - p.x, t.z - p.z) - S.cam.yaw + Math.PI;
      const cx = HUD2.w / 2, cy = HUD2.h / 2, rr = Math.min(HUD2.w, HUD2.h) * 0.34;
      const sx = cx + Math.sin(ang) * rr, sy = cy - Math.cos(ang) * rr * 0.62;
      c.save(); c.translate(sx, sy); c.rotate(ang);
      c.fillStyle = 'rgba(255,210,63,.92)';
      c.beginPath(); c.moveTo(0, -14); c.lineTo(10, 8); c.lineTo(0, 3); c.lineTo(-10, 8); c.closePath(); c.fill();
      c.restore();
      c.save(); c.font = '900 12px "Trebuchet MS",sans-serif'; c.textAlign = 'center';
      c.lineWidth = 3; c.strokeStyle = 'rgba(8,4,18,.8)';
      c.strokeText(Math.round(d) + ' м · ' + t.label, sx, sy + 26);
      c.fillStyle = '#ffd23f'; c.fillText(Math.round(d) + ' м · ' + t.label, sx, sy + 26);
      c.restore();
    }
  }
}

    }

  for (const g of S.guards) { c.fillStyle = '#ff4d5e'; c.beginPath(); c.arc(g.x * sx, g.z * sz, big ? 5 : 2.4, 0, TAU); c.fill(); }
  const t = S.mission && S.mission.target;
  if (t) {
    const pulse = 0.5 + 0.5 * Math.sin(S.t * 4);
    c.strokeStyle = '#ffd23f'; c.lineWidth = big ? 3 : 1.6;
    c.beginPath(); c.arc(t.x * sx, t.z * sz, (big ? 10 : 3) + pulse * (big ? 5 : 3), 0, TAU); c.stroke();
    c.fillStyle = '#ffd23f'; c.beginPath(); c.arc(t.x * sx, t.z * sz, big ? 5 : 2, 0, TAU); c.fill();
    if (big) { c.font = '900 12px "Arial Black",sans-serif'; c.textAlign = 'center'; c.fillText('ЦЕЛЬ: ' + t.label.toUpperCase(), t.x * sx, t.z * sz - 18); c.textAlign = 'left'; }
  }
  const p = S.player;
  c.save(); c.translate(p.x * sx, p.z * sz); c.rotate(-p.yaw + Math.PI);
  c.fillStyle = '#fff';
  c.beginPath(); c.moveTo(0, -(big ? 9 : 5)); c.lineTo(big ? 6 : 3.4, big ? 6 : 3); c.lineTo(-(big ? 6 : 3.4), big ? 6 : 3); c.closePath(); c.fill();
  c.restore();
  if (big) { c.fillStyle = '#ff2d95'; c.font = '900 11px "Arial Black",sans-serif'; c.textAlign = 'center'; c.fillText('ОЛЕГ', p.x * sx, p.z * sz - 14); c.textAlign = 'left'; }
}

function saveGame(silent) {
  const p = S.player;
  const data = {
    v: 1, ts: Date.now(),
    p: { x: p.x, z: p.z, yaw: p.yaw, health: p.health, stamina: p.stamina, drunk: p.drunk, money: p.money, rep: p.rep, tools: p.tools.slice(), tool: p.tool },
    bike: { x: S.bike.x, z: S.bike.z, cond: S.bike.cond },
    clock: S.clock, day: S.day, heat: S.heat,
    missionIndex: S.missionIndex, missionsDone: S.missionsDone.slice(),
    free: S.free, freeCount: S.freeCount,
    upgrades: Object.assign({}, S.upgrades), stats: Object.assign({}, S.stats), flags: Object.assign({}, S.flags),
    poles: POLES.map(pl => !!pl.installed), station: Audio2.station
  };
  const ok = Save.write(data);
  if (!ok && !silent) toast('Не удалось сохранить: ' + (Save.lastError || 'localStorage недоступен'), 'bad', 4000);
  else if (!silent) toast('Прогресс сохранён', 'good', 1400);
  return ok;
}
function loadGame() {
  const d = Save.read();
  if (!d) return false;
  try {
    resetWorld(false);
    const p = S.player;
    Object.assign(p, { x: d.p.x, z: d.p.z, yaw: d.p.yaw || 0, health: d.p.health, stamina: d.p.stamina,
      drunk: d.p.drunk || 0, money: d.p.money, rep: d.p.rep, tools: (d.p.tools || []).filter(t => TOOLS[t]), tool: d.p.tool || 0 });
    S.bike.x = d.bike.x; S.bike.z = d.bike.z; S.bike.cond = d.bike.cond;
    S.clock = d.clock; S.day = d.day || 1; S.heat = d.heat || 0;
    S.missionIndex = d.missionIndex || 0; S.missionsDone = d.missionsDone || [];
    S.free = !!d.free; S.freeCount = d.freeCount || 0;
    S.upgrades = d.upgrades || {};
    S.stats = Object.assign(S.stats, d.stats || {});
    S.flags = Object.assign(S.flags, d.flags || {});
    if (Array.isArray(d.poles)) d.poles.forEach((v, i) => { if (POLES[i]) POLES[i].installed = v; });
    if (typeof d.station === 'number') Audio2.station = clamp(d.station, 0, Audio2.stations.length - 1);
    S.flags.tutorialDone = true; S.tutorial = null; S.mission = null; S.phoneRing = 2.5;
    S.cam.tx = p.x; S.cam.tz = p.z; hudToolSig = '';
    return true;
  } catch (e) { toast('Сохранение повреждено, начинаем заново', 'bad', 3600); Save.wipe(); return false; }
}
const TUTORIAL = [
  { text: 'Осмотрись: двигай мышью (клик — захват курсора, или зажми правую кнопку)', check: t => t.looked > 1.2 },
  { text: 'Пройдись: W A S D', check: t => t.moved > 6 },
  { text: 'Ускорься: зажми Shift на ходу', check: t => t.sprint > 0.9 },
  { text: 'Велосипед рядом — подойди и нажми E', check: () => S.player.onBike },
  { text: 'Прокатись немного вперёд', check: t => t.rode > 25 },
  { text: 'Притормози: Space', check: t => t.braked },
  { text: 'Открой карту района: M', check: t => t.mapOpened },
  { text: 'Всё. Тамара уже набирает номер…', check: t => t.wait > 1.6 }
];
function updateTutorial(dt) {
  const T = S.tutorial, p = S.player;
  T.wait = (T.wait || 0) + dt;
  T.looked = (T.looked || 0) + (Math.abs(Input.dx) + Math.abs(Input.dy) > 2 ? dt : 0);
  const sp = Math.hypot(p.vx, p.vz);
  if (!p.onBike) T.moved += sp * dt;
  if (Input.any(K.sprint) && sp > 1) T.sprint += dt;
  if (p.onBike) T.rode += Math.abs(S.bike.speed) * dt;
  if (p.onBike && Input.any(K.brake) && Math.abs(S.bike.speed) > 1) T.braked = true;
  if (S.screen === 'map') T.mapOpened = true;
  if (TUTORIAL[T.step].check(T)) {
    T.step++; T.wait = 0; Audio2.ok();
    if (T.step >= TUTORIAL.length) {
      T.done = true; S.tutorial = null; S.flags.tutorialDone = true; S.phoneRing = 1.4;
      toast('Обучение пройдено. Смена начинается', 'good', 2600); saveGame(true);
    } else toast('Дальше: ' + TUTORIAL[T.step].text, 'info', 2400);
  }
}

function updatePrompt() {
  const it = currentInteraction(), el = $('prompt');
  if (it && !Dlg.open) { el.style.display = 'block'; $('promptText').innerHTML = '<b>E</b> — ' + it.label; }

function updateFx(dt) {
  for (let i = S.fx.length - 1; i >= 0; i--) {
    const f = S.fx[i];
    f.life -= dt;
    if (f.life <= 0) { S.fx.splice(i, 1); continue; }
    f.x += f.vx * dt; f.y += f.vy * dt; f.z += f.vz * dt;
    if (f.kind !== 'text') { f.vx *= Math.exp(-2.6 * dt); f.vz *= Math.exp(-2.6 * dt); f.vy -= 7 * dt; }
  }
}
function updateWorld(dt) {
  const p = S.player;
  S.clock += dt * (86400 / DAY_LEN);
  if (S.clock >= 86400) { S.clock -= 86400; S.day++; toast('Новый день. День ' + S.day, 'info', 2200); }
  p.invuln = Math.max(0, p.invuln - dt); p.hurt = Math.max(0, p.hurt - dt);
  p.swing = Math.max(0, p.swing - dt); p.swingCd = Math.max(0, p.swingCd - dt);
  const wasDrunk = p.drunk;
  p.drunk = clamp(p.drunk - BAL.soberRate * dt, 0, 100);
  if (wasDrunk > 0 && p.drunk <= 0) toast('Голова прояснилась. Работать можно', 'good', 2400);
  if (p.drunk > 60 && Math.random() < 0.35 * dt) floater(p.x, 2.2, p.z, pick(['…', 'Оп', 'Куда руль?']), '#8a2be2');
  if (p.onBike) moveBike(dt); else movePlayerOnFoot(dt);
  updateCars(dt); updateDogs(dt); updateHools(dt); updatePeds(dt); updatePartner(dt); updateHeat(dt);
  for (const g of S.grans) g.say = Math.max(0, g.say - dt);
  updateMission(dt);
  if (!S.mission && S.phoneRing > 0 && !Dlg.open) { S.phoneRing -= dt; if (S.phoneRing <= 0) offerMission(S.missionIndex); }
  S.autosave += dt;
  if (S.autosave > 20) { S.autosave = 0; saveGame(true); }
  if (S.tutorial && !S.tutorial.done) updateTutorial(dt);
  updatePrompt();
}
function handleKeys() {
  if (Input.anyHit(K.pause)) {
    if (Dlg.open && Dlg.opts) { }
    else if (S.screen === 'menu' || S.screen === 'win' || S.screen === 'lose') { }
    else if (S.screen === 'pause') resumeFromPause();
    else if ($('screens').classList.contains('show')) closeSheet();
    else if (Input.locked) exitLock();
    else if (S.screen === 'play' || S.screen === 'mini') screenPause();
    Audio2.click();
    return;
  }
  if (Dlg.open) return;
  if (S.screen === 'map' && Input.anyHit(K.map)) { closeSheet(); return; }
  if (S.screen === 'journal' && Input.anyHit(K.phone)) { closeSheet(); return; }
  if (S.screen !== 'play') return;
  if (Input.anyHit(K.map)) { screenMap(); return; }
  if (Input.anyHit(K.phone)) { screenJournal(); return; }
  if (Input.anyHit(K.radio)) { toast('Радио: ' + Audio2.nextStation(), 'info', 1600); Radio.timer = 0; }
  if (Input.anyHit(K.partner)) callPartner();
  if (Input.anyHit(K.act)) handleAction();
  if (Input.anyHit(K.tool)) useTool();
  for (let i = 0; i < 8; i++) if (Input.pressed('Digit' + (i + 1)) && S.player.tools[i]) { S.player.tool = i; hudToolSig = ''; Audio2.click(); }
}

  if (S.lowFx) {
    GL.canvas.width = Math.max(320, Math.floor(GL.w * 0.62));
    GL.canvas.height = Math.max(240, Math.floor(GL.h * 0.62));
  }
  if (Mini.g) Mini.resize();
}
let lastTs = 0, crashed = false, hardErrors = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  if (crashed) return;
  const dt = clamp((ts - lastTs) / 1000, 0, 0.05);
  lastTs = ts;
  try { step(dt || 0.016); } catch (e) { fatal(e, true); }
}
function step(dt) {
  S.t += dt;
  Dlg.update(dt);
  updateRadio(dt);
  if (S.screen === 'play' && !Dlg.open) updateWorld(dt);
  else if (S.screen === 'mini' && !Dlg.open) Mini.update(dt);
  else if (Dlg.open) $('prompt').style.display = 'none';
  updateFx(dt);
  updateCamera(dt);
  renderFrame();
  if (S.screen === 'mini' || Mini.g) Mini.draw();
  updateHud();
  handleKeys();
  Input.endFrame();
}
function fatal(err, hard) {
  const msg = (err && (err.stack || err.message)) || String(err);
  if (hard) { hardErrors++; if (hardErrors > 40) crashed = true; }
  $('errtext').textContent = msg + (crashed ? '\n\nИгра остановлена. Перезапусти — сохранение обычно цело.' : '\n\nИгра продолжает работать.');
  $('errbox').style.display = 'block';
  if (!$('errRestart')) {
    const wrap = document.createElement('div');
    wrap.style.marginTop = '10px';
    const b = document.createElement('button');
    b.id = 'errRestart'; b.className = 'btn sm y'; b.textContent = 'Перезапустить игру';
    b.addEventListener('click', () => location.reload());
    const h = document.createElement('button');
    h.className = 'btn sm'; h.textContent = 'Скрыть'; h.style.marginLeft = '8px';
    h.addEventListener('click', () => { $('errbox').style.display = 'none'; });
    wrap.appendChild(b); wrap.appendChild(h);
    $('errbox').appendChild(wrap);
  }
  try { console.error('[Монтаж-Сити 3D]', err); } catch (e) { }
}
function boot() {
  try {
    const step = t => { const el = $('loadStep'); if (el) el.textContent = t; };
    const gl = initRenderer($('gl'));
    initHud2();
    resizeAll();
    step('генерируем текстуры');
    buildTextures(gl);
    buildShadowTex(gl);
    step('строим район');
    buildSolids();
    buildWorld(gl);
    step('собираем жителей и технику');
    buildCharacters(gl);
    buildVehicles(gl);
    Input.init();
    resetWorld(true);
    window.addEventListener('resize', resizeAll);
    window.addEventListener('orientationchange', () => setTimeout(resizeAll, 300));
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) { if (S.screen === 'play') saveGame(true); }
      else lastTs = performance.now();
    });
    window.addEventListener('beforeunload', () => { if (S.screen === 'play' && !S.ended) saveGame(true); });
    window.addEventListener('error', e => fatal(e.error || e.message, false));
    window.addEventListener('unhandledrejection', e => fatal(e.reason || 'unhandled rejection', false));
    const kick = () => { Audio2.init(); Audio2.resume(); };
    window.addEventListener('pointerdown', kick);
    window.addEventListener('keydown', kick);
    $('loading').style.display = 'none';
    screenMenu();
    requestAnimationFrame(frame);
  } catch (e) {
    $('loading').innerHTML = '<div style="max-width:640px;text-align:center;font:600 14px/1.5 var(--ui);color:#f7ecff;text-transform:none;letter-spacing:0">' +
      '<b style="display:block;font:900 20px var(--head);color:#ff2d95;margin-bottom:10px">Не удалось запустить 3D</b>' +
      (e && e.message ? String(e.message) : String(e)) +
      '<br><br>Нужен браузер с WebGL2 и аппаратным ускорением (актуальный Chrome). Проверь chrome://gpu.</div>';
    try { console.error(e); } catch (er) { }
  }
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

})();
</script>
