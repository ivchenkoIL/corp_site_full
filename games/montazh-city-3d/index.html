.phBar .sp{flex:1}
.phSig{display:inline-flex;align-items:flex-end;gap:2px;height:10px}
.phSig s{display:block;width:3px;border-radius:1px;text-decoration:none;background:rgba(207,214,228,.26)}
.phSig s.on{background:#cfd6e4}
.phBat{display:inline-block;width:22px;height:10px;border:1px solid rgba(207,214,228,.55);
  border-radius:3px;padding:1px;position:relative}
.phBat::after{content:'';position:absolute;right:-3px;top:3px;width:2px;height:4px;
  background:rgba(207,214,228,.55);border-radius:0 1px 1px 0}
.phBat i{display:block;height:100%;border-radius:1px;background:#4be36b}
.phBat.low i{background:#ff8a1f}
.phBat.dead i{background:#ff4d5e}
.phTitle{padding:2px 14px 8px;font:900 18px/1.1 var(--head);color:#fff}
.phList{max-height:min(54vh,430px);overflow:auto;padding:0 8px 6px}
.phRow{display:flex;align-items:center;gap:10px;padding:7px 8px;margin-bottom:6px;border-radius:13px;
  background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.05)}
.phRow.off{opacity:.42}
.phAv{flex:0 0 38px;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font:900 15px/1 var(--head);color:#0b0b0f}
.phWho{flex:1;min-width:0}
.phWho b{display:block;font:700 13px/1.25 var(--ui);color:#eef2f8;text-transform:none}
.phWho span{display:block;font:400 11px/1.3 var(--ui);color:#8b93a4;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.phDial{flex:0 0 34px;width:34px;height:34px;border-radius:50%;border:0;cursor:pointer;
  background:#2ecc71;color:#06301a;font:900 18px/1 var(--head);box-shadow:0 2px 8px rgba(46,204,113,.4)}
.phDial:hover{filter:brightness(1.12)}
.phDial:active{transform:translateY(2px)}
.phRow.off .phDial{background:#5a6070;color:#20242c;box-shadow:none;cursor:not-allowed}
.phFoot{padding:7px 14px 2px;font:600 10px/1.35 var(--ui);color:#6b7385;text-align:center;letter-spacing:.05em}
.stats{display:grid;grid-template-columns:1fr auto;gap:2px 14px;font:600 13px/1.5 var(--ui);max-width:420px}
.stats i{font-style:normal;color:var(--dim)}
.stats b{font-family:var(--mono);color:var(--yellow)}
#mapCanvas{width:100%;height:auto;border:2px solid rgba(37,232,220,.5);border-radius:6px;background:#0a0614}
.legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:4px 12px;font:600 12px/1.5 var(--ui);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
.disclaimer{font:400 11px/1.5 var(--ui);color:#8d7cab;margin-top:14px;border-top:1px solid rgba(185,166,214,.2);padding-top:10px}
.slider{display:flex;align-items:center;gap:10px;font:600 13px var(--ui);margin:6px 0}
.slider input{width:200px}
.jobList{display:flex;flex-direction:column;gap:6px}
.job{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:5px;border:1px solid rgba(185,166,214,.28);background:rgba(13,7,24,.65)}
.job.done{border-color:rgba(75,227,107,.5)}
.job.cur{border-color:var(--pink);box-shadow:0 0 14px rgba(255,45,149,.25)}
.job b{font:900 13px/1.15 var(--head);text-transform:uppercase;flex:1}
.job small{font:600 11px/1.2 var(--ui);color:var(--dim)}
#mini{position:absolute;inset:0;z-index:16;display:none;background:radial-gradient(120% 100% at 50% 0%,rgba(20,8,40,.93),rgba(5,3,12,.98))}
#mini.show{display:block}
#miniCanvas{position:absolute;left:0;top:0;width:100%;height:100%}
#miniTop{position:absolute;left:0;right:0;top:0;padding:10px 16px;display:flex;gap:14px;align-items:center;pointer-events:none}
#miniTitle{font:900 clamp(16px,2.4vw,24px)/1 var(--head);color:var(--pink);text-transform:uppercase;text-shadow:0 2px 0 #55002c}
#miniPhase{font:700 12px/1 var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--cyan)}
#miniQ{margin-left:auto;min-width:180px}
#miniBottom{position:absolute;left:0;right:0;bottom:0;padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#miniHint{font:600 13px/1.35 var(--ui);flex:1;min-width:200px}
#miniHint b{color:var(--yellow)}
#miniBtns{display:flex;gap:8px;flex-wrap:wrap}
#errbox{position:absolute;inset:auto 16px 16px 16px;z-index:40;display:none;padding:12px 14px;border-radius:8px;
  background:rgba(80,0,14,.96);border:2px solid var(--bad);font:600 12px/1.45 var(--mono);max-height:40vh;overflow:auto}
#errbox b{display:block;font:900 13px var(--head);color:#fff;margin-bottom:6px}
#loading{position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;
  background:#07040e;font:900 18px var(--head);color:var(--pink);text-transform:uppercase;letter-spacing:.2em}
#loading small{font:600 12px var(--ui);color:var(--dim);letter-spacing:.05em;text-transform:none}
#loadBar{width:min(360px,70vw);height:7px;border:1px solid rgba(255,45,149,.55);border-radius:4px;background:#160a2a;overflow:hidden}
#loadBar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--cyan));transition:width .12s linear}
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl"></canvas>
  <canvas id="hud2d" style="position:absolute;inset:0;width:100%;height:100%;z-index:3;pointer-events:none"></canvas>
  <div id="grade"></div>
  <div id="scan"></div>
  <div id="crosshair"></div>

  <div id="hud">
    <div id="hudTL" class="panel">
      <div class="row"><span class="lab">Здоровье</span><span class="bar hp"><i id="barHp"></i><b id="numHp">100</b></span></div>
      <div class="row"><span class="lab">Силы</span><span class="bar st"><i id="barSt"></i><b id="numSt">100</b></span></div>
      <div class="row"><span class="lab">Велик</span><span class="bar bk"><i id="barBk"></i><b id="numBk">100</b></span></div>
      <div class="row" id="rowDrunk" style="display:none"><span class="lab">Хмель</span><span class="bar dr"><i id="barDr"></i><b id="numDr">0</b></span></div>
      <div class="row" id="rowQual" style="display:none"><span class="lab">Монтаж</span><span class="bar qa"><i id="barQa"></i><b id="numQa">0</b></span></div>
    </div>
    <div id="hudTR" class="panel">
      <div class="money" id="numMoney">0 ₽</div>
      <div class="rep" id="numRep">Репутация: 0 — стажёр</div>
      <div id="clock">17:00</div>
      <div id="daypart">закат</div>
      <div id="eyes" title="Уровень внимания"><span>👁</span><span>👁</span><span>👁</span><span>👁</span><span>👁</span></div>
    </div>
    <div id="hudBL" class="panel">
      <div id="taskTitle">Смена не начата</div>
      <div id="taskStep">—</div>
      <div id="taskHint"></div>
      <div id="taskTimer">00:00</div>
    </div>
    <div id="hudBR" class="panel">
      <div id="mmLabel">Район «Заводская Слобода»</div>
      <canvas id="minimap" width="180" height="140"></canvas>
    </div>
    <div id="hudBC"></div>
  </div>

  <div id="radio"><div class="panel">
    <span id="stationName">РАДИО ЗАКАТ</span>
    <span id="tickWrap"><span id="tick"></span></span>
    <span id="radioKey">Q</span>
  </div></div>

  <div id="toasts"></div>
  <div id="prompt"><div class="panel"><span id="promptText"></span></div></div>

  <div id="dialog"><div class="panel">
    <canvas id="portrait" width="88" height="88"></canvas>
    <div id="dlgBody">
      <div id="dlgName">ТАМАРА</div>
      <div id="dlgText"></div>
      <div id="dlgOpts"></div>
      <div id="dlgNext">Space / E — далее</div>
    </div>
  </div></div>

  <div id="mini">
    <canvas id="miniCanvas"></canvas>
    <div id="miniTop">
      <span id="miniTitle">МОНТАЖ</span>
      <span id="miniPhase">этап 1</span>
      <span id="miniQ" class="panel" style="pointer-events:none">
        <div class="row" style="margin:0"><span class="lab">Качество</span><span class="bar qa"><i id="miniQBar"></i><b id="miniQNum">0</b></span></div>
      </span>
    </div>
    <div id="miniBottom" class="panel">
      <span id="miniHint">—</span>
      <span id="miniBtns"></span>
    </div>
  </div>

  <div id="screens"><div class="sheet" id="sheet"></div></div>
  <div id="errbox"><b>Что-то отвалилось (как обычно)</b><span id="errtext"></span></div>
  <div id="loading"><span id="loadTitle">Собираем район…</span><small id="loadStep">генерируем текстуры</small><div id="loadBar"><i></i></div></div>
</div>
<script>
/* =====================================================================
   МОНТАЖ-СИТИ 3D: ТРУДНАЯ СМЕНА
   Вид от третьего лица. Собственный WebGL2-рендерер: ни одной внешней
   библиотеки, вся геометрия и все текстуры генерируются кодом.
   Персонажи, организации и события вымышлены; ассеты — оригинальные.
   ===================================================================== */
(function () {
'use strict';

/* ------------------------------------------------------------------ */
/* Конфигурация качества и производительности                          */
/* ------------------------------------------------------------------ */
/* ЕДИНСТВЕННОЕ место, где живут числа качества. Всё, что влияет на цену
   кадра или на резкость картинки, задаётся здесь и читается по имени:
   в шейдерах и в проходах кадра «магических» чисел быть не должно.
   Профиль выбирает игрок в настройках (S.quality), активный лежит в Q.
   Что применяется на лету: dprMax, scale/scaleMin, aniso, texSS (текстуры
   пересобираются с полосой прогресса), lamps, lampPick, glowR, vis, sparks,
   scan, detail. Только при следующем запуске: msaa — атрибут контекста, и
   veg — плотность зелени зашита в геометрию района. */
const QCFG = {
  profiles: {
    low: {
      title: 'низкое',
      dprMax: 1.0,        /* потолок плотности пикселей: 1× даже на Retina */
      scale: 0.85,        /* стартовый масштаб рендера (доля от dprMax) */
      scaleMin: 0.5,      /* ниже авто-масштаб не опускается */
      texSS: 1,           /* холсты текстур в логическом размере: 256² вместо 512² */
      aniso: 4,           /* анизотропная фильтрация, ограничена возможностями GPU */
      msaa: 0,            /* сэмплов в HDR-буфере сцены: 0, 2 или 4 */
      detail: false,      /* detail-нормаль вблизи */
      lamps: 4,           /* источников света в шейдере, не больше shader.maxLamps */
      lampPick: 3,        /* ближайших фонарей в подборке ночью */
      glowR: 32,          /* радиус свечений фонарей, м */
      vis: 0.8,           /* множитель дальности отрисовки жителей и техники */
      sparks: 0.5,        /* доля частиц искр и пыли */
      scan: false,        /* полоски развёртки поверх кадра */
      veg: { grass: 0.5, cards: 0.6 }   /* плотность травы и карт листвы */
    },
    medium: {
      title: 'среднее',
      dprMax: 1.25, scale: 1, scaleMin: 0.6, texSS: 2, aniso: 8, msaa: 2, detail: true,
      lamps: 8, lampPick: 5, glowR: 52, vis: 1, sparks: 1, scan: true,
      veg: { grass: 1, cards: 1 }
    },
    high: {
      title: 'высокое',
      dprMax: 2, scale: 1, scaleMin: 0.6, texSS: 2, aniso: 16, msaa: 2, detail: true,
      lamps: 8, lampPick: 5, glowR: 52, vis: 1, sparks: 1, scan: true,
      veg: { grass: 1, cards: 1 }
    }
  },
  /* Профиль для нового игрока: Retina плюс сильный GPU — «высокое», иначе
     «среднее». Авто-масштаб страхует в обе стороны, поэтому ошибка не
     фатальна. Выбор закрепляется в настройках при первом запуске. */
  pickDefault(renderer, dpr) {
    return (dpr >= 1.5 && /Apple M\d|Apple GPU|RTX|Radeon RX|Arc\b/i.test(renderer || '')) ? 'high' : 'medium';
  },
  /* Динамический масштаб рендера. Бюджет считается от частоты монитора,
     измеренной в рантайме (display), а не от жёстких 60 Гц. */
  dynamic: {
    budgetFrac: 0.80,    /* доля интервала кадра, которую разрешаем занять GPU */
    headroom: 0.60,      /* «с запасом» — GPU занят меньше этой доли бюджета */
    downFrames: 4,       /* столько кадров подряд сверх бюджета — шаг вниз */
    upSeconds: 1.5,      /* столько секунд с запасом — шаг вверх */
    upSecondsNoTimer: 3, /* то же без таймер-запросов GPU (Safari) */
    step: 0.05,          /* шаг масштаба; вниз умножается на перерасход, до ×3 */
    quantum: 0.025,      /* масштаб округляется к сетке — меньше перевыделений буфера */
    cooldownMs: 350,     /* пауза между шагами: перевыделение буфера не бесплатно */
    dropRatio: 1.5,      /* кадр длиннее интервала во столько раз — пропущенный */
    dropTolerance: 0.05, /* без таймера GPU: доля пропусков, при которой ещё можно расти */
    ceilHoldSec: 8       /* после «вверх и сразу вниз» планка держится столько секунд */
  },
  /* Частота монитора: медиана интервалов requestAnimationFrame, прижатая к
     известным частотам; перемеряется, потому что окно могут перетащить. */
  display: { samples: 48, remeasureSec: 15, known: [30, 48, 50, 60, 72, 75, 85, 90, 100, 120, 144, 165, 240] },
  /* Слой интерфейса поверх сцены (реплики, метки, мини-игры) — всегда в
     полной плотности, масштаб рендера его не касается. */
  uiDprMax: 2,
  /* Компилируемые пределы шейдера. */
  shader: { maxLamps: 8 },
  /* Свечения: дальности в метрах, умножаются на profile.vis. */
  glow: {
    lampNear: 26, signR: 55, carR: 45,      /* дальности, м */
    /* Размеры и прозрачности спрайтов свечения: пара [размер в метрах,
       прозрачность], жёсткость — показатель спада к краю квада. */
    lampBig: [3.2, 0.75, 2.0], lampSmall: [1.6, 0.5, 2.0], lampHalo: [8, 0.14, 3.2],
    sign: [4.2, 0.38, 2.4], head: [1.5, 0.5, 2.2], tail: [1.1, 0.4, 2.2],
    torch: [1.2, 0.7, 2.2], marker: [1.5, 0.30, 2.2], markerBase: [3.4, 0.22, 3],
    spark: [6, 0.7, 2], dust: [6, 0.35, 2]
  },
  /* Текстуры: размеры логические (холст = size × texSS), карты — из высот. */
  tex: {
    surfSize: 256,       /* материалы поверхностей: 15 слоёв, полный комплект карт */
    cardSize: 512,       /* атласы зелени и знаков: только albedo с альфой */
    signSize: [256, 64], /* вывески: один слой на каждую */
    detailSize: 128,     /* detail-нормаль высокой частоты */
    detailScale: 7,      /* повторов detail-нормали на тайл материала */
    detailNear: 6,       /* до этой дистанции detail в полную силу, м */
    detailFar: 22,       /* дальше не подмешивается */
    detailStrength: 0.55,
    aoRadius: 5,         /* радиус размытия высот для ambient occlusion, px логических */
    aoStrength: 2.0,
    /* Пороги альфа-теста. У зелени ниже общего: на дальних мипах альфа
       усредняется с пустотой и при 0.5 крона редеет. Вывескам нужен чёткий край. */
    cutVeg: 0.40, cutSign: 0.5
  },
  /* Цвет. Albedo лежит в SRGB8_ALPHA8 и семплится линейно; вершинные цвета
     и авторские тинты переводятся в линейное пространство той же гаммой.
     Кодирование в sRGB — один раз, в проходе постобработки.
     Коэффициенты sunK/ambK/skyK/fogK этапа 02 были костылями под старую
     модель — балансом теперь занимаются QCFG.light и QCFG.sky. */
  color: { gamma: 2.2 },
  /* Свет. Модель отражения физическая: GGX (Троубридж–Райц) для распределения
     микрограней, высотно-коррелированный Smith для затенения геометрией,
     Френель по Шлику, Ламберт в диффузе с сохранением энергии. Одна и та же
     BRDF для солнца, для точечных источников и для окружения. Ни одного
     числа освещения в шейдере — всё здесь. */
  light: {
    sunK: 8.0,          /* освещённость от солнца = прозрачность атмосферы × sunK */
    vGlossK: 0.85,      /* лужи, стекло, краска: rough_eff = rough·(1 − vGloss·k) */
    roughMin: 0.045,    /* ниже блик вырождается в точку и мерцает на движении */
    f0: 0.04,           /* отражение диэлектрика в упор, 4 % */
    /* Точечные источники: спад обратный квадрату с оконной функцией на
       радиусе, та же BRDF, что у солнца. Раньше был линейный спад (1 − d/16)²
       и обёртка 0.75/0.25, из-за которой затенённая сторона всё равно
       светилась. */
    lamp: {
      radius: 16,       /* дальше источник не считается, м */
      /* Радиус самого светильника. Точечный источник на полутора метрах даёт
         обратным квадратом вдесятеро больше прежнего линейного спада и
         выжигает землю под ногами; у настоящей лампы есть размер, и ближе
         своего радиуса она не разгорается. */
      srcR: 1.2,
      /* Сила источника: освещённость = power·k·окно²/расстояние². Значение не
         на глаз: приравнено к прежнему вкладу (0.75·NoL + 0.25)·(1 − d/16)² на
         восьми и на четырнадцати метрах — оба уравнения дают 21. */
      power: 21,
      warm: [1, .82, .55], oleg: [.65, .7, .95], torch: [1, .95, .8], bike: [1, .92, .7],
      /* kOleg — не светильник, а игровая поблажка «чтобы ночью не идти
         вслепую»: при честном спаде её пришлось убавить втрое. */
      kSmall: 0.7, kBig: 1.15, kOleg: 0.18, kTorch: 1.2, kBike: 1.0
    },
    emis: { win: 1.55, tint: [1, .86, .6], tintK: 0.35 },   /* окна и неон */
    glowK: 1.0,         /* общая сила свечений-спрайтов */
    horizonOccl: 1.0,   /* гашение отражений, ушедших под геометрическую нормаль */
    sunAO: 0.5,         /* насколько карта AO гасит прямой солнечный свет */
    glossNight: 1.45,   /* к ночи поверхности «влажнее» и сильнее бликуют */
    /* Тени-блобы под объектами: не модель освещения, а дешёвая подложка. */
    shadow: { lift: 0.022, hard: 1.6, ped: [1.3, 0.38], dog: [1.1, 0.34], car: [3.4, 0.4],
              guard: [2.0, 0.4], bike: [1.6, 0.35], oleg: [1.4, 0.45], olegBike: [2.2, 0.45] },
    /* Вершинное затенение низа стен и кузовов. Это не дубль карты AO: та про
       мелкий рельеф материала, а это контакт с землёй, которого карте взять
       неоткуда. Сила задана так, как читается после линеаризации. */
    groundAO: { y0: 0, y1: 3.5, k: 0.17 },
    bodyAO: { y0: 0.15, y1: 1.0, k: 0.12 }
  },
  /* Небо: однократное рассеяние Рэлея и Ми по лучу зрения. Коэффициенты
     стандартные для земной атмосферы, длины в метрах. Модель живёт в одном
     месте (GLSL_SKY): из неё собирается шейдер кубмапы, и по ней же на CPU
     считаются сферические гармоники рассеянного света. Совпадение двух

/* --- матрицы 4x4 (column-major, как ждёт GL) --- */
function m4() { const m = new Float32Array(16); m[0] = m[5] = m[10] = m[15] = 1; return m; }

        a20=a[8],a21=a[9],a22=a[10],a23=a[11],a30=a[12],a31=a[13],a32=a[14],a33=a[15];

    o[i*4]   = b0*a00 + b1*a10 + b2*a20 + b3*a30;
    o[i*4+1] = b0*a01 + b1*a11 + b2*a21 + b3*a31;

  let zx = ex - cx, zy = ey - cy, zz = ez - cz;
  let l = Math.hypot(zx, zy, zz) || 1; zx /= l; zy /= l; zz /= l;
  let xx = uy * zz - uz * zy, xy = uz * zx - ux * zz, xz = ux * zy - uy * zx;
  l = Math.hypot(xx, xy, xz) || 1; xx /= l; xy /= l; xz /= l;

  o[4]=m10*s; o[5]=m11*s; o[6]=m12*s; o[7]=0;

/* 1. WebGL: контекст, шейдеры, буферы                                  */

const GL = { gl: null, canvas: null, w: 1, h: 1, dpr: 1, scale: 1, uiDpr: 1, aniso: null, maxAniso: 1, renderer: '' };

/* Числа конфигурации в текст шейдера. */
const gf = v => (v !== 0 && Math.abs(v) < 1e-4 ? v.toExponential(8) : v.toFixed(8));
const gv3 = a => 'vec3(' + a.map(gf).join(', ') + ')';

/* --- Модель неба: однократное рассеяние Рэлея и Ми ---------------------
   Луч зрения делится на отсчёты; в каждом считается, сколько света дошло от
   солнца (внутренний цикл — оптическая глубина к солнцу) и сколько из него
   рассеялось в сторону наблюдателя. Отсюда сами собой берутся синий зенит
   (Рэлей сильнее в коротких волнах), красный закат (длинный путь через
   атмосферу выедает синеву) и белёсый ореол вокруг солнца (Ми).

   Это единственное место, где живёт формула неба. Из неё собирается GLSL для
   кубмапы, и по ней же считаются сферические гармоники — но на CPU, чтобы
   не читать обратно то, что нарисовали. Значит, формула существует в двух
   исполнениях, и их совпадение проверяется тестом tools/sky-test.mjs. */
const GLSL_SKY = (() => {
  const K = QCFG.sky;
  return `
const vec3  BETA_R = ${gv3(K.betaR)};
const float BETA_M = ${gf(K.betaM)};
const float H_R = ${gf(K.hR)}, H_M = ${gf(K.hM)};
const float R_EARTH = ${gf(K.rEarth)}, R_ATMO = ${gf(K.rAtmo)};
const float G_MIE = ${gf(K.gMie)}, SUN_I = ${gf(K.sunI)}, MS_K = ${gf(K.msK)};
const vec3  GROUND_A = ${gv3(K.groundAlbedo)};
const vec3  NIGHT_Z = ${gv3(K.night.zenith)}, NIGHT_H = ${gv3(K.night.horizon)};

/* расстояние до верхней границы атмосферы вдоль луча */
float atmoFar(vec3 o, vec3 d){
  float b = dot(o, d), c = dot(o, o) - R_ATMO * R_ATMO;
  float disc = b * b - c;
  return disc <= 0.0 ? 0.0 : -b + sqrt(disc);
}
/* луч уходит в землю? тогда точка в её тени и не светит */
bool hitsGround(vec3 o, vec3 d){
  float b = dot(o, d), c = dot(o, o) - R_EARTH * R_EARTH;
  float disc = b * b - c;
  return disc > 0.0 && (-b - sqrt(disc)) > 0.0;
}
vec3 inscatter(vec3 dir, vec3 sun){
  vec3 o = vec3(0.0, R_EARTH + 200.0, 0.0);
  float far = atmoFar(o, dir);
  if (far <= 0.0) return vec3(0.0);
  float seg = far / ${K.viewSteps}.0;
  vec3 sumR = vec3(0.0), sumM = vec3(0.0);
  float odR = 0.0, odM = 0.0;
  for (int i = 0; i < ${K.viewSteps}; i++){
    vec3 p = o + dir * (seg * (float(i) + 0.5));
    float h = length(p) - R_EARTH;
    float dr = exp(-h / H_R) * seg, dm = exp(-h / H_M) * seg;
    odR += dr; odM += dm;
    if (hitsGround(p, sun)) continue;
    float ls = atmoFar(p, sun) / ${K.lightSteps}.0;
    float lR = 0.0, lM = 0.0;
    for (int j = 0; j < ${K.lightSteps}; j++){
      float hq = length(p + sun * (ls * (float(j) + 0.5))) - R_EARTH;
      lR += exp(-hq / H_R) * ls; lM += exp(-hq / H_M) * ls;
    }
    vec3 att = exp(-(BETA_R * (odR + lR) + BETA_M * 1.1 * (odM + lM)));
    sumR += att * dr; sumM += att * dm;
  }
  float mu = dot(dir, sun), mu2 = mu * mu;
  float pR = 0.05968310 * (1.0 + mu2);                       /* 3/(16pi) */
  float g2 = G_MIE * G_MIE;

     горизонт: там, где путь через атмосферу длинный, синева выедается
     начисто, а в действительности она возвращается переотражениями.
     Насыщение (1 − exp(−betaR·od)) даёт нужную форму — у зенита почти ноль,
     у горизонта ровный белый, — и стоит одного exp, потому что оптическая
     глубина уже посчитана. */
  vec3 ms = (vec3(1.0) - exp(-BETA_R * odR)) * (MS_K * SUN_I * max(sun.y * 1.4 + 0.06, 0.0));
  return (sumR * BETA_R * pR + sumM * BETA_M * pM) * SUN_I + ms;
}
/* Небо целиком: рассеяние, ночная подложка и земля под горизонтом.

   Для направлений вниз луч зрения ушёл бы под поверхность, плотность
   атмосферы там растёт экспоненциально и интеграл вырождается: в GLSL
   получался ноль, в JS — NaN (0 · Infinity). Поэтому нижнюю полусферу
   считаем по зеркальному направлению — это и есть дымка над далёкой землёй,
   которая вблизи горизонта неотличима от неба, — и подмешиваем к ней саму
   землю, освещённую солнцем и небом.

   Земля нужна не для картинки, её закрывает застройка, а для окружения: из
   нижней полусферы берутся отражения и рассеянный свет снизу. */

  vec3 up = dir.y < 0.0 ? vec3(dir.x, -dir.y, dir.z) : dir;
  vec3 col = inscatter(up, sun);

  if (dir.y < 0.0){
    vec3 g = GROUND_A * (max(sun.y, 0.0) * ${gf(QCFG.sky.groundSun)} + ${gf(QCFG.sky.groundSky)});
    col = mix(col, g, clamp(-dir.y * 2.5, 0.0, 1.0) * 0.85);
  }
  return max(col, vec3(0.0));
}`;

/* JS-двойник модели неба. Нужен ровно для одного: посчитать сферические

const SkyJS = {
  _o: [0, 0, 0], _p: [0, 0, 0],
  atmoFar(ox, oy, oz, dx, dy, dz) {
    const K = QCFG.sky;
    const b = ox * dx + oy * dy + oz * dz;
    const c = ox * ox + oy * oy + oz * oz - K.rAtmo * K.rAtmo;
    const disc = b * b - c;
    return disc <= 0 ? 0 : -b + Math.sqrt(disc);

  hitsGround(ox, oy, oz, dx, dy, dz) {
    const K = QCFG.sky;
    const b = ox * dx + oy * dy + oz * dz;

    const disc = b * b - c;

    const K = QCFG.sky, bR = K.betaR, bM = K.betaM;

      for (let i = 0; i < K.viewSteps; i++) {
        const t = seg * (i + 0.5);
        const px = dx * t, py = oy + uy * t, pz = dz * t;
        const h = Math.sqrt(px * px + py * py + pz * pz) - K.rEarth;
        const dr = Math.exp(-h / K.hR) * seg, dm = Math.exp(-h / K.hM) * seg;
        odR += dr; odM += dm;
        if (this.hitsGround(px, py, pz, sun[0], sun[1], sun[2])) continue;
        const ls = this.atmoFar(px, py, pz, sun[0], sun[1], sun[2]) / K.lightSteps;
        let lR = 0, lM = 0;
        for (let j = 0; j < K.lightSteps; j++) {
          const u = ls * (j + 0.5);
          const qx = px + sun[0] * u, qy = py + sun[1] * u, qz = pz + sun[2] * u;
          const hq = Math.sqrt(qx * qx + qy * qy + qz * qz) - K.rEarth;

        sR0 += a0 * dr; sR1 += a1 * dr; sR2 += a2 * dr;
        sM0 += a0 * dm; sM1 += a1 * dm; sM2 += a2 * dm;
      }
      const mu = dx * sun[0] + uy * sun[1] + dz * sun[2], mu2 = mu * mu;
      const pR = 0.05968310 * (1 + mu2);
      const g2 = K.gMie * K.gMie;
      const pM = 0.11936620 * ((1 - g2) * (1 + mu2)) /
                 ((2 + g2) * Math.pow(Math.max(1 + g2 - 2 * K.gMie * mu, 1e-4), 1.5));
      const msk = K.msK * K.sunI * Math.max(sun[1] * 1.4 + 0.06, 0);
      r = (sR0 * bR[0] * pR + sM0 * bM * pM) * K.sunI + (1 - Math.exp(-bR[0] * odR)) * msk;
      g = (sR1 * bR[1] * pR + sM1 * bM * pM) * K.sunI + (1 - Math.exp(-bR[1] * odR)) * msk;
      b = (sR2 * bR[2] * pR + sM2 * bM * pM) * K.sunI + (1 - Math.exp(-bR[2] * odR)) * msk;
    }
    const up = clamp(dir[1] * 0.5 + 0.5, 0, 1), N = QCFG.sky.night;
    r += lerp(N.horizon[0], N.zenith[0], up) * nightK;
    g += lerp(N.horizon[1], N.zenith[1], up) * nightK;
    b += lerp(N.horizon[2], N.zenith[2], up) * nightK;
    if (dir[1] < 0) {
      const A = QCFG.sky.groundAlbedo;
      const k = Math.max(sun[1], 0) * QCFG.sky.groundSun + QCFG.sky.groundSky;
      const t = clamp(-dir[1] * 2.5, 0, 1) * 0.85;
      r = lerp(r, A[0] * k, t); g = lerp(g, A[1] * k, t); b = lerp(b, A[2] * k, t);
    }
    out[0] = Math.max(r, 0); out[1] = Math.max(g, 0); out[2] = Math.max(b, 0);
    return out;
  },
  /* Прозрачность атмосферы вдоль луча на солнце: отсюда цвет и сила прямого
     солнечного света, а не из авторской палитры. */
  transmittance(out, sun) {
    const K = QCFG.sky, bR = K.betaR;
    const oy = K.rEarth + 200;
    if (this.hitsGround(0, oy, 0, sun[0], sun[1], sun[2])) { out[0] = out[1] = out[2] = 0; return out; }
    const far = this.atmoFar(0, oy, 0, sun[0], sun[1], sun[2]);
    const seg = far / (K.lightSteps * 2);
    let odR = 0, odM = 0;
    for (let j = 0; j < K.lightSteps * 2; j++) {
      const t = seg * (j + 0.5);
      const px = sun[0] * t, py = oy + sun[1] * t, pz = sun[2] * t;
      const h = Math.sqrt(px * px + py * py + pz * pz) - K.rEarth;
      odR += Math.exp(-h / K.hR) * seg; odM += Math.exp(-h / K.hM) * seg;
    }
    const m = K.betaM * 1.1 * odM;
    out[0] = Math.exp(-(bR[0] * odR + m)); out[1] = Math.exp(-(bR[1] * odR + m)); out[2] = Math.exp(-(bR[2] * odR + m));
    return out;
  }
};

/* --- Постобработка ----------------------------------------------------
   Единственное место, где линейный свет становится картинкой. Сцена, небо и
   свечения складываются в HDR-буфере, и уже он проходит экспозицию, ACES,
   насыщенность, кодирование в sRGB и дизеринг. */
const VS_TONE = `#version 300 es
layout(location=0) in vec2 aPos;
out vec2 vUV;
void main(){ vUV = aPos * 0.5 + 0.5; gl_Position = vec4(aPos, 0.0, 1.0); }`;

const FS_TONE = `#version 300 es
/* PASS:tone */
precision mediump float;
in vec2 vUV;
uniform sampler2D uHDR;
uniform float uExposure, uSat, uDither;
out vec4 fragColor;
/* ACES, аппроксимация Наркович: одна дробь вместо матриц RRT и ODT */
vec3 aces(vec3 x){
  return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0);
}
/* Interleaved gradient noise, разность двух отсчётов даёт треугольное
   распределение: в восьми битах ночное небо иначе идёт полосами. */
float ign(vec2 p){ return fract(52.9829189 * fract(dot(p, vec2(0.06711056, 0.00583715)))); }
void main(){
  vec3 c = aces(texture(uHDR, vUV).rgb * uExposure);
  float g = dot(c, vec3(0.2126, 0.7152, 0.0722));
  c = mix(vec3(g), c, uSat);
  c = pow(max(c, vec3(0.0)), vec3(1.0 / ${QCFG.color.gamma.toFixed(2)}));
  float d = ign(gl_FragCoord.xy) - ign(gl_FragCoord.xy + vec2(11.0, 7.0));
  fragColor = vec4(c + d * (uDither / 255.0), 1.0);
}`;

/* --- Физическая модель отражения --------------------------------------
   GGX (Троубридж–Райц) для распределения микрограней, высотно-
   коррелированный Smith для затенения, Френель по Шлику, Ламберт в диффузе.
   Одна и та же BRDF для солнца, для точечных источников и для окружения —
   иначе объекты и выглядят наклеенными: блик живёт по одним правилам,
   рассеянное по другим, отражение неба вовсе отсутствует. */
const GLSL_PBR = `
const float PI = 3.14159265, INV_PI = 0.31830989;
float D_GGX(float NoH, float a){
  float a2 = a * a, d = NoH * NoH * (a2 - 1.0) + 1.0;
  return a2 / max(PI * d * d, 1e-7);
}
/* уже делённый на 4·NoL·NoV — в произведении с D эти множители сокращаются */
float V_Smith(float NoV, float NoL, float a){
  float a2 = a * a;
  float gv = NoL * sqrt(NoV * NoV * (1.0 - a2) + a2);
  float gl = NoV * sqrt(NoL * NoL * (1.0 - a2) + a2);
  return 0.5 / max(gv + gl, 1e-5);
}
vec3 F_Schlick(vec3 f0, float u){ return f0 + (1.0 - f0) * pow(1.0 - u, 5.0); }
/* Приближение Кариса для второй суммы split-sum. Взято вместо таблицы BRDF:
   таблица стоила бы прохода генерации, текстуры и выборки на каждый пиксель,
   а это десяток арифметических операций и ноль обращений к памяти. */
vec3 envBRDF(vec3 f0, float rough, float NoV){
  const vec4 c0 = vec4(-1.0, -0.0275, -0.572, 0.022);
  const vec4 c1 = vec4(1.0, 0.0425, 1.04, -0.04);
  vec4 r = rough * c0 + c1;
  float a004 = min(r.x * r.x, exp2(-9.28 * NoV)) * r.x + r.y;
  vec2 ab = vec2(-1.04, 1.04) * a004 + r.zw;
  return f0 * ab.x + ab.y;
}
/* Зеркальная окклюзия из AO: гладкое зеркало окклюдируется слабее шершавого,
   иначе металл в углу чернеет. */
float specOcclusion(float NoV, float ao, float rough){
  return clamp(pow(NoV + ao, exp2(-16.0 * rough - 1.0)) - 1.0 + ao, 0.0, 1.0);
}
/* Прямой источник: солнце и фонарь считаются одинаково, разница только в
   освещённости irr и в направлении L. */
vec3 directLight(vec3 N, vec3 V, vec3 L, vec3 irr, vec3 diff, vec3 f0, float a){
  float NoL = max(dot(N, L), 0.0);
  if (NoL <= 0.0) return vec3(0.0);
  vec3 H = normalize(L + V);
  float NoV = max(dot(N, V), 1e-4), NoH = max(dot(N, H), 0.0), VoH = max(dot(V, H), 0.0);
  vec3 F = F_Schlick(f0, VoH);
  vec3 spec = F * (D_GGX(NoH, a) * V_Smith(NoV, NoL, a));
  return ((vec3(1.0) - F) * diff * INV_PI + spec) * irr * NoL;
}`;

const VS_MAIN = `#version 300 es
layout(location=0) in vec3 aPos;
layout(location=1) in vec3 aNor;
layout(location=2) in vec2 aUV;
layout(location=3) in vec3 aCol;
layout(location=4) in float aEmis;
layout(location=5) in float aPart;
layout(location=6) in float aGloss;
uniform mat4 uProj, uView, uModel;
uniform mat4 uBones[20];
uniform float uSkin;
uniform vec3 uWind;                       /* xy — вектор порыва в метрах, z — время */
out highp vec3 vWorld; out highp vec2 vUV;
out vec3 vNor; out vec3 vCol; out float vEmis; out float vGloss;
void main(){
  mat4 M = uSkin > 0.5 ? uBones[int(aPart)] : uModel;
  vec4 wp = M * vec4(aPos, 1.0);
  /* Ветер. У статичной зелени aPart — вес качания (0 у земли, ~0.3 у макушки);
     у персонажей тот же атрибут значит номер кости, поэтому ветку закрывает
     uSkin. Кора, стволы и ветви веса не получают — качаются только свободные
     карты, так что разойтись по швам нечему. */
  if (uSkin < 0.5 && aPart > 0.001) {
    float ph = wp.x * 0.42 + wp.z * 0.31;
    float g = sin(uWind.z * 1.15 + ph) * 0.66 + sin(uWind.z * 2.70 + ph * 2.3) * 0.34;
    wp.xz += uWind.xy * aPart * (0.55 + 0.45 * g);
    wp.y -= length(uWind.xy) * aPart * 0.28 * abs(g);   /* карта не тянется, а «приседает» */
  }
  vWorld = wp.xyz;
  vNor = mat3(M) * aNor;
  /* цвета вершин авторские, в sRGB — переводим в линейное, как и albedo */
  vUV = aUV; vCol = pow(max(aCol, vec3(0.0)), vec3(${QCFG.color.gamma.toFixed(2)})); vEmis = aEmis; vGloss = aGloss;
  gl_Position = uProj * uView * wp;
}`;

/* Главная программа собирается в двух вариантах: дневном (LAMPS = 0, цикла
   по источникам нет вовсе) и ночном. Обе компилируются при загрузке, а кадр
   выбирает нужную — днём восемь мёртвых итераций с полной BRDF не исполняются.

   Точность: mediump везде, кроме связанного с мировыми координатами. На Apple
   GPU mediump — половинная точность; координаты района доходят до двухсот
   метров, а развёртка с повторами detail — до сотен, и в fp16 то и другое
   рассыпается. */
const FS_MAIN = LAMPS => `#version 300 es
/* PASS:main — метка для оснастки замера (tools/perf-inject.js): по ней
   программа опознаётся в разборе кадра по проходам, а не по именам юниформ. */
precision mediump float;
precision mediump sampler2DArray;
precision mediump samplerCube;
in highp vec3 vWorld; in highp vec2 vUV;
in vec3 vNor; in vec3 vCol; in float vEmis; in float vGloss;
uniform sampler2DArray uTex;      /* albedo в SRGB8_ALPHA8: семплер отдаёт линейный цвет; альфа — маска */
uniform sampler2DArray uSurf;     /* nx ny roughness metalness, линейно */
uniform sampler2DArray uAO;       /* ambient occlusion, линейно */
uniform sampler2DArray uDetail;   /* detail-нормаль высокой частоты, RG */
uniform samplerCube uSky;         /* небо: туман и дальний план */
uniform samplerCube uPref;        /* префильтрованные по шероховатости отражения */
uniform float uPrefMax;           /* последний уровень префильтра */
uniform vec3 uSH[9];              /* сферические гармоники рассеянного света */
uniform float uLayer, uHasSurf, uTriplanar, uDetailK;
uniform vec2 uMatRM;              /* roughness, metalness для материалов без карт */
uniform vec3 uDetailP;            /* повторов на тайл, ближняя и дальняя дистанции, м */
uniform vec3 uSunDir, uSunIrr;
uniform float uFogDens, uFogMip, uNight, uAlphaMode, uCut, uGlossMul, uEmisK;
uniform vec4 uTint;
uniform highp vec3 uEye;
${LAMPS > 0 ? `uniform highp vec3 uLampPos[${LAMPS}];
uniform vec3 uLampCol[${LAMPS}];
uniform float uLampR2, uLampR0, uLampP;
uniform int uLampN;` : ''}
out vec4 fragColor;
${GLSL_PBR}
/* Освещённость из сферических гармоник L2 по формуле Рамамурти–Ханрахана:
   девять коэффициентов и два десятка операций вместо выборки из карты
   освещённости. Коэффициенты считает CPU по той же модели неба. */
vec3 shIrradiance(vec3 n){
  const float c1 = 0.429043, c2 = 0.511664, c3 = 0.743125, c4 = 0.886227, c5 = 0.247708;
  return max(c1 * uSH[8] * (n.x * n.x - n.y * n.y) + c3 * uSH[6] * n.z * n.z + c4 * uSH[0] - c5 * uSH[6]
           + 2.0 * c1 * (uSH[4] * n.x * n.y + uSH[7] * n.x * n.z + uSH[5] * n.y * n.z)
           + 2.0 * c2 * (uSH[3] * n.x + uSH[1] * n.y + uSH[2] * n.z), vec3(0.0));
}
/* Касательный базис из производных экрана: тангенсов в вершинах нет и не нужно */
vec3 perturb(vec3 N, vec3 nt, highp vec3 p, highp vec2 uv){
  vec3 dp1 = vec3(dFdx(p)), dp2 = vec3(dFdy(p));
  vec2 duv1 = vec2(dFdx(uv)), duv2 = vec2(dFdy(uv));
  vec3 dp2perp = cross(dp2, N), dp1perp = cross(N, dp1);
  vec3 T = dp2perp * duv1.x + dp1perp * duv2.x;
  vec3 B = dp2perp * duv1.y + dp1perp * duv2.y;
  float invmax = inversesqrt(max(dot(T, T), dot(B, B)) + 1e-12);
  return normalize(mat3(T * invmax, B * invmax, N) * nt);
}
void main(){
  vec3 Ng = normalize(vNor);
  vec3 vNorG = Ng;                   /* геометрическая нормаль: для горизонтной окклюзии */
  vec3 N = Ng;
  vec4 t;
  vec4 sf = vec4(0.5, 0.5, uMatRM);
  float ao = 1.0;
  float dEye = float(length(vWorld - uEye));
  if (uTriplanar > 0.0) {
    /* трёхплоскостная проекция: развёртка от мировых координат, швов и растяжений нет */
    vec3 w = pow(abs(Ng), vec3(4.0)); w /= (w.x + w.y + w.z);
    vec3 q = vWorld / uTriplanar;
    highp vec3 cx = vec3(q.zy, uLayer), cy = vec3(q.xz, uLayer), cz = vec3(q.xy, uLayer);
    t = texture(uTex, cx) * w.x + texture(uTex, cy) * w.y + texture(uTex, cz) * w.z;
    if (uHasSurf > 0.5) {
      vec4 sx = texture(uSurf, cx), sy = texture(uSurf, cy), sz = texture(uSurf, cz);
      sf = sx * w.x + sy * w.y + sz * w.z;
      ao = texture(uAO, cx).r * w.x + texture(uAO, cy).r * w.y + texture(uAO, cz).r * w.z;
      vec2 nx = sx.xy * 2.0 - 1.0, ny = sy.xy * 2.0 - 1.0, nz = sz.xy * 2.0 - 1.0;
      vec3 sg = sign(Ng);
      N = normalize(Ng + vec3(0.0, nx.y, nx.x * sg.x) * w.x + vec3(ny.x, 0.0, ny.y * sg.y) * w.y + vec3(nz.x * sg.z, nz.y, 0.0) * w.z);
    }
  } else {
    highp vec3 tc = vec3(vUV, uLayer);
    t = texture(uTex, tc);
    if (uAlphaMode > 0.5 && t.a < uCut) discard;      /* листва и знаки: альфа-тест */
    if (uHasSurf > 0.5) {
      sf = texture(uSurf, tc);
      ao = texture(uAO, tc).r;
      vec2 nxy = sf.xy * 2.0 - 1.0;
      /* Производные развёртки считаем ДО ветки: внутри неоднородного
         ветвления они не определены, а textureGrad как раз и нужен, чтобы
         уровень мипа не зависел от того, зашли мы в ветку или нет. */
      highp vec2 duv = vUV * uDetailP.x;
      vec2 ddx = vec2(dFdx(duv)), ddy = vec2(dFdy(duv));
      if (uDetailK > 0.0 && dEye < uDetailP.z) {
        /* detail-нормаль вблизи — то, что убирает мыло в упор */
        float k = uDetailK * (1.0 - smoothstep(uDetailP.y, uDetailP.z, dEye));
        nxy += (textureGrad(uDetail, vec3(duv, 0.0), ddx, ddy).xy * 2.0 - 1.0) * k;
      }
      N = perturb(Ng, normalize(vec3(nxy, sqrt(max(0.06, 1.0 - dot(nxy, nxy))))), vWorld, vUV);
    }
  }
  vec3 V = normalize(uEye - vWorld);
  vec3 albedo = t.rgb * vCol * uTint.rgb;
  float metal = sf.w;
  /* vGloss — авторская поправка «мокрое, лакированное, стеклянное»: она
     снижает шероховатость, а не подменяет её. Всё остальное из карт. */
  float rough = max(sf.z * (1.0 - clamp(vGloss * uGlossMul, 0.0, 1.0) * ${gf(QCFG.light.vGlossK)}), ${gf(QCFG.light.roughMin)});
  float a = rough * rough;
  vec3 diff = albedo * (1.0 - metal);
  vec3 f0 = mix(vec3(${gf(QCFG.light.f0)}), albedo, metal);
  float NoV = max(dot(N, V), 1e-4);

  /* солнце */
  vec3 lit = directLight(N, V, uSunDir, uSunIrr * mix(1.0, ao, ${gf(QCFG.light.sunAO)}), diff, f0, a);

  /* Окружение как свет. Рассеянное — из сферических гармоник неба;
     зеркальное — из префильтрованной по шероховатости кубмапы по отражённому
     вектору, со split-sum: свёртку даёт префильтр, интеграл BRDF —
     приближение Кариса. Именно это превращает объекты из наклеенных в
     стоящие в сцене: металл отражает небо, тени подсвечены голубым. */
  vec3 R = reflect(-V, N);
  /* Горизонтная окклюзия: отражение, ушедшее под геометрическую поверхность,
     физически невозможно — иначе карта нормалей ловит небо сквозь стену. */
  float horiz = clamp(1.0 + ${gf(QCFG.light.horizonOccl)} * dot(R, vNorG), 0.0, 1.0);
  horiz *= horiz;
  vec3 skyRad = textureLod(uPref, R, rough * uPrefMax).rgb;
  lit += diff * shIrradiance(N) * INV_PI * ao;
  lit += skyRad * envBRDF(f0, rough, NoV) * specOcclusion(NoV, ao, rough) * horiz;

${LAMPS > 0 ? `
  /* точечные источники: фонари, витрины и фары */
  for (int i = 0; i < ${LAMPS}; i++) {
    if (i >= uLampN) break;
    vec3 d = vec3(uLampPos[i] - vWorld);
    float d2 = dot(d, d);
    if (d2 > uLampR2) continue;
    /* спад обратный квадрату с оконной функцией на радиусе: свет кончается
       ровно там, где кончается, и не обрывается ступенькой */
    float win = clamp(1.0 - d2 * d2 / (uLampR2 * uLampR2), 0.0, 1.0);
    float att = uLampP * win * win / max(d2, uLampR0);
    lit += directLight(N, V, d * inversesqrt(max(d2, 1e-8)), uLampCol[i] * att * ao, diff, f0, a);
  }` : ''}
  /* окна и неон: альфа текстуры — маска свечения */
  float winMask = (uAlphaMode > 0.5) ? 0.0 : t.a;
  float em = vEmis + winMask;
  lit += (albedo * em * ${gf(QCFG.light.emis.win)} + ${gv3(QCFG.light.emis.tint)} * winMask * ${gf(QCFG.light.emis.tintK)}) * uNight * uEmisK;
  /* Туман: цвет берётся из той же модели неба по направлению взгляда — вдаль
     объекты уходят ровно в тот оттенок, каким там небо, и на закате туман
     краснеет со стороны солнца сам, без отдельной палитры. */
  float f = 1.0 - exp(-uFogDens * dEye);
  vec3 col = mix(lit, textureLod(uSky, -V, uFogMip).rgb, clamp(f, 0.0, 1.0));
  /* линейный свет в HDR-буфер: экспозиция и тонмаппинг — один раз, в проходе постобработки */
  fragColor = vec4(col, uTint.a);
}`;

/* --- Небо в кубмапу ---------------------------------------------------
   Дорогая часть неба считается сюда: одна грань 128² за кадр и только когда
   солнце сдвинулось. В кадре из неё берутся фон, туман, отражения и
   рассеянный свет — четыре потребителя на один расчёт. */
const VS_FACE = `#version 300 es
layout(location=0) in vec2 aPos;
out vec2 vP;
void main(){ vP = aPos; gl_Position = vec4(aPos, 0.0, 1.0); }`;

const FS_CUBE = `#version 300 es
/* PASS:env */
precision highp float;
in vec2 vP;
uniform vec3 uFaceO, uFaceU, uFaceV;   /* базис грани куба */
uniform vec3 uSunDir;
uniform float uNight;
out vec4 fragColor;
${GLSL_SKY}
void main(){
  fragColor = vec4(skyColor(normalize(uFaceO + uFaceU * vP.x + uFaceV * vP.y), uSunDir, uNight), 1.0);
}`;

/* --- Префильтр отражений ----------------------------------------------
   Свёртка кубмапы неба ядром GGX по уровням шероховатости: нулевой уровень —
   зеркало, последний — почти рассеянное. Это вторая половина split-sum;
   первая (интеграл BRDF) взята аналитическим приближением Кариса, поэтому
   таблицы BRDF и прохода её генерации нет вовсе. */
const FS_PREF = `#version 300 es
/* PASS:env */
precision highp float;
in vec2 vP;
uniform vec3 uFaceO, uFaceU, uFaceV;
uniform samplerCube uSrc;
uniform float uRough, uSrcSize;
uniform int uSamples;
out vec4 fragColor;
const float PI = 3.14159265;
/* Хаммерсли: детерминированная последовательность без текстуры шума */
vec2 hammersley(int i, int n){
  uint b = uint(i);
  b = (b << 16u) | (b >> 16u);
  b = ((b & 0x55555555u) << 1u) | ((b & 0xAAAAAAAAu) >> 1u);
  b = ((b & 0x33333333u) << 2u) | ((b & 0xCCCCCCCCu) >> 2u);
  b = ((b & 0x0F0F0F0Fu) << 4u) | ((b & 0xF0F0F0F0u) >> 4u);
  b = ((b & 0x00FF00FFu) << 8u) | ((b & 0xFF00FF00u) >> 8u);
  return vec2(float(i) / float(n), float(b) * 2.3283064365386963e-10);
}
vec3 importanceGGX(vec2 xi, vec3 N, float a){
  float phi = 2.0 * PI * xi.x;
  float ct = sqrt((1.0 - xi.y) / (1.0 + (a * a - 1.0) * xi.y));
  float st = sqrt(max(1.0 - ct * ct, 0.0));
  vec3 h = vec3(st * cos(phi), st * sin(phi), ct);
  vec3 up = abs(N.z) < 0.999 ? vec3(0.0, 0.0, 1.0) : vec3(1.0, 0.0, 0.0);
  vec3 tx = normalize(cross(up, N)), ty = cross(N, tx);
  return tx * h.x + ty * h.y + N * h.z;
}
void main(){
  vec3 N = normalize(uFaceO + uFaceU * vP.x + uFaceV * vP.y);
  if (uRough <= 0.0) { fragColor = vec4(texture(uSrc, N).rgb, 1.0); return; }
  float a = uRough * uRough;
  vec3 sum = vec3(0.0); float wsum = 0.0;
  for (int i = 0; i < 64; i++) {
    if (i >= uSamples) break;
    vec3 H = importanceGGX(hammersley(i, uSamples), N, a);
    vec3 L = 2.0 * dot(N, H) * H - N;
    float NoL = dot(N, L);
    if (NoL <= 0.0) continue;
    /* Мип источника по телесному углу отсчёта: без него на грубых уровнях
       небо распадается на светлые точки — отсчётов меньше, чем текселей. */
    float NoH = max(dot(N, H), 1e-4);
    float d = NoH * NoH * (a * a - 1.0) + 1.0;
    float pdf = (a * a) / (PI * d * d) * 0.25 + 1e-4;
    float sa = 1.0 / (float(uSamples) * pdf);
    float sTex = 4.0 * PI / (6.0 * uSrcSize * uSrcSize);
    sum += textureLod(uSrc, L, max(0.5 * log2(sa / sTex), 0.0)).rgb * NoL;
    wsum += NoL;
  }
  fragColor = vec4(sum / max(wsum, 1e-4), 1.0);
}`;

const VS_SKY = `#version 300 es
layout(location=0) in vec2 aPos;
uniform mat4 uInvVP;
out vec3 vDir;
void main(){
  vec4 p = uInvVP * vec4(aPos, 1.0, 1.0);
  vDir = p.xyz / p.w;
  /* w = z: небо садится ровно на дальнюю плоскость и рисуется последним из
     непрозрачного с проверкой глубины — под домами шейдер не исполняется */
  gl_Position = vec4(aPos, 1.0, 1.0);

const FS_SKY = `#version 300 es
/* PASS:sky */
precision mediump float;
precision mediump samplerCube;
in highp vec3 vDir;
uniform highp vec3 uEye;
uniform vec3 uSunDir, uSunTint, uMoonDir;
uniform samplerCube uSky;
uniform float uCloud, uTime, uNight;
out vec4 fragColor;
float h21(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
float vnoise(vec2 p){
  vec2 i = floor(p), f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  return mix(mix(h21(i), h21(i + vec2(1,0)), f.x), mix(h21(i + vec2(0,1)), h21(i + vec2(1,1)), f.x), f.y);
}
/* Четыре октавы вместо пяти: пятая давала рябь мельче пикселя, а стоила
   восьми хешей. Считается только там, где небо видно. */
float fbm(vec2 p){
  float s = 0.0, a = 0.5;
  for (int k = 0; k < 4; k++) { s += a * vnoise(p); p *= 2.03; a *= 0.5; }
  return s;
}
void main(){
  vec3 d = normalize(vDir - uEye);
  vec3 col = texture(uSky, d).rgb;
  float sd = max(dot(d, uSunDir), 0.0);
  /* Диск солнца и луна: в кубмапе 128² они размазались бы в пятно, поэтому
     считаются здесь, аналитически, поверх выборки. */
  col += uSunTint * pow(sd, ${gf(QCFG.sky.disk.pow)}) * ${gf(QCFG.sky.disk.k)};
  if (uNight > 0.01) {
    float md = max(dot(d, uMoonDir), 0.0);
    col += ${gv3(QCFG.sky.moon.col)} * uNight *
           (smoothstep(${gf(QCFG.sky.moon.cos)}, 1.0, md) * ${gf(QCFG.sky.moon.k)} +
            pow(md, ${gf(QCFG.sky.moon.glowPow)}) * 0.2);
    vec3 sp = floor(d * ${gf(QCFG.sky.stars.dens)});
    float st = h21(sp.xy + sp.z * 37.0);
    st = pow(max(st - 0.984, 0.0) * 62.0, 2.0);
    col += vec3(st) * uNight * ${gf(QCFG.sky.stars.k)} * smoothstep(0.0, 0.25, d.y);
  }
  if (d.y > 0.0) {
    /* облачный слой: плоскость над головой, проекция направления взгляда */
    float dy = max(d.y, 0.035);
    vec2 cp = d.xz / dy * ${gf(QCFG.sky.cloud.plane)} + vec2(uTime * ${gf(QCFG.sky.cloud.speed[0])}, uTime * ${gf(QCFG.sky.cloud.speed[1])});
    float n = fbm(cp * ${gf(QCFG.sky.cloud.lo)});
    n = smoothstep(0.52 - uCloud * 0.22, 0.86, n + uCloud * 0.16);
    float edge = fbm(cp * ${gf(QCFG.sky.cloud.hi)}) * 0.5 + 0.5;
    float cov = n * smoothstep(0.0, 0.16, d.y);
    /* Облака красит то же небо: тень снизу, освещённая сторона сверху,
       подсветка со стороны солнца. Своих палитр у облаков больше нет. */
    vec3 lo = texture(uSky, vec3(d.x, -0.3, d.z)).rgb;
    vec3 hi = texture(uSky, vec3(0.0, 1.0, 0.0)).rgb;
    vec3 cloud = mix(lo * 0.8, mix(hi, uSunTint, 0.30) * (0.7 + 0.6 * edge), edge)
               + uSunTint * pow(sd, 5.0) * ${gf(QCFG.sky.cloud.sunlit)};
    col = mix(col, cloud, cov * 0.85);
  }
  fragColor = vec4(col, 1.0);
}`;

out vec2 vUV;

const FS_GLOW = `#version 300 es
/* PASS:glow */
precision mediump float;
in vec2 vUV;
uniform vec4 uColor;
uniform float uHard, uMode;
out vec4 fragColor;
void main(){
  float r = length(vUV);
  float a = pow(clamp(1.0 - r, 0.0, 1.0), uHard);
  if (uMode > 0.5) fragColor = vec4(uColor.rgb, a * uColor.a);   /* тень: обычное смешивание */

function compile(gl, type, src, name) {
  const sh = gl.createShader(type);
  gl.shaderSource(sh, src); gl.compileShader(sh);
  if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
    throw new Error('Шейдер ' + name + ': ' + gl.getShaderInfoLog(sh));
  }
  return sh;
}
function program(gl, vs, fs, name) {
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl, gl.VERTEX_SHADER, vs, name + '.vs'));
  gl.attachShader(p, compile(gl, gl.FRAGMENT_SHADER, fs, name + '.fs'));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error('Программа ' + name + ': ' + gl.getProgramInfoLog(p));
  const u = {};
  const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) {
    const info = gl.getActiveUniform(p, i);
    const nm = info.name.replace(/\[0\]$/, '');
    u[nm] = gl.getUniformLocation(p, info.name);
    if (info.size > 1) for (let k = 1; k < info.size; k++) u[nm + '[' + k + ']'] = gl.getUniformLocation(p, nm + '[' + k + ']');
  }
  return { p, u };
}

/* ------------------------------------------------------------------ */
/* 2. Меши: сборка геометрии                                            */
/* ------------------------------------------------------------------ */
const STRIDE = 14;                       /* pos3 nor3 uv2 col3 emis1 part1 gloss1 */

/* Замкнутый контур скруглённого прямоугольника в плоскости XZ.
   Точки идут так, чтобы боковые четырёхугольники и верхняя крышка
   получались лицевой стороной наружу (обход против часовой сверху). */
function rrLoop(w, d, r, cs) {
  r = clamp(r, 0.0015, Math.max(0.0015, Math.min(w, d) / 2 - 1e-4));
  cs = Math.max(1, cs | 0);
  const hw = w / 2 - r, hd = d / 2 - r;
  const corners = [[hw, hd], [-hw, hd], [-hw, -hd], [hw, -hd]];
  const pts = [];
  let per = 0;
  for (let ci = 0; ci < 4; ci++) {
    const [cx, cz] = corners[ci];
    for (let s = 0; s <= cs; s++) {
      const a = (ci + s / cs) * (Math.PI / 2);
      const nx = Math.cos(a), nz = Math.sin(a);
      pts.push({ x: cx + nx * r, z: cz + nz * r, nx, nz, u: 0 });
    }
  }
  pts.reverse();
  for (let i = 0; i < pts.length; i++) {
    pts[i].u = per;
    const j = (i + 1) % pts.length;
    per += Math.hypot(pts[j].x - pts[i].x, pts[j].z - pts[i].z);
  }
  pts.per = per;
  return pts;
}

class Mesh {
  constructor() { this.v = []; this.i = []; this.n = 0; this.g = 0; }
  /* блеск — «состояние материала»: примитивы берут его из opt.gloss */
  _g(opt) { const p = this.g; if (opt && opt.gloss !== undefined) this.g = opt.gloss; return p; }
  vert(x, y, z, nx, ny, nz, u, vv, r, g, b, e, part) {
    this.v.push(x, y, z, nx, ny, nz, u, vv, r, g, b, e || 0, part || 0, this.g);
    return this.n++;
  }
  tri(a, b, c) { this.i.push(a, b, c); }
  /* четырёхугольник с разными нормалями в вершинах */
  quadN(p0, p1, p2, p3, n0, n1, n2, n3, uv, col, emis, part) {
    const [r, g, b] = col;
    const a = this.vert(p0[0], p0[1], p0[2], n0[0], n0[1], n0[2], uv[0], uv[1], r, g, b, emis, part);
    const bb = this.vert(p1[0], p1[1], p1[2], n1[0], n1[1], n1[2], uv[2], uv[3], r, g, b, emis, part);
    const c = this.vert(p2[0], p2[1], p2[2], n2[0], n2[1], n2[2], uv[4], uv[5], r, g, b, emis, part);
    const d = this.vert(p3[0], p3[1], p3[2], n3[0], n3[1], n3[2], uv[6], uv[7], r, g, b, emis, part);
    this.i.push(a, bb, c, a, c, d);
  }
  /* четырёхугольник с разными цветами в вершинах — мягкие переходы */
  quadC(p0, p1, p2, p3, nx, ny, nz, uv, c0, c1, c2, c3, emis, part) {
    const a = this.vert(p0[0], p0[1], p0[2], nx, ny, nz, uv[0], uv[1], c0[0], c0[1], c0[2], emis, part);
    const b = this.vert(p1[0], p1[1], p1[2], nx, ny, nz, uv[2], uv[3], c1[0], c1[1], c1[2], emis, part);
    const c = this.vert(p2[0], p2[1], p2[2], nx, ny, nz, uv[4], uv[5], c2[0], c2[1], c2[2], emis, part);
    const d = this.vert(p3[0], p3[1], p3[2], nx, ny, nz, uv[6], uv[7], c3[0], c3[1], c3[2], emis, part);
    this.i.push(a, b, c, a, c, d);
  }
  quad(p0, p1, p2, p3, nx, ny, nz, uv, col, emis, part) {
    const n = [nx, ny, nz];
    this.quadN(p0, p1, p2, p3, n, n, n, n, uv, col, emis, part);
  }
  /* коробка: центр по XZ, основание на y0; uvScale — метров на тайл */
  box(cx, y0, cz, w, h, d, col, opt) {
    opt = opt || {};
    const gp = this._g(opt);
    const s = opt.uv || 1, e = opt.emis || 0, part = opt.part || 0;
    const x0 = cx - w / 2, x1 = cx + w / 2, z0 = cz - d / 2, z1 = cz + d / 2, y1 = y0 + h;
    const top = opt.topCol || col, side = col;
    const uw = w / s, ud = d / s, uh = h / s;
    const uo = opt.uvOff || [0, 0];
    if (opt.skipSides !== true) {
      this.quad([x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1], 0,0,1, [uo[0],ud+uo[1], uo[0]+uw,ud+uo[1], uo[0]+uw,uo[1], uo[0],uo[1]], side, e, part);
      this.quad([x1,y0,z0],[x0,y0,z0],[x0,y1,z0],[x1,y1,z0], 0,0,-1, [uo[0],ud+uo[1], uo[0]+uw,ud+uo[1], uo[0]+uw,uo[1], uo[0],uo[1]], side, e, part);
      this.quad([x1,y0,z1],[x1,y0,z0],[x1,y1,z0],[x1,y1,z1], 1,0,0, [uo[0],ud+uo[1], uo[0]+ud,ud+uo[1], uo[0]+ud,uo[1], uo[0],uo[1]], side, e, part);
      this.quad([x0,y0,z0],[x0,y0,z1],[x0,y1,z1],[x0,y1,z0], -1,0,0, [uo[0],ud+uo[1], uo[0]+ud,ud+uo[1], uo[0]+ud,uo[1], uo[0],uo[1]], side, e, part);
      /* по вертикали растягиваем ровно по высоте */
      const base = this.v.length - 4 * 4 * STRIDE;
      for (let f = 0; f < 4; f++) for (let k = 0; k < 4; k++) {
        const idx = base + (f * 4 + k) * STRIDE + 7;
        this.v[idx] = (k === 0 || k === 1) ? uh + uo[1] : uo[1];
      }
    }
    if (opt.skipTop !== true)
      this.quad([x0,y1,z1],[x1,y1,z1],[x1,y1,z0],[x0,y1,z0], 0,1,0, [uo[0],uo[1], uo[0]+uw,uo[1], uo[0]+uw,uo[1]+ud, uo[0],uo[1]+ud], top, opt.topEmis || 0, part);
    if (opt.bottom === true)
      this.quad([x0,y0,z0],[x1,y0,z0],[x1,y0,z1],[x0,y0,z1], 0,-1,0, [0,0, uw,0, uw,ud, 0,ud], col, 0, part);
    this.g = gp;
  }
  /* Коробка с фасками (и, если нужно, сужением кверху).
     opt: bev — ширина фаски, r — радиус скругления углов в плане,
     cs — сегментов на угол, taper — [sx, sz] масштаб верхней грани. */
  bevelBox(cx, y0, cz, w, h, d, col, opt) {
    opt = opt || {};
    const gp = this._g(opt);
    const bev = Math.min(opt.bev === undefined ? Math.min(w, h, d) * 0.12 : opt.bev, h / 2 - 1e-3, Math.min(w, d) / 2 - 1e-3);
    const r = Math.max(opt.r || 0, 0.0015), cs = Math.max(1, opt.cs || 2);
    const tp = opt.taper || [1, 1];
    const uvS = opt.uv || 1, e = opt.emis || 0, part = opt.part || 0;
    const top = opt.topCol || col;
    /* профили колец: [доля высоты, вписка внутрь, признак фаски] */
    const rings = [
      { t: 0, in: bev, k: -1 },
      { t: bev / h, in: 0, k: 0 },
      { t: 1 - bev / h, in: 0, k: 0 },
      { t: 1, in: bev, k: 1 }
    ];
    const loops = rings.map(rg => {
      const sx = lerp(1, tp[0], rg.t), sz = lerp(1, tp[1], rg.t);
      const ww = Math.max(0.002, w * sx - rg.in * 2), dd = Math.max(0.002, d * sz - rg.in * 2);
      const lp = rrLoop(ww, dd, Math.min(r, Math.min(ww, dd) / 2 - 1e-4), cs);
      return { lp, y: y0 + h * rg.t, k: rg.k };
    });
    const N = loops[0].lp.length;
    const nrm = (p, k) => {
      if (!k) return [p.nx, 0, p.nz];
      const l = Math.hypot(p.nx * 0.62, 0.78, p.nz * 0.62);
      return [p.nx * 0.62 / l, k * 0.78 / l, p.nz * 0.62 / l];
    };
    for (let ri = 0; ri < 3; ri++) {
      const A = loops[ri], B = loops[ri + 1];
      for (let i = 0; i < N; i++) {
        const j = (i + 1) % N;
        const a0 = A.lp[i], a1 = A.lp[j], b0 = B.lp[i], b1 = B.lp[j];
        const u0 = a0.u / uvS, u1 = (j === 0 ? A.lp.per : a1.u) / uvS;
        const v0 = (A.y - y0) / uvS, v1 = (B.y - y0) / uvS;
        this.quadN([a0.x + cx, A.y, a0.z + cz], [a1.x + cx, A.y, a1.z + cz],
                   [b1.x + cx, B.y, b1.z + cz], [b0.x + cx, B.y, b0.z + cz],
                   nrm(a0, A.k), nrm(a1, A.k), nrm(b1, B.k), nrm(b0, B.k),
                   [u0, v0, u1, v0, u1, v1, u0, v1], col, e, part);
      }
    }
    if (opt.skipTop !== true) {
      const T = loops[3];
      const c = this.vert(cx, T.y, cz, 0, 1, 0, 0.5, 0.5, top[0], top[1], top[2], opt.topEmis || e, part);
      const idx = [];
      for (let i = 0; i < N; i++) {
        const p = T.lp[i];
        idx.push(this.vert(p.x + cx, T.y, p.z + cz, 0, 1, 0, (p.x + cx) / uvS, (p.z + cz) / uvS, top[0], top[1], top[2], opt.topEmis || e, part));
      }
      for (let i = 0; i < N; i++) this.tri(c, idx[(i + 1) % N], idx[i]);
    }
    if (opt.bottom === true) {
      const T = loops[0];
      const c = this.vert(cx, T.y, cz, 0, -1, 0, 0.5, 0.5, col[0], col[1], col[2], e, part);
      const idx = [];
      for (let i = 0; i < N; i++) {
        const p = T.lp[i];
        idx.push(this.vert(p.x + cx, T.y, p.z + cz, 0, -1, 0, (p.x + cx) / uvS, (p.z + cz) / uvS, col[0], col[1], col[2], e, part));
      }
      for (let i = 0; i < N; i++) this.tri(c, idx[i], idx[(i + 1) % N]);
    }
    this.g = gp;
  }
  /* горизонтальная площадка (дорога, тротуар, газон) */
  plate(x0, z0, x1, z1, y, col, uvScale, emis, rot, gloss) {
    const gp = this.g; if (gloss !== undefined) this.g = gloss;
    const s = uvScale || 1;
    const u0 = rot ? z0 / s : x0 / s, u1 = rot ? z1 / s : x1 / s;
    const v0 = rot ? x0 / s : z0 / s, v1 = rot ? x1 / s : z1 / s;
    this.quad([x0,y,z1],[x1,y,z1],[x1,y,z0],[x0,y,z0], 0,1,0,
      [u0,v1, u1,v1, u1,v0, u0,v0], col, emis || 0, 0);
    this.g = gp;
  }
  cyl(cx, y0, cz, r, h, seg, col, opt) {
    opt = opt || {};
    const gp = this._g(opt);
    const part = opt.part || 0, e = opt.emis || 0;
    const rTop = opt.rTop === undefined ? r : opt.rTop;
    for (let i = 0; i < seg; i++) {
      const a0 = i / seg * TAU, a1 = (i + 1) / seg * TAU;
      const c0 = Math.cos(a0), s0 = Math.sin(a0), c1 = Math.cos(a1), s1 = Math.sin(a1);
      this.quadN([cx+c0*r,y0,cz+s0*r],[cx+c1*r,y0,cz+s1*r],[cx+c1*rTop,y0+h,cz+s1*rTop],[cx+c0*rTop,y0+h,cz+s0*rTop],
        [c0,0,s0],[c1,0,s1],[c1,0,s1],[c0,0,s0],
        [i/seg*2,1, (i+1)/seg*2,1, (i+1)/seg*2,0, i/seg*2,0], col, e, part);
    }
    if (opt.cap !== false) {
      const cy = y0 + h;
      for (let i = 0; i < seg; i++) {
        const a0 = i / seg * TAU, a1 = (i + 1) / seg * TAU;
        const A = this.vert(cx, cy, cz, 0,1,0, .5,.5, col[0],col[1],col[2], e, part);
        const B = this.vert(cx+Math.cos(a0)*rTop, cy, cz+Math.sin(a0)*rTop, 0,1,0, .5+Math.cos(a0)*.5,.5+Math.sin(a0)*.5, col[0],col[1],col[2], e, part);
        const C = this.vert(cx+Math.cos(a1)*rTop, cy, cz+Math.sin(a1)*rTop, 0,1,0, .5+Math.cos(a1)*.5,.5+Math.sin(a1)*.5, col[0],col[1],col[2], e, part);
        this.i.push(A, C, B);          /* обход против часовой сверху */
      }
    }
    if (opt.capBottom) {
      for (let i = 0; i < seg; i++) {
        const a0 = i / seg * TAU, a1 = (i + 1) / seg * TAU;
        const A = this.vert(cx, y0, cz, 0,-1,0, .5,.5, col[0],col[1],col[2], e, part);
        const B = this.vert(cx+Math.cos(a1)*r, y0, cz+Math.sin(a1)*r, 0,-1,0, .5,.5, col[0],col[1],col[2], e, part);
        const C = this.vert(cx+Math.cos(a0)*r, y0, cz+Math.sin(a0)*r, 0,-1,0, .5,.5, col[0],col[1],col[2], e, part);
        this.i.push(A, B, C);
      }
    }
    this.g = gp;
  }
  /* эллипсоид: головы, плечи, кисти, кроны деревьев */
  ellipsoid(cx, cy, cz, rx, ry, rz, seg, rings, col, opt) {
    opt = opt || {};
    const gp = this._g(opt);
    const part = opt.part || 0, e = opt.emis || 0;
    const y0 = opt.cut === undefined ? -1 : opt.cut;   /* обрезка снизу, -1..1 */
    const grid = [];
    for (let r0 = 0; r0 <= rings; r0++) {
      const v = r0 / rings;
      const phi = Math.acos(clamp(lerp(1, y0, v), -1, 1));
      const sy = Math.cos(phi), sr = Math.sin(phi);
      const row = [];
      for (let s = 0; s <= seg; s++) {
        const a = s / seg * TAU;
        const nx = Math.cos(a) * sr, nz = Math.sin(a) * sr;
        const px = cx + nx * rx, py = cy + sy * ry, pz = cz + nz * rz;
        let gx = nx / rx, gy = sy / ry, gz = nz / rz;
        const l = Math.hypot(gx, gy, gz) || 1;
        row.push(this.vert(px, py, pz, gx / l, gy / l, gz / l, s / seg * 2, v, col[0], col[1], col[2], e, part));
      }
      grid.push(row);
    }
    for (let r0 = 0; r0 < rings; r0++) for (let s = 0; s < seg; s++) {
      const a = grid[r0][s], b = grid[r0][s + 1], c = grid[r0 + 1][s + 1], d = grid[r0 + 1][s];
      if (r0 > 0) this.i.push(a, b, c);
      if (r0 < rings - 1 || y0 > -0.999) this.i.push(a, c, d);
    }
    this.g = gp;
  }
  /* Выдавливание замкнутого профиля (в плоскости XY) вдоль оси Z.
     profile: [[x,y], ...] против часовой при взгляде с +Z.
     slices:  [{z, sx, sy}] — сечения; масштаб относительно origin. */
  extrudeZ(profile, slices, col, opt) {
    opt = opt || {};
    const gp = this._g(opt);
    const part = opt.part || 0, e = opt.emis || 0, uvS = opt.uv || 1;
    const ox = opt.origin ? opt.origin[0] : 0, oy = opt.origin ? opt.origin[1] : 0;
    const N = profile.length;
    /* нормали рёбер профиля и их сглаживание по углу */
    const en = [];
    let per = 0; const arc = [];
    for (let i = 0; i < N; i++) {
      arc.push(per);
      const j = (i + 1) % N;
      const dx = profile[j][0] - profile[i][0], dy = profile[j][1] - profile[i][1];
      const l = Math.hypot(dx, dy) || 1;
      en.push([dy / l, -dx / l]);
      per += l;
    }
    const cosT = Math.cos((opt.smooth === undefined ? 62 : opt.smooth) * D2R);
    const vn = [];
    for (let i = 0; i < N; i++) {
      const a = en[(i - 1 + N) % N], b = en[i];
      if (a[0] * b[0] + a[1] * b[1] > cosT) {
        const x = a[0] + b[0], y = a[1] + b[1], l = Math.hypot(x, y) || 1;
        vn.push([[x / l, y / l], [x / l, y / l]]);
      } else vn.push([[a[0], a[1]], [b[0], b[1]]]);   /* острое ребро: своя нормаль */
    }
    const P = (s, i) => [ox + (profile[i][0] - ox) * s.sx, oy + (profile[i][1] - oy) * s.sy, s.z];
    for (let k = 0; k < slices.length - 1; k++) {
      const A = slices[k], B = slices[k + 1];
      const zt = Math.abs(B.z - A.z);
      const tap = Math.abs(B.sx - A.sx) + Math.abs(B.sy - A.sy);
      /* при сужении наклоняем нормаль наружу-вдоль Z */
      const zn = tap > 1e-4 ? clamp(tap * 1.6 / Math.max(zt, 0.02), 0, 2.2) : 0;
      const sgnA = A.z < B.z ? -1 : 1;
      for (let i = 0; i < N; i++) {
        const j = (i + 1) % N;
        const na = vn[i][1], nb = vn[j][0];
        const mk = (n2, sgn) => {
          const l = Math.hypot(n2[0], n2[1], zn * sgn) || 1;
          return [n2[0] / l, n2[1] / l, zn * sgn / l];
        };
        const u0 = arc[i] / uvS, u1 = (j === 0 ? per : arc[j]) / uvS;
        this.quadN(P(A, i), P(A, j), P(B, j), P(B, i),
          mk(na, sgnA), mk(nb, sgnA), mk(nb, -sgnA), mk(na, -sgnA),
          [u0, A.z / uvS, u1, A.z / uvS, u1, B.z / uvS, u0, B.z / uvS], col, e, part);
      }
    }
    if (opt.caps !== false) {
      for (const [s, dir] of [[slices[0], -1], [slices[slices.length - 1], 1]]) {
        let cx2 = 0, cy2 = 0;
        for (let i = 0; i < N; i++) { const p = P(s, i); cx2 += p[0]; cy2 += p[1]; }
        cx2 /= N; cy2 /= N;
        const c = this.vert(cx2, cy2, s.z, 0, 0, dir, .5, .5, col[0], col[1], col[2], e, part);
        const idx = [];
        for (let i = 0; i < N; i++) {
          const p = P(s, i);
          idx.push(this.vert(p[0], p[1], p[2], 0, 0, dir, p[0] / uvS, p[1] / uvS, col[0], col[1], col[2], e, part));
        }
        for (let i = 0; i < N; i++) {
          const a = idx[i], b = idx[(i + 1) % N];
          if (dir > 0) this.i.push(c, a, b); else this.i.push(c, b, a);
        }
      }
    }
    this.g = gp;
  }
  /* труба вдоль ломаной: рамы, поручни, водостоки, кабели */
  tube(pts, r, seg, col, opt) {
    opt = opt || {};
    const gp = this._g(opt);
    const part = opt.part || 0, e = opt.emis || 0;
    let up = [0, 1, 0];
    const rings = [];
    for (let i = 0; i < pts.length; i++) {
      const a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)];
      let t = [b[0] - a[0], b[1] - a[1], b[2] - a[2]];
      let tl = Math.hypot(t[0], t[1], t[2]) || 1;
      t = [t[0] / tl, t[1] / tl, t[2] / tl];
      if (Math.abs(t[0] * up[0] + t[1] * up[1] + t[2] * up[2]) > 0.95) up = [1, 0, 0];
      let sx = [up[1] * t[2] - up[2] * t[1], up[2] * t[0] - up[0] * t[2], up[0] * t[1] - up[1] * t[0]];
      let sl = Math.hypot(sx[0], sx[1], sx[2]) || 1;
      sx = [sx[0] / sl, sx[1] / sl, sx[2] / sl];
      const sy = [t[1] * sx[2] - t[2] * sx[1], t[2] * sx[0] - t[0] * sx[2], t[0] * sx[1] - t[1] * sx[0]];
      const rr = Array.isArray(r) ? r[Math.min(i, r.length - 1)] : r;
      const row = [];
      for (let s = 0; s <= seg; s++) {
        const ang = s / seg * TAU, ca = Math.cos(ang), sa = Math.sin(ang);
        const nx = sx[0] * ca + sy[0] * sa, ny = sx[1] * ca + sy[1] * sa, nz = sx[2] * ca + sy[2] * sa;
        row.push(this.vert(pts[i][0] + nx * rr, pts[i][1] + ny * rr, pts[i][2] + nz * rr,
          nx, ny, nz, s / seg * 2, i * 0.5, col[0], col[1], col[2], e, part));
      }
      rings.push(row);
    }
    for (let i = 0; i < rings.length - 1; i++) for (let s = 0; s < seg; s++) {
      const a = rings[i][s], b = rings[i][s + 1], c = rings[i + 1][s + 1], d = rings[i + 1][s];
      this.i.push(a, b, c, a, c, d);
    }
    this.g = gp;
  }
  /* колесо: диск в плоскости XY, ось по Z (простая версия) */
  wheel(r, width, seg, col, rim, part) {
    for (let side = -1; side <= 1; side += 2) {
      for (let i = 0; i < seg; i++) {
        const a0 = i / seg * TAU, a1 = (i + 1) / seg * TAU;
        const z = side * width / 2;
        const A = this.vert(0, 0, z, 0, 0, side, .5, .5, rim[0], rim[1], rim[2], 0, part);
        const B = this.vert(Math.cos(a0) * r, Math.sin(a0) * r, z, 0, 0, side, .5 + Math.cos(a0) * .5, .5 + Math.sin(a0) * .5, col[0], col[1], col[2], 0, part);
        const C = this.vert(Math.cos(a1) * r, Math.sin(a1) * r, z, 0, 0, side, .5 + Math.cos(a1) * .5, .5 + Math.sin(a1) * .5, col[0], col[1], col[2], 0, part);
        if (side > 0) this.i.push(A, B, C); else this.i.push(A, C, B);
      }
    }
    for (let i = 0; i < seg; i++) {
      const a0 = i / seg * TAU, a1 = (i + 1) / seg * TAU;
      const c0 = Math.cos(a0), s0 = Math.sin(a0), c1 = Math.cos(a1), s1 = Math.sin(a1);
      this.quadN([c0*r,s0*r,-width/2],[c1*r,s1*r,-width/2],[c1*r,s1*r,width/2],[c0*r,s0*r,width/2],
        [c0,s0,0],[c1,s1,0],[c1,s1,0],[c0,s0,0], [0,0, 1,0, 1,1, 0,1], col, 0, part);
    }
  }
  /* автомобильное колесо: шина с плечами и профилем + диск со спицами */
  wheelDetailed(r, width, seg, tyre, rim, part, opt) {
    opt = opt || {};
    const gp = this._g(opt);
    const hw = width / 2, sh = r * 0.16;              /* скругление плеча шины */
    const rimR = opt.rimR === undefined ? r * 0.62 : opt.rimR;
    const spokes = opt.spokes === undefined ? 6 : opt.spokes;
    const prof = [                                     /* [z, радиус, признак фаски] */
      [-hw * 0.66, rimR, 1], [-hw, r - sh, 1], [-hw * 0.92, r, 0],
      [hw * 0.92, r, 0], [hw, r - sh, 1], [hw * 0.66, rimR, 1]
    ];
    for (let k = 0; k < prof.length - 1; k++) {
      const [z0, r0] = prof[k], [z1, r1] = prof[k + 1];
      const dz = z1 - z0, dr = r1 - r0;
      const ln = Math.hypot(dz, dr) || 1;
      const nr = dz / ln, nz = -dr / ln;
      const dark = k === 0 || k === prof.length - 2 ? 0.65 : 1;
      const c = [tyre[0] * dark, tyre[1] * dark, tyre[2] * dark];
      for (let i = 0; i < seg; i++) {
        const a0 = i / seg * TAU, a1 = (i + 1) / seg * TAU;
        const c0 = Math.cos(a0), s0 = Math.sin(a0), c1 = Math.cos(a1), s1 = Math.sin(a1);
        this.quadN([c0*r0,s0*r0,z0],[c1*r0,s1*r0,z0],[c1*r1,s1*r1,z1],[c0*r1,s0*r1,z1],
          [c0*nr,s0*nr,nz],[c1*nr,s1*nr,nz],[c1*nr,s1*nr,nz],[c0*nr,s0*nr,nz],
          [i/seg*3,0, (i+1)/seg*3,0, (i+1)/seg*3,1, i/seg*3,1], c, 0, part);
      }
    }
    /* диск: тарелка со спицами и ступицей */
    for (const side of [-1, 1]) {
      const z = side * hw * 0.66;
      const hub = this.vert(0, 0, z + side * 0.012, 0, 0, side, .5, .5, rim[0], rim[1], rim[2], 0, part);
      const ring = [];
      for (let i = 0; i <= seg; i++) {
        const a = i / seg * TAU;
        const k = ((i % Math.max(1, Math.round(seg / spokes))) === 0) ? 1 : 0.55;
        ring.push(this.vert(Math.cos(a) * rimR, Math.sin(a) * rimR, z, 0, 0, side,
          .5 + Math.cos(a) * .5, .5 + Math.sin(a) * .5, rim[0] * k, rim[1] * k, rim[2] * k, 0, part));
      }
      for (let i = 0; i < seg; i++) {
        if (side > 0) this.i.push(hub, ring[i], ring[i + 1]);
        else this.i.push(hub, ring[i + 1], ring[i]);
      }
    }
    this.g = gp;
  }
  /* поворот всей сетки вокруг Y: удобно собирать кузов «длиной по X»,
     а потом развернуть его носом по +Z */
  rotY(a) {
    const c = Math.cos(a), s2 = Math.sin(a);
    for (let i = 0; i < this.v.length; i += STRIDE) {
      const x = this.v[i], z = this.v[i + 2];
      this.v[i] = x * c + z * s2; this.v[i + 2] = -x * s2 + z * c;
      const nx = this.v[i + 3], nz = this.v[i + 5];
      this.v[i + 3] = nx * c + nz * s2; this.v[i + 5] = -nx * s2 + nz * c;
    }
    return this;
  }
  /* сглаживание нормалей: усредняем по совпадающим позициям, если рёбра
     сходятся под углом меньше порога */
  smoothNormals(maxDeg) {
    const cosT = Math.cos((maxDeg === undefined ? 55 : maxDeg) * D2R);
    const map = new Map();
    for (let i = 0; i < this.n; i++) {
      const o = i * STRIDE;
      const key = (Math.round(this.v[o] * 900) + ',' + Math.round(this.v[o+1] * 900) + ',' + Math.round(this.v[o+2] * 900));
      let a = map.get(key); if (!a) { a = []; map.set(key, a); }
      a.push(i);
    }
    const out = new Float32Array(this.n * 3);
    for (const a of map.values()) {
      for (const i of a) {
        const o = i * STRIDE;
        let nx = 0, ny = 0, nz = 0;
        for (const j of a) {
          const q = j * STRIDE;
          if (this.v[o+3] * this.v[q+3] + this.v[o+4] * this.v[q+4] + this.v[o+5] * this.v[q+5] < cosT) continue;
          nx += this.v[q+3]; ny += this.v[q+4]; nz += this.v[q+5];
        }
        const l = Math.hypot(nx, ny, nz) || 1;
        out[i*3] = nx / l; out[i*3+1] = ny / l; out[i*3+2] = nz / l;
      }
    }
    for (let i = 0; i < this.n; i++) {
      const o = i * STRIDE;
      this.v[o+3] = out[i*3]; this.v[o+4] = out[i*3+1]; this.v[o+5] = out[i*3+2];
    }
    return this;
  }
  /* затемнение низа — дешёвое «затенение» без карт теней */
  aoByHeight(y0, y1, strength) {
    for (let i = 0; i < this.v.length; i += STRIDE) {
      const y = this.v[i + 1];
      const t = clamp((y - y0) / Math.max(0.01, y1 - y0), 0, 1);
      const k = lerp(1 - strength, 1, t);
      this.v[i + 8] *= k; this.v[i + 9] *= k; this.v[i + 10] *= k;
    }
  }
  merge(other, dx, dy, dz) {
    const base = this.n;
    for (let i = 0; i < other.v.length; i += STRIDE) {
      this.v.push(other.v[i] + (dx || 0), other.v[i+1] + (dy || 0), other.v[i+2] + (dz || 0));
      for (let k = 3; k < STRIDE; k++) this.v.push(other.v[i + k]);
      this.n++;
    }
    for (const idx of other.i) this.i.push(idx + base);
  }
  upload(gl) {
    const vao = gl.createVertexArray();
    gl.bindVertexArray(vao);
    const vb = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, vb);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(this.v), gl.STATIC_DRAW);
    const ib = gl.createBuffer();
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ib);
    const big = this.n > 65535;
    gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, big ? new Uint32Array(this.i) : new Uint16Array(this.i), gl.STATIC_DRAW);
    const S = STRIDE * 4;
    const attrs = [[0,3,0],[1,3,12],[2,2,24],[3,3,32],[4,1,44],[5,1,48],[6,1,52]];
    for (const [loc, size, off] of attrs) {
      gl.enableVertexAttribArray(loc);
      gl.vertexAttribPointer(loc, size, gl.FLOAT, false, S, off);
    }
    gl.bindVertexArray(null);
    return { vao, count: this.i.length, type: big ? gl.UNSIGNED_INT : gl.UNSIGNED_SHORT, verts: this.n, tris: this.i.length / 3 };
  }
}

/* ------------------------------------------------------------------ */
/* 3. Процедурные текстуры (рисуются кодом, ничего не загружается)      */
/* ------------------------------------------------------------------ */
/* Устройство. Материал — не одна картинка, а комплект карт:
     albedo   цвет и альфа (маска свечения окон либо альфа-тест карт);
              хранится в SRGB8_ALPHA8 — семплер отдаёт линейный цвет, мипы
              усредняются правильно;
     surf     nx, ny (нормаль по Собелю из карты высот), roughness,
              metalness — RGBA8, линейно;
     ao       ambient occlusion из полостей той же карты высот — R8.
   Полный комплект получают материалы поверхностей (SURF_DEFS). Картам
   зелени и знаков, вывескам, ткани и краске хватает albedo плюс констант
   материала: нормаль на фанерке листа и на вывеске ничего не даёт, а по
   памяти и времени генерации они самые дорогие.
   Материалы одного размера лежат слоями одного TEXTURE_2D_ARRAY: одно
   связывание на группу, слой выбирает юниформ uLayer. Все текстуры — с
   полной мип-цепочкой и анизотропией из профиля (Q.aniso).
   Генерация идёт заданиями, по одному на материал, и отдаёт кадр браузеру
   между ними: заставка рисует полосу прогресса, а при смене профиля
   текстуры пересобираются прямо в игре и подменяются разом — батчи ищут
   материал по имени при каждом вызове отрисовки. */
const TX = {};              /* материалы по имени: { grp, layer, rough, metal, tri } */
let TEX_SS = 2;             /* холст крупнее логического размера во столько раз (Q.texSS) */
const Tex = { detail: null, recs: [], signRecs: [], busy: false };

/* Реестр GPU-текстур: анизотропия меняется у всех разом, инвентарь памяти
   считается с мипами, при пересборке старые удаляются. */
const TexReg = {
  list: [],
  add(rec) { this.list.push(rec); return rec; },
  bytes() { return this.list.reduce((a, r) => a + r.bytes, 0); },
  setAniso(gl, a) {
    if (!GL.aniso) return;
    const v = Math.max(1, Math.min(a, GL.maxAniso));
    for (const r of this.list) { gl.bindTexture(r.target, r.tex); gl.texParameterf(r.target, GL.aniso.TEXTURE_MAX_ANISOTROPY_EXT, v); }
  },
  drop(gl, recs) {
    for (const r of recs) { gl.deleteTexture(r.tex); const i = this.list.indexOf(r); if (i >= 0) this.list.splice(i, 1); }
  }
};

/* --- холсты и кисти ------------------------------------------------- */
/* Текстуры рисуются в «логической» системе, а холст берём крупнее в TEX_SS
   раз: композиция та же, зерно, трещины и подтёки получают больше пикселей. */
function cv2d(size, hgt) {
  const c = document.createElement('canvas');

/* --- карты, у которых только albedo ----------------------------------- */
/* Атлас зелени (альфа-тест). 2x2 ячейки по 256 логических пикселей. Атлас,
   а не четыре текстуры: вся зелень остаётся ОДНИМ альфа-батчем. Породу
   различает форма карт и цвет вершин (vCol умножается на текстуру).
     broad — широкий лист (клён, палая листва)
     veil  — мелкий лист (берёза, тополь, куст, изгородь, вьюн)
     fir   — еловая лапа, перо идёт слева направо, вдоль оси U
     tuft  — пучок узких листьев от нижней кромки + соцветия сверху */
function paintLeaves(x, A) {
  const H = A / 2, pad = 10;      /* поле, чтобы мипы не мешали ячейки */
  const R = mulberry32(121);
  const cellAt = (cx, cy, draw) => {
    x.save(); x.translate(cx * H, cy * H);
    x.beginPath(); x.rect(0, 0, H, H); x.clip();
    draw(); x.restore();
  };
  /* широкий лист: масса крупных листьев в круге, низ глуше */
  cellAt(0, 0, () => {
    for (let i = 0; i < 520; i++) {
      const px = H / 2 + (R() - .5) * (H - pad * 2), py = H / 2 + (R() - .5) * (H - pad * 2);
      const d = Math.hypot(px - H / 2, py - H / 2) / (H / 2 - pad);
      if (d > 1 || R() < d * d * 0.7) continue;
      const r = (10 + R() * 18) * (1 - d * 0.35), k = py > H * 0.56 ? 0.74 : 1;
      x.fillStyle = 'rgb(' + Math.round((46 + R() * 38) * k) + ',' + Math.round((80 + R() * 64) * k) + ',' + Math.round((34 + R() * 38) * k) + ')';
      x.beginPath(); x.ellipse(px, py, r, r * (0.6 + R() * 0.5), R() * Math.PI, 0, TAU); x.fill();
    }
  });
  /* мелкий лист: вытянутая вуаль с просветами и рваным контуром */
  cellAt(1, 0, () => {
    /* Веточки рисуем тонкими и бледными: при увеличении карты жирные штрихи
       читаются висящими полосами, а не ветками. */
    x.strokeStyle = 'rgba(58,48,36,.28)'; x.lineWidth = 0.8;
    for (let i = 0; i < 5; i++) {
      x.beginPath(); x.moveTo(H / 2, H - pad);
      x.quadraticCurveTo(H / 2 + (R() - .5) * H * .3, H * .55, H / 2 + (R() - .5) * H * .5, pad + R() * H * .45);
      x.stroke();
    }
    for (let i = 0; i < 1100; i++) {
      const px = H / 2 + (R() - .5) * (H - pad * 2) * 0.94, py = H / 2 + (R() - .5) * (H - pad * 2);
      const d = Math.hypot((px - H / 2) / (H * 0.46), (py - H / 2) / (H * 0.47));
      if (d > 1 || R() < d * d * 0.85) continue;
      const r = 4.5 + R() * 9, k = py > H * 0.60 ? 0.78 : 1;
      x.fillStyle = 'rgb(' + Math.round((52 + R() * 44) * k) + ',' + Math.round((92 + R() * 68) * k) + ',' + Math.round((38 + R() * 40) * k) + ')';
      x.beginPath(); x.ellipse(px, py, r, r * (0.55 + R() * 0.5), R() * Math.PI, 0, TAU); x.fill();
    }
  });
  /* еловая лапа: веточка слева направо, хвоинки назад-вбок и короче к концу */
  cellAt(0, 1, () => {
    const y0 = H / 2;
    x.lineCap = 'round';
    x.strokeStyle = '#4a3c2a'; x.lineWidth = 3;
    x.beginPath(); x.moveTo(pad * .5, y0); x.lineTo(H - pad, y0); x.stroke();
    for (let s = -1; s <= 1; s += 2) for (let i = 0; i < 90; i++) {
      const t = 0.04 + R() * 0.94, bx = pad + t * (H - pad * 2);
      const ln = H * 0.30 * (1 - t * 0.72) * (0.6 + R() * 0.6);
      x.strokeStyle = 'rgb(' + Math.round(26 + R() * 30) + ',' + Math.round(60 + R() * 46) + ',' + Math.round(30 + R() * 28) + ')';
      x.lineWidth = 1.6 + R() * 1.6;
      x.beginPath(); x.moveTo(bx, y0); x.lineTo(bx + ln * 0.45, y0 + s * ln); x.stroke();
    }
  });
  /* пучок: клинки растут от НИЖНЕЙ кромки ячейки, сверху — светлые соцветия */
  cellAt(1, 1, () => {
    for (let i = 0; i < 40; i++) {
      const bx = pad + R() * (H - pad * 2), hgt = H * (0.42 + R() * 0.55);
      const lean = (R() - .5) * H * 0.30, w = 2.5 + R() * 4.5;
      x.fillStyle = 'rgb(' + Math.round(52 + R() * 52) + ',' + Math.round(88 + R() * 70) + ',' + Math.round(36 + R() * 42) + ')';
      x.beginPath();
      x.moveTo(bx - w / 2, H);
      x.quadraticCurveTo(bx + lean * 0.4 + w / 2, H - hgt * 0.55, bx + lean, H - hgt);
      x.quadraticCurveTo(bx + lean * 0.4 - w / 2, H - hgt * 0.55, bx + w / 2, H);
      x.fill();
    }
    for (let i = 0; i < 14; i++) {          /* соцветия почти белые — цвет им даёт vCol */
      const px = pad + R() * (H - pad * 2), py = pad + R() * H * 0.34;
      x.fillStyle = 'rgb(' + Math.round(226 + R() * 26) + ',' + Math.round(216 + R() * 26) + ',' + Math.round(206 + R() * 30) + ')';
      x.beginPath(); x.arc(px, py, 3.5 + R() * 4.5, 0, TAU); x.fill();
    }
  });
}

    x.fillRect(-Q4 * 0.26, Q4 * 0.12, Q4 * 0.52, Q4 * 0.04); });
  cell(1, 0, () => { circ('#f4f0e6', '#c02a24');                     /* ограничение 20 */
    x.fillStyle = ink; x.font = 'bold ' + Math.round(Q4 * 0.44) + 'px sans-serif';
    x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText('20', 0, Q4 * 0.02); });
  cell(2, 0, () => {                                                 /* пешеходный переход */
    x.fillStyle = '#1d4b8f'; x.beginPath();
    x.moveTo(0, -Q4 * 0.44); x.lineTo(Q4 * 0.44, 0); x.lineTo(0, Q4 * 0.44); x.lineTo(-Q4 * 0.44, 0); x.closePath(); x.fill();
    x.fillStyle = '#f4f0e6';
    for (let i = 0; i < 4; i++) x.fillRect(-Q4 * 0.20 + i * Q4 * 0.11, Q4 * 0.02, Q4 * 0.06, Q4 * 0.20);
    x.beginPath(); x.arc(-Q4 * 0.02, -Q4 * 0.20, Q4 * 0.055, 0, TAU); x.fill();
    x.fillRect(-Q4 * 0.05, -Q4 * 0.14, Q4 * 0.07, Q4 * 0.18); });
  cell(3, 0, () => {                                                 /* уступи дорогу */
    x.beginPath(); x.moveTo(0, Q4 * 0.44); x.lineTo(Q4 * 0.46, -Q4 * 0.36); x.lineTo(-Q4 * 0.46, -Q4 * 0.36); x.closePath();
    x.fillStyle = '#c02a24'; x.fill();
    x.beginPath(); x.moveTo(0, Q4 * 0.30); x.lineTo(Q4 * 0.36, -Q4 * 0.27); x.lineTo(-Q4 * 0.36, -Q4 * 0.27); x.closePath();
    x.fillStyle = '#f4f0e6'; x.fill(); });
  cell(0, 1, () => {                                                 /* стоп */
    x.fillStyle = '#b0241f'; x.beginPath();
    for (let i = 0; i < 8; i++) { const a = (i + 0.5) / 8 * TAU; const r = Q4 * 0.45;
      i ? x.lineTo(Math.cos(a) * r, Math.sin(a) * r) : x.moveTo(Math.cos(a) * r, Math.sin(a) * r); }
    x.closePath(); x.fill();
    x.fillStyle = '#f4f0e6'; x.font = 'bold ' + Math.round(Q4 * 0.26) + 'px sans-serif';

  cell(1, 1, () => { circ('#c02a24', '#f4f0e6');                     /* въезд запрещён */
    x.fillStyle = '#f4f0e6'; x.fillRect(-Q4 * 0.26, -Q4 * 0.07, Q4 * 0.52, Q4 * 0.14); });

    x.fillStyle = ink; x.fillRect(-Q4 * 0.03, -Q4 * 0.20, Q4 * 0.06, Q4 * 0.40);
