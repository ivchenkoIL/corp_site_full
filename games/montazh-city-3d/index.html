function movePlayerOnFoot(dt) {
  const p = S.player, v = inputVec();
  const drunkF = p.drunk / 100;
  let dx, dz;
  if (S.camFollow) {
    /* Руль у персонажа: A/D разворачивают Олега, камера сама едет за спину.
       W/S — вперёд и назад по его направлению, боком не ходим. */
    const turn = (3.4 - (Input.any(K.sprint) ? 0.9 : 0)) * (1 - drunkF * 0.3);
    /* Знак важен: рост yaw поворачивает взгляд влево (вперёд — (sin, cos),
       экранное «право» — (-cos, sin)), поэтому D должен yaw уменьшать. */
    p.yaw -= v.r * turn * dt;
    dx = Math.sin(p.yaw) * v.f; dz = Math.cos(p.yaw) * v.f;
  } else {
    /* Свободная камера: движение относительно взгляда. */
    const yaw = S.cam.yaw;
    const fx = -Math.sin(yaw), fz = -Math.cos(yaw);
    const rx = Math.cos(yaw), rz = -Math.sin(yaw);
    dx = fx * v.f + rx * v.r; dz = fz * v.f + rz * v.r;
  }
  const sprint = Input.any(K.sprint) && p.stamina > 3 && v.len > 0;
  let maxSp = (sprint ? BAL.sprint : BAL.walk) * (1 - drunkF * 0.22) * (p.stamina < 15 ? 0.72 : 1) * (p.health < 30 ? 0.85 : 1);

  if (Input.anyHit(K.brake) && p.dodgeCd <= 0 && p.stamina >= BAL.dodgeCost && v.len > 0) {
    p.dodge = 0.26; p.dodgeCd = 0.85; p.stamina -= BAL.dodgeCost; p.invuln = 0.34;
    let ddx = dx, ddz = dz;
    if (Math.hypot(ddx, ddz) < 0.2) { ddx = Math.sin(p.yaw); ddz = Math.cos(p.yaw); }
    p.vx = ddx * 9; p.vz = ddz * 9; Audio2.noise(0.12, 0.13, 300, 1800);
    fx3(p.x, 0.2, p.z, 'dust', 7);
  }
  const acc = BAL.walkAcc * (p.dodge > 0 ? 0.2 : 1);
  p.vx += dx * acc * dt; p.vz += dz * acc * dt;
  if (drunkF > 0.15) { p.vx += Math.sin(S.t * 3.1) * 1.6 * drunkF * dt; p.vz += Math.cos(S.t * 2.3) * 1.5 * drunkF * dt; }
  const sp = Math.hypot(p.vx, p.vz);
  const lim = p.dodge > 0 ? 10 : maxSp;
  if (sp > lim) { p.vx = p.vx / sp * lim; p.vz = p.vz / sp * lim; }
  const fr = Math.exp(-BAL.walkFric * dt);
  p.vx *= fr; p.vz *= fr;
  if (sprint) p.stamina = clamp(p.stamina - BAL.stamDrain * dt, 0, 100);
  else p.stamina = clamp(p.stamina + BAL.stamRegen * (v.len > 0 ? 0.45 : 1) * dt * staminaMult(), 0, 100);
  if (!S.camFollow && v.len > 0) p.yaw = angLerp(p.yaw, Math.atan2(dx, dz), 1 - Math.exp(-16 * dt));
  tickGait(p, dt, GAITS.oleg, true);       /* курс у Олега свой: рулит игрок */
  tickGaze(p, dt);

}
function moveBike(dt) {
  const p = S.player, b = S.bike;
  const drunkF = p.drunk / 100, cond = b.cond / 100;
  const boost = Input.any(K.sprint) && p.stamina > 2;
  let maxSp = (boost ? BAL.bikeBoost : BAL.bikeMax) * (0.62 + 0.38 * cond);
  if (S.upgrades.frame) maxSp *= 1.14;
  if (S.upgrades.tires) maxSp *= 1.05;
  maxSp *= (1 - drunkF * 0.18) * (p.stamina < 12 ? 0.75 : 1);

  let thr = 0;
  if (Input.any(K.up)) thr = 1;
  if (Input.any(K.down)) thr = -0.5;
  let steer = 0;
  if (Input.any(K.left)) steer -= 1;
  if (Input.any(K.right)) steer += 1;
  if (drunkF > 0.45 && Math.sin(S.t * 0.9) > 0.72) steer *= -1;

  b.speed += thr * BAL.bikeAcc * (0.6 + 0.4 * cond) * dt;
  if (Input.any(K.brake)) {
    const before = b.speed;
    b.speed -= Math.sign(b.speed) * BAL.bikeBrake * dt;
    if (Math.sign(before) !== Math.sign(b.speed)) b.speed = 0;
    if (Math.abs(before) > 4 && Math.random() < 0.25) Audio2.skid();
  }
  b.speed *= Math.exp(-BAL.bikeDrag * dt);
  b.speed = clamp(b.speed, -3, maxSp);
  const turn = BAL.bikeTurn * (S.upgrades.tires ? 1.16 : 1) * clamp(Math.abs(b.speed) / 4, 0, 1.25);
  b.yaw -= steer * turn * dt * Math.sign(b.speed || 1);
  b.yaw += Math.sin(S.t * 5.5) * (drunkF * 0.5 + (1 - cond) * 0.3) * 0.4 * dt;
  b.lean = lerp(b.lean, -steer * clamp(Math.abs(b.speed) / 8, 0, 1) * 0.32, dt * 6);
  /* угол руля: вилка доворачивается плавно, на скорости — меньше */
  b.steer = lerp(b.steer || 0, -steer * (0.42 - clamp(Math.abs(b.speed) / 14, 0, 0.28)), dt * 8);

  if (boost && Math.abs(b.speed) > 1.5) p.stamina = clamp(p.stamina - BAL.stamDrain * 0.85 * dt, 0, 100);
  else p.stamina = clamp(p.stamina + BAL.stamRegen * 0.55 * dt * staminaMult(), 0, 100);

  if (b.cond < 45 && b.chain <= 0 && Math.random() < 0.06 * dt * (1 - cond)) {
    b.chain = 1; toast('Слетела цепь! F — поправить', 'bad'); Audio2.nope();
  }

/* 19. Камера от третьего лица                                          */
/* ------------------------------------------------------------------ */
function updateCamera(dt) {
  const c = S.cam, p = S.player;
  if (Input.locked || Input.rdrag) {
    if (Math.abs(Input.dx) > 0.5 || Math.abs(Input.dy) > 0.5) c.manual = 1.6;
    c.yaw -= Input.dx * 0.0027;
    c.pitch = clamp(c.pitch + Input.dy * 0.0022, -0.35, 1.15);
  }
  if (Input.wheel) c.dist = clamp(c.dist + Input.wheel * 0.6, 2.6, 9);
  /* Камера за спиной: сама доворачивается туда, куда смотрит Олег.
     Мышь временно перехватывает управление, потом обзор плавно возвращается. */
  if (S.camFollow) {
    c.manual = Math.max(0, c.manual - dt);
    if (c.manual <= 0) {
      const speed = p.onBike ? Math.abs(S.bike.speed) : Math.hypot(p.vx, p.vz);
      const k = 5.0 + clamp(speed, 0, 8) * 0.55;
      c.yaw = angLerp(c.yaw, p.yaw + Math.PI, 1 - Math.exp(-k * dt));
      c.pitch = lerp(c.pitch, p.onBike ? 0.20 : 0.26, 1 - Math.exp(-2.2 * dt));
    }
  }

  const tgtDist = c.dist * (p.onBike ? 1.15 : 1);
  const ty = (p.onBike ? 1.25 : 1.35);
  c.tx = lerp(c.tx, p.x, 1 - Math.exp(-14 * dt));
  c.ty = lerp(c.ty, ty, 1 - Math.exp(-8 * dt));
  c.tz = lerp(c.tz, p.z, 1 - Math.exp(-14 * dt));
  const cp = Math.cos(c.pitch), sp = Math.sin(c.pitch);
  let ex = c.tx + Math.sin(c.yaw) * cp * tgtDist;
  let ez = c.tz + Math.cos(c.yaw) * cp * tgtDist;
  let ey = c.ty + sp * tgtDist + 0.5;
  /* не даём камере уехать в стену */
  let best = 1;
  for (let i = 1; i <= 6; i++) {
    const t = i / 6;
    const px = lerp(c.tx, ex, t), pz = lerp(c.tz, ez, t);
    let blocked = false;
    for (const s of solidsNear(px, pz, 0.6)) {
      if (s.kind === 'edge') continue;
      const hh = s.kind === 'building' && s.ref ? s.ref.h : 3;
      if (lerp(c.ty, ey, t) > hh + 0.3) continue;
      if (circleRect(px, pz, 0.45, s)) { blocked = true; break; }
    }
    if (blocked) { best = Math.max(0.25, (i - 1) / 6); break; }
  }
  ex = lerp(c.tx, ex, best); ez = lerp(c.tz, ez, best); ey = lerp(c.ty + 0.4, ey, best);
  c.x = lerp(c.x, ex, 1 - Math.exp(-18 * dt));
  c.y = lerp(c.y, Math.max(0.6, ey), 1 - Math.exp(-14 * dt));
  c.z = lerp(c.z, ez, 1 - Math.exp(-18 * dt));
  if (S.shake > 0.001) {
    c.x += rnd(-S.shake, S.shake) * 0.4; c.y += rnd(-S.shake, S.shake) * 0.3; c.z += rnd(-S.shake, S.shake) * 0.4;
    S.shake *= Math.exp(-6 * dt);
  }
}

const HUD2 = { cv: null, c: null, w: 0, h: 0 };
function initHud2() { HUD2.cv = $('hud2d'); HUD2.c = HUD2.cv.getContext('2d'); }
function resizeHud2() {
  HUD2.w = GL.w; HUD2.h = GL.h;
  HUD2.cv.width = Math.floor(GL.w * GL.uiDpr); HUD2.cv.height = Math.floor(GL.h * GL.uiDpr);
  HUD2.cv.style.width = GL.w + 'px'; HUD2.cv.style.height = GL.h + 'px';
  HUD2.c.setTransform(GL.uiDpr, 0, 0, GL.uiDpr, 0, 0);
}
const PRJ = new Float32Array(4);
function project(x, y, z) {
  const v = R3.view, pr = R3.proj;
  const ex = v[0]*x + v[4]*y + v[8]*z + v[12];
  const ey = v[1]*x + v[5]*y + v[9]*z + v[13];
  const ez = v[2]*x + v[6]*y + v[10]*z + v[14];
  const cw = -ez;
  if (cw < 0.05) return null;
  const cx = pr[0] * ex, cy = pr[5] * ey;
  PRJ[0] = (cx / cw * 0.5 + 0.5) * HUD2.w;
  PRJ[1] = (0.5 - cy / cw * 0.5) * HUD2.h;
  PRJ[2] = cw;
  return PRJ;
}
function bubble3(x, y, z, text, color) {
  const p = project(x, y, z);
  if (!p || p[2] > 42) return;
  const c = HUD2.c;
  const scale = clamp(12 / p[2] + 0.55, 0.6, 1.15);
  c.save();
  /* Длинную реплику ужимаем по размеру шрифта, а не обрезаем рамкой: раньше
     всё, что не влезало в 250 пикселей, просто выезжало за пузырь. */
  let f = Math.round(13 * scale);
  c.font = '700 ' + f + 'px "Trebuchet MS",sans-serif';
  let tw = c.measureText(text).width;
  if (tw + 16 > 250) {
    f = Math.max(9, Math.floor(f * 250 / (tw + 16)));
    c.font = '700 ' + f + 'px "Trebuchet MS",sans-serif';
    tw = c.measureText(text).width;
  }
  const w = Math.min(250, tw + 16);
  const h = 22 * scale;
  c.globalAlpha = clamp((42 - p[2]) / 12, 0, 1);
  c.fillStyle = 'rgba(12,7,24,.86)';
  c.strokeStyle = color || 'rgba(255,45,149,.7)'; c.lineWidth = 2;
  roundRect(0, c, p[0] - w / 2, p[1] - h, w, h, 5); c.fill(); c.stroke();
  c.beginPath(); c.moveTo(p[0] - 4, p[1]); c.lineTo(p[0] + 4, p[1]); c.lineTo(p[0], p[1] + 7 * scale); c.closePath(); c.fill();
  c.fillStyle = '#e9dcff'; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText(text, p[0], p[1] - h / 2);
  c.restore();
}
function label3(x, y, z, text, color, size) {
  const p = project(x, y, z);
  if (!p || p[2] > 70) return;
  const c = HUD2.c;
  c.save();
  c.globalAlpha = clamp((70 - p[2]) / 20, 0, 1);
  c.font = '900 ' + (size || 12) + 'px "Trebuchet MS",sans-serif';
  c.textAlign = 'center'; c.textBaseline = 'middle';
  c.lineWidth = 3; c.strokeStyle = 'rgba(8,4,18,.8)';
  c.strokeText(text, p[0], p[1]); c.fillStyle = color || '#ffd23f';
  c.fillText(text, p[0], p[1]);
  c.restore();
}

const CAR_TINTS = [[.78,.24,.26],[.28,.46,.72],[.86,.84,.78],[.34,.34,.4],[.8,.62,.26],[.28,.6,.42],[.5,.32,.7]];
const CAR_KINDS = ['sedan','sedan','van','pickup','sedan'];
/* Габарит кузова в плане: половина длины берётся из силуэта (кузов строится
   «длиной по X», потом разворачивается носом по +Z), половина ширины — hw.
   Нужен и для столкновений с пешеходом, и чтобы машины не въезжали друг в друга. */
const CAR_BOX = (() => {
  const o = {};
  for (const k in CAR_SPEC) {
    let L = 0;
    for (const pt of CAR_SPEC[k].body) L = Math.max(L, Math.abs(pt[0]));
    o[k] = [L, CAR_SPEC[k].hw];
  }
  return o;
})();
/* Ближайшая точка кузова к точке (x, z) и вектор наружу. */
function carHit(c, x, z, r) {
  const dx = x - c.x, dz = z - c.z;
  const box = CAR_BOX[c.kind] || [2.1, 0.9];
  const fx = Math.sin(c.yaw), fz = Math.cos(c.yaw);
  const lo = dx * fx + dz * fz, la = -dx * fz + dz * fx;      /* вдоль и поперёк кузова */
  const cl = clamp(lo, -box[0], box[0]), ca = clamp(la, -box[1], box[1]);
  let ex = lo - cl, ez = la - ca, d = Math.hypot(ex, ez);
  if (d < 1e-4) {                                             /* центр внутри — выходим по ближней грани */
    const pl = box[0] - Math.abs(lo), pa = box[1] - Math.abs(la);
    if (pl < pa) { ex = lo >= 0 ? 1 : -1; ez = 0; d = -pl; }
    else { ex = 0; ez = la >= 0 ? 1 : -1; d = -pa; }
  } else { ex /= d; ez /= d; }
  if (d >= r) return null;
  return { push: r - d, nx: ex * fx - ez * fz, nz: ex * fz + ez * fx };
}
function spawnTraffic() {

const PED_GAITS = ['norm', 'norm', 'norm', 'vanya', 'kostya', 'boris', 'gran'];

      say: 0, line: '', down: 0, hop: 0, mesh: Math.floor(R() * 8), walk: 0.95 + R() * 0.75,
      gait: PED_GAITS[Math.floor(R() * PED_GAITS.length)], seed: R() });

/* Один шаг «жизни» пешего: фаза шага, сглаженные скорость и поворот,
   продольное ускорение, время для покоя и запуск холостых движений.
   Заменяет пары строк «phase += ...; yaw = atan2(...)» во всех апдейтах.
   keepYaw — для игрока и для тех, кто рулит корпусом сам.                */
function tickGait(e, dt, g, keepYaw) {
  g = g || GAIT(e.gait);
  if (e.seed === undefined) e.seed = Math.random();          /* личный сдвиг фаз */
  e.time = (e.time || 0) + dt;
  const v = Math.hypot(e.vx || 0, e.vz || 0);
  e.phase = ((e.phase || 0) + v * dt * g.cad) % 1e4;
  e.sp = lerp(e.sp || 0, clamp(v / g.vmax, 0, 1), 1 - Math.exp(-5.5 * dt));   /* поза догоняет скорость */
  e.acc = lerp(e.acc || 0, (v - (e.v0 || 0)) / Math.max(dt, 1e-3), 1 - Math.exp(-7 * dt));
  e.v0 = v;
  if (!keepYaw && v > 0.1) e.yaw = angLerp(e.yaw || 0, Math.atan2(e.vx, e.vz), 1 - Math.exp(-g.turn * dt));
  /* холостое движение — только когда человек реально стоит */
  if (e.idleP !== undefined && e.idleP < 1) e.idleP = Math.min(1, e.idleP + dt / IDLES[e.idle || 0].len);
  if (e.sp < 0.05) {
    e.idleT = (e.idleT === undefined ? rnd(2, 7) : e.idleT) - dt;
    if (e.idleT <= 0) { e.idleT = rnd(5, 12); e.idle = Math.floor(Math.random() * IDLES.length); e.idleP = 0; }
  } else { e.idleT = rnd(3, 8); e.idleP = 1; }
}

/* Взгляд: раз в 0.25..0.5 с выбираем, на что смотреть, дальше голова
   доворачивается и так же плавно возвращается вперёд. За спину не выворачиваемся. */
function tickGaze(e, dt) {
  if (dist2(e.x, e.z, S.cam.x, S.cam.z) > 45 * 45) { e.lkY = 0; e.lkP = 0; e.gz = null; return; }
  e.gzT = (e.gzT || 0) - dt;
  if (e.gzT <= 0) { e.gzT = rnd(0.25, 0.5); e.gz = pickGaze(e); }
  let wy = 0, wp = 0;
  if (e.gz) {
    const d = ((Math.atan2(e.gz[0] - e.x, e.gz[1] - e.z) - (e.yaw || 0) + Math.PI) % TAU + TAU) % TAU - Math.PI;
    if (Math.abs(d) < 1.7) {
      wy = clamp(d, -1, 1);
      wp = clamp(Math.atan2((e.gz[2] || 1.5) - 1.56, Math.max(0.6, dist(e.x, e.z, e.gz[0], e.gz[1]))), -0.5, 0.55);
    }
  }
  const k = 1 - Math.exp(-5 * dt);
  e.lkY = angLerp(e.lkY || 0, wy, k);
  e.lkP = lerp(e.lkP || 0, wp, k);
}
/* Что интереснее: собеседник, потом Олег, потом собака, потом машина на ходу.
   Вес w делает объект «интереснее» при том же расстоянии.                */
function pickGaze(e) {
  const p = S.player;
  let best = null, bw = 1e9;
  const see = (x, z, y, w) => { const d = dist2(e.x, e.z, x, z) * w; if (d < bw) { bw = d; best = [x, z, y]; } };
  see(p.x, p.z, p.onBike ? 1.45 : 1.60, e.say > 0 ? 0.25 : 1);
  for (const d of S.dogs) see(d.x, d.z, 0.55, 2.2);
  for (const c of S.cars) if (Math.abs(c.sp) > 4) see(c.x, c.z, 1.0, 3.2);
  for (const g of S.guards) see(g.x, g.z, 1.6, 1.4);
  return bw < 900 ? best : null;                     /* взвешенный радиус ≈ 30 м */
}

/* Действия. Одноразовые проигрываются по прогрессу и сами гаснут,
   длящиеся плавно набирают и теряют вес. want — что нужно прямо сейчас. */
const ACT_ONCE = { swing: 0.55, scare: 0.50 };
function startAct(e, name) { e.act = name; e.actK = 0; }
function tickAct(e, dt, want) {
  if (e.act && ACT_ONCE[e.act]) {
    e.actK = (e.actK || 0) + dt / ACT_ONCE[e.act];
    if (e.actK >= 1) { e.act = ''; e.actK = 0; }
    return;
  }
  if (want && want !== e.act) { e.act = want; e.actK = e.actK || 0; }
  e.actK = lerp(e.actK || 0, e.act && e.act === want ? 1 : 0, 1 - Math.exp(-6 * dt));
  if (e.act !== want && e.actK < 0.02) { e.act = ''; e.actK = 0; }
}

function updateCars(dt) {
  const p = S.player;
  for (const c of S.cars) {
    const dx = Math.sin(c.yaw), dz = Math.cos(c.yaw);
    const ahead = (p.x - c.x) * dx + (p.z - c.z) * dz;
    const side = Math.abs(-(p.x - c.x) * dz + (p.z - c.z) * dx);
    /* Впереди идущая машина: держим дистанцию. Без этого колонна в полосе
       съезжается и машины едут одна сквозь другую. Встречные не мешают —
       их полоса в 5,2 м, а поперечный допуск вдвое меньше. */
    let gap = 0;
    for (const o of S.cars) {
      if (o === c) continue;
      const ax = (o.x - c.x) * dx + (o.z - c.z) * dz;
      if (ax <= 0 || ax > 14) continue;
      if (Math.abs(-(o.x - c.x) * dz + (o.z - c.z) * dx) > 2.0) continue;
      if (!gap || ax < gap) gap = ax;
    }
    let want = c.base;
    if (gap) want = Math.min(want, Math.max(0, (gap - 5.2) * 2.4));
    if (ahead > 0 && ahead < 9 && side < 1.8) want = Math.min(want, c.base * 0.15);
    c.sp = lerp(c.sp, want, 1 - Math.exp(-(want < c.sp ? 5 : 1.6) * dt));
    c.x += dx * c.sp * dt; c.z += dz * c.sp * dt;
    c.wheel += c.sp * dt * 3;
    /* клевок на торможении и крен на повороте — по производным скорости и курса */
    const dv = (c.sp - (c.sp0 === undefined ? c.sp : c.sp0)) / Math.max(dt, 1e-3); c.sp0 = c.sp;
    const dyw = ((c.yaw - (c.yaw0 === undefined ? c.yaw : c.yaw0) + Math.PI) % TAU + TAU) % TAU - Math.PI; c.yaw0 = c.yaw;
    c.pitch = lerp(c.pitch || 0, clamp(-dv * 0.010, -0.028, 0.028), 1 - Math.exp(-9 * dt));
    c.roll = lerp(c.roll || 0, clamp(-(dyw / Math.max(dt, 1e-3)) * c.sp * 0.012, -0.07, 0.07), 1 - Math.exp(-6 * dt));
    if (c.x < -6) c.x = W.x + 4; if (c.x > W.x + 6) c.x = -4;
    if (c.z < -6) c.z = W.z + 4; if (c.z > W.z + 6) c.z = -4;
    const d = dist(c.x, c.z, p.x, p.z);

    c.horn = Math.max(0, c.horn - dt);
    if (Math.abs(c.sp) > 3.2 && p.invuln <= 0 && carHit(c, p.x, p.z, p.r + 0.1)) {
      const a = Math.atan2(p.x - c.x, p.z - c.z);
      p.vx = Math.sin(a) * 8; p.vz = Math.cos(a) * 8;
      hurt(p.onBike ? 20 : 14, 'Машина оказалась быстрее и тяжелее. Смена окончена.');
      if (p.onBike) { S.bike.speed = 0; damageBike(16); p.onBike = false; S.bike.parked = true; S.bike.x = p.x - 1.2; S.bike.z = p.z + 0.6; }
      Audio2.crash(); shake(14); S.stats.crashes++;
      toast(pick(['«Куда прёшь, монтаж!»', '«Я тут вообще-то еду»', 'Водитель показал жест из ПДД, которого нет в ПДД']), 'bad');
    }

}

    /* Бригада не молчит: пока стоят рядом, каждый роняет своё. */
    if (n.say <= 0 && n.leave <= 0 && !Dlg.open && CREW_LINES[n.kind] &&
        dist2(n.x, n.z, S.player.x, S.player.z) < 26 * 26 && Math.random() < 0.09 * dt) {
      n.say = 3.4; n.line = pick(CREW_LINES[n.kind]);
    }
    if (n.leave > 0) {                                /* расходятся; Костя, как обычно, первым */
      n.leave -= dt;
      n.vx = Math.sin(n.yaw) * 2.9; n.vz = Math.cos(n.yaw) * 2.9;
      n.x += n.vx * dt; n.z += n.vz * dt;
      tickGaze(n, dt); tickGait(n, dt, GAIT(n.gait), true);
      if (n.leave <= 0) S.npcs = S.npcs.filter(o => o !== n);
      continue;
    }
    tickGaze(n, dt);
    const dNear = dist(n.x, n.z, S.player.x, S.player.z);
    tickAct(n, dt, n.say > 0 || (Dlg.open && Dlg.who === (n.who || n.kind)) ? 'talk'
      : (n.kind === 'sanya' && S.partnerBonus && dNear < 3.5 ? 'hold' : ''));
    /* стоящие NPC не ходят, но живут: дыхание, перенос веса, холостые движения */
    if (n.kind !== 'sanya' || n.brief) { n.vx = 0; n.vz = 0; tickGait(n, dt, GAIT(n.gait), true); continue; }
    const p = S.player, d = dist(n.x, n.z, p.x, p.z);
    if (d > 4) { const a = Math.atan2(p.x - n.x, p.z - n.z); n.vx = Math.sin(a) * 3.4; n.vz = Math.cos(a) * 3.4; }
    else { n.vx *= 0.85; n.vz *= 0.85; }
    n.x += n.vx * dt; n.z += n.vz * dt;
    tickGait(n, dt, GAITS.sanya);
  }
}
function updateHeat(dt) {
  S.heat = clamp(S.heat - BAL.heatDecay * dt * (S.player.onBike ? 0.8 : 1), 0, 100);
  const want = S.heat >= 70 ? 2 : S.heat >= 42 ? 1 : 0;
  while (S.guards.length < want) {
    const p = S.player;
    let gx = p.x, gz = p.z, best = -1;
    for (let i = 0; i < 10; i++) {
      const a = rnd(0, TAU), r = 40;
      const tx = clamp(p.x + Math.sin(a) * r, 3, W.x - 3), tz = clamp(p.z + Math.cos(a) * r, 3, W.z - 3);
      const d = dist(tx, tz, p.x, p.z);
      if (d > best) { best = d; gx = tx; gz = tz; }
      if (d > 33) break;
    }
    S.guards.push({ x: gx, z: gz, vx: 0, vz: 0, yaw: 0, phase: 0, wheel: 0, siren: 0, catchCd: 0, gait: 'guard', seed: Math.random() });
    toast('ЧОП «Бдительный сосед» выехал по вызову', 'bad', 3000); Audio2.siren();
  }
  while (S.guards.length > want) S.guards.pop();
  for (const g of S.guards) {
    const p = S.player;
    const a = Math.atan2(p.x - g.x, p.z - g.z);
    const sp = 5.5 + S.heat * 0.03;
    g.vx = lerp(g.vx, Math.sin(a) * sp, 1 - Math.exp(-2.4 * dt));
    g.vz = lerp(g.vz, Math.cos(a) * sp, 1 - Math.exp(-2.4 * dt));
    g.x += g.vx * dt; g.z += g.vz * dt;
    g.yaw = angLerp(g.yaw, a, 1 - Math.exp(-8 * dt));
    /* колесо машины — от скорости, шаг охранника — общим накопителем */
    const gv = Math.hypot(g.vx, g.vz);
    g.wheel = (g.wheel || 0) + gv * dt * 3;
    const gdy = ((g.yaw - (g.yaw0 === undefined ? g.yaw : g.yaw0) + Math.PI) % TAU + TAU) % TAU - Math.PI; g.yaw0 = g.yaw;
    g.roll = lerp(g.roll || 0, clamp(-(gdy / Math.max(dt, 1e-3)) * gv * 0.012, -0.07, 0.07), 1 - Math.exp(-6 * dt));
    g.pitch = lerp(g.pitch || 0, clamp(-(gv - (g.v1 === undefined ? gv : g.v1)) / Math.max(dt, 1e-3) * 0.010, -0.028, 0.028), 1 - Math.exp(-9 * dt)); g.v1 = gv;
    tickGait(g, dt, GAITS.guard, true);
    for (const s of solidsNear(g.x, g.z, 1)) { const c = circleRect(g.x, g.z, 0.5, s); if (c && !s.soft) { g.x += c.nx * c.push; g.z += c.nz * c.push; } }
    g.siren -= dt;
    if (g.siren <= 0 && dist(g.x, g.z, p.x, p.z) < 44) { g.siren = 1.6; Audio2.siren(); }
    g.catchCd = Math.max(0, g.catchCd - dt);
    if (dist(g.x, g.z, p.x, p.z) < 1.9 && g.catchCd <= 0 && !Dlg.open) {
      g.catchCd = 8;
      const fine = Math.round(clamp(120 + S.heat * 5, 120, 700));
      addMoney(-fine, 'Штраф от ЧОП'); S.stats.fines++; S.heat = 18;
      S.player.vx = -g.vx * 0.6; S.player.vz = -g.vz * 0.6;
      if (S.player.onBike) S.bike.speed *= 0.3;
      Dlg.one('guard', pick([
        'Вы кто? Монтажник? А наряд-допуск? А совесть? Штраф ' + fine + ' рублей, распишитесь мысленно.',
        'Бабушки жаловались. Бабушки не ошибаются. ' + fine + ' рублей.',
        'Я вас не задерживаю. Я вас штрафую. Это разные вещи.']));
    }
  }
}

      fn: () => {

        applyKostyaHint();
        const flag = 'kfix_' + m.def.id;                   /* репутацию дают один раз за заявку */
        if (!S.flags[flag]) { S.flags[flag] = true; addRep(1, 'Переделал за Костей'); }

      } },

function missingTools(list) { return (list || []).filter(t => S.player.tools.indexOf(t) < 0); }
function offerMission(idx) {

  let def;
  if (idx >= MISSIONS.length) { S.freeCount++; def = makeFreeMission(S.freeCount); }
  else def = MISSIONS[idx];
  S.mission = { def, stage: 'brief', quality: 0, timer: def.time || 0, data: {}, target: null };
  S.phoneRing = 0; Audio2.phone();

function workStepText() {

function missionTarget() {

function updateMission(dt) {

function tryStartWork() {

    ]);

  }

    return true;

      const pole = POLES.filter(pl => pl.mount).sort((a, b) => dist2(a.x, a.z, d.site.x, d.site.z) - dist2(b.x, b.z, d.site.x, d.site.z))[0];

  if (d.kind === 'final') { m.stage = 'work'; startFinalStep(); return true; }
  return false;
}
function finishWork(q) {

function payoutMission() {
  const m = S.mission, d = m.def, p = S.player, q = m.quality;
  let pay = d.pay * (0.55 + 0.75 * q / 100);
  const lines = [];
  if (m.data.late) { pay *= 0.5; lines.push('Опоздание: −50%'); }
  if (p.drunk > 20) { pay *= 0.7; lines.push('Состояние «после обеда»: −30%'); }
  if (p.drunk <= 0.5) { pay *= 1.12; lines.push('Трезвая смена: +12%'); S.stats.sober++; }
  if (S.heat > 60) { pay *= 0.9; lines.push('Шум во дворе: −10%'); }
  pay = Math.round(pay);
  let rep = q >= 88 ? 6 : q >= 72 ? 4 : q >= 55 ? 2 : q >= 40 ? 0 : -3;
  if (m.data.late) rep -= 2;
  if (p.drunk > 20) rep -= 3;
  addMoney(pay, 'Оплата за «' + d.title + '»');
  addRep(rep, rep >= 0 ? 'Работа принята' : 'Работа принята с оговорками');
  S.missionsDone.push({ id: d.id, q: Math.round(q), pay, late: !!m.data.late, kept: !!m.data.kostyaKept });
  S.stats.fixed++;
  const bonus = q >= 90 && !m.data.late && p.drunk <= 0.5 ? Math.round(d.pay * 0.25) : 0;
  const summary = [
    { who: d.client && d.client.who !== 'tamara' ? d.client.who : 'tamara', text: d.done },
    { who: 'boris', text: (q >= 88 ? 'Смотрел объект. Придраться не к чему, а хочется. Молодец, Олег.'
      : q >= 60 ? 'Нормально. Не блестяще, но работает. Так и запишем: «работает».'
      : 'Олег. Оно работает, но как-то по-олеговски. Переделывать не заставлю, но ты подумай.')
      + (bonus ? ' Держи премию ' + bonus + ' ₽.' : '')
      + (lines.length ? '\n\nПо расчёту: ' + lines.join('; ') + '.' : '') }
  ];
  /* сюжет замыкается: девиз возвращается, но теперь его произносит Олег */
  if (d.id === 'final') finalWords(S.missionsDone.filter(x => x.kept).length).forEach(l => summary.push(l));
  if (bonus) addMoney(bonus, 'Премия от Борисыча');
  m.stage = 'done';
  Dlg.seq(summary, () => {
    S.missionIndex++; S.mission = null; saveGame(true);
    if (S.missionIndex >= MISSIONS.length && !S.free) { endGame(true); return; }
    S.phoneRing = rnd(6, 10);

function startCableDefense() {
  const m = S.mission;
  m.data.timer = 62;
  m.data.coils = [

    x: c.x + rnd(-26, 26), z: c.z + rnd(19, 29), target: i, speed: 2.7 + i * 0.45, phase: 0, yaw: 0, done: false, scared: 0,
    mesh: i % 3
  }));
  Audio2.siren();
  Dlg.one('sanya', 'Олег! К бухтам идут «оценщики»! Их трое, ты один, но у тебя велосипед!');

function updateCableDefense(dt) {
  const m = S.mission, p = S.player, D = m.data;
  if (!D.coils) return;
  D.timer -= dt;
  for (const r of D.raiders) {
    const c = D.coils[r.target];
    if (r.done || c.lost || c.saved) continue;
    if (r.scared > 0) {
      r.scared -= dt;
      const a = Math.atan2(r.x - p.x, r.z - p.z);
      r.x += Math.sin(a) * 5 * dt; r.z += Math.cos(a) * 5 * dt;
      r.yaw = a; r.vx = Math.sin(a) * 2.4; r.vz = Math.cos(a) * 2.4; tickGait(r, dt, GAITS.hool, true);
      if (r.scared <= 0) { r.done = true; c.saved = true; }
      continue;
    }
    const a = Math.atan2(c.x - r.x, c.z - r.z);
    const d = dist(r.x, r.z, c.x, c.z);
    if (d > 1) { r.x += Math.sin(a) * r.speed * dt; r.z += Math.cos(a) * r.speed * dt; r.yaw = a;
      r.vx = Math.sin(a) * r.speed; r.vz = Math.cos(a) * r.speed; }
    else {
      r.vx = 0; r.vz = 0;
      c.prog += dt * 0.2;
      if (c.prog >= 1) { c.lost = true; r.done = true; toast('Бухту унесли! «Это был не кабель, это была надежда»', 'bad', 3000); Audio2.nope(); }
    }
    tickGait(r, dt, GAITS.hool, true);
    if (dist(r.x, r.z, p.x, p.z) < 4.4 && (Input.anyHit(K.tool) || Input.anyHit(K.act))) {
      r.scared = 1.4; c.saved = true;
      delete Input.hit['KeyF']; delete Input.hit['KeyE'];
      Audio2.thud(); fx3(r.x, 0.8, r.z, 'dust', 8);
      floater(r.x, 2, r.z, pick(['Всё-всё!', 'Мы мимо шли', 'Тут не наше']), '#ffd23f');
      toast('Бухта спасена', 'good', 1800);
    }
  }
  const open = D.coils.filter(c => !c.saved && !c.lost).length;
  if (open === 0 || D.timer <= 0) {
    D.coils.forEach(c => { if (!c.saved && !c.lost) c.lost = true; });
    const saved = D.coils.filter(c => c.saved).length;
    D.step = 6;
    const base = D.parts.reduce((a, b) => a + b, 0) / Math.max(1, D.parts.length);
    m.quality = clamp(base * 0.8 + saved / D.coils.length * 20 + (D.kostyaMod || 0), 0, 100);
    S.stats.bestQ = Math.max(S.stats.bestQ, m.quality);
    m.stage = 'verify';
    Dlg.one('oleg', saved === 3 ? 'Кабель на месте. Все три бухты. Борисыч даже не поверит.'
      : saved > 0 ? 'Часть кабеля спасли. Часть ушла в народное хозяйство.'
      : 'Кабель ушёл. Скажу, что это был провод с неопределённым будущим.');
    saveGame(true);
  }
}

function currentInteraction() {
  const p = S.player, M = S.mission;
  const near = (x, z, r) => dist2(p.x, p.z, x, z) < r * r;
  const slow = !p.onBike || Math.abs(S.bike.speed) < 3;
  if (M && slow) {
    const d = M.def;
    /* Костя ещё не уехал — можно расспросить: это подсказка, а не вежливость */
    if (!M.data.kostyaTold && d.kostya && d.kostya.ask) {
      const kn = S.npcs.find(n => n.kind === 'kostya');
      if (kn && near(kn.x, kn.z, 4.2)) return { label: 'спросить Костю: что тут было', fn: () => askKostya() };
    }
    if (M.stage === 'travel' && near(d.site.x, d.site.z, 4.6)) return { label: 'начать работу: ' + d.site.label, fn: () => tryStartWork() };
    if (M.stage === 'verify' && near(d.site.x, d.site.z, 5.6)) return { label: 'проверить оборудование', fn: () => doVerify() };
    if (M.stage === 'report' && d.client && near(d.client.x, d.client.z, 5.2)) return { label: 'сдать работу: ' + d.client.name, fn: () => payoutMission() };
    if (M.stage === 'work') {
      if (d.kind === 'search' && M.data.spots)
        for (const sp of M.data.spots) if (near(sp.x, sp.z, 3.6) && !sp.searched) return { label: 'обыскать: ' + sp.label, fn: () => searchSpot(sp) };
      if (d.kind === 'night' && M.data.poles) {
        for (const e of M.data.poles) {
          if (!near(e.p.x, e.p.z, 4.6)) continue;
          const isBroken = M.data.poles.indexOf(e) === M.data.broken;
          if (M.data.found && isBroken) return { label: 'чинить камеру', fn: () => startCameraGame({ zone: d.zone || 'въезд' }, q => { e.p.installed = true; e.p.camYaw = 0.2; finishWork(q); }) };
          if (!M.data.found) return { label: 'осмотреть камеру', fn: () => inspectPole(e) };
        }
      }
      if (d.kind === 'final') {
        const st = M.data.step;
        if (st === 0 && near(d.site.x, d.site.z, 5)) return { label: 'монтаж СКУД на входе', fn: () => startFinalStep() };
        if (st >= 1 && st <= 4) { const cam = M.data.cams[st - 1]; if (near(cam.p.x, cam.p.z, 5)) return { label: 'ставить камеру на опору ' + cam.p.mount, fn: () => startFinalStep() }; }
      }
    }
  }
  if (S.egg.stage === 'go' && slow && near(EGG.dev.x, EGG.dev.z, 3.4))
    return { label: 'вскрыть прибор периметра', fn: () => eggOpenDevice() };
  for (const poi of POIS) if (near(poi.x, poi.z, poi.r) && slow) return { label: poi.act, fn: () => openPoi(poi.id) };
  if (!p.onBike && near(S.bike.x, S.bike.z, 3.2)) return { label: 'сесть на велосипед', fn: () => tryMountBike() };
  if (p.onBike) return { label: 'слезть с велосипеда', fn: () => tryMountBike() };
  return null;
}
function handleAction() { const it = currentInteraction(); if (it) { it.fn(); return true; } return false; }
function useTool() {
  const p = S.player;
  if (!p.tools.length) { toast('Сумка пуста. «Работать нечем, зато честно»', 'bad', 1800); return; }

function drawShadow(x, z, size, alpha) {
  const gl = GL.gl, P = R3.glow;
  gl.useProgram(P.p);
  gl.uniformMatrix4fv(P.u.uProj, false, R3.proj);
  gl.uniformMatrix4fv(P.u.uView, false, R3.view);
  gl.uniform3f(P.u.uRight, 1, 0, 0);
  gl.uniform3f(P.u.uUp, 0, 0, 1);
  gl.uniform3f(P.u.uPos, x, surfY(x, z) + QCFG.light.shadow.lift, z);
  gl.uniform2f(P.u.uSize, size, size);
  gl.uniform4f(P.u.uColor, 0, 0, 0, alpha);
  gl.uniform1f(P.u.uHard, QCFG.light.shadow.hard);
  gl.uniform1f(P.u.uMode, 1);
  gl.bindVertexArray(R3.glowVAO);
  gl.drawArrays(gl.TRIANGLES, 0, 6);
  gl.uniform1f(P.u.uMode, 0);
}
function pedMesh(i) { return CHAR_MESHES.peds[i % CHAR_MESHES.peds.length]; }

function drawDynamic() {
  const gl = GL.gl, p = S.player;
  const camx = S.cam.x, camz = S.cam.z;
  const vk = Q.vis;
  const vis = (x, z, r) => { const rr = (r || 95) * vk; return dist2(x, z, camx, camz) < rr * rr; };

  /* тени — отдельным проходом, с альфа-смешиванием */
  const SH = QCFG.light.shadow, sh = (x, z, k) => drawShadow(x, z, k[0], k[1]);
  gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA); gl.depthMask(false);
  if (vis(p.x, p.z)) sh(p.x, p.z, p.onBike ? SH.olegBike : SH.oleg);
  for (const q of S.peds) if (vis(q.x, q.z, 55)) sh(q.x, q.z, SH.ped);
  for (const h of S.hools) if (vis(h.x, h.z, 55)) sh(h.x, h.z, SH.ped);
  for (const g of S.grans) if (vis(g.x, g.z, 55)) sh(g.x, g.z, SH.ped);
  for (const n of S.npcs) if (vis(n.x, n.z, 55)) sh(n.x, n.z, SH.ped);
  for (const d of S.dogs) if (vis(d.x, d.z, 45)) sh(d.x, d.z, SH.dog);
  for (const g of S.guards) if (vis(g.x, g.z, 70)) sh(g.x, g.z, SH.guard);
  for (const c of S.cars) if (vis(c.x, c.z)) sh(c.x, c.z, SH.car);
  if (!p.onBike && vis(S.bike.x, S.bike.z, 55)) sh(S.bike.x, S.bike.z, SH.bike);
  const M = S.mission;
  if (M && M.data && M.data.raiders && M.data.step === 5)
    for (const r of M.data.raiders) if (!r.done && vis(r.x, r.z, 60)) sh(r.x, r.z, SH.ped);
  gl.depthMask(true); gl.disable(gl.BLEND);

  beginMainLights();
  /* машины */
  for (const c of S.cars) if (vis(c.x, c.z)) drawVehicle(c.kind, c.x, surfY(c.x, c.z), c.z, c.yaw, c.wheel, [c.tint[0], c.tint[1], c.tint[2], 1], c);
  /* прохожие и жители */
  for (const q of S.peds) if (vis(q.x, q.z, 60)) drawCharacter(pedMesh(q.mesh), charPose(q));
  for (const h of S.hools) if (vis(h.x, h.z, 60)) drawCharacter(CHAR_MESHES.hool, charPose(h));
  for (const g of S.grans) if (vis(g.x, g.z, 60)) drawCharacter(CHAR_MESHES.gran, charPose(g));
  for (const n of S.npcs) if (vis(n.x, n.z, 70))
    drawCharacter(n.kind === 'sanya' ? CHAR_MESHES.sanya : (CHAR_MESHES[n.who] || CHAR_MESHES.client), charPose(n));
  for (const g of S.guards) if (vis(g.x, g.z, 90)) {
    drawVehicle('sedan', g.x, surfY(g.x, g.z), g.z, g.yaw, g.wheel || 0, [.55, .12, .16, 1],
      { pitch: g.pitch, roll: g.roll, steer: clamp((g.roll || 0) * -4, -0.5, 0.5) });
    drawCharacter(CHAR_MESHES.guard, charPose(g));
  }
  if (M && M.data && M.data.raiders && M.data.step === 5)

    m4compose(EGG_MAT, EGG.dev.x, EGG.dev.y, EGG.dev.z, 0, 0, 0, 1);

  }
  for (const pole of POLES) {
    if (!pole.installed || !vis(pole.x, pole.z, 70)) continue;
    m4compose(BONES[0], pole.x - 0.7, (pole.lamp ? 7.2 : 6.2) - 0.5, pole.z, 0, (pole.camYaw || 0) + Math.PI, 0, 1);
    BONEBUF.set(BONES[0], 0);

function drawDog3(d) {
  const gl = GL.gl, P = R3.main;
  const v = Math.hypot(d.vx, d.vz), sp = clamp(v / 5.2, 0, 1);
  /* Размах привязан к скорости: стоящая собака стоит на прямых ногах, а не
     раскорячившись — раньше в размах входила постоянная добавка. */
  const ph = d.phase * 2, amp = 0.05 + sp * 0.66;
  const be = Math.sin(Math.PI * clamp(d.barkK || 0, 0, 1));      /* колокол лая */
  /* корпус пружинит на бегу и приседает на лае */
  m4compose(BONES[0], d.x, surfY(d.x, d.z) + 0.42 + Math.sin(ph * 2) * 0.03 * sp - be * 0.02, d.z,
    -sp * 0.06 + Math.sin(ph * 2) * 0.04 * sp, d.yaw, Math.sin(ph) * 0.05 * sp, 1);
  /* голова: смотрит на цель, задирается на лае, опускается на бегу */
  m4mul(BONES[1], BONES[0], m4compose(SCRATCH[6], 0, 0.02, 0.30,
    -0.10 * sp - be * 0.45 + (d.hp || 0), d.hy || 0, Math.sin(S.t * 1.7 + d.x) * 0.05 * (1 - sp), 1));
  /* челюсть: лай и одышка после пробежки */
  m4mul(BONES[2], BONES[1], m4compose(SCRATCH[6], 0, 0.005, 0.055,
    be * 0.55 + (d.pant || 0) * (0.10 + Math.sin(S.t * 9) * 0.06), 0, 0, 1));
  /* Лапы рысью: диагонали работают вместе. Плечо машет, а сустав ниже (у
     передних запястье, у задних скакательный) подламывается назад в фазе
     выноса — без него нога так и остаётся палкой. */
  for (const [b, lb, ox, oz, off, kn] of [[3, 8, -0.085, 0.17, 0, 0.85], [4, 9, 0.085, 0.17, Math.PI, 0.85],
                                          [5, 10, -0.085, -0.20, Math.PI, 1.30], [6, 11, 0.085, -0.20, 0, 1.30]]) {
    m4mul(BONES[b], BONES[0], m4compose(SCRATCH[6], ox, -0.10, oz, -Math.sin(ph + off) * amp, 0, 0, 1));
    const bend = 0.06 + (0.5 - 0.5 * Math.cos(ph + off)) * amp * kn;
    m4mul(BONES[lb], BONES[b], m4compose(SCRATCH[6], 0, -0.175, 0, bend, 0, 0, 1));
  }
  /* хвост: виляет тем шире, чем добрее настроение, и поджимается со страху */
  const wg = clamp(d.wag || 0, 0, 1);
  m4mul(BONES[7], BONES[0], m4compose(SCRATCH[6], 0, 0.02, -0.36,
    0.15 + wg * 0.55 - (d.scare > 0 ? 1.1 : 0), Math.sin(S.t * (6 + wg * 10)) * (0.12 + wg * 0.55), 0, 1));
  for (let i = 0; i < 12; i++) BONEBUF.set(BONES[i], i * 16);
  gl.uniformMatrix4fv(P.u.uBones, false, BONEBUF);
  drawMesh(VEH.dog, TX.paint, BONES[0], { skin: true });
}
function beginMainLights() {

    for (let i = 0; i < Math.min(Q.lampPick, all.length); i++)
      lamps.push({ x: all[i].x, y: all[i].y, z: all[i].z, c: LP.warm, k: Env.night * (all[i].small ? LP.kSmall : LP.kBig) });
    /* собственный свет Олега, чтобы ночью не идти вслепую */

    if (p.lampOn) lamps.push({ x: p.x + Math.sin(p.yaw) * 2.6, y: 1.3, z: p.z + Math.cos(p.yaw) * 2.6, c: LP.torch, k: Env.night * LP.kTorch });

function drawGlows() {

    const G = QCFG.glow, LC = QCFG.light.lamp;
    for (const l of Static.lamps) {

      const k = l.small ? G.lampSmall : G.lampBig;
      drawGlow([l.x, l.y, l.z], k[0], LC.warm, k[1] * Env.night, k[2]);
      if (!l.small && dd < nearR * nearR)

    drawGlow([t.x, 0.15, t.z], G.markerBase[0], [1, .82, .25], G.markerBase[1] * pulse, G.markerBase[2]);

function drawOverlay2D() {

  if (p.say > 0 && p.line) bubble3(p.x, 1.95, p.z, p.line, 'rgba(255,138,31,.82)');

      label3(n.x, 2.35, n.z, (CHARS[n.who] ? CHARS[n.who].name : 'КЛИЕНТ'),
        (CHARS[n.who] && CHARS[n.who].c) || '#25e8dc', 12);
  }
  /* точки поиска и тёмные опоры */
  const M = S.mission;
  if (M && M.stage === 'work' && M.def.kind === 'search' && M.data.spots)
    for (const sp of M.data.spots) label3(sp.x, 1.4, sp.z, sp.searched ? '· осмотрено ·' : '⌕ ' + sp.label, sp.searched ? '#9a8fb0' : '#25e8dc', 12);
  if (M && M.def.kind === 'final' && M.data.coils)
    for (const coil of M.data.coils)
      label3(coil.x, 1.2, coil.z, coil.lost ? 'УНЕСЛИ' : coil.saved ? 'ЦЕЛА' : 'КАБЕЛЬ ' + Math.round((1 - coil.prog) * 100) + '%',
        coil.lost ? '#ff4d5e' : coil.saved ? '#4be36b' : '#ffd23f', 13);
  /* всплывающий текст */
  for (const f of S.fx) if (f.kind === 'text') {
    const pr = project(f.x, f.y, f.z);
    if (!pr) continue;
    c.save(); c.globalAlpha = clamp(f.life / f.max, 0, 1);
    c.font = '900 16px "Arial Black",sans-serif'; c.textAlign = 'center';
    c.lineWidth = 4; c.strokeStyle = 'rgba(8,4,18,.85)';
    c.strokeText(f.text, pr[0], pr[1]); c.fillStyle = f.color; c.fillText(f.text, pr[0], pr[1]);
    c.restore();
  }
  /* указатель на цель */
  const t = (M && M.target) || (S.egg.stage === 'go' ? EGG.mark : null);
  if (t) {
    const d = dist(t.x, t.z, p.x, p.z);
    const pr = project(t.x, 3.2, t.z);
    const onScreen = pr && pr[0] > 40 && pr[0] < HUD2.w - 40 && pr[1] > 40 && pr[1] < HUD2.h - 40;
    if (onScreen) label3(t.x, 3.6, t.z, t.label.toUpperCase() + ' · ' + Math.round(d) + ' м', '#ffd23f', 13);
    else {
      const ang = Math.atan2(t.x - p.x, t.z - p.z) - S.cam.yaw + Math.PI;
      const cx = HUD2.w / 2, cy = HUD2.h / 2, rr = Math.min(HUD2.w, HUD2.h) * 0.34;
      const sx = cx + Math.sin(ang) * rr, sy = cy - Math.cos(ang) * rr * 0.62;
      c.save(); c.translate(sx, sy); c.rotate(ang);
      c.fillStyle = 'rgba(255,210,63,.92)';
      c.beginPath(); c.moveTo(0, -14); c.lineTo(10, 8); c.lineTo(0, 3); c.lineTo(-10, 8); c.closePath(); c.fill();
      c.restore();
      c.save(); c.font = '900 12px "Trebuchet MS",sans-serif'; c.textAlign = 'center';
      c.lineWidth = 3; c.strokeStyle = 'rgba(8,4,18,.8)';
      c.strokeText(Math.round(d) + ' м · ' + t.label, sx, sy + 26);
      c.fillStyle = '#ffd23f'; c.fillText(Math.round(d) + ' м · ' + t.label, sx, sy + 26);
      c.restore();
    }
  }
}
/* Тонмаппинг: единственный проход, который пишет в холст. */
function drawTone() {
  const gl = GL.gl, P = R3.tone;
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, GL.canvas.width, GL.canvas.height);
  gl.useProgram(P.p);
  gl.disable(gl.DEPTH_TEST);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, HDR.tex);
  gl.uniform1i(P.u.uHDR, 0);
  gl.uniform1f(P.u.uExposure, Env.exposure);
  gl.uniform1f(P.u.uSat, QCFG.post.sat);
  gl.uniform1f(P.u.uDither, QCFG.post.dither);
  gl.bindVertexArray(R3.skyVAO);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.enable(gl.DEPTH_TEST);
  R3.curGrp = null;                    /* тонмаппинг сбил привязки текстур */
}

/* Порядок проходов кадра. Смен буфера ровно три: сцена в HDR, разрешение
   мультисэмпла, тонмаппинг в холст. После сцены глубина больше не нужна, а
   после разрешения не нужен мультисэмпловый цвет — говорим об этом драйверу
   через invalidateFramebuffer: на тайловом GPU это прямая экономия обмена с
   памятью, а не микрооптимизация. */
function renderFrame() {
  const gl = GL.gl;
  Perf.beginFrame(gl);
  Env.update(hour());
  R3.time = S.t;                       /* облака медленно плывут */
  setCamera([S.cam.x, S.cam.y, S.cam.z], [S.cam.tx, S.cam.ty, S.cam.tz]);

  /* Окружение: по грани кубмапы за кадр и только когда солнце сдвинулось. */
  EnvMap.check();
  EnvMap.update(gl, false);

  gl.bindFramebuffer(gl.FRAMEBUFFER, HDR.fb);
  gl.viewport(0, 0, HDR.w, HDR.h);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  beginMainLights();
  drawStatic();
  drawDynamic();
  drawSky();                           /* последним из непрозрачного, с проверкой глубины */
  drawGlows();
  gl.invalidateFramebuffer(gl.FRAMEBUFFER, [gl.DEPTH_ATTACHMENT]);

  if (HDR.samples > 0) {
    gl.bindFramebuffer(gl.READ_FRAMEBUFFER, HDR.fb);
    gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, HDR.resolveFb);
    gl.blitFramebuffer(0, 0, HDR.w, HDR.h, 0, 0, HDR.w, HDR.h, gl.COLOR_BUFFER_BIT, gl.NEAREST);
    gl.bindFramebuffer(gl.READ_FRAMEBUFFER, HDR.fb);
    gl.invalidateFramebuffer(gl.READ_FRAMEBUFFER, [gl.COLOR_ATTACHMENT0]);
    gl.bindFramebuffer(gl.READ_FRAMEBUFFER, null);
    gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, null);
  }
  drawTone();

  Perf.endFrame(gl);
  drawOverlay2D();
}

function drawMiniWorld(c, w, h, big) {

  for (const z of ROADS_Z) c.fillRect(0, (z - ROAD_W / 2) * sz, w, ROAD_W * sz);
  for (const x of ROADS_X) c.fillRect((x - ROAD_W / 2) * sx, 0, ROAD_W * sx, h);
  for (const b of BUILDINGS) {
    c.fillStyle = b.kind === 'panel' ? '#5a4a72' : b.kind === 'indust' ? '#4a5566' : b.kind === 'garage' ? '#4a4152' : '#6b4a7a';
    c.fillRect(b.x * sx, b.z * sz, b.w * sx, b.d * sz);
  }
  for (const poi of POIS) {
    c.fillStyle = poi.color;
    c.beginPath(); c.arc(poi.x * sx, poi.z * sz, big ? 7 : 2.6, 0, TAU); c.fill();
    if (big) {
      c.fillStyle = '#e9dcff'; c.font = '700 11px "Trebuchet MS",sans-serif'; c.textAlign = 'center';
      c.fillText(poi.name, poi.x * sx, poi.z * sz - 12); c.textAlign = 'left';
    }
  }
  for (const g of S.guards) { c.fillStyle = '#ff4d5e'; c.beginPath(); c.arc(g.x * sx, g.z * sz, big ? 5 : 2.4, 0, TAU); c.fill(); }
  const t = S.mission && S.mission.target;
  if (t) {
    const pulse = 0.5 + 0.5 * Math.sin(S.t * 4);
    c.strokeStyle = '#ffd23f'; c.lineWidth = big ? 3 : 1.6;
    c.beginPath(); c.arc(t.x * sx, t.z * sz, (big ? 10 : 3) + pulse * (big ? 5 : 3), 0, TAU); c.stroke();
    c.fillStyle = '#ffd23f'; c.beginPath(); c.arc(t.x * sx, t.z * sz, big ? 5 : 2, 0, TAU); c.fill();
    if (big) { c.font = '900 12px "Arial Black",sans-serif'; c.textAlign = 'center'; c.fillText('ЦЕЛЬ: ' + t.label.toUpperCase(), t.x * sx, t.z * sz - 18); c.textAlign = 'left'; }
  }
  const p = S.player;
  c.save(); c.translate(p.x * sx, p.z * sz); c.rotate(-p.yaw + Math.PI);
  c.fillStyle = '#fff';
  c.beginPath(); c.moveTo(0, -(big ? 9 : 5)); c.lineTo(big ? 6 : 3.4, big ? 6 : 3); c.lineTo(-(big ? 6 : 3.4), big ? 6 : 3); c.closePath(); c.fill();
  c.restore();
  if (big) { c.fillStyle = '#ff2d95'; c.font = '900 11px "Arial Black",sans-serif'; c.textAlign = 'center'; c.fillText('ОЛЕГ', p.x * sx, p.z * sz - 14); c.textAlign = 'left'; }
}

function shopSheet(shopId, title, subtitle, extra, back) {
  const items = SHOP_ITEMS.filter(i => i.shop === shopId);
  const cards = items.map(i => {
    const owned = i.up && S.upgrades[i.id];
    const canBuy = !owned && i.can() && S.player.money >= i.price;
    return '<div class="card' + (owned ? ' owned' : '') + '"><b>' + i.name + '</b><span>' + i.desc + '</span>' +
      '<div class="price">' + fmtMoney(i.price) + '</div>' +
      '<button class="btn sm ' + (canBuy ? 'c' : '') + '" id="buy_' + i.id + '"' + (canBuy ? '' : ' disabled') + '>' +
      (owned ? 'Уже есть' : !i.can() ? 'Не нужно' : S.player.money < i.price ? 'Не хватает денег' : 'Купить') + '</button></div>';
  }).join('');
  showSheet('<h2>' + title + '</h2><div class="sub">' + subtitle + '</div>' +
    '<p>В кармане: <b style="color:#ffd23f">' + fmtMoney(S.player.money) + '</b></p>' + (extra || '') +
    '<div class="shopGrid">' + cards + '</div>' +

  items.forEach(i => wire('buy_' + i.id, () => {

    toast('Куплено: ' + i.name, 'good'); saveGame(true);

}

function endGame(win, reason) {

  Mini.close(); Dlg.closeAll();
  if (win) Audio2.win(); else Audio2.lose();
  const avgQ = S.missionsDone.length ? Math.round(S.missionsDone.reduce((a, b) => a + b.q, 0) / S.missionsDone.length) : 0;
  const rank = avgQ >= 88 ? 'МАСТЕР УЧАСТКА' : avgQ >= 72 ? 'КРЕПКИЙ МОНТАЖНИК' : avgQ >= 55 ? 'РАБОТАЕТ — И ЛАДНО' : 'ЕСТЬ КУДА РАСТИ';
  const stats = '<div class="stats">' +
    '<i>Заявок сдано</i><b>' + S.missionsDone.length + '</b>' +

  if (win) {
    showSheet('<h1>Смена сдана</h1><div class="sub">звание по итогам: ' + rank + '</div>' +
      '<p><b>Борисыч:</b> «Олег. Объект работает, заказчик доволен, кабель на месте. Иди домой, завтра новая заявка».</p>' +
      '<p><b>Ваня:</b> «Бригада отработала. Кто-то с первого раза, кто-то с третьего. Главное — отработала».</p>' +
      '<p><b>Тамара:</b> «И телефон не выключай. Я всё равно дозвонюсь».</p>' + stats +
      '<div class="note">Сюжет пройден. Можно остаться в районе: Тамара будет присылать бесконечные заявки, оплата растёт с каждой.</div>' +
      '<div class="btns"><button class="btn c" id="bFree">Остаться на смене</button>' +
      '<button class="btn p" id="bAgain">Новая смена</button><button class="btn" id="bMenu">В меню</button></div>' + DISCLAIMER, 'win');
    wire('bFree', startFreeMode);
  } else {
    showSheet('<h1>Смена сорвана</h1><div class="sub">' + rank + '</div>' +
      '<p>' + (reason || 'Что-то пошло не так, как обычно — просто чуть сильнее.') + '</p>' +
      '<p><b>Тамара:</b> «Олег, отдохни. И завтра без самодеятельности».</p>' + stats +
      '<div class="btns"><button class="btn p" id="bAgain">Попробовать заново</button><button class="btn c" id="bMenu">В меню</button></div>', 'lose');
  }
  wire('bAgain', () => startNewGame(true));
  wire('bMenu', screenMenu);
  if (win) { S.flags.won = true; saveGame(true); } else Save.wipe();
}

/* Настройки интерфейса: живут отдельно от прогресса смены. */
function saveOpts() {
  Save.writeOpts({ camFollow: !!S.camFollow, quality: S.quality, dynamic: !!S.dynamic, station: Audio2.station,
                   sfx: Audio2.sfxVol, mus: Audio2.musVol, muted: !!Audio2.muted });
}
function loadOpts() {
  const o = Save.readOpts();
  if (!o) return;
  if (typeof o.camFollow === 'boolean') S.camFollow = o.camFollow;
  if (typeof o.quality === 'string' && QCFG.profiles[o.quality]) S.quality = o.quality;
  else if (o.lowFx === true) S.quality = 'low';          /* прежний режим «экономно» */
  if (typeof o.dynamic === 'boolean') S.dynamic = o.dynamic;
  if (typeof o.sfx === 'number') Audio2.setSfx(clamp(o.sfx, 0, 1));
  if (typeof o.mus === 'number') Audio2.setMus(clamp(o.mus, 0, 1));
  if (typeof o.station === 'number' && Audio2.stations[o.station]) Audio2.station = o.station | 0;
  if (o.muted) Audio2.mute(true);
}

function saveGame(silent) {
  const p = S.player;
  const data = {
    v: 1, ts: Date.now(),
    p: { x: p.x, z: p.z, yaw: p.yaw, health: p.health, stamina: p.stamina, drunk: p.drunk, money: p.money, rep: p.rep, tools: p.tools.slice(), tool: p.tool },
    bike: { x: S.bike.x, z: S.bike.z, cond: S.bike.cond },
    clock: S.clock, day: S.day, heat: S.heat,
    missionIndex: S.missionIndex, missionsDone: S.missionsDone.slice(),
    free: S.free, freeCount: S.freeCount,
    upgrades: Object.assign({}, S.upgrades), stats: Object.assign({}, S.stats), flags: Object.assign({}, S.flags),
    poles: POLES.map(pl => !!pl.installed), station: Audio2.station
  };
  const ok = Save.write(data);
  if (!ok && !silent) toast('Не удалось сохранить: ' + (Save.lastError || 'localStorage недоступен'), 'bad', 4000);
  else if (!silent) toast('Прогресс сохранён', 'good', 1400);
  return ok;
}
function loadGame() {
  const d = Save.read();
  if (!d) return false;
  try {
    resetWorld(false);
    const p = S.player;
    Object.assign(p, { x: d.p.x, z: d.p.z, yaw: d.p.yaw || 0, health: d.p.health, stamina: d.p.stamina,
      drunk: d.p.drunk || 0, money: d.p.money, rep: d.p.rep, tools: (d.p.tools || []).filter(t => TOOLS[t]), tool: d.p.tool || 0 });
    S.bike.x = d.bike.x; S.bike.z = d.bike.z; S.bike.cond = d.bike.cond;
    S.clock = d.clock; S.day = d.day || 1; S.heat = d.heat || 0;
    S.missionIndex = d.missionIndex || 0; S.missionsDone = d.missionsDone || [];
    S.free = !!d.free; S.freeCount = d.freeCount || 0;
    S.upgrades = d.upgrades || {};
    S.stats = Object.assign(S.stats, d.stats || {});
    S.flags = Object.assign(S.flags, d.flags || {});
    if (Array.isArray(d.poles)) d.poles.forEach((v, i) => { if (POLES[i]) POLES[i].installed = v; });
    if (typeof d.station === 'number') Audio2.station = clamp(d.station, 0, Audio2.stations.length - 1);
    S.flags.tutorialDone = true; S.tutorial = null; S.mission = null; S.phoneRing = 2.5;
    S.cam.tx = p.x; S.cam.tz = p.z; hudToolSig = '';
    return true;
  } catch (e) { toast('Сохранение повреждено, начинаем заново', 'bad', 3600); Save.wipe(); return false; }
}

  { text: 'Всё. Сейчас позвонит Ваня — объяснит один раз', check: t => t.wait > 1.6 }
];
function updateTutorial(dt) {
  const T = S.tutorial, p = S.player;
  T.wait = (T.wait || 0) + dt;
  T.looked = (T.looked || 0) + (Math.abs(Input.dx) + Math.abs(Input.dy) > 2 ? dt : 0);
  T.turned = (T.turned || 0) + ((Input.any(K.left) || Input.any(K.right)) ? dt : 0);
  const sp = Math.hypot(p.vx, p.vz);
  if (!p.onBike) T.moved += sp * dt;
  if (Input.any(K.sprint) && sp > 1) T.sprint += dt;
  if (p.onBike) T.rode += Math.abs(S.bike.speed) * dt;
  if (p.onBike && Input.any(K.brake) && Math.abs(S.bike.speed) > 1) T.braked = true;
  if (S.screen === 'map') T.mapOpened = true;
  if (TUTORIAL[T.step].check(T)) {
    T.step++; T.wait = 0; Audio2.ok();
    if (T.step >= TUTORIAL.length) {
      T.done = true; S.tutorial = null; S.flags.tutorialDone = true; S.phoneRing = 1.4;
      toast('Обучение пройдено. Смена начинается', 'good', 2600); saveGame(true);
    } else toast('Дальше: ' + TUTORIAL[T.step].text, 'info', 2400);
  }
}
function skipTutorial() {
  if (!S.tutorial) return false;
  S.tutorial = null; S.flags.tutorialDone = true; S.phoneRing = 1.2;
  toast('Обучение пропущено', 'info');
  return true;
}

/* ------------------------------------------------------------------ */
/* 28. Мир, цикл и запуск                                               */
/* ------------------------------------------------------------------ */
function resetWorld(fresh) {
  S.player = newPlayer(); S.bike = newBike();
  S.heat = 0; S.fx.length = 0; S.npcs.length = 0; S.guards.length = 0;
  S.mission = null; S.missionIndex = 0; S.missionsDone = []; S.free = false; S.freeCount = 0;
  S.partner = { cooldown: 0, eta: 0, active: 0, forgot: false }; S.partnerBonus = false;
  S.clock = START_HOUR * 3600; S.day = 1; S.ended = null; S.phoneRing = 0; S.autosave = 0;
  S.stats = { earned: 0, crashes: 0, fixed: 0, sober: 0, bestQ: 0, fines: 0, dist: 0 };
  S.flags = {}; S.upgrades = {}; S.phone = { calls: {} };
  S.egg = { stage: 'none', ring: 0, burnt: 0 };
  spawnTraffic(); spawnDogs(); spawnHools(); spawnGrans(); spawnPeds();
  for (const p of POLES) p.installed = false;
  for (const k of KIOSKS) k.broken = false;
  for (const p of PROPS) p.broken = false;
  hudToolSig = '';
  S.cam.tx = S.player.x; S.cam.tz = S.player.z; S.cam.x = S.player.x; S.cam.z = S.player.z + 5; S.cam.y = 3;
  if (fresh) S.tutorial = null;
}
/* Развод у конторы. Смена начинается не с пустого двора, а с того, что вся
   бригада стоит вместе, Ваня делит объекты, а дальше все расходятся — и
   переспрашивать, по девизу, никто уже не будет. */
const BRIEF = {
  oleg:   { x: 12.0, z: 51.4, yaw: 0 },
  vanya:  { x: 12.2, z: 54.8, yaw: Math.PI },
  kostya: { x: 14.4, z: 53.9, yaw: Math.PI * 0.86 },
  sanya:  { x: 9.9,  z: 54.0, yaw: Math.PI * 1.16 },
  bike:   { x: 15.6, z: 53.4, yaw: 0.62 }
};
function spawnBrigade() {
  const p = S.player, b = BRIEF;
  p.x = b.oleg.x; p.z = b.oleg.z; p.yaw = b.oleg.yaw; p.vx = p.vz = 0;
  S.bike.x = b.bike.x; S.bike.z = b.bike.z; S.bike.yaw = b.bike.yaw; S.bike.parked = true;
  for (const k of ['vanya', 'kostya', 'sanya'])
    S.npcs.push({ kind: k, who: k, x: b[k].x, z: b[k].z, yaw: b[k].yaw, vx: 0, vz: 0,
      phase: 0, say: 0, line: '', gait: k, seed: Math.random(), brief: 1, leave: 0,
      time: 0, sp: 0, acc: 0, act: '', actK: 0, idle: 0, idleP: 1, lkY: 0, lkP: 0 });
  /* камера сразу за спиной Олега, чтобы бригада была в кадре с первого кадра */
  S.cam.yaw = p.yaw + Math.PI; S.cam.pitch = 0.24; S.cam.dist = 6.0; S.cam.manual = 0;
  S.cam.tx = p.x; S.cam.tz = p.z; S.cam.ty = 1.35;
  S.cam.x = p.x - Math.sin(p.yaw) * 6; S.cam.z = p.z - Math.cos(p.yaw) * 6; S.cam.y = 3;
}
function briefingScene(after) {
  Dlg.seq([
    { who: 'vanya',  text: 'Так, бригада. Пять вечера, объектов больше, чем нас, велосипед один. Слушаем один раз.' },
    { who: 'vanya',  text: 'Костя — на дальние точки. Ставишь и не переставляешь. Саня — на телефоне и на подстраховке. Олег — всё остальное.' },
    { who: 'oleg',   text: 'А почему опять всё остальное?' },
    { who: 'vanya',  text: 'Потому что ты единственный, кто доезжает.' },
    { who: 'kostya', text: 'Понял, не дурак. Был бы дурак — не понял.' },
    { who: 'sanya',  text: 'Я на связи. Если что — приеду. Может быть.' },
    { who: 'vanya',  text: 'И чтобы потом никто не переспрашивал. ' + MOTTO },
    { who: 'kostya', text: 'Вот именно. Я поехал, мне ещё на два адреса.' },
    { who: 'sanya',  text: 'Олег, если Костя где-то был — проверь за ним. По-доброму говорю.' },
    { who: 'oleg',   text: 'Проверю. Как всегда за всеми проверяю.' },
    { who: 'vanya',  text: 'Тамара скинет заявку. Велосипед твой у стены. Работаем.' }
  ], () => {
    const go = (k, yaw, t) => { const n = S.npcs.find(o => o.brief && o.kind === k); if (n) { n.yaw = yaw; n.leave = t; } };
    go('kostya', Math.PI * 0.5, 8);       /* Костя уезжает первым — он всегда первым */
    go('sanya', Math.PI * 1.45, 9);
    go('vanya', Math.PI * 0.02, 11);
    if (after) after();
  });
}
function startNewGame(withTutorial) {
  Mini.close(); Dlg.closeAll(); resetWorld(true); closeSheet();
  S.screen = 'play'; Audio2.init(); Audio2.resume();
  spawnBrigade();
  if (withTutorial) {
    S.tutorial = { step: 0, moved: 0, sprint: 0, rode: 0, braked: false, mapOpened: false, wait: 0, looked: 0, turned: 0 };
    briefingScene(() => toast('Обучение: ' + TUTORIAL[0].text, 'info', 3000));
  } else briefingScene(() => { S.phoneRing = 1.5; });
  saveGame(true);
}
function updatePrompt() {
  const it = currentInteraction(), el = $('prompt');
  if (it && !Dlg.open) { el.style.display = 'block'; $('promptText').innerHTML = '<b>E</b> — ' + it.label; }
  else el.style.display = 'none';
}
function updateFx(dt) {
  for (let i = S.fx.length - 1; i >= 0; i--) {
    const f = S.fx[i];
    f.life -= dt;
    if (f.life <= 0) { S.fx.splice(i, 1); continue; }
    f.x += f.vx * dt; f.y += f.vy * dt; f.z += f.vz * dt;
    if (f.kind !== 'text') { f.vx *= Math.exp(-2.6 * dt); f.vz *= Math.exp(-2.6 * dt); f.vy -= 7 * dt; }
  }
}
function updateWorld(dt) {
  const p = S.player;
  S.clock += dt * (86400 / DAY_LEN);
  if (S.clock >= 86400) { S.clock -= 86400; S.day++; toast('Новый день. День ' + S.day, 'info', 2200); }
  p.invuln = Math.max(0, p.invuln - dt); p.hurt = Math.max(0, p.hurt - dt);
  p.swing = Math.max(0, p.swing - dt); p.swingCd = Math.max(0, p.swingCd - dt);
  /* Олег у объекта заявки не стоит столбом, а ковыряется отвёрткой */
  tickAct(p, dt, !p.onBike && S.mission && S.mission.stage === 'work' && Math.hypot(p.vx, p.vz) < 0.4
    && dist2(p.x, p.z, S.mission.def.site.x, S.mission.def.site.z) < 16 ? 'work' : '');
  const wasDrunk = p.drunk;
  p.drunk = clamp(p.drunk - BAL.soberRate * dt, 0, 100);
  if (wasDrunk > 0 && p.drunk <= 0) toast('Голова прояснилась. Работать можно', 'good', 2400);
  if (p.drunk > 60 && Math.random() < 0.35 * dt) floater(p.x, 2.2, p.z, pick(['…', 'Оп', 'Куда руль?']), '#8a2be2');
  /* Бубнит себе под нос, стоя на месте. Чем пьянее, тем чаще и тем убеждённее
     он не пьёт. */
  p.say = Math.max(0, p.say - dt);
  if (p.say <= 0 && !Dlg.open && !p.onBike &&
      Math.random() < (0.09 + p.drunk * 0.002) * dt) {
    p.say = 3.4; p.line = pick(CREW_LINES.oleg);
  }
  if (p.drunk > 45) addHeat(0.5 * dt);            /* внимание района растёт само, молча */
  if (p.onBike) moveBike(dt); else movePlayerOnFoot(dt);
  updateCars(dt); updateDogs(dt); updateHools(dt); updatePeds(dt); updatePartner(dt); updateHeat(dt);
  updateGrans(dt);
  updateMission(dt);
  if (!S.mission && S.phoneRing > 0 && !Dlg.open) { S.phoneRing -= dt; if (S.phoneRing <= 0) offerMission(S.missionIndex); }
  /* Личная история: если заявки нет и Олег просто ходит, Ваня звонит сам. */
  if (!S.flags.aznetDone && S.egg.stage === 'none' && !S.mission && !Dlg.open) {
    S.egg.ring += dt;
    if (S.egg.ring > 70) eggRing();
  }
  S.autosave += dt;
  if (S.autosave > 20) { S.autosave = 0; saveGame(true); }
  if (S.tutorial && !S.tutorial.done) updateTutorial(dt);
  updatePrompt();
}
function handleKeys() {
  if (Input.anyHit(K.pause)) {
    if (Dlg.open && Dlg.opts) { }
    else if (S.screen === 'menu' || S.screen === 'win' || S.screen === 'lose') { }
    else if (S.screen === 'pause') resumeFromPause();
    else if ($('screens').classList.contains('show')) closeSheet();
    else if (Input.locked) exitLock();
    else if (S.screen === 'play' || S.screen === 'mini') screenPause();
    Audio2.click();
    return;
  }
  if (Dlg.open) return;
  if (S.screen === 'map' && Input.anyHit(K.map)) { closeSheet(); return; }
  if (S.screen === 'journal' && Input.anyHit(K.phone)) { closeSheet(); return; }
  if (S.screen === 'phone') {
    if (Input.anyHit(K.myphone)) { closeSheet(); return; }
    /* цифрами звоним по порядку из книжки — как на кнопочном */
    const book = PHONE.book('oleg');
    for (let i = 0; i < book.length && i < 9; i++)
      if (Input.pressed('Digit' + (i + 1))) { callContact(book[i]); return; }
    return;
  }
  if (S.screen !== 'play') return;
  if (Input.anyHit(K.map)) { screenMap(); return; }
  if (Input.anyHit(K.phone)) { screenJournal(); return; }
  if (Input.anyHit(K.myphone)) { screenPhone(); return; }
  if (Input.anyHit(K.radio)) { toast('Радио: ' + Audio2.nextStation(), 'info', 1600); Radio.timer = 0; }
  if (Input.anyHit(K.partner)) callPartner();
  if (Input.anyHit(K.act)) handleAction();
  if (Input.anyHit(K.tool)) useTool();
  for (let i = 0; i < 8; i++) if (Input.pressed('Digit' + (i + 1)) && S.player.tools[i]) { S.player.tool = i; hudToolSig = ''; Audio2.click(); }
}
function resizeAll() {
  resizeGL(); resizeHud2();
  if (Mini.g) Mini.resize();
}
let lastTs = 0, crashed = false, hardErrors = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  if (crashed) return;
  Perf.frameTs(ts);
  const dt = clamp((ts - lastTs) / 1000, 0, 0.05);
  lastTs = ts;
  try { step(dt || 0.016); Perf.tick(ts); Perf.readout(ts); } catch (e) { fatal(e, true); }
}
function step(dt) {
  S.t += dt;
  Dlg.update(dt);
  updateRadio(dt);
  if (S.screen === 'play' && !Dlg.open) updateWorld(dt);
  else if (S.screen === 'mini' && !Dlg.open) Mini.update(dt);
  else if (Dlg.open) $('prompt').style.display = 'none';
  updateFx(dt);
  updateCamera(dt);
  renderFrame();
  if (S.screen === 'mini' || Mini.g) Mini.draw();
  updateHud();
  handleKeys();
  Input.endFrame();
}
function fatal(err, hard) {
  const msg = (err && (err.stack || err.message)) || String(err);
  if (hard) { hardErrors++; if (hardErrors > 40) crashed = true; }
  $('errtext').textContent = msg + (crashed ? '\n\nИгра остановлена. Перезапусти — сохранение обычно цело.' : '\n\nИгра продолжает работать.');
  $('errbox').style.display = 'block';
  if (!$('errRestart')) {
    const wrap = document.createElement('div');
    wrap.style.marginTop = '10px';
    const b = document.createElement('button');
    b.id = 'errRestart'; b.className = 'btn sm y'; b.textContent = 'Перезапустить игру';
    b.addEventListener('click', () => location.reload());
    const h = document.createElement('button');
    h.className = 'btn sm'; h.textContent = 'Скрыть'; h.style.marginLeft = '8px';
    h.addEventListener('click', () => { $('errbox').style.display = 'none'; });
    wrap.appendChild(b); wrap.appendChild(h);
    $('errbox').appendChild(wrap);
  }
  try { console.error('[Монтаж-Сити 3D]', err); } catch (e) { }
}
/* Заставка загрузки. Генерация текстур и сборка района идут порциями между
   кадрами: полоса прогресса перерисовывается, вкладка не «зависает». */
const Loader = {
  show(title) { $('loadTitle').textContent = title; $('loading').style.display = 'flex'; this.set('', 0); },
  set(text, frac) {
    if (text !== undefined && text !== null) $('loadStep').textContent = text;
    if (frac !== undefined) $('loadBar').firstElementChild.style.width = Math.round(clamp(frac, 0, 1) * 100) + '%';
  },
  hide() { $('loading').style.display = 'none'; },
  /* Отдать кадр браузеру, чтобы полоса перерисовалась. В скрытой вкладке
     rAF не приходит, а таймеры зажаты до секунды — там не ждём вовсе и
     собираем всё подряд, как раньше: прогресс показывать некому. */
  yield() {
    if (document.hidden) return Promise.resolve();
    return new Promise(res => {
      let done = false;
      const go = () => { if (!done) { done = true; res(); } };
      requestAnimationFrame(go); setTimeout(go, 60);
    });
  }
};
async function boot() {
  try {
    loadOpts();
    const gl = initRenderer($('gl'));
    if (!S.quality) S.quality = QCFG.pickDefault(GL.renderer, window.devicePixelRatio || 1);
    applyProfile(S.quality, false);
    initHud2();
    resizeAll();
    Loader.set('генерируем текстуры', 0);
    await buildTexturesAsync(gl, (f, job) => Loader.set(job ? 'генерируем текстуры · ' + job : null, f * 0.55));
    Loader.set('строим район', 0.57); await Loader.yield();
    buildSolids();
    buildWorld(gl);
    Loader.set('рисуем вывески', 0.72); await Loader.yield();
    await buildSignsAsync(gl, (f, job) => Loader.set(job ? 'рисуем вывески · ' + job : null, 0.72 + f * 0.10));
    Loader.set('собираем жителей и технику', 0.84); await Loader.yield();
    buildCharacters(gl);
    buildVehicles(gl);
    /* Окружение собираем целиком один раз при загрузке: по грани за кадр оно
       набралось бы только к шестому кадру, и первый кадр смены был бы без
       неба и без рассеянного света. */
    Env.update(12);
    EnvMap.dirty = true; EnvMap.job = 0;
    EnvMap.update(gl, true);
    Loader.set(null, 1);
    Input.init();
    resetWorld(true);
    saveOpts();                        /* закрепить профиль, выбранный по умолчанию */
    window.addEventListener('resize', resizeAll);
    window.addEventListener('orientationchange', () => setTimeout(resizeAll, 300));
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) { if (S.screen === 'play') saveGame(true); }
      else lastTs = performance.now();
    });
    window.addEventListener('beforeunload', () => { if (S.screen === 'play' && !S.ended) saveGame(true); });
    window.addEventListener('error', e => fatal(e.error || e.message, false));
    window.addEventListener('unhandledrejection', e => fatal(e.reason || 'unhandled rejection', false));
    const kick = () => { Audio2.init(); Audio2.resume(); };
    window.addEventListener('pointerdown', kick);
    window.addEventListener('keydown', kick);
    /* Крючок только для оснастки: tools/sky-test.mjs сверяет GLSL-модель неба
       с её JS-двойником, а для этого ему нужны обе. Ставится исключительно
       при запуске с ?mc3d-test — при обычном открытии из file:// в window
       по-прежнему не торчит ничего. */
    if (location.search.indexOf('mc3d-test') >= 0) window.__MC3D = { QCFG, SkyJS, Env, EnvMap, GL, R3, GLSL_SKY, Perf, S };
    Loader.hide();
    screenMenu();
    requestAnimationFrame(frame);
  } catch (e) {
    $('loading').innerHTML = '<div style="max-width:640px;text-align:center;font:600 14px/1.5 var(--ui);color:#f7ecff;text-transform:none;letter-spacing:0">' +
      '<b style="display:block;font:900 20px var(--head);color:#ff2d95;margin-bottom:10px">Не удалось запустить 3D</b>' +
      (e && e.message ? String(e.message) : String(e)) +
      '<br><br>Нужен браузер с WebGL2 и аппаратным ускорением (актуальный Chrome). Проверь chrome://gpu.</div>';
    try { console.error(e); } catch (er) { }
  }
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

})();
</script>
