const SCRATCH = []; for (let i = 0; i < 8; i++) SCRATCH.push(m4());
/* --- поза ---------------------------------------------------------------
   o: {x,y,z,yaw,phase,speed,sit,lean,roll,down,armL,armR,
       headYaw,headPitch,headRoll,scale,tint,
       gait  — ключ GAITS: характер походки (по умолчанию 'norm'),
       time  — непрерывное время персонажа (по умолчанию S.t): дыхание и жесты,
       seed  — личный сдвиг фаз 0..1, чтобы двор не дышал строем,
       acc   — продольное ускорение, м/с²: наклон при разгоне и торможении,
       drunk — 0..1 хмель: сбитый такт, крен, разножка,
       idle  — номер холостого жеста, idleP — его прогресс 0..1,
       act   — 'swing'|'work'|'talk'|'climb'|'hold'|'scare',
       actK  — прогресс 0..1 (swing, scare) или вес слоя 0..1 (остальные)}
   Все новые поля необязательны: без них поза считается как раньше.        */
function poseCharacter(o) {
  const g = GAIT(o.gait);
  const yaw = o.yaw || 0, sp = clamp(o.speed || 0, 0, 1);
  const t = o.time === undefined ? S.t : o.time, sd = (o.seed || 0) * TAU;
  const dr = clamp(o.drunk || 0, 0, 1), down = clamp(o.down || 0, 0, 1);
  const rest = (1 - clamp(sp * 1.8, 0, 1)) * (1 - down);   /* «стоит спокойно» */
  const rn = clamp((sp - 0.55) / 0.45, 0, 1);              /* доля бега в походке */
  const ph = (o.phase || 0) + dr * Math.sin(t * 0.8 + sd) * 0.5;   /* хмель сбивает такт */

  /* --- слои действий: вес и собственные фазы --- */
  const act = o.act || '', ak = clamp(o.actK || 0, 0, 1);
  const work = act === 'work' ? ak : 0, talk = act === 'talk' ? ak : 0;
  const climb = act === 'climb' ? ak : 0, hold = act === 'hold' ? ak : 0;
  const fear = act === 'scare' ? Math.sin(Math.PI * ak) : 0;

  /* --- покой: дыхание, перенос веса, холостой жест --- */
  const br = Math.sin(t * 1.15 + sd) * rest;                       /* вдох-выдох, ~5.5 с */
  const wgt = Math.sin(t * 0.52 + sd * 1.7) * rest;                /* вес: − левая нога, + правая */
  const iN = o.idle || 0, iu = o.idleP === undefined ? 1 : clamp(o.idleP, 0, 1);
  const ik = iu < 1 ? Math.sin(Math.PI * iu) * rest : 0;           /* колокол жеста */

  /* --- корпус --- */
  const twist = Math.sin(ph) * (0.10 + rn * 0.10) * sp;            /* плечи против таза */
  const lean = (o.lean || 0) + sp * g.lean + rn * 0.16
    + clamp((o.acc || 0) * 0.045, -0.12, 0.18)                     /* разгон вперёд, торможение назад */
    + work * 0.20 + climb * 0.06 + talk * 0.04 - fear * 0.30;
  const bob = Math.sin(ph * 2) * g.bob * (1 + rn * 1.4) * sp
    + Math.max(0, Math.sin(ph * 2)) * 0.055 * rn                   /* фаза полёта на бегу */
    + br * 0.009 - g.duck * sp - work * 0.05 - fear * 0.05;
  const roll = Math.sin(ph) * g.roll * sp + wgt * 0.026 + (o.roll || 0)
    + dr * (Math.sin(t * 1.7 + sd) * 0.10 + Math.sin(t * 0.63) * 0.05);
  const root = m4compose(SCRATCH[0], o.x, (o.y || 0) + (o.sit ? RIG.sit : RIG.root) + bob - down * 0.78,
    o.z, down * 1.4, yaw, roll, o.scale || 1);
  const T = (out, parent, dx, dy, dz, rx, ry, rz) =>
    m4mul(out, parent, m4compose(SCRATCH[7], dx, dy, dz, rx || 0, ry || 0, rz || 0, 1));

  /* таз уходит к опорной ноге, проседает на свободной и крутится против плеч */
  const hipX = wgt * 0.022 + Math.sin(ph) * g.sway * 0.09 * sp;
  const swayZ = o.sit ? Math.sin(ph * 1.4) * 0.05 * sp : 0;        /* качание в седле */
  T(BONES[BONE.HIP], root, hipX, -Math.abs(wgt) * 0.012, 0, 0, -twist * 0.55, 0);
  T(BONES[BONE.SPINE], BONES[BONE.HIP], 0, RIG.spine, 0,
    lean * 0.42 - br * 0.012, twist * 0.35, -hipX * 0.6 + swayZ * 0.4);
  T(BONES[BONE.CHEST], BONES[BONE.SPINE], 0, RIG.chest, 0,
    lean * 0.58 - br * 0.030 + work * 0.10,
    twist + Math.sin(t * 1.9 + sd) * 0.07 * talk,
    swayZ + Math.sin(t * 1.3 + sd) * 0.05 * talk);

  /* голова: гасит наклон корпуса, доворачивается к цели, кивает в разговоре */
  const headP = -lean * 0.7 + (o.headPitch || 0) + work * 0.34 - climb * 0.20 - down * 0.55
    + Math.sin(t * 2.6 + sd) * 0.10 * talk + dr * Math.sin(t * 0.9 + sd) * 0.10
    + ik * (iN === 0 ? 0.34 : iN === 1 ? -0.12 : iN === 2 ? 0.18 : 0.05);
  const headY = (o.headYaw || 0) - twist * 0.5 + Math.sin(t * 0.37 + sd * 2.1) * 0.09 * rest
    + ik * (iN === 1 ? 0.45 : iN === 2 ? -0.28 : 0.10);
  const headR = (o.headRoll || 0) + Math.sin(ph) * 0.02 * sp + dr * Math.sin(t * 1.3 + sd) * 0.12
    + ik * (iN === 1 ? Math.sin(iu * TAU) * 0.38 : 0);
  T(BONES[BONE.HEAD], BONES[BONE.CHEST], 0, RIG.neck, 0, headP, headY, headR);
  T(BONES[BONE.CAP], BONES[BONE.HEAD], 0, 0, 0, 0, 0, 0);

  const amp = 0.15 + sp * g.arm, lamp = 0.15 + sp * g.amp;
  const swing = Math.sin(ph) * lamp, swing2 = Math.sin(ph + Math.PI) * lamp;
  const SX = RIG.shoulder[0], SY = RIG.shoulder[1];
  if (o.sit) {                          /* поза на велосипеде: руки на руле */
    const jolt = Math.sin(t * 11 + sd) * 0.02 * sp;                /* дорога отдаёт в локти */
    for (const [u, d, h, sx, rz] of [[BONE.ARMLU, BONE.ARMLD, BONE.HANDL, -SX, 0.16],
                                     [BONE.ARMRU, BONE.ARMRD, BONE.HANDR, SX, -0.16]]) {
      T(BONES[u], BONES[BONE.CHEST], sx, SY, 0.02, -1.02 - (o.lean || 0) * 0.12 + jolt, 0, rz);
      T(BONES[d], BONES[u], 0, -RIG.upperArm, 0, -0.40 - jolt * 2, 0, 0);
      T(BONES[h], BONES[d], 0, -RIG.foreArm, 0, 0.55, 0, 0);
    }
    const pedal = ph * 1.4;
    for (const [u, d, f, off, side] of [[BONE.LEGLU, BONE.LEGLD, BONE.FOOTL, 0, -1],
                                        [BONE.LEGRU, BONE.LEGRD, BONE.FOOTR, Math.PI, 1]]) {
      const th = -1.12 + Math.sin(pedal + off) * (0.42 + sp * 0.16);
      const kn = 1.05 - Math.sin(pedal + off) * (0.38 + sp * 0.16);
      T(BONES[u], BONES[BONE.HIP], side * RIG.hip[0], RIG.hip[1], 0.03, th, 0, side * 0.04);
      T(BONES[d], BONES[u], 0, -RIG.thigh, 0, kn, 0, 0);
      T(BONES[f], BONES[d], 0, -RIG.shin, 0, clamp(-(th + kn) * 0.7, -0.5, 0.7), 0, 0);
    }
  } else {
    /* базовый мах: на бегу локоть закрывается, руки идут выше */
    let sL = swing2 * (g.arm / g.amp), sR = swing * (g.arm / g.amp);
    let eL = -0.24 - Math.abs(sL) * g.elbow - rn * 0.75, eR = -0.24 - Math.abs(sR) * g.elbow - rn * 0.75;
    /* Разведение рук от корпуса. Знак важен: для левой руки (плечо на -X)
       положительный поворот по Z уводит кисть внутрь тела — а раньше именно
       так и было, поэтому на ходу руки тонули в жилете тем глубже, чем
       быстрее шёл персонаж. */
    let zL = -(0.155 + sp * 0.075 + g.splay + dr * 0.22) + br * 0.02;
    let zR =  (0.155 + sp * 0.075 + g.splay + dr * 0.22) - br * 0.02;
    let hL = -0.06, hR = -0.06, yL = 0, yR = 0;
    /* холостые движения */
    if (ik > 0.001) {
      if (iN === 0) {                    /* глянуть на часы */
        sL = lerp(sL, -0.85, ik); eL = lerp(eL, -1.75, ik); zL = lerp(zL, -0.22, ik); hL = lerp(hL, 0.25, ik);
      } else if (iN === 1) {             /* размять шею: ладонь к затылку */
        sR = lerp(sR, -2.05, ik); eR = lerp(eR, -1.95, ik); zR = lerp(zR, -0.45, ik);
      } else if (iN === 2) {             /* поправить сумку */
        sR = lerp(sR, 0.20, ik); eR = lerp(eR, -1.35, ik); zR = lerp(zR, -0.30, ik);
      }
    }
    /* работа отвёрткой: обе руки перед грудью, правая крутит кистью */
    if (work > 0) {
      const w = Math.sin(t * 7.5);
      sL = lerp(sL, -1.02, work); eL = lerp(eL, -1.55, work); zL = lerp(zL, -0.30, work);
      sR = lerp(sR, -1.10 + w * 0.05, work); eR = lerp(eR, -1.45 - Math.max(0, w) * 0.12, work);
      zR = lerp(zR, 0.24, work); yR = lerp(yR, w * 0.9, work); hR = lerp(hR, 0.15, work);
    }
    /* разговор: правая объясняет, левая вступает через раз */
    if (talk > 0) {
      const q = t * 2.3 + sd, q2 = Math.max(0, Math.sin(q * 0.5 - 1));
      sR = lerp(sR, -0.62 - Math.sin(q) * 0.30, talk); eR = lerp(eR, -1.15 + Math.sin(q * 1.7) * 0.35, talk);
      zR = lerp(zR, -0.34 - Math.sin(q * 0.7) * 0.14, talk); yR = lerp(yR, Math.sin(q * 2.1) * 0.45, talk);
      sL = lerp(sL, -0.45 * q2, talk); eL = lerp(eL, -0.90 - q2 * 0.50, talk); zL = lerp(zL, 0.30, talk);
    }
    /* подъём по лестнице: руки и ноги крест-накрест по перекладинам */
    if (climb > 0) {
      const c = t * 2.4 + sd;
      sL = lerp(sL, -2.15 + Math.sin(c) * 0.55, climb); eL = lerp(eL, -0.55 - Math.max(0, Math.sin(c)) * 0.55, climb); zL = lerp(zL, 0.10, climb);
      sR = lerp(sR, -2.15 - Math.sin(c) * 0.55, climb); eR = lerp(eR, -0.55 - Math.max(0, -Math.sin(c)) * 0.55, climb); zR = lerp(zR, -0.10, climb);
    }
    if (hold > 0) {                      /* держит стремянку */
      sL = lerp(sL, -1.45, hold); eL = lerp(eL, -0.35, hold); zL = lerp(zL, 0.18, hold);
      sR = lerp(sR, -1.45, hold); eR = lerp(eR, -0.35, hold); zR = lerp(zR, -0.18, hold);
    }
    if (fear > 0) {                      /* испуг: плечи вверх, руки к груди */
      sL = lerp(sL, -0.95, fear); eL = lerp(eL, -1.85, fear); zL = lerp(zL, 0.42, fear);
      sR = lerp(sR, -0.95, fear); eR = lerp(eR, -1.85, fear); zR = lerp(zR, -0.42, fear);
    }
    /* замах сумкой: 0..0.35 — отвод назад, дальше бросок вперёд */
    if (act === 'swing') {
      const back = clamp(ak / 0.35, 0, 1), f = clamp((ak - 0.35) / 0.40, 0, 1);
      const e3 = f * f * (3 - 2 * f);                               /* мягкий разгон удара */
      sR = 0.95 * back * (1 - e3) - 1.70 * e3;
      eR = -0.30 - 0.90 * back * (1 - e3) - 0.15 * e3;
      zR = -0.34 + 0.22 * e3; yR = 0;
    }
    if (down > 0) {                      /* упал: руки разлетаются */
      sL = lerp(sL, -1.15, down); eL = lerp(eL, -0.55, down); zL = lerp(zL, 0.75, down);
      sR = lerp(sR, -1.15, down); eR = lerp(eR, -0.55, down); zR = lerp(zR, -0.75, down);
    }
    /* явные armL/armR (старые вызовы) перекрывают всё */
    if (o.armL !== undefined) { sL = o.armL; eL = -0.24 - Math.abs(o.armL) * g.elbow; }
    if (o.armR !== undefined) { sR = o.armR; eR = -0.24 - Math.abs(o.armR) * g.elbow; }
    T(BONES[BONE.ARMLU], BONES[BONE.CHEST], -SX, SY, 0, sL, 0, zL);
    T(BONES[BONE.ARMLD], BONES[BONE.ARMLU], 0, -RIG.upperArm, 0, eL, yL, 0);
    T(BONES[BONE.HANDL], BONES[BONE.ARMLD], 0, -RIG.foreArm, 0, hL, 0, 0);
    T(BONES[BONE.ARMRU], BONES[BONE.CHEST], SX, SY, 0, sR, 0, zR);
    T(BONES[BONE.ARMRD], BONES[BONE.ARMRU], 0, -RIG.upperArm, 0, eR, yR, 0);
    T(BONES[BONE.HANDR], BONES[BONE.ARMRD], 0, -RIG.foreArm, 0, hR, 0, 0);

    for (const [u, d, f, off, side] of [[BONE.LEGLU, BONE.LEGLD, BONE.FOOTL, 0, -1],
                                        [BONE.LEGRU, BONE.LEGRD, BONE.FOOTR, Math.PI, 1]]) {
      const fi = ph + off, s = Math.sin(fi) * lamp;      /* + нога сзади, − впереди */
      const sf = Math.max(0, Math.sin(fi)), sb = Math.max(0, -Math.sin(fi));
      /* колено гнётся в середине маха и распрямляется к касанию пятки */
      const knee = Math.max(0, -Math.cos(fi)) * (0.55 + sp * g.knee + rn * 0.55)
        + sf * 0.10 * sp + sp * 0.06
        + Math.max(0, side * wgt) * 0.10                 /* свободная нога в покое чуть согнута */
        + climb * (0.95 + Math.sin(fi) * 0.35) + work * 0.10 + fear * 0.18 + down * 0.65;
      const hipA = s - g.duck * sp * 0.3 + climb * (-0.85 + Math.sin(fi) * 0.35)
        + Math.max(0, side * wgt) * 0.06 + down * 0.35 + fear * 0.10
        + (iN === 3 ? ik * side * 0.18 : 0);             /* переступил с ноги на ногу */
      T(BONES[u], BONES[BONE.HIP], side * RIG.hip[0], RIG.hip[1], 0,
        hipA, 0, side * (g.splay * 0.6 + dr * 0.10 + down * 0.25));
      T(BONES[d], BONES[u], 0, -RIG.thigh, 0, knee, 0, 0);
      /* перекат: пятка первой, отталкивание носком, в воздухе носок вверх */
      const toe = sf * sf * (0.45 + rn * 0.35) * g.toe * sp, heel = sb * sb * 0.26 * sp;
      T(BONES[f], BONES[d], 0, -RIG.shin, 0,
        clamp(-(hipA + knee) * 0.88 + toe - heel, -0.55, 0.85), 0, 0);
    }
  }
  /* сумка: качается в такт шагу, а в замахе она уже в правой руке */
  if (act === 'swing')
    m4mul(BONES[BONE.ACC], BONES[BONE.HANDR], m4compose(SCRATCH[7], 0, -0.30, 0.02, 0.25, 0, 0, 1));
  else {
    const bg = Math.sin(ph) * 0.05 * sp + (iN === 2 ? ik * 0.16 : 0);
    T(BONES[BONE.ACC], BONES[BONE.HIP], 0.300, -0.06, -0.020, 0.05 + bg, 0, 0.06 - bg * 0.35);
  }
  for (let i = 0; i < NBONE; i++) BONEBUF.set(BONES[i], i * 16);
}

function drawCharacter(mesh, o) {
  const gl = GL.gl, P = R3.main;
  const s0 = o.scale;                    /* рост живёт в палитре: Ваня невысокий */
  if (s0 === undefined && mesh.pal && mesh.pal.scale) o.scale = mesh.pal.scale;
  poseCharacter(o);
  gl.uniformMatrix4fv(P.u.uBones, false, BONEBUF);
  drawMesh(mesh.gpu, TX.cloth || TX.white, BONES[0], { skin: true, tint: o.tint });
  o.scale = s0;
}

      [1.62, 0.98], [1.30, 1.02],

    body: [
      [-2.20, 0.28], [-2.05, 0.20], [-0.70, 0.18], [0.70, 0.18], [2.00, 0.20], [2.12, 0.30],

    ],

function buildCar(gl, spec) {
  const body = new Mesh();                 /* «длиной по X», развернём в конце */
  const PAINT = [1, 1, 1];                 /* красится оттенком при отрисовке */
  const DARK = [.18, .18, .21], CHROME = [.72, .74, .80], GLASS = [.16, .21, .30];
  const hw = spec.hw, gw = spec.gw;
  const sl = (w, tapXY) => [
    { z: -w, sx: tapXY[0], sy: tapXY[1] }, { z: -w * 0.9, sx: 1, sy: 1 },
    { z: w * 0.9, sx: 1, sy: 1 }, { z: w, sx: tapXY[0], sy: tapXY[1] }
  ];
  /* --- корпус --- */
  body.extrudeZ(spec.body, sl(hw, [0.975, 0.955]), PAINT,
    { origin: [0, 0.58], uv: 1.6, gloss: 0.62, part: 0, smooth: 46 });
  /* --- остекление: тёмное стекло, поверх него стойки и крыша --- */
  body.extrudeZ(spec.glass, sl(gw, [0.94, 0.94]), GLASS,
    { origin: [0, 1.05], uv: 1, gloss: 0.95, part: 0, smooth: 30 });
  /* крыша */
  body.bevelBox(spec.roof[0], spec.roof[1] - 0.055, 0, spec.roof[2], 0.06, gw * 2.03, PAINT,
    { bev: 0.022, r: 0.10, cs: 3, part: 0, gloss: 0.6, uv: 1.4 });
  /* стойки по краям остекления */
  {
    const g = spec.glass, n = g.length;
    for (const sz of [-1, 1]) {
      const z = sz * (gw + 0.014);
      for (let i = 1; i < n; i++) {
        const a = g[i], b = g[(i + 1) % n];
        if (a[1] <= g[0][1] + 0.02 && b[1] <= g[0][1] + 0.02) continue;
        /* тонкая наклонная стойка вдоль ребра остекления */
        body.tube([[a[0], a[1], z], [b[0], b[1], z]], 0.035, 6, PAINT, { part: 0, gloss: 0.6 });
      }
      /* центральная стойка */
      if (spec.doors[1] !== null) {
        const yTop = spec.roof[1] - 0.05;
        body.tube([[spec.doors[1], spec.glass[0][1], z], [spec.doors[1] - 0.05, yTop, z]], 0.04, 6, PAINT, { part: 0, gloss: 0.6 });
      }
    }
  }
  /* --- бамперы --- */
  for (const [x, w] of [[spec.body[6][0] - 0.04, 0.26], [spec.body[16][0] + 0.04, 0.24]]) {
    body.bevelBox(x, 0.30, 0, w, 0.30, hw * 2.02, DARK,
      { bev: 0.05, r: 0.08, cs: 2, part: 0, gloss: 0.3, taper: [0.9, 1] });
  }
  /* --- решётка и фары --- */
  const fx = spec.body[7][0];
  body.bevelBox(fx - 0.03, 0.60, 0, 0.10, 0.20, hw * 1.15, DARK,
    { bev: 0.02, r: 0.05, cs: 2, part: 0, gloss: 0.4 });
  for (let i = 0; i < 3; i++)
    body.box(fx + 0.01, 0.63 + i * 0.055, 0, 0.05, 0.022, hw * 1.12, CHROME, { part: 0, gloss: 0.85 });
  for (const sz of [-1, 1]) {
    body.bevelBox(fx - 0.06, 0.62, sz * hw * 0.66, 0.14, 0.17, 0.34, [1, .96, .86],
      { bev: 0.025, r: 0.05, cs: 2, part: 0, gloss: 0.9, emis: 0.35 });
    body.bevelBox(spec.body[16][0] + 0.05, 0.60, sz * hw * 0.66, 0.10, 0.16, 0.30, [1, .26, .2],
      { bev: 0.02, r: 0.04, cs: 2, part: 0, gloss: 0.8, emis: 0.5 });
    /* повторители в бампере */
    body.box(fx - 0.02, 0.40, sz * hw * 0.78, 0.05, 0.07, 0.20, [1, .62, .18], { part: 0, gloss: 0.7, emis: 0.25 });
  }
  /* номерные знаки */
  body.box(fx - 0.05, 0.42, 0, 0.03, 0.11, 0.42, [.88, .89, .86], { part: 0, gloss: 0.4 });
  body.box(spec.body[16][0] + 0.06, 0.44, 0, 0.03, 0.11, 0.42, [.88, .89, .86], { part: 0, gloss: 0.4 });
  /* --- арки колёс --- */
  for (const [ax, ar] of spec.arches) {
    for (const sz of [-1, 1]) {
      const pts = [];
      for (let i = 0; i <= 8; i++) {
        const a = Math.PI * (0.06 + 0.88 * i / 8);
        pts.push([ax + Math.cos(a) * ar, spec.wr + Math.sin(a) * ar, sz * (hw - 0.03)]);
      }
      body.tube(pts, 0.045, 6, PAINT, { part: 0, gloss: 0.5 });
    }
  }
  /* --- двери: расшивка, ручки, зеркала, пороги --- */
  for (const sz of [-1, 1]) {
    const z = sz * (hw + 0.005);
    for (const dx of spec.doors) {
      if (dx === null) continue;
      body.box(dx, 0.55, z, 0.018, 0.62, 0.02, [.12, .12, .14], { part: 0, gloss: 0.2 });
      body.bevelBox(dx - 0.30, 0.78, z - sz * 0.005, 0.20, 0.045, 0.05, CHROME,
        { bev: 0.008, r: 0.015, cs: 2, part: 0, gloss: 0.85 });
    }
    body.box(0.2, 0.24, z - sz * 0.03, 2.2, 0.09, 0.06, DARK, { part: 0, gloss: 0.25 });   /* порог */
    /* зеркало на стойке */
    const mz = spec.glass[1][0];
    body.box(mz - 0.06, spec.glass[0][1] + 0.06, z + sz * 0.06, 0.07, 0.035, 0.10, DARK, { part: 0, gloss: 0.4 });
    body.bevelBox(mz - 0.06, spec.glass[0][1] + 0.02, z + sz * 0.14, 0.10, 0.13, 0.06, PAINT,
      { bev: 0.02, r: 0.02, cs: 2, part: 0, gloss: 0.6 });
  }
  /* --- крышка капота и багажника: расшивка --- */
  body.box(spec.hood[0], spec.hood[1], 0, 1.1, 0.012, hw * 1.7, [.1, .1, .12], { part: 0, gloss: 0.3 });
  if (spec.trunk) body.box(spec.trunk[0], spec.trunk[1], 0, 0.5, 0.012, hw * 1.7, [.1, .1, .12], { part: 0, gloss: 0.3 });
  /* кузов пикапа: борта */
  if (spec.bed) {
    const [bx, by, bl] = spec.bed;
    for (const sz of [-1, 1])
      body.bevelBox(bx, by, sz * (hw - 0.09), bl, 0.34, 0.10, PAINT, { bev: 0.02, r: 0.03, cs: 2, part: 0, gloss: 0.55 });
    body.bevelBox(bx - bl / 2 - 0.05, by, 0, 0.10, 0.34, hw * 1.82, PAINT, { bev: 0.02, r: 0.03, cs: 2, part: 0, gloss: 0.55 });
    body.plate(bx - bl / 2, -(hw - 0.14), bx + bl / 2, hw - 0.14, by + 0.005, [.42, .42, .46], 0.5, 0, false, 0.2);
  }
  /* багажник на крыше у фургона */
  if (spec.tall) {
    for (const sz of [-1, 1])
      body.tube([[spec.roof[0] - 1.3, spec.roof[1] + 0.06, sz * gw * 0.72], [spec.roof[0] + 1.3, spec.roof[1] + 0.06, sz * gw * 0.72]],
        0.028, 6, CHROME, { part: 0, gloss: 0.8 });
    body.box(spec.roof[0], spec.roof[1] + 0.02, 0, 0.10, 0.06, gw * 1.5, CHROME, { part: 0, gloss: 0.8 });
  }
  /* выхлоп */
  body.tube([[spec.body[16][0] + 0.10, 0.26, -hw * 0.55], [spec.body[16][0] - 0.06, 0.26, -hw * 0.55]], 0.035, 6, [.4, .4, .44], { part: 0, gloss: 0.7 });

  body.aoByHeight(QCFG.light.bodyAO.y0, QCFG.light.bodyAO.y1, QCFG.light.bodyAO.k);
  body.rotY(-Math.PI / 2);                 /* нос — в сторону +Z */

  const m = new Mesh();
  m.merge(body, 0, 0, 0);
  for (let i = 0; i < 4; i++)
    m.wheelDetailed(spec.wr, 0.22, 14, [.11, .11, .13], [.70, .72, .78], 1 + i, { spokes: 5, rimR: spec.wr * 0.60, gloss: 0.45 });
  return m.upload(gl);
}

function buildVehicles(gl) {
  /* --- велосипед: 0 рама, 1 переднее колесо, 2 заднее, 3 вилка с рулём --- */
  {
    const m = new Mesh();
    const F = [.86, .20, .26], STEEL = [.62, .64, .70], DARK = [.16, .16, .19];
    const wb = 0.52;                       /* колёса на ±0.52 по Z */
    /* рама: труба по ломаной — верхняя, подседельная, нижняя, перья */
    m.tube([[0, 0.92, 0.30], [0, 0.86, -0.24]], 0.024, 7, F, { gloss: 0.6 });          /* верхняя */
    m.tube([[0, 0.86, -0.24], [0, 0.34, -0.02]], 0.024, 7, F, { gloss: 0.6 });         /* подседельная */
    m.tube([[0, 0.92, 0.30], [0, 0.36, -0.01]], 0.026, 7, F, { gloss: 0.6 });          /* нижняя */
    for (const sx of [-0.055, 0.055]) {
      m.tube([[sx * 0.6, 0.34, -0.02], [sx, 0.34, -wb]], 0.014, 6, F, { gloss: 0.6 }); /* нижние перья */
      m.tube([[0, 0.86, -0.24], [sx, 0.34, -wb]], 0.012, 6, F, { gloss: 0.6 });        /* верхние перья */
    }
    m.cyl(0, 0.30, -0.02, 0.045, 0.08, 10, DARK, { gloss: 0.5 });                      /* каретка */
    /* рулевой узел — отдельная кость 3, координаты от пивота (0, 0.92, 0.30):
       вилка, вынос, руль, грипсы и фара поворачиваются вместе с колесом */
    for (const sx of [-0.055, 0.055])
      m.tube([[sx * 1.1, 0, 0], [sx * 1.1, -0.58, 0.22]], 0.014, 6, STEEL, { gloss: 0.75, part: 3 });
    m.tube([[0, 0, 0], [0, 0.14, 0]], 0.020, 7, STEEL, { gloss: 0.75, part: 3 });
    m.tube([[-0.26, 0.14, 0], [-0.20, 0.14, 0.04], [0.20, 0.14, 0.04], [0.26, 0.14, 0]], 0.017, 7, STEEL, { gloss: 0.75, part: 3 });
    for (const sx of [-1, 1]) m.cyl(sx * 0.235, 0.125, 0, 0.021, 0.03, 8, DARK, { gloss: 0.2, part: 3 });
    m.bevelBox(0, 0.08, 0.08, 0.09, 0.08, 0.10, [1, .93, .68], { bev: 0.015, r: 0.02, cs: 2, emis: 1, gloss: 0.9, part: 3 });
    /* седло и подседельный штырь */
    m.tube([[0, 0.86, -0.24], [0, 1.00, -0.26]], 0.014, 6, STEEL, { gloss: 0.8 });
    m.bevelBox(0, 0.99, -0.28, 0.10, 0.05, 0.30, [.20, .20, .24], { bev: 0.018, r: 0.04, cs: 3, gloss: 0.35, taper: [1.6, 0.8] });
    /* шатуны с педалями и звезда — кость 4, координаты от оси каретки
       (0, 0.30, -0.02). Шатуны противоположны по построению, поэтому одной
       кости хватает, чтобы педали крутились как надо. */
    m.cyl(-0.055, -0.006, 0, 0.092, 0.012, 12, [.55, .56, .62], { gloss: 0.8, part: 4 });
    m.box(-0.075, -0.17, 0, 0.028, 0.17, 0.030, STEEL, { gloss: 0.7, part: 4 });
    m.bevelBox(-0.105, -0.192, 0, 0.09, 0.022, 0.11, DARK, { bev: 0.005, r: 0.01, cs: 1, gloss: 0.3, part: 4 });
    m.box(0.075, 0, 0, 0.028, 0.17, 0.030, STEEL, { gloss: 0.7, part: 4 });
    m.bevelBox(0.105, 0.170, 0, 0.09, 0.022, 0.11, DARK, { bev: 0.005, r: 0.01, cs: 1, gloss: 0.3, part: 4 });
    /* цепь */
    m.tube([[0.02, 0.30, -0.02], [0.02, 0.30, -wb]], 0.010, 5, [.35, .36, .40], { gloss: 0.6 });
    /* багажник, крылья, фара */
    m.box(0, 0.70, -0.50, 0.22, 0.03, 0.34, [.45, .46, .52], { gloss: 0.5 });
    for (const [zc, r] of [[wb, 0.36], [-wb, 0.36]])
      m.tube([[0, r + 0.05, zc - 0.16], [0, r + 0.10, zc], [0, r + 0.05, zc + 0.16]], 0.055, 4, [.30, .31, .36], { gloss: 0.4 });
    /* колёса со спицами */
    for (const part of [1, 2])
      m.wheelDetailed(0.34, 0.045, 16, [.12, .12, .15], [.78, .80, .86], part, { spokes: 8, rimR: 0.29, gloss: 0.5 });
    VEH.bike = m.upload(gl);
  }
  /* --- машины --- */
  VEH.sedan = buildCar(gl, CAR_SPEC.sedan);
  VEH.van = buildCar(gl, CAR_SPEC.van);
  VEH.pickup = buildCar(gl, CAR_SPEC.pickup);
  /* --- дворовая собака: 0 корпус, 1 голова, 2 челюсть, 3/4 передние плечи,
         5/6 задние бёдра, 7 хвост, 8..11 голени тех же лап --- */
  {
    const m = new Mesh();
    const fur = [.62, .46, .3], dfur = [.5, .36, .24];
    m.ellipsoid(0, -0.10, 0, 0.15, 0.16, 0.36, 10, 6, fur, { part: 0, gloss: 0.14 });
    m.ellipsoid(0, -0.08, -0.26, 0.12, 0.13, 0.16, 9, 5, fur, { part: 0, gloss: 0.14 });   /* круп */
    /* голова: координаты от пивота кости 1 (0, 0.02, 0.30) */
    m.ellipsoid(0, 0, -0.26, 0.11, 0.11, 0.14, 9, 5, fur, { part: 1, gloss: 0.14 });
    m.ellipsoid(0, -0.008, -0.145, 0.060, 0.032, 0.088, 8, 4, dfur, { part: 1, gloss: 0.18 });   /* верх морды */
    m.ellipsoid(0, -0.015, -0.065, 0.026, 0.022, 0.02, 6, 3, [.14, .12, .14], { part: 1, gloss: 0.6 });  /* нос */
    for (const sx of [-1, 1]) {
      m.bevelBox(sx * 0.072, 0.08, -0.32, 0.045, 0.10, 0.055, fur, { bev: 0.012, r: 0.012, cs: 2, part: 1, gloss: 0.14 });
      m.ellipsoid(sx * 0.048, 0.028, -0.172, 0.017, 0.016, 0.012, 6, 3, [.1, .1, .12], { part: 1, gloss: 0.75 });
    }
    /* нижняя челюсть: своя кость, пивот в углу пасти (0, 0.005, 0.055) от кости 1 */
    m.ellipsoid(0, -0.015, 0.100, 0.052, 0.026, 0.075, 8, 3, dfur, { part: 2, gloss: 0.18 });
    /* Нога из двух звеньев: плечо (бедро) и голень с лапой. Одним бруском
       нога читалась палкой — сустав нужен, чтобы она подламывалась на ходу.
       Верх толще низа, поэтому бруски идут с расширением кверху. Сумма звеньев
       0.175 + 0.145 = 0.32 — ровно от сустава до земли. */
    const paw = [.42, .32, .22];
    for (const [pt, lb] of [[3, 8], [4, 9], [5, 10], [6, 11]]) {
      const fr = pt < 5;
      m.bevelBox(0, -0.175, 0, fr ? 0.050 : 0.056, 0.175, fr ? 0.056 : 0.062, fur,
        { bev: 0.014, r: 0.014, cs: 2, part: pt, gloss: 0.14, taper: [1.36, fr ? 1.40 : 1.62], skipTop: true });
      m.bevelBox(0, -0.145, 0, fr ? 0.046 : 0.044, 0.145, fr ? 0.052 : 0.050, fur,
        { bev: 0.012, r: 0.012, cs: 2, part: lb, gloss: 0.14, taper: [1.14, 1.18], skipTop: true });
      m.bevelBox(0, -0.145, 0.014, fr ? 0.062 : 0.060, 0.046, fr ? 0.082 : 0.078, paw,
        { bev: 0.010, r: 0.016, cs: 2, part: lb, gloss: 0.2 });
    }
    /* хвост от своего сустава назад-вверх */
    m.tube([[0, 0, 0], [0, 0.10, -0.12], [0.02, 0.20, -0.18]], 0.035, 6, fur, { part: 7, gloss: 0.14 });
    VEH.dog = m.upload(gl);
  }
  /* --- камера видеонаблюдения (ставится на опоры) --- */
  {
    const m = new Mesh();
    const CASE = [.84, .85, .89];
    m.bevelBox(0, -0.055, 0.02, 0.105, 0.11, 0.32, CASE, { bev: 0.018, r: 0.03, cs: 3, gloss: 0.55 });
    m.bevelBox(0, -0.075, -0.16, 0.14, 0.15, 0.10, [.74, .75, .80], { bev: 0.02, r: 0.03, cs: 2, gloss: 0.5 });
    m.cyl(0, 0, 0.185, 0.052, 0.05, 12, [.20, .20, .24], { gloss: 0.6, rTop: 0.048 });
    m.ellipsoid(0, 0.025, 0.215, 0.042, 0.042, 0.03, 10, 5, [.10, .12, .18], { gloss: 0.95 });
    m.box(0, 0.10, 0.16, 0.16, 0.02, 0.22, [.70, .71, .76], { gloss: 0.5 });   /* козырёк */
    m.box(0.0, 0.035, -0.06, 0.035, 0.02, 0.03, [1, .22, .2], { emis: 1, gloss: 0.7 });
    m.tube([[0, -0.06, -0.20], [0, -0.02, -0.30]], 0.012, 5, [.2, .2, .24], { gloss: 0.5 });
    VEH.cam = m.upload(gl);
  }

  /* --- периметральный прибор «АЗИМУТ-НЕТ»: щиток на заборе базы --- */
  {
    const m = new Mesh();
    const BODY = [.80, .82, .78], DOOR = [.70, .72, .68], DARK = [.17, .18, .21];
    m.box(0, -0.28, 0, 0.44, 0.56, 0.18, BODY, { gloss: 0.35 });          /* корпус */
    m.box(0, -0.21, 0.094, 0.34, 0.40, 0.016, DOOR, { gloss: 0.5 });      /* откинутая крышка */
    m.box(0, 0.26, 0, 0.40, 0.04, 0.21, DARK, { gloss: 0.3 });            /* козырёк от дождя */
    m.box(0, -0.06, 0.104, 0.25, 0.06, 0.014, DARK, { gloss: 0.4 });      /* колодка клемм */
    m.box(0, 0.06, 0.104, 0.25, 0.06, 0.014, DARK, { gloss: 0.4 });       /* вторая пара, та самая */
    m.box(-0.14, 0.16, 0.104, 0.035, 0.025, 0.014, [1, .22, .2], { emis: 1, gloss: 0.7 });
    m.tube([[0, -0.28, -0.06], [0, -0.56, -0.06]], 0.014, 5, DARK, { gloss: 0.5 });       /* гофра вниз */
    VEH.aznet = m.upload(gl);
  }
}

function drawVehicle(kind, x, y, z, yaw, wheelPhase, tint, o) {
  const gl = GL.gl, P = R3.main;
  const spec = CAR_SPEC[kind];
  const pit = o ? o.pitch || 0 : 0, rol = o ? o.roll || 0 : 0, st = o ? o.steer || 0 : 0;
  /* кузов клюёт и кренится, колёсам нужна своя ровная база — иначе уедут в асфальт */
  m4compose(SCRATCH[6], x, y, z, 0, yaw, 0, 1);
  m4compose(BONES[0], x, y, z, pit, yaw, rol, 1);
  for (let i = 0; i < 4; i++) {
    const [ox, oz] = spec.wheels[i];
    m4mul(BONES[1 + i], SCRATCH[6], m4compose(SCRATCH[7], ox, spec.wr - y, oz, 0,
      Math.PI / 2 + (i < 2 ? st : 0), -wheelPhase, 1));
  }
  for (let i = 0; i < 5; i++) BONEBUF.set(BONES[i], i * 16);
  gl.uniformMatrix4fv(P.u.uBones, false, BONEBUF);
  drawMesh(VEH[kind], TX.paint, BONES[0], { skin: true, tint });
}
function drawBike(x, y, z, yaw, wheelPhase, lean, steer, crank) {
  const gl = GL.gl, P = R3.main;
  const st = steer || 0;
  m4compose(BONES[0], x, y, z, 0, yaw, lean || 0, 1);
  /* вилка с рулём вращается вокруг рулевой колонки, переднее колесо — её ребёнок */
  m4mul(BONES[3], BONES[0], m4compose(SCRATCH[7], 0, 0.92, 0.30, 0, st, 0, 1));
  m4mul(BONES[1], BONES[3], m4compose(SCRATCH[7], 0, -0.58, 0.22, 0, Math.PI / 2, -wheelPhase, 1));
  m4mul(BONES[2], BONES[0], m4compose(SCRATCH[7], 0, 0.34, -0.52, 0, Math.PI / 2, -wheelPhase, 1));
  /* каретка: шатуны крутятся в такт с ногами всадника */
  m4mul(BONES[4], BONES[0], m4compose(SCRATCH[7], 0, 0.30, -0.02, crank || 0, 0, 0, 1));
  for (let i = 0; i < 5; i++) BONEBUF.set(BONES[i], i * 16);
  gl.uniformMatrix4fv(P.u.uBones, false, BONEBUF);
  drawMesh(VEH.bike, TX.paint, BONES[0], { skin: true });
}

/* 10. Звук: Web Audio, всё синтезируется на лету                       */
/* ------------------------------------------------------------------ */
const Audio2 = {
  ctx: null, master: null, sfxGain: null, musGain: null,
  ready: false, muted: false, sfxVol: 0.6, musVol: 0.35,
  station: 0, _next: 0, _step: 0, _timer: null,

  init() {
    if (this.ready) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      this.master = this.ctx.createGain(); this.master.gain.value = 0.9;
      this.sfxGain = this.ctx.createGain(); this.sfxGain.gain.value = this.sfxVol;
      this.musGain = this.ctx.createGain(); this.musGain.gain.value = this.musVol;
      this.sfxGain.connect(this.master); this.musGain.connect(this.master);
      this.master.connect(this.ctx.destination);
      this.ready = true;
      this._timer = setInterval(() => this._pump(), 90);
    } catch (e) { this.ready = false; this.ctx = null; }
  },
  resume() { if (this.ready && this.ctx && this.ctx.state === 'suspended') this.ctx.resume().catch(() => {}); },
  setSfx(v) { this.sfxVol = v; if (this.ready) this.sfxGain.gain.value = this.muted ? 0 : v; },
  setMus(v) { this.musVol = v; if (this.ready) this.musGain.gain.value = this.muted ? 0 : v; },
  mute(m) { this.muted = m; if (!this.ready) return; this.sfxGain.gain.value = m ? 0 : this.sfxVol; this.musGain.gain.value = m ? 0 : this.musVol; },

  tone(freq, dur, type, vol, slideTo, delay) {
    if (!this.ready || this.muted) return;
    const t0 = this.ctx.currentTime + (delay || 0);
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type || 'square'; o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30, slideTo), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.001, vol || 0.2), t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(this.sfxGain); o.start(t0); o.stop(t0 + dur + 0.03);
  },
  noise(dur, vol, lo, hi, delay) {
    if (!this.ready || this.muted) return;
    const t0 = this.ctx.currentTime + (delay || 0);
    const n = Math.floor(this.ctx.sampleRate * dur);
    const buf = this.ctx.createBuffer(1, Math.max(1, n), this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = this.ctx.createBufferSource(); s.buffer = buf;
    const f = this.ctx.createBiquadFilter(); f.type = 'bandpass';
    f.frequency.value = (lo + hi) / 2; f.Q.value = 0.9;
    const g = this.ctx.createGain(); g.gain.value = vol || 0.2;
    s.connect(f); f.connect(g); g.connect(this.sfxGain); s.start(t0); s.stop(t0 + dur + 0.02);
  },

  click()   { this.tone(680, 0.05, 'square', 0.16); },
  select()  { this.tone(420, 0.05, 'square', 0.13); this.tone(640, 0.06, 'square', 0.11, null, 0.05); },
  ok()      { this.tone(560, 0.08, 'triangle', 0.2); this.tone(760, 0.1, 'triangle', 0.18, null, 0.07); this.tone(980, 0.16, 'triangle', 0.16, null, 0.15); },
  nope()    { this.tone(200, 0.16, 'sawtooth', 0.18, 90); },
  spark()   { this.noise(0.16, 0.3, 1800, 6500); this.tone(1400, 0.07, 'square', 0.12, 300); },
  drill()   { this.noise(0.22, 0.16, 300, 1400); this.tone(120, 0.2, 'sawtooth', 0.1, 180); },
  screwdr() { this.noise(0.14, 0.1, 500, 2200); this.tone(320, 0.12, 'square', 0.07, 420); },
  crash()   { this.noise(0.32, 0.34, 90, 900); this.tone(90, 0.3, 'sawtooth', 0.2, 40); },
  thud()    { this.tone(110, 0.14, 'sine', 0.24, 55); this.noise(0.1, 0.12, 100, 500); },
  bark()    { this.tone(300, 0.09, 'sawtooth', 0.18, 180); this.tone(240, 0.1, 'sawtooth', 0.15, 140, 0.1); },
  cash()    { [880, 1180, 1480].forEach((f, i) => this.tone(f, 0.13, 'triangle', 0.17, null, i * 0.07)); },
  lock()    { this.tone(150, 0.06, 'square', 0.22); this.tone(900, 0.05, 'square', 0.12, null, 0.06); },
  bell()    { this.tone(1240, 0.4, 'sine', 0.15, 1180); this.tone(1860, 0.3, 'sine', 0.07, null, 0.02); },
  phone()   { for (let i = 0; i < 3; i++) { this.tone(880, 0.09, 'square', 0.14, null, i * 0.18); this.tone(1180, 0.09, 'square', 0.12, null, i * 0.18 + 0.09); } },
  siren()   { this.tone(700, 0.28, 'sawtooth', 0.12, 1100); this.tone(1100, 0.28, 'sawtooth', 0.12, 700, 0.28); },
  gulp()    { this.tone(220, 0.12, 'sine', 0.16, 120); this.tone(160, 0.14, 'sine', 0.14, 90, 0.12); },
  win()     { [523, 659, 784, 1046, 1318].forEach((f, i) => this.tone(f, 0.26, 'triangle', 0.19, null, i * 0.14)); },
  lose()    { [440, 392, 330, 262, 196].forEach((f, i) => this.tone(f, 0.3, 'sawtooth', 0.16, null, i * 0.17)); },
  skid()    { this.noise(0.26, 0.15, 400, 2600); },

  /* --- радио: три станции, всё сочинено процедурно --- */
  stations: [
    { name: 'ЗАКАТ 101.4', bpm: 108, wave: 'sawtooth',
      chords: [[57, 60, 64], [53, 57, 60], [48, 52, 55], [55, 59, 62]],
      lead: [76, 74, 72, 69, 71, 72, 74, 69], drums: 1 },
    { name: 'ПРОМЗОНА FM', bpm: 132, wave: 'square',
      chords: [[50, 53, 57], [50, 53, 57], [46, 50, 53], [48, 52, 55]],
      lead: [62, 65, 69, 65, 62, 60, 62, 57], drums: 2 },
    { name: 'ГАРАЖ-ВОЛНА 88.2', bpm: 92, wave: 'triangle',
      chords: [[45, 48, 52], [50, 53, 57], [43, 47, 50], [45, 48, 52]],
      lead: [69, 67, 64, 62, 64, 67, 69, 71], drums: 0 },
    { name: 'ТИШИНА', bpm: 0, chords: [], lead: [], drums: 0 }
  ],
  mtof(m) { return 440 * Math.pow(2, (m - 69) / 12); },
  _pump() {
    if (!this.ready || this.muted || this.musVol <= 0.001) return;
    const st = this.stations[this.station];
    if (!st || !st.bpm) return;
    if (this.ctx.state !== 'running') return;
    const spb = 60 / st.bpm / 2;              // восьмые
    const now = this.ctx.currentTime;
    if (this._next < now) this._next = now + 0.05;
    while (this._next < now + 0.35) {
      const s = this._step, t = this._next;
      const ch = st.chords[(s >> 3) % st.chords.length];
      if (s % 8 === 0) ch.forEach((n, i) => this._mnote(this.mtof(n), spb * 3.4, st.wave, 0.055 - i * 0.006, t));
      if (s % 2 === 0) this._mnote(this.mtof(ch[0] - 12), spb * 1.5, 'triangle', 0.085, t);
      const ld = st.lead[s % st.lead.length];
      if (s % 2 === 1) this._mnote(this.mtof(ld), spb * 0.8, 'square', 0.032, t);
      if (st.drums) {
        if (s % 4 === 0) this._mkick(t);
        if (st.drums > 1 && s % 4 === 2) this._mhat(t, 0.05);
        if (s % 8 === 4) this._msnare(t);
        if (s % 2 === 1) this._mhat(t, 0.022);
      }
      this._next += spb; this._step++;
    }
  },
  _mnote(f, d, w, v, t) {
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = w; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(v, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(this.musGain); o.start(t); o.stop(t + d + 0.02);
  },
  _mkick(t) {
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(45, t + 0.13);
    g.gain.setValueAtTime(0.16, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
    o.connect(g); g.connect(this.musGain); o.start(t); o.stop(t + 0.18);
  },
  _mhat(t, v) { this._mnoise(t, 0.035, v, 6000); },
  _msnare(t) { this._mnoise(t, 0.12, 0.08, 1800); },
  _mnoise(t, d, v, freq) {
    const n = Math.floor(this.ctx.sampleRate * d);
    const buf = this.ctx.createBuffer(1, Math.max(1, n), this.ctx.sampleRate);
    const arr = buf.getChannelData(0);
    for (let i = 0; i < n; i++) arr[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = this.ctx.createBufferSource(); s.buffer = buf;
    const f = this.ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = freq;
    const g = this.ctx.createGain(); g.gain.value = v;
    s.connect(f); f.connect(g); g.connect(this.musGain); s.start(t); s.stop(t + d + 0.02);
  },
  nextStation() {
    this.station = (this.station + 1) % this.stations.length;
    this._step = 0; this._next = 0;
    return this.stations[this.station].name;
  }
};

/* 11. Сохранение                                                       */
/* ------------------------------------------------------------------ */
const SAVE_KEY = 'montazh_city_3d_save_v1';
const Save = {
  available: true, lastError: '',
  test() {
    try { localStorage.setItem(SAVE_KEY + '_t', '1'); localStorage.removeItem(SAVE_KEY + '_t'); this.available = true; }
    catch (e) { this.available = false; this.lastError = String(e && e.message || e); }
    return this.available;
  },
  write(data) {
    if (!this.available) return false;
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(data)); return true; }
    catch (e) { this.available = false; this.lastError = String(e && e.message || e); return false; }
  },
  read() {
    if (!this.available) return null;
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return null;
      const d = JSON.parse(raw);
      if (!d || typeof d !== 'object' || d.v !== 1) return null;
      return d;
    } catch (e) { this.lastError = String(e && e.message || e); return null; }
  },
  wipe() { try { localStorage.removeItem(SAVE_KEY); return true; } catch (e) { return false; } },
  has() { try { return !!localStorage.getItem(SAVE_KEY); } catch (e) { return false; } }
};
Save.test();
/* Настройки хранятся отдельно от сохранения смены: «стереть сохранение»
   не должно сбрасывать выбранное управление и режим эффектов. */
Save.readOpts = function () {
  try {
    const raw = localStorage.getItem(SAVE_KEY + '_opt');
    if (!raw) return null;
    const d = JSON.parse(raw);
    return (d && typeof d === 'object') ? d : null;
  } catch (e) { return null; }
};
Save.writeOpts = function (o) {
  try { localStorage.setItem(SAVE_KEY + '_opt', JSON.stringify(o)); return true; } catch (e) { return false; }
};

/* 12. Диалоги и портреты                                               */
/* ------------------------------------------------------------------ */
const Dlg = {
  open: false, who: '', text: '', shown: 0, opts: null, queue: [], onEnd: null, lock: 0,
  seq(list, onEnd) {
    this.queue = list.slice();
    this.onEnd = onEnd || null;
    this._next();
  },
  one(who, text, opts, onEnd) { this.seq([{ who, text, opts }], onEnd); },
  _next() {
    if (!this.queue.length) { this._close(); if (this.onEnd) { const f = this.onEnd; this.onEnd = null; f(); } return; }
    const e = this.queue.shift();
    this.open = true; this.who = e.who; this.text = e.text; this.shown = 0; this.opts = e.opts || null; this.lock = 0.18;
    $('dialog').style.display = 'block';
    $('dlgName').textContent = CHARS[e.who] ? CHARS[e.who].name : e.who;
    $('dlgText').textContent = '';
    drawPortrait(e.who);
    this._renderOpts();
    if (this.opts) Audio2.select(); else Audio2.click();
  },
  _renderOpts() {
    const box = $('dlgOpts'); box.innerHTML = '';
    $('dlgNext').textContent = this.opts ? 'Цифры 1–5 или мышь' : 'Space / E — далее';
    if (!this.opts) return;
    this.opts.forEach((o, i) => {
      const b = document.createElement('button');
      b.className = 'opt'; b.type = 'button';
      b.innerHTML = '<s>' + (i + 1) + '.</s> ' + o.label + (o.hint ? ' <s>— ' + o.hint + '</s>' : '');
      b.disabled = !!o.disabled;
      if (o.disabled) b.style.opacity = '.45';
      b.addEventListener('click', () => this.choose(i));
      box.appendChild(b);
    });
  },
  choose(i) {
    if (!this.opts || !this.opts[i] || this.opts[i].disabled) return;
    const o = this.opts[i];
    Audio2.click();
    const rest = this.queue.slice(); const end = this.onEnd;
    this.queue = []; this.onEnd = null; this._close();
    if (o.fn) o.fn();
    if (!this.open && rest.length) { this.queue = rest; this.onEnd = end; this._next(); }
  },
  _close() { this.open = false; this.opts = null; $('dialog').style.display = 'none'; },
  closeAll() { this.queue = []; this.onEnd = null; this._close(); },
  update(dt) {
    if (!this.open) return;
    this.lock = Math.max(0, this.lock - dt);
    if (this.shown < this.text.length) {
      this.shown = Math.min(this.text.length, this.shown + dt * 74);
      $('dlgText').textContent = this.text.slice(0, Math.floor(this.shown));
    }
    if (this.lock > 0) return;
    if (this.opts) {
      for (let i = 0; i < this.opts.length; i++)
        if (Input.pressed('Digit' + (i + 1)) || Input.pressed('Numpad' + (i + 1))) { this.choose(i); return; }
      return;
    }
    if (Input.anyHit(K.act) || Input.anyHit(K.brake) || (Input.mclick && Input.my > GL.h - 190)) {
      delete Input.hit['KeyE']; delete Input.hit['Space'];
      if (this.shown < this.text.length) { this.shown = this.text.length; $('dlgText').textContent = this.text; }
      else this._next();
    }
  }
};

const CHARS = {
  oleg:     { name: 'ОЛЕГ', c: '#ff8a1f' },
  tamara:   { name: 'ДИСПЕТЧЕР ТАМАРА', c: '#ff2d95' },

/* Заряд садится за смену: в пять вечера полный, к глубокой ночи треть. */
function phoneBattery() {
  const spent = ((hour() - START_HOUR + 24) % 24) / 12;
  return Math.round(clamp(100 - spent * 68, 12, 100));
}
/* Связь: в промзоне железо и бетон, по краям района — просто никому не надо. */
function phoneSignal() {
  const p = S.player;
  if (p.x > 100 && p.z < 70) return 1;
  if (p.x < 12 || p.x > W.x - 12 || p.z < 10 || p.z > W.z - 10) return 2;
  return 4;
}

function eggBurn(choice) {
  const p = S.player;
  S.egg.stage = 'burn'; S.egg.burnt = 1;
  const lines = choice === '12'
    ? [
        { who: 'oleg', text: 'Двенадцать вольт. Ставлю щупы на нижнюю пару.' },
        { who: 'oleg', text: 'Так. А почему тестер показывает двести двадцать.' },
        { who: 'oleg', text: 'А, это верхняя пара. Я на верхней.' }
      ]
    : [
        { who: 'oleg', text: 'Ладно. Двести двадцать так двести двадцать, чего мелочиться.' },
        { who: 'oleg', text: 'Ставлю щупы. Всё правильно ставлю.' },
        { who: 'oleg', text: 'Только это не клеммы. Это шлейф.' }

    Audio2.crash(); shake(11);

    floater(EGG.dev.x, EGG.dev.y + 0.5, EGG.dev.z, 'ПФ-Ф-Ф', '#ff8a1f');

      { who: 'oleg',  text: 'Меня тут нет.' }

  const p = S.player;

  const spent = Math.min(p.money, 1200 + Math.floor(Math.random() * 1800));

    '<div class="stats">' +

    '<i>В кармане осталось</i><b>' + fmtMoney(p.money) + '</b>' +
    '<i>Состояние</i><b>тяжёлое</b>' +
    '</div>' +
    '<div class="note">Это не провал. Провалить это было нельзя: обе клеммы вели в одно и то же место. ' +
    'Смена продолжается, только теперь с похмелья.</div>' +

function callContact(who) {
  if (Dlg.open) return;
  closeSheet();
  /* Плохая связь — звонок просто не проходит. Неудачную попытку не считаем:
     Егоров и так не бесконечно терпеливый. */
  if (phoneSignal() <= 1 && Math.random() < 0.34) {
    Audio2.nope();
    toast('Связь пропала. Промзона', 'bad', 2200);
    return;
  }
  const n = (S.phone.calls[who] = (S.phone.calls[who] || 0) + 1);
  const say = (w, t) => ({ who: w, text: t });
  const M = S.mission;
  let seq = [];
  let after = null;

  switch (who) {
    case 'vanya':
      seq.push(say('vanya', pick(CREW_LINES.vanya)));
      seq.push(say('vanya', 'А, Олег. Слушаю.'));
      after = () => { if (Math.random() < 0.5) olegMutter(OLEG_VANYA_LINE); };
      if (M) {
        seq.push(say('oleg', 'По «' + M.def.title + '» вопрос…'));
        seq.push(say('vanya', 'Я объяснял. ' + MOTTO));
        seq.push(say('vanya', 'Ладно. ' + taskText().step + '. Всё, работаем.'));
      } else if (!S.flags.aznetDone && S.egg.stage === 'none') {
        seq.push(say('vanya', 'О, кстати. Раз ты всё равно свободен — есть дело.'));
        after = () => eggRing();
      } else {
        seq.push(say('vanya', 'Заявки нет — значит, отдыхай. Появится — Тамара позвонит.'));
      }
      break;

    case 'kostya':
      seq.push(say('kostya', pick(CREW_LINES.kostya)));
      seq.push(say('kostya', 'О, Олег! Я там уже всё посмотрел, всё нормально.'));
      seq.push(say('oleg', 'Костя, ты вообще на каком объекте?'));
      seq.push(say('kostya', 'На нужном. Ты главное не переделывай, а то опять скажут, что я криво.'));
      break;

    case 'sanya':
      seq.push(say('sanya', pick(CREW_LINES.sanya)));
      if (callPartner()) {
        seq.push(say('sanya', 'Еду. Пять минут.'));
        seq.push(say('oleg', 'Саня, твои пять минут — это сколько?'));
        seq.push(say('sanya', 'Десять. Но еду же.'));
      } else {
        seq.push(say('sanya', 'Не могу сейчас. Совсем. Правда.'));
      }
      break;

    case 'tamara':
      seq.push(say('tamara', 'Диспетчерская. Тамара.'));
      if (M) {
        const t = taskText();
        seq.push(say('tamara', t.title + '. ' + t.step + '.'));
        if (t.hint) seq.push(say('tamara', t.hint));
      } else {
        seq.push(say('tamara', 'Заявок на тебя пока нет. Отдыхай, пока дают.'));
      }
      break;

    case 'egorov': {
      if (n > 3) {
        Audio2.nope();
        toast('Егоров сбросил. Гудки', 'bad', 2200);
        return;
      }
      seq.push(say('oleg', 'Сергей, здравствуйте. По объекту вопрос.'));
      /* Вторая реплика заведомо не совпадает с первой: сдвиг никогда не кратен длине. */
      const i0 = (n - 1 + S.day) % EGOROV_LINES.length;
      seq.push(say('egorov', EGOROV_LINES[i0]));
      seq.push(say('egorov', EGOROV_LINES[(i0 + 2 + (n % 3)) % EGOROV_LINES.length]));
      break;
    }

    case 'ambul': {
      const p = S.player;
      seq.push(say('ambul', 'Скорая. Что у вас?'));
      if (p.health < 55) {
        const fee = 900;
        if (p.money >= fee) {
          seq.push(say('oleg', 'Упал с велосипеда. Бордюр оказался быстрее.'));
          seq.push(say('ambul', 'Подъедем. Перевязка, зелёнка, счёт.'));
          after = () => {
            p.health = clamp(p.health + 40, 0, 100);
            addMoney(-fee, 'Выезд скорой');
            toast('Перевязали. Ездить аккуратнее не научили', 'good', 2600);
          };
        } else {
          seq.push(say('ambul', 'Выезд платный. У вас на него не хватает. Дойдите до чайной, съешьте пирожок.'));
        }
      } else {
        seq.push(say('oleg', 'Да я так, узнать.'));
        seq.push(say('ambul', 'Здоровы. Не занимайте линию.'));
      }
      break;
    }

    case 'pnd':
      seq.push(say('pnd', 'Психоневрологический диспансер, дежурный слушает.'));
      if (S.player.drunk > 45) {
        seq.push(say('oleg', 'А вы… это… работаете?'));
        seq.push(say('pnd', 'Работаем. Но вам, судя по голосу, не к нам, а поспать.'));
      } else {
        seq.push(say('oleg', 'Мне бригадир объясняет один раз.'));
        seq.push(say('pnd', 'Это не по нашей части. Это по части бригадира.'));
      }
      break;

    default:
      seq.push(say(who, 'Абонент не отвечает.'));
  }

  Audio2.phone();
  Dlg.seq(seq, after);
}

  if (P.scarf) { x.fillStyle = P.hat; x.beginPath(); x.ellipse(0, 16, 18, 8, 0, 0, TAU); x.fill(); }
  x.fillStyle = skin;                        // шея + лицо
  x.fillRect(-7, 2, 14, 14);
  x.beginPath(); x.ellipse(0, -6, 19, 22, 0, 0, TAU); x.fill();
  if (P.bald) {                              // лысина: тёмный ободок на висках и блик на темени

    x.fillStyle = skin;
    x.beginPath(); x.ellipse(0, -12, 15.5, 12, 0, Math.PI, TAU); x.fill();
    x.fillStyle = 'rgba(255,255,255,.13)';
    x.beginPath(); x.ellipse(-5, -19, 6, 3.5, -0.5, 0, TAU); x.fill();
  } else {
    x.fillStyle = P.hair;                    // волосы
    x.beginPath(); x.ellipse(0, -18, 19, 13, 0, Math.PI, TAU); x.fill();
  }
  if (P.cap) { x.fillStyle = P.hat; x.beginPath(); x.ellipse(0, -20, 20, 12, 0, Math.PI, TAU); x.fill(); x.fillRect(-22, -21, 30, 5); }
  if (P.goggles) {                           // очки, сдвинутые на лоб
    x.fillStyle = 'rgba(198,222,176,.8)';
    x.beginPath(); x.ellipse(0, -19, 13.5, 4.6, 0, 0, TAU); x.fill();
    x.strokeStyle = P.hat; x.lineWidth = 2.6;
    x.beginPath(); x.moveTo(-18, -20); x.lineTo(-12, -19.5); x.moveTo(12, -19.5); x.lineTo(18, -20); x.stroke();
  }
  x.fillStyle = dark;                        // глаза
  x.beginPath(); x.ellipse(-7, -8, 2.6, 3.1, 0, 0, TAU); x.fill();
  x.beginPath(); x.ellipse(7, -8, 2.6, 3.1, 0, 0, TAU); x.fill();
  if (P.glass) { x.strokeStyle = '#dfe6ff'; x.lineWidth = 1.6; x.beginPath(); x.arc(-7, -8, 6, 0, TAU); x.arc(7, -8, 6, 0, TAU); x.moveTo(-1, -8); x.lineTo(1, -8); x.stroke(); }
  x.strokeStyle = '#8a5a3a'; x.lineWidth = 2;  // брови/рот
  x.beginPath(); x.moveTo(-11, -15); x.lineTo(-3, -13); x.moveTo(3, -13); x.lineTo(11, -15); x.stroke();
  x.strokeStyle = '#7a3a3a'; x.beginPath(); x.moveTo(-6, 3); x.quadraticCurveTo(0, who === 'oleg' ? 1 : 6, 6, 3); x.stroke();
  if (P.beard) {                             // борода: у густой (beard: 2) плотнее, выше и с усами
    const th = P.beard > 1;
    x.fillStyle = P.hair; x.globalAlpha = th ? .82 : .55;
    x.beginPath(); x.ellipse(0, th ? 4 : 6, th ? 15 : 13, th ? 12 : 9, 0, 0, Math.PI); x.fill();
    if (th) x.fillRect(-6.5, -0.5, 13, 2.6);
    x.globalAlpha = 1;
  }
  x.restore();
  x.strokeStyle = 'rgba(255,255,255,.14)'; x.lineWidth = 1; x.strokeRect(.5, .5, w - 1, h - 1);
}

/* 13. Мини-игры монтажа (двумерные схемы поверх сцены)                  */

function roundRect(x, c, rx, ry, w, h, r) {
  c.beginPath();
  c.moveTo(rx + r, ry);
  c.arcTo(rx + w, ry, rx + w, ry + h, r);
  c.arcTo(rx + w, ry + h, rx, ry + h, r);
  c.arcTo(rx, ry + h, rx, ry, r);
  c.arcTo(rx, ry, rx + w, ry, r);
  c.closePath();
}
const Mini = {
  g: null, cv: null, cx: null, w: 0, h: 0, dpr: 1, onDone: null, t: 0,
  open(game, onDone) {
    this.g = game; this.onDone = onDone; this.t = 0;
    this.cv = $('miniCanvas'); this.cx = this.cv.getContext('2d');
    S.screen = 'mini';
    $('mini').classList.add('show');
    $('miniTitle').textContent = game.title;
    this.resize();
    game.layout(this.w, this.h);
    if (game.init) game.init();
    this.sync();
    Audio2.select();
  },
  resize() {
    const r = $('stage').getBoundingClientRect();
    this.dpr = Math.min(2, window.devicePixelRatio || 1);
    this.w = Math.max(320, Math.floor(r.width)); this.h = Math.max(240, Math.floor(r.height));
    this.cv.width = Math.floor(this.w * this.dpr); this.cv.height = Math.floor(this.h * this.dpr);
    this.cv.style.width = this.w + 'px'; this.cv.style.height = this.h + 'px';
    this.cx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    if (this.g && this.g.layout) this.g.layout(this.w, this.h);
  },
  close() {
    $('mini').classList.remove('show');
    $('miniBtns').innerHTML = '';
    this.g = null; S.screen = 'play';
  },
  finish(q) {
    const cb = this.onDone; const qq = clamp(Math.round(q), 0, 100);
    this.close();
    if (cb) cb(qq);
  },
  sync() {
    const g = this.g; if (!g) return;
    $('miniPhase').textContent = g.phaseName();
    $('miniHint').innerHTML = g.hint();
    const q = clamp(g.q, 0, 100);
    $('miniQBar').style.width = q + '%';
    $('miniQNum').textContent = Math.round(q);
    const btns = g.buttons ? g.buttons() : [];
    const box = $('miniBtns');
    const sig = btns.map(b => b.label + (b.disabled ? '!' : '')).join('|');
    if (box.dataset.sig !== sig) {
      box.dataset.sig = sig; box.innerHTML = '';
      btns.forEach(b => {
        const el = document.createElement('button');
        el.className = 'btn sm ' + (b.cls || '');
        el.type = 'button'; el.textContent = b.label; el.disabled = !!b.disabled;
        el.addEventListener('click', e => { e.stopPropagation(); Audio2.click(); b.fn(); });
        box.appendChild(el);
      });
    }
  },
  update(dt) {
    if (!this.g) return;
    this.t += dt;
    /* «пьяный» курсор и усталость */
    const p = S.player;
    const jx = p.drunk > 5 ? Math.sin(this.t * 3.7) * p.drunk * 0.16 + Math.sin(this.t * 9.1) * p.drunk * 0.06 : 0;
    const jy = p.drunk > 5 ? Math.cos(this.t * 3.1) * p.drunk * 0.14 : 0;
    const tired = p.stamina < 25 ? Math.sin(this.t * 5.3) * (25 - p.stamina) * 0.12 : 0;
    this.mx = Input.mx + jx + tired; this.my = Input.my + jy;
    this.g.update(dt, this);
    this.sync();
  },
  draw() {
    if (!this.g) return;
    const c = this.cx;
    c.clearRect(0, 0, this.w, this.h);
    const bg = c.createLinearGradient(0, 0, 0, this.h);
    bg.addColorStop(0, '#241041'); bg.addColorStop(0.55, '#160a2a'); bg.addColorStop(1, '#0b0518');
    c.fillStyle = bg; c.fillRect(0, 0, this.w, this.h);
    c.save();
    c.globalAlpha = 0.1; c.strokeStyle = '#8a2be2'; c.lineWidth = 1;
    for (let x = 0; x < this.w; x += 40) { c.beginPath(); c.moveTo(x, 0); c.lineTo(x, this.h); c.stroke(); }
    for (let y = 0; y < this.h; y += 40) { c.beginPath(); c.moveTo(0, y); c.lineTo(this.w, y); c.stroke(); }
    c.restore();
    this.g.draw(c, this.w, this.h, this);
    /* курсор */
    if (this.mx != null) {
      c.save();
      c.strokeStyle = '#ffd23f'; c.lineWidth = 2;
      c.beginPath(); c.arc(this.mx, this.my, 9, 0, TAU); c.stroke();
      c.beginPath(); c.moveTo(this.mx - 14, this.my); c.lineTo(this.mx - 4, this.my);
      c.moveTo(this.mx + 4, this.my); c.lineTo(this.mx + 14, this.my);
      c.moveTo(this.mx, this.my - 14); c.lineTo(this.mx, this.my - 4);
      c.moveTo(this.mx, this.my + 4); c.lineTo(this.mx, this.my + 14); c.stroke();
      c.restore();
    }
  },
  click() { return Input.mclick && this.my < this.h - 74 && this.my > 58; }
};

/* 23. Мини-игра «Монтаж двери» (условная схема)                        */

function startDoorGame(onDone) {
  const DEVS = [
    { id: 'ctrl', name: 'Контроллер', tok: '' },
    { id: 'read', name: 'Считыватель', tok: 'B' },
    { id: 'exit', name: 'Кнопка выхода', tok: 'C' },
    { id: 'lock', name: 'Замок', tok: 'D' }
  ];
  const g = {
    title: 'МОНТАЖ СКУД: ДВЕРЬ', q: 100, phase: 0, t: 0,
    devs: DEVS.map(d => Object.assign({ placed: false }, d)),
    slots: [], tray: [], held: null, sel: 0, slotSel: 0,
    nodes: [], links: [], selNode: null, shorts: 0, misses: 0,
    test: -1, log: [], finished: false,
    layout(w, h) {
      const bw = Math.min(880, w - 120), bh = Math.min(430, h - 210);
      const bx = (w - bw) / 2, by = 74 + (h - 150 - bh) / 2;
      this.board = { x: bx, y: by, w: bw, h: bh };
      const doorW = bw * 0.32;
      this.door = { x: bx + 34, y: by + 62, w: doorW, h: bh - 132 };
      const px = bx + doorW + 96, pw = bw - doorW - 130;
      this.panel = { x: px, y: by + 62, w: pw, h: bh - 132 };
      const sw = 108, sh = 62;
      this.slots = [
        { id: 'ctrl', label: 'Контроллер', x: px + pw / 2 - sw / 2, y: by + 82, w: sw, h: sh },
        { id: 'read', label: 'Считыватель', x: this.door.x + this.door.w + 12, y: this.door.y + 70, w: sw * 0.72, h: sh * 0.72 },
        { id: 'exit', label: 'Кнопка выхода', x: this.door.x + 14, y: this.door.y + this.door.h - 84, w: sw * 0.66, h: sh * 0.66 },
        { id: 'lock', label: 'Замок', x: this.door.x + this.door.w / 2 - sw * 0.4, y: this.door.y + 12, w: sw * 0.8, h: sh * 0.42 }
      ];
      const tw = 128, ty = by + bh - 4;
      this.tray = this.devs.map((d, i) => ({ id: d.id, x: bx + 20 + i * (tw + 12), y: ty, w: tw, h: 44 }));
      this.psu = { x: px + pw - 92, y: by + bh - 150, w: 76, h: 54 };
      this.rebuildNodes();
    },
    rebuildNodes() {
      const s = id => this.slots.find(v => v.id === id);
      const c = s('ctrl');
      this.nodes = [
        { id: 'c_A', tok: 'A', x: c.x + 14, y: c.y + c.h + 12, own: 'ctrl' },
        { id: 'c_B', tok: 'B', x: c.x + 42, y: c.y + c.h + 12, own: 'ctrl' },
        { id: 'c_C', tok: 'C', x: c.x + 70, y: c.y + c.h + 12, own: 'ctrl' },
        { id: 'c_D', tok: 'D', x: c.x + 96, y: c.y + c.h + 12, own: 'ctrl' },
        { id: 'psu_A', tok: 'A', x: this.psu.x + this.psu.w / 2, y: this.psu.y - 10, own: 'psu' },
        { id: 'read_B', tok: 'B', x: s('read').x + s('read').w / 2, y: s('read').y + s('read').h + 10, own: 'read' },
        { id: 'exit_C', tok: 'C', x: s('exit').x + s('exit').w + 13, y: s('exit').y + s('exit').h / 2, own: 'exit' },
        { id: 'lock_D', tok: 'D', x: s('lock').x + s('lock').w + 13, y: s('lock').y + s('lock').h / 2, own: 'lock' }
      ];
    },
    phaseName() { return ['ЭТАП 1 — РАЗМЕЩЕНИЕ', 'ЭТАП 2 — КОММУТАЦИЯ', 'ЭТАП 3 — ПРОВЕРКА'][this.phase] || 'ГОТОВО'; },
    hint() {
      if (this.phase === 0) return 'Расставь оборудование по местам: клик по прибору внизу, затем клик по контуру. С клавиатуры: <b>←/→</b> — прибор, <b>↑/↓</b> — место, <b>E</b> — поставить. Ошибка стоит качества.';
      if (this.phase === 1) return 'Соедини одинаковые метки: <b>A</b>—питание, <b>B</b>—считыватель, <b>C</b>—кнопка, <b>D</b>—замок. Разные метки = короткое замыкание. Замыканий: <b>' + this.shorts + '/3</b>';
      if (this.phase === 2) return 'Жми <b>«Запустить проверку»</b> — посмотрим, откроется ли дверь и запишется ли проход.';
      return 'Готово.';
    },
    buttons() {
      if (this.phase === 1) return [{ label: 'Сбросить последний провод', cls: '', disabled: !this.links.length, fn: () => { this.links.pop(); this.q = clamp(this.q - 2, 0, 100); } }];
      if (this.phase === 2 && this.test < 0) return [{ label: 'Запустить проверку', cls: 'c', fn: () => { this.test = 0; this.log = []; Audio2.click(); } }];
      if (this.phase === 3) return [{ label: 'Закончить и сдать', cls: 'y', fn: () => Mini.finish(this.q) }];
      return [];
    },
    init() { this.t = 0; },
    update(dt, M) {
      this.t += dt;
      const click = Mini.click();
      if (this.phase === 0) {
        /* клавиатура */
        const freeDevs = this.devs.filter(d => !d.placed);
        if (freeDevs.length && this.devs[this.sel].placed) {
          this.sel = this.devs.indexOf(freeDevs[0]);
        }
        if (Input.anyHit(K.left) || Input.anyHit(K.right)) {
          const dir = Input.anyHit(K.right) ? 1 : -1;
          for (let i = 0; i < this.devs.length; i++) {
            this.sel = (this.sel + dir + this.devs.length) % this.devs.length;
            if (!this.devs[this.sel].placed) break;
          }
          Audio2.click();
        }
        if (Input.anyHit(K.up) || Input.anyHit(K.down)) {
          const dir = Input.anyHit(K.down) ? 1 : -1;
          this.slotSel = (this.slotSel + dir + this.slots.length) % this.slots.length;
          Audio2.click();
        }
        if (Input.anyHit(K.act)) this.tryPlace(this.devs[this.sel].id, this.slots[this.slotSel].id);
        if (click) {
          const tr = this.tray.find(t => hitRect(M.mx, M.my, t) && !this.devs.find(d => d.id === t.id).placed);
          if (tr) { this.held = tr.id; Audio2.click(); }
          else if (this.held) {
            const sl = this.slots.find(s => hitRect(M.mx, M.my, s, 12));
            if (sl) { this.tryPlace(this.held, sl.id); this.held = null; }
          }
        }
        if (this.devs.every(d => d.placed)) {
          this.phase = 1; Audio2.ok();
          toast('Оборудование на местах. Теперь коммутация', 'good', 2200);
        }
      } else if (this.phase === 1) {
        if (click) {
          const n = this.nodes.find(n => dist(M.mx, M.my, n.x, n.y) < 20);
          if (n) {
            if (!this.selNode) { this.selNode = n; Audio2.click(); }
            else if (this.selNode.id === n.id) { this.selNode = null; }
            else this.tryLink(this.selNode, n);
          } else this.selNode = null;
        }
        if (this.links.length >= 4) { this.phase = 2; Audio2.ok(); }
      } else if (this.phase === 2) {
        if (this.test >= 0) {
          const prev = this.test;
          this.test += dt;
          const stages = [0.1, 1.0, 1.9, 2.8, 3.8];
          const msgs = [
            'Подношу карту к считывателю…',
            'Контроллер думает. Думает хорошо.',
            this.q >= 55 ? 'Замок щёлкнул. Дверь открылась.' : 'Замок щёлкнул. Со второй попытки.',
            'Журнал: «' + clockStr() + ' — проход зафиксирован, карта №001».',
            'Кнопка выхода отработала. Дверь закрылась, как приличная.'
          ];
          for (let i = 0; i < stages.length; i++) {
            if (prev < stages[i] && this.test >= stages[i]) {
              this.log.push(msgs[i]);
              if (i === 2) Audio2.lock(); else Audio2.click();
            }
          }
          if (this.test > 5) { this.phase = 3; Audio2.ok(); }
        }
      } else if (this.phase === 3) {
        if (Input.anyHit(K.act)) Mini.finish(this.q);
      }
    },
    tryPlace(devId, slotId) {
      const dev = this.devs.find(d => d.id === devId);
      if (!dev || dev.placed) return;
      if (devId === slotId) {
        dev.placed = true; Audio2.screwdr();
        const sl = this.slots.find(s => s.id === slotId);
        fxMini(sl.x + sl.w / 2, sl.y + sl.h / 2);
      } else {
        this.misses++; this.q = clamp(this.q - 7, 0, 100);
        Audio2.nope();
        toast(pick(['Не туда. Совсем не туда', 'Замок на кнопку выхода — смело, но нет', 'Оно, конечно, влезет. Но не должно']), 'bad', 1600);
      }
    },
    tryLink(a, b) {
      const key = [a.id, b.id].sort().join('|');
      if (this.links.some(l => l.key === key)) { this.selNode = null; return; }
      if (this.links.some(l => l.a.id === a.id || l.b.id === a.id || l.a.id === b.id || l.b.id === b.id)) {
        toast('Эта клемма уже занята', 'bad', 1400); Audio2.nope(); this.selNode = null; return;
      }
      if (a.tok === b.tok && a.own !== b.own) {
        this.links.push({ a, b, key, tok: a.tok, spark: 0 });
        Audio2.ok(); this.selNode = null;
        fxMini((a.x + b.x) / 2, (a.y + b.y) / 2);
      } else {
        this.shorts++; this.q = clamp(this.q - 11, 0, 100);
        Audio2.spark(); shake(4);
        this.selNode = null;
        this.sparkAt = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2, t: 0.5 };
        toast(pick(['Короткое замыкание! Пахнет опытом', 'Искра, буря, безумие. И запах', 'Так делать не надо. Уже не надо']), 'bad', 1800);
        if (this.shorts >= 3) {
          this.links.length = 0; this.shorts = 0;
          this.q = clamp(this.q - 8, 0, 100);
          toast('Автомат выбило. Начинаем коммутацию заново', 'bad', 2600);
        }
      }
    },
    draw(c, w, h, M) {
      const b = this.board;
      c.save();
      /* панель схемы */
      c.fillStyle = 'rgba(12,7,24,.86)'; c.strokeStyle = 'rgba(37,232,220,.5)'; c.lineWidth = 2;
      roundRect(0, c, b.x, b.y, b.w, b.h, 10); c.fill(); c.stroke();
      c.fillStyle = 'rgba(185,166,214,.6)'; c.font = '700 11px "Trebuchet MS", sans-serif';
      c.fillText('УСЛОВНАЯ МОНТАЖНАЯ СХЕМА · ИГРОВАЯ ГОЛОВОЛОМКА', b.x + 14, b.y + 20);

      /* дверь */
      const d = this.door;
      c.fillStyle = '#2a2338'; roundRect(0, c, d.x, d.y, d.w, d.h, 4); c.fill();
      c.strokeStyle = '#6b5a86'; c.lineWidth = 3; c.stroke();
      const openAmt = this.phase === 2 && this.test > 1.9 ? clamp((this.test - 1.9) / 0.8, 0, 1) : (this.phase === 3 ? 1 : 0);
      c.fillStyle = '#0d0a16'; c.fillRect(d.x + 6, d.y + 6, d.w - 12, d.h - 12);   /* тёмный проём */
      if (openAmt > 0.05) {
        c.fillStyle = 'rgba(255,210,63,.10)';
        c.fillRect(d.x + 6, d.y + 6, (d.w - 12) * openAmt, d.h - 12);
      }
      c.save();
      c.translate(d.x + 6, d.y + 6);
      c.scale(clamp(1 - openAmt * 0.72, 0.05, 1), 1);
      c.fillStyle = '#3c3350'; c.fillRect(0, 0, d.w - 12, d.h - 12);
      c.strokeStyle = '#8f7fae'; c.lineWidth = 2; c.strokeRect(8, 8, d.w - 28, d.h - 28);
      c.fillStyle = '#ffd23f'; c.beginPath(); c.arc(d.w - 30, (d.h - 12) / 2, 5, 0, TAU); c.fill();
      c.restore();
      c.fillStyle = 'rgba(185,166,214,.55)'; c.font = '700 10px "Trebuchet MS", sans-serif';
      c.fillText('ДВЕРЬ ПОДЪЕЗДА', d.x + 4, d.y - 8);

      /* блок питания */
      c.fillStyle = '#1c1430'; c.strokeStyle = '#ff8a1f'; c.lineWidth = 2;
      roundRect(0, c, this.psu.x, this.psu.y, this.psu.w, this.psu.h, 5); c.fill(); c.stroke();
      c.fillStyle = '#ff8a1f'; c.font = '700 10px "Trebuchet MS", sans-serif';
      c.fillText('БЛОК ПИТАНИЯ', this.psu.x + 6, this.psu.y + 18);
      c.fillStyle = '#b9a6d6'; c.fillText('метка A', this.psu.x + 6, this.psu.y + 34);

      /* слоты */
      for (const s of this.slots) {
        const dev = this.devs.find(v => v.id === s.id);
        const on = dev.placed;
        c.setLineDash(on ? [] : [7, 5]);
        const aimed = this.phase === 0 && (this.held === s.id || this.slots[this.slotSel] === s);
        c.strokeStyle = on ? '#4be36b' : (aimed ? '#ffd23f' : 'rgba(185,166,214,.5)');
        c.lineWidth = on ? 2 : 2;

      const gap = Math.min(200, (w * 0.52) / n);
      const y = h / 2 - 10;
      for (let i = 0; i < n; i++) {
        const x = w * 0.62 + (i - (n - 1) / 2) * gap;
        const b = this.bolts[i], r = 66;
        c.save(); c.translate(x, y);
        c.strokeStyle = 'rgba(185,166,214,.35)'; c.lineWidth = 16;
        c.beginPath(); c.arc(0, 0, r, Math.PI * 0.75, Math.PI * 2.25); c.stroke();
        const arc = (t) => Math.PI * 0.75 + t * Math.PI * 1.5;
        c.strokeStyle = 'rgba(255,210,63,.5)'; c.lineWidth = 16;
        c.beginPath(); c.arc(0, 0, r, arc(0.3), arc(0.72)); c.stroke();
        c.strokeStyle = '#4be36b';
        c.beginPath(); c.arc(0, 0, r, arc(0.42), arc(0.6)); c.stroke();
        c.strokeStyle = '#ff4d5e'; c.lineWidth = 16;
        c.beginPath(); c.arc(0, 0, r, arc(0.72), arc(1)); c.stroke();
        if (i === this.boltIdx) {
          const a = arc(b.a);
          c.strokeStyle = '#fff'; c.lineWidth = 4;
          c.beginPath(); c.moveTo(0, 0); c.lineTo(Math.cos(a) * (r + 14), Math.sin(a) * (r + 14)); c.stroke();
        }
        c.fillStyle = b.state === 1 ? '#4be36b' : b.state === 2 ? '#ffd23f' : b.state === 3 ? '#ff4d5e' : '#2a2338';
        c.beginPath(); c.arc(0, 0, 26, 0, TAU); c.fill();
        c.strokeStyle = '#0b0518'; c.lineWidth = 3;
        c.beginPath(); c.moveTo(-13, 0); c.lineTo(13, 0); c.stroke();
        c.fillStyle = '#e9dcff'; c.font = '900 13px "Arial Black",sans-serif'; c.textAlign = 'center';
        c.fillText('КРЕПЁЖ ' + (i + 1), 0, r + 44);
        if (b.state) c.fillText(['', 'ОТЛИЧНО', 'НОРМ', 'СОРВАНО'][b.state], 0, r + 64);
        c.textAlign = 'left'; c.restore();
      }
      c.fillStyle = '#e9dcff'; c.font = '900 16px "Arial Black",sans-serif'; c.textAlign = 'center';
      c.fillText('ЗАТЯНИ КРЕПЛЕНИЯ — F В ЗЕЛЁНОМ СЕКТОРЕ', w * 0.62, 96); c.textAlign = 'left';
    },
    drawPlugs(c, w, h, M) {
      this.drawRig(c, w, h);
      const cx = w * 0.64, cy = h / 2;
      c.fillStyle = 'rgba(12,7,24,.8)'; c.strokeStyle = 'rgba(37,232,220,.4)'; c.lineWidth = 2;
      roundRect(0, c, cx - 210, cy - 120, 420, 240, 10); c.fill(); c.stroke();
      drawCamIcon(c, cx, cy - 74, 1.3, 0.15);
      this.sockets = [
        { id: 'pwr', px: cx - 90, py: cy + 10, name: 'Гнездо питания', c: '#ff8a1f' },
        { id: 'net', px: cx + 90, py: cy + 10, name: 'Гнездо сети', c: '#25e8dc' }
      ];
      /* перемешиваем расположение гнёзд один раз */
      if (this.swapSockets === undefined) this.swapSockets = Math.random() < 0.5;
      if (this.swapSockets) { const a = this.sockets[0].px; this.sockets[0].px = this.sockets[1].px; this.sockets[1].px = a; }
      for (const s of this.sockets) {
        const done = this.plugs.find(p => p.id === s.id).done;
        c.strokeStyle = s.c; c.lineWidth = 3; c.fillStyle = done ? s.c : 'rgba(0,0,0,.4)';
        c.beginPath(); c.arc(s.px, s.py, 22, 0, TAU); c.fill(); c.stroke();
        c.fillStyle = '#e9dcff'; c.font = '700 11px "Trebuchet MS",sans-serif'; c.textAlign = 'center';
        c.fillText(s.name, s.px, s.py + 40); c.textAlign = 'left';
      }
      this.plugs.forEach((p, i) => {
        p.px = cx - 120 + i * 240; p.py = cy + 110;
        if (p.done) return;
        const sel = this.plugSel === p;
        c.fillStyle = sel ? '#fff' : p.c; c.strokeStyle = p.c; c.lineWidth = 2;
        roundRect(0, c, p.px - 30, p.py - 16, 60, 32, 6); c.fill();
        c.fillStyle = '#0b0518'; c.font = '700 11px "Trebuchet MS",sans-serif'; c.textAlign = 'center';
        c.fillText(p.name, p.px, p.py + 4); c.textAlign = 'left';
        if (sel) { c.strokeStyle = '#ffd23f'; c.setLineDash([5, 4]); c.beginPath(); c.moveTo(p.px, p.py); c.lineTo(M.mx, M.my); c.stroke(); c.setLineDash([]); }
      });
      c.fillStyle = '#e9dcff'; c.font = '900 16px "Arial Black",sans-serif'; c.textAlign = 'center';
      c.fillText('ПОДКЛЮЧИ ПИТАНИЕ И СЕТЬ', cx, 96); c.textAlign = 'left';
    },
    drawAim(c, w, h) {
      /* вид сверху */
      const cx = w * 0.34, cy = h * 0.62, ppm = Math.min(13, (h * 0.4) / 16);
      c.fillStyle = 'rgba(10,6,20,.6)'; c.strokeStyle = 'rgba(185,166,214,.25)'; c.lineWidth = 1;
      for (let r = 4; r <= 16; r += 4) {
        c.beginPath(); c.arc(cx, cy, r * ppm, 0, TAU); c.stroke();
        c.fillStyle = 'rgba(185,166,214,.45)'; c.font = '600 10px "Consolas",monospace';
        c.fillText(r + ' м', cx + r * ppm + 3, cy - 3);
      }
      /* конус */
      const a0 = this.ang - (this.fovH * Math.PI / 180) / 2, a1 = this.ang + (this.fovH * Math.PI / 180) / 2;
      const LIM = 19;                                  /* дальше диаграмму не рисуем */
      const clipped = this.far > LIM;
      const nr = clamp(this.near, 0, LIM) * ppm, fr = Math.min(this.far, LIM) * ppm;
      const grad = c.createRadialGradient(cx, cy, nr, cx, cy, Math.max(nr + 1, fr));
      grad.addColorStop(0, 'rgba(37,232,220,.34)'); grad.addColorStop(1, 'rgba(37,232,220,.05)');
      c.fillStyle = grad;
      c.beginPath(); c.arc(cx, cy, fr, a0, a1); c.arc(cx, cy, nr, a1, a0, true); c.closePath(); c.fill();
      c.strokeStyle = 'rgba(37,232,220,.8)'; c.lineWidth = 2;
      c.beginPath(); c.moveTo(cx + Math.cos(a0) * nr, cy + Math.sin(a0) * nr); c.lineTo(cx + Math.cos(a0) * fr, cy + Math.sin(a0) * fr);
      c.moveTo(cx + Math.cos(a1) * nr, cy + Math.sin(a1) * nr); c.lineTo(cx + Math.cos(a1) * fr, cy + Math.sin(a1) * fr);
      c.stroke();
      c.beginPath(); c.arc(cx, cy, nr, a0, a1); c.stroke();
      c.setLineDash(clipped ? [7, 6] : []);
      c.beginPath(); c.arc(cx, cy, fr, a0, a1); c.stroke();
      c.setLineDash([]);
      if (clipped) {
        c.fillStyle = 'rgba(37,232,220,.75)'; c.font = '700 10px "Trebuchet MS",sans-serif'; c.textAlign = 'center';
        c.fillText('дальше — до горизонта', cx + Math.cos(this.ang) * (fr + 16), cy + Math.sin(this.ang) * (fr + 16));
        c.textAlign = 'left';
      }
      c.fillStyle = 'rgba(255,77,94,.16)';
      c.beginPath(); c.arc(cx, cy, nr, a0, a1); c.lineTo(cx, cy); c.closePath(); c.fill();
      /* зона */
      const z = this.zone, zx = cx + Math.cos(z.bear) * z.dist * ppm, zy = cy + Math.sin(z.bear) * z.dist * ppm;
      c.save(); c.translate(zx, zy); c.rotate(z.bear);
      c.fillStyle = this.cover >= 0.9 ? 'rgba(75,227,107,.3)' : 'rgba(255,45,149,.28)';
      c.strokeStyle = this.cover >= 0.9 ? '#4be36b' : '#ff2d95'; c.lineWidth = 2;
      c.fillRect(-z.d / 2 * ppm, -z.w / 2 * ppm, z.d * ppm, z.w * ppm);
      c.strokeRect(-z.d / 2 * ppm, -z.w / 2 * ppm, z.d * ppm, z.w * ppm);
      c.restore();
      c.fillStyle = '#e9dcff'; c.font = '700 11px "Trebuchet MS",sans-serif'; c.textAlign = 'center';
      c.fillText(this.zoneName.toUpperCase(), zx, zy - z.w / 2 * ppm - 8); c.textAlign = 'left';
      /* опора */
      c.fillStyle = '#8f7fae'; c.beginPath(); c.arc(cx, cy, 8, 0, TAU); c.fill();
      c.strokeStyle = '#ffd23f'; c.lineWidth = 3;
      c.beginPath(); c.moveTo(cx, cy); c.lineTo(cx + Math.cos(this.ang) * 30, cy + Math.sin(this.ang) * 30); c.stroke();
      c.fillStyle = 'rgba(185,166,214,.85)'; c.font = '700 11px "Trebuchet MS",sans-serif';
      c.fillText('ВИД СВЕРХУ · высота ' + (this.hSet || 5).toFixed(1) + ' м · наклон ' + Math.round(this.tilt) + '°', cx - 90, cy + h * 0.2);

      /* превью «что видит камера» */
      const p = this.prev;
      c.save();
      c.beginPath(); roundRect(0, c, p.x, p.y, p.w, p.h, 8); c.clip();
      const horizon = p.y + p.h / 2 - ((this.tilt * Math.PI / 180) / ((this.fovV * Math.PI / 180) / 2)) * (p.h / 2);
      const sky = c.createLinearGradient(0, p.y, 0, horizon);
      sky.addColorStop(0, '#ff8a1f'); sky.addColorStop(1, '#8a2be2');
      c.fillStyle = sky; c.fillRect(p.x, p.y, p.w, Math.max(0, horizon - p.y));
      const gr = c.createLinearGradient(0, horizon, 0, p.y + p.h);
      gr.addColorStop(0, '#3a3448'); gr.addColorStop(1, '#221c30');
      c.fillStyle = gr; c.fillRect(p.x, Math.max(p.y, horizon), p.w, p.y + p.h - Math.max(p.y, horizon));
      /* проекция зоны */
      const proj = (px, py) => {
        const r = Math.hypot(px, py);
        let da = Math.atan2(py, px) - this.ang;
        da = ((da + Math.PI) % TAU + TAU) % TAU - Math.PI;
        const e = Math.atan((this.hSet || 5) / Math.max(0.3, r));
        const u = da / ((this.fovH * Math.PI / 180) / 2);
        const v = (e - this.tilt * Math.PI / 180) / ((this.fovV * Math.PI / 180) / 2);
        return { x: p.x + p.w / 2 + u * p.w / 2, y: p.y + p.h / 2 + v * p.h / 2 };
      };
      const ux = Math.cos(z.bear), uy = Math.sin(z.bear);
      const corners = [[-1, -1], [1, -1], [1, 1], [-1, 1]].map(([i, j]) => {
        const px = Math.cos(z.bear) * z.dist + ux * i * (z.d / 2) - uy * j * (z.w / 2);
        const py = Math.sin(z.bear) * z.dist + uy * i * (z.d / 2) + ux * j * (z.w / 2);
        return proj(px, py);
      });
      c.beginPath(); c.moveTo(corners[0].x, corners[0].y);
      for (let i = 1; i < 4; i++) c.lineTo(corners[i].x, corners[i].y);
      c.closePath();
      c.fillStyle = this.cover >= 0.9 ? 'rgba(75,227,107,.35)' : 'rgba(255,45,149,.3)';
      c.strokeStyle = this.cover >= 0.9 ? '#4be36b' : '#ff2d95'; c.lineWidth = 2;
      c.fill(); c.stroke();
      /* сетка «видеокадра» */
      c.strokeStyle = 'rgba(255,255,255,.12)'; c.lineWidth = 1;
      for (let i = 1; i < 3; i++) {
        c.beginPath(); c.moveTo(p.x + p.w * i / 3, p.y); c.lineTo(p.x + p.w * i / 3, p.y + p.h); c.stroke();
        c.beginPath(); c.moveTo(p.x, p.y + p.h * i / 3); c.lineTo(p.x + p.w, p.y + p.h * i / 3); c.stroke();
      }
      c.fillStyle = '#4be36b'; c.font = '700 11px "Consolas",monospace';
      c.fillText('REC ' + clockStr(), p.x + 10, p.y + 20);
      c.fillStyle = 'rgba(255,77,94,.9)'; c.beginPath(); c.arc(p.x + p.w - 16, p.y + 16, 5, 0, TAU); c.fill();
      c.restore();
      c.strokeStyle = this.aimOk ? '#4be36b' : 'rgba(185,166,214,.6)'; c.lineWidth = 2;
      roundRect(0, c, p.x, p.y, p.w, p.h, 8); c.stroke();
      c.fillStyle = '#b9a6d6'; c.font = '700 11px "Trebuchet MS",sans-serif';
      c.fillText('ЧТО ВИДИТ КАМЕРА', p.x, p.y - 6);
      if (this.sky > 0.3) {
        c.fillStyle = '#ff4d5e'; c.font = '900 13px "Arial Black",sans-serif';
        c.fillText('СЛИШКОМ МНОГО НЕБА', p.x, p.y + p.h + 20);
      } else if (this.cover < 0.9) {
        c.fillStyle = '#ffd23f'; c.font = '900 13px "Arial Black",sans-serif';
        c.fillText('ЗОНА НЕ ЦЕЛИКОМ В КАДРЕ', p.x, p.y + p.h + 20);
      } else {
        c.fillStyle = '#4be36b'; c.font = '900 13px "Arial Black",sans-serif';
        c.fillText('ЗОНА В КАДРЕ — МОЖНО ПОДТВЕРЖДАТЬ (E)', p.x, p.y + p.h + 20);
      }
      if (this.shakeT > 0) {
        c.save(); c.translate(rnd(-4, 4), rnd(-4, 4));
        c.fillStyle = 'rgba(255,77,94,.9)'; c.font = '900 18px "Arial Black",sans-serif'; c.textAlign = 'center';
        c.fillText('ОПОРУ РАСКАЧИВАЮТ! F — ОТОГНАТЬ', w / 2, h - 110); c.textAlign = 'left';
        c.restore();
      }
    }
  };
  Mini.open(g, q => onDone(applyWorkMods(q)));
}

  Radio.timer -= dt;

    Radio.timer = 13;

/* вспомогательная плоская отрисовка для мини-игр и интерфейса */
function wrapText(c, text, x, y, maxW, lh) {
  const words = String(text).split(' ');
  let line = '', yy = y;
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (c.measureText(test).width > maxW && line) { c.fillText(line, x, yy); line = w; yy += lh; }
    else line = test;
  }
  c.fillText(line, x, yy);
}

function drawPerson(c, x, y, o) {
  const ph = o.phase || 0, dir = o.dir || 0;
  const facing = Math.cos(dir) >= 0 ? 1 : -1;
  const bob = Math.sin(ph * 2) * 1.4;
  const legA = Math.sin(ph * 2) * 6, legB = -legA;
  c.save(); c.translate(x, y);
  c.fillStyle = 'rgba(10,6,20,.38)';
  c.beginPath(); c.ellipse(3, 2, 11, 5, 0, 0, TAU); c.fill();
  c.strokeStyle = o.pants || '#2f3550'; c.lineWidth = 4.4; c.lineCap = 'round';
  c.beginPath(); c.moveTo(-2, -12); c.lineTo(-2 + legA * 0.5, 0); c.moveTo(3, -12); c.lineTo(3 + legB * 0.5, 0); c.stroke();
  c.fillStyle = o.body || '#ff8a1f';
  roundRect(0, c, -8, -30 + bob, 17, 20, 4); c.fill();
  if (o.vest) { c.fillStyle = 'rgba(255,255,255,.5)'; c.fillRect(-8, -24 + bob, 17, 2.6); c.fillRect(-8, -19 + bob, 17, 2.6); }
  c.strokeStyle = o.body || '#ff8a1f'; c.lineWidth = 4;
  const armA = Math.sin(ph * 2 + Math.PI) * 5;
  c.beginPath(); c.moveTo(-6, -26 + bob); c.lineTo(-9 + armA * 0.4, -16 + bob); c.stroke();
  c.beginPath(); c.moveTo(7, -26 + bob); c.lineTo(10 - armA * 0.4, -16 + bob); c.stroke();
  if (o.bag) { c.fillStyle = '#3a2a22'; roundRect(0, c, 6 * facing, -22 + bob, 11, 12, 3); c.fill(); c.fillStyle = '#ffd23f'; c.fillRect(6 * facing + 2, -19 + bob, 7, 2); }
  c.fillStyle = o.skin || '#e8b48a';
  c.beginPath(); c.arc(0.5, -36 + bob, 8, 0, TAU); c.fill();
  c.fillStyle = o.hair || '#4a3a2a';
  c.beginPath(); c.arc(0.5, -38 + bob, 8, Math.PI, TAU); c.fill();
  if (o.cap) { c.fillStyle = o.cap; c.beginPath(); c.arc(0.5, -39 + bob, 8.4, Math.PI, TAU); c.fill(); c.fillRect(0.5 + (facing > 0 ? 0 : -10), -40 + bob, 10, 3); }
  c.fillStyle = '#1b1226';
  c.beginPath(); c.arc(0.5 + 2.6 * facing, -36 + bob, 1.4, 0, TAU); c.fill();
  if (o.tool) { c.fillStyle = '#ffd23f'; c.fillRect(9 * facing, -25 + bob, 8, 4); }
  c.restore();
}
function drawToolIcon(c, x, y, id, on) {

    case 'drill':

    case 'ties':

function moveWithCollision(e, dt, r, isBike) {
  e.x += e.vx * dt; e.z += e.vz * dt;
  let hard = null, impact = 0;
  for (const s of solidsNear(e.x, e.z, r + 1)) {
    const c = circleRect(e.x, e.z, r, s);
    if (!c || s.soft) continue;
    e.x += c.nx * c.push; e.z += c.nz * c.push;
    const vn = e.vx * c.nx + e.vz * c.nz;
    if (vn < 0) {
      const bounce = isBike ? 0.18 : 0.05;
      e.vx -= (1 + bounce) * vn * c.nx; e.vz -= (1 + bounce) * vn * c.nz;
      if (-vn > impact) { impact = -vn; hard = s; }
    }
  }
  if (hard && impact > 4.2) {
    if (isBike) {
      S.bike.speed *= 0.25;
      damageBike(impact * 0.9);
      hurt(impact * 0.5, 'Олег познакомился со стеной ближе, чем планировал.');
      S.stats.crashes++;
      Audio2.crash(); shake(9);
      fx3(e.x, 0.8, e.z, 'spark', 9);
      if (hard.fragile) breakProp(hard);
    } else { Audio2.thud(); shake(3); }
  } else if (hard && impact > 1.6 && isBike) {
    Audio2.thud(); shake(2);
    if (hard.fragile && impact > 3) breakProp(hard);
  }
  /* Кузов машины — тоже препятствие: раньше Олег проходил сквозь неё насквозь. */
  for (const c of S.cars) {
    if (dist2(e.x, e.z, c.x, c.z) > 49) continue;
    const h = carHit(c, e.x, e.z, r + 0.12);
    if (!h) continue;
    e.x += h.nx * h.push; e.z += h.nz * h.push;
    const vn = e.vx * h.nx + e.vz * h.nz;
    if (vn < 0) { e.vx -= vn * h.nx; e.vz -= vn * h.nz; }
  }
  e.x = clamp(e.x, 0.6, W.x - 0.6); e.z = clamp(e.z, 0.6, W.z - 0.6);
  return { impact, hit: hard };
}

function inputVec() {
