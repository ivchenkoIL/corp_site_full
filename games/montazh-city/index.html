const View = { cv: null, c: null, w: 0, h: 0, dpr: 1, zoom: 1, night: null, nc: null, sunset: null, sunsetKey: '' };

function resizeView() {
  const r = $('stage').getBoundingClientRect();
  View.dpr = Math.min(2, window.devicePixelRatio || 1);
  View.w = Math.max(320, Math.floor(r.width));
  View.h = Math.max(240, Math.floor(r.height));
  S.view.w = View.w; S.view.h = View.h;
  View.cv.width = Math.floor(View.w * View.dpr); View.cv.height = Math.floor(View.h * View.dpr);
  View.cv.style.width = View.w + 'px'; View.cv.style.height = View.h + 'px';
  View.c.setTransform(View.dpr, 0, 0, View.dpr, 0, 0);
  View.night.width = View.cv.width; View.night.height = View.cv.height;
  View.sunsetKey = '';
  View.zoom = clamp(Math.min(View.w, View.h * 1.62) / 1040, 0.78, 1.62);
  if (Mini.g) Mini.resize();
}

function updateCamera(dt) {
  const p = S.player;
  const vw = View.w / View.zoom, vh = View.h / View.zoom;
  let tx = p.x - vw / 2, ty = p.y - vh / 2;
  if (p.onBike) { tx += Math.cos(S.bike.dir) * Math.min(150, Math.abs(S.bike.speed) * 0.4); ty += Math.sin(S.bike.dir) * Math.min(150, Math.abs(S.bike.speed) * 0.4); }
  S.cam.x = lerp(S.cam.x, clamp(tx, 0, Math.max(0, WORLD.w - vw)), 1 - Math.exp(-7 * dt));
  S.cam.y = lerp(S.cam.y, clamp(ty, 0, Math.max(0, WORLD.h - vh)), 1 - Math.exp(-7 * dt));
}

function drawBuilding(c, b, dark) {
  const ox = -b.ht * 0.17, oy = -b.ht;
  if (!b._pal) {
    const V = {
      panel: [['#7b6294', '#5d4a72', '#8f76a8'], ['#8a6274', '#6a4858', '#9c7488'],
              ['#5f6f96', '#485472', '#7285ad'], ['#7d7a5c', '#5e5c46', '#928f6e']],
      industrial: [['#5f6b7d', '#485262', '#74808f'], ['#6d6560', '#524c48', '#827a72']],
      garage: [['#6a5a72', '#514459', '#7d6b86'], ['#5c6470', '#464d57', '#6f7885']],
      shop: [['#8c5f96', '#6d4776', '#a173aa'], ['#966a5a', '#755146', '#ab7f6d']],
      office: [['#6a548c', '#513f6c', '#7f68a3'], ['#4f5f8c', '#3c496c', '#6274a3']],
      trafo: [['#7a6f52', '#5d543e', '#8f8365']]
    }[b.kind] || [['#66596e', '#4e4455', '#7b6d84']];
    b._pal = V[Math.abs(Math.floor(b.x * 3 + b.y * 7)) % V.length];
  }
  const palette = b._pal;

  /* тень */
  c.fillStyle = 'rgba(10,6,20,.42)';
  c.beginPath();
  c.moveTo(b.x + 8, b.y + b.h); c.lineTo(b.x + b.w + 18, b.y + b.h);
  c.lineTo(b.x + b.w + 26, b.y + b.h + 14); c.lineTo(b.x + 16, b.y + b.h + 14);
  c.closePath(); c.fill();

  /* правая грань */
  c.fillStyle = palette[1];
  c.beginPath();
  c.moveTo(b.x + b.w, b.y); c.lineTo(b.x + b.w, b.y + b.h);
  c.lineTo(b.x + b.w + ox, b.y + b.h + oy); c.lineTo(b.x + b.w + ox, b.y + oy);
  c.closePath(); c.fill();

  /* фронт */
  c.fillStyle = palette[0];
  c.beginPath();
  c.moveTo(b.x, b.y + b.h); c.lineTo(b.x + b.w, b.y + b.h);
  c.lineTo(b.x + b.w + ox, b.y + b.h + oy); c.lineTo(b.x + ox, b.y + b.h + oy);
  c.closePath(); c.fill();
  c.strokeStyle = 'rgba(14,9,26,.55)'; c.lineWidth = 2; c.stroke();
  const fg = c.createLinearGradient(b.x, b.y + b.h, b.x + ox, b.y + b.h + oy);
  fg.addColorStop(0, 'rgba(255,138,31,.16)'); fg.addColorStop(1, 'rgba(20,10,40,.30)');
  c.fillStyle = fg;
  c.beginPath();
  c.moveTo(b.x, b.y + b.h); c.lineTo(b.x + b.w, b.y + b.h);
  c.lineTo(b.x + b.w + ox, b.y + b.h + oy); c.lineTo(b.x + ox, b.y + b.h + oy);
  c.closePath(); c.fill();

  /* окна на фронте */
  const rows = Math.max(1, Math.floor(b.ht / 34)), cols = Math.max(2, Math.floor(b.w / 46));
  const seed = Math.floor(b.x * 7 + b.y * 13);
  const R = mulberry32(seed);
  for (let r = 0; r < rows; r++) for (let k = 0; k < cols; k++) {
    const u0 = (k + 0.22) / cols, u1 = (k + 0.78) / cols;
    const v0 = (r + 0.25) / rows, v1 = (r + 0.75) / rows;
    const P = (u, v) => ({
      x: b.x + u * b.w + v * ox,
      y: b.y + b.h + v * oy
    });
    const a = P(u0, v0), bb = P(u1, v0), cc = P(u1, v1), dd = P(u0, v1);
    const lit = R() < (dark > 0.25 ? 0.55 : 0.08);
    c.fillStyle = lit ? (R() < .3 ? 'rgba(255,210,63,.9)' : 'rgba(255,235,190,.82)') : 'rgba(30,24,44,.75)';
    c.beginPath(); c.moveTo(a.x, a.y); c.lineTo(bb.x, bb.y); c.lineTo(cc.x, cc.y); c.lineTo(dd.x, dd.y); c.closePath(); c.fill();
  }
  /* крыша */
  c.fillStyle = palette[2];
  c.fillRect(b.x + ox, b.y + oy, b.w, b.h);
  c.strokeStyle = 'rgba(12,8,22,.45)'; c.lineWidth = 2;
  c.strokeRect(b.x + ox, b.y + oy, b.w, b.h);
  if (b.kind === 'panel' || b.kind === 'office') {
    c.fillStyle = 'rgba(20,14,32,.55)';
    c.fillRect(b.x + ox + 10, b.y + oy + 8, 26, 18);
    c.fillRect(b.x + ox + b.w - 44, b.y + oy + b.h - 26, 30, 16);
  }
  if (b.kind === 'industrial') {
    c.strokeStyle = 'rgba(20,14,32,.35)'; c.lineWidth = 3;
    for (let i = 1; i < 6; i++) {
      c.beginPath(); c.moveTo(b.x + ox + i * b.w / 6, b.y + oy); c.lineTo(b.x + ox + i * b.w / 6, b.y + oy + b.h); c.stroke();
    }
  }
  if (b.rows) {                                  /* ворота гаражей */
    const n = b.rows;
    for (let i = 0; i < n; i++) {
      const u0 = (i + 0.12) / n, u1 = (i + 0.88) / n;
      const P = (u, v) => ({ x: b.x + u * b.w + v * ox, y: b.y + b.h + v * oy });
      const a = P(u0, 0.08), bb = P(u1, 0.08), cc = P(u1, 0.82), dd = P(u0, 0.82);
      c.fillStyle = ['#7a4a3a', '#4a6a7a', '#6a5a3a', '#5a4a6a', '#3a6a5a'][i % 5];
      c.beginPath(); c.moveTo(a.x, a.y); c.lineTo(bb.x, bb.y); c.lineTo(cc.x, cc.y); c.lineTo(dd.x, dd.y); c.closePath(); c.fill();
      c.strokeStyle = 'rgba(15,10,26,.55)'; c.lineWidth = 1.5; c.stroke();
    }
  }
  /* подъезды */
  if (b.entries) for (const ex of b.entries) {
    const u = (ex - b.x) / b.w;
    const P = (uu, v) => ({ x: b.x + uu * b.w + v * ox, y: b.y + b.h + v * oy });
    const a = P(u - 0.045, 0.02), bb = P(u + 0.045, 0.02), cc = P(u + 0.045, 0.30), dd = P(u - 0.045, 0.30);
    c.fillStyle = '#241a30';
    c.beginPath(); c.moveTo(a.x, a.y); c.lineTo(bb.x, bb.y); c.lineTo(cc.x, cc.y); c.lineTo(dd.x, dd.y); c.closePath(); c.fill();
    c.strokeStyle = '#ffd23f'; c.lineWidth = 1.6; c.stroke();
  }
  if (b.door) {
    const u = (b.door[0] - b.x) / b.w;
    const P = (uu, v) => ({ x: b.x + uu * b.w + v * ox, y: b.y + b.h + v * oy });
    const a = P(u - 0.06, 0.02), bb = P(u + 0.06, 0.02), cc = P(u + 0.06, 0.34), dd = P(u - 0.06, 0.34);
    c.fillStyle = '#1c1428';
    c.beginPath(); c.moveTo(a.x, a.y); c.lineTo(bb.x, bb.y); c.lineTo(cc.x, cc.y); c.lineTo(dd.x, dd.y); c.closePath(); c.fill();
    c.strokeStyle = 'rgba(37,232,220,.7)'; c.lineWidth = 2; c.stroke();
  }
  /* вывеска */
  if (b.sign) {
    const sx = b.x + b.w / 2 + ox * 0.62, sy = b.y + b.h + oy * 0.72;
    c.save();
    c.font = '900 ' + clamp(b.w / (b.sign.t.length * 0.62), 9, 21).toFixed(0) + 'px "Arial Black", sans-serif';
    c.textAlign = 'center';
    c.shadowColor = b.sign.c; c.shadowBlur = dark > 0.15 ? 22 : 10;
    c.fillStyle = b.sign.c;
    c.fillText(b.sign.t, sx, sy);
    c.shadowBlur = 0;
    c.restore();
  }
  if (b.name) {
    c.save(); c.font = '700 11px "Trebuchet MS", sans-serif'; c.textAlign = 'center';
    c.fillStyle = 'rgba(233,220,255,.55)';
    c.fillText(b.name, b.x + b.w / 2 + ox * 0.5, b.y + b.h + oy * 0.35);
    c.restore();
  }
}

function drawKiosk(c, k, dark) {
  const ht = 52, ox = -ht * 0.17, oy = -ht;
  c.fillStyle = 'rgba(10,6,20,.4)'; c.fillRect(k.x + 6, k.y + k.h, k.w + 8, 10);
  c.fillStyle = k.broken ? '#4a3a3a' : '#4a4258';
  c.beginPath(); c.moveTo(k.x + k.w, k.y); c.lineTo(k.x + k.w, k.y + k.h);
  c.lineTo(k.x + k.w + ox, k.y + k.h + oy); c.lineTo(k.x + k.w + ox, k.y + oy); c.closePath(); c.fill();
  c.fillStyle = k.broken ? '#5a4444' : '#5c5470';
  c.beginPath(); c.moveTo(k.x, k.y + k.h); c.lineTo(k.x + k.w, k.y + k.h);
  c.lineTo(k.x + k.w + ox, k.y + k.h + oy); c.lineTo(k.x + ox, k.y + k.h + oy); c.closePath(); c.fill();
  c.fillStyle = k.broken ? 'rgba(60,40,40,.9)' : 'rgba(255,235,190,.75)';
  c.fillRect(k.x + 8 + ox * 0.5, k.y + k.h + oy * 0.62, k.w - 16, 16);
  c.fillStyle = '#6a6280'; c.fillRect(k.x + ox, k.y + oy, k.w, k.h);
  c.save(); c.font = '900 9px "Arial Black",sans-serif'; c.textAlign = 'center';
  c.shadowColor = k.c; c.shadowBlur = dark > 0.15 ? 16 : 6; c.fillStyle = k.broken ? '#7a6a6a' : k.c;
  c.fillText(k.broken ? 'ЗАКРЫТО' : k.t, k.x + k.w / 2 + ox * 0.5, k.y + k.h + oy - 6);
  c.restore();
}

function drawPole(c, p, dark) {
  const H = p.lamp ? 108 : 96;
  c.fillStyle = 'rgba(10,6,20,.4)';
  c.beginPath(); c.ellipse(p.x + 6, p.y + 4, 12, 5, 0, 0, TAU); c.fill();
  c.strokeStyle = '#6b6278'; c.lineWidth = 6; c.lineCap = 'round';
  c.beginPath(); c.moveTo(p.x, p.y); c.lineTo(p.x - H * 0.12, p.y - H); c.stroke();
  c.lineWidth = 2; c.strokeStyle = '#8d8499';
  c.beginPath(); c.moveTo(p.x - 2, p.y - 20); c.lineTo(p.x - H * 0.12 + 2, p.y - H + 12); c.stroke();
  const tx = p.x - H * 0.12, ty = p.y - H;
  if (p.lamp) {
    c.fillStyle = '#4a4458';
    c.beginPath(); c.moveTo(tx, ty); c.lineTo(tx + 26, ty - 6); c.lineTo(tx + 30, ty + 4); c.lineTo(tx + 2, ty + 8); c.closePath(); c.fill();
    if (dark > 0.15) {
      c.save(); c.shadowColor = '#ffd9a0'; c.shadowBlur = 26;
      c.fillStyle = 'rgba(255,220,160,.95)';
      c.beginPath(); c.ellipse(tx + 16, ty + 5, 9, 4, 0, 0, TAU); c.fill();
      c.restore();
    }
  } else {
    c.fillStyle = '#5a5468'; c.fillRect(tx - 4, ty - 4, 12, 10);
    if (p.installed) {
      c.save(); c.translate(tx + 10, ty); c.rotate(p.camAng || 0.4); c.scale(0.62, 0.62);
      drawCamIcon(c, 0, 0, 1, 0);
      c.restore();
      if (dark > 0.2) { c.fillStyle = 'rgba(255,77,94,' + (0.4 + 0.6 * Math.abs(Math.sin(S.t * 2))) + ')'; c.beginPath(); c.arc(tx + 8, ty - 6, 2.4, 0, TAU); c.fill(); }
    } else {
      c.fillStyle = '#8d8499'; c.fillRect(tx + 4, ty - 2, 10, 5);
    }
    c.save();
    c.font = '700 10px "Trebuchet MS",sans-serif'; c.textAlign = 'center';
    c.fillStyle = 'rgba(185,166,214,.7)';
    c.fillText(p.mount, p.x, p.y + 18);
    c.restore();
  }
}

function drawProp(c, p, dark) {
  const x = p.x, y = p.y;
  switch (p.kind) {
    case 'tree': {
      c.fillStyle = 'rgba(10,6,20,.35)'; c.beginPath(); c.ellipse(x + 8, y + 3, 16, 6, 0, 0, TAU); c.fill();
      c.fillStyle = '#4a3a2c'; c.fillRect(x - 4, y - 26, 8, 28);
      const g = c.createRadialGradient(x - 6, y - 46, 4, x, y - 40, 30);
      g.addColorStop(0, '#5f7a44'); g.addColorStop(1, '#33452a');
      c.fillStyle = g;
      c.beginPath(); c.arc(x, y - 42, 24, 0, TAU); c.fill();
      c.beginPath(); c.arc(x - 16, y - 32, 15, 0, TAU); c.fill();
      c.beginPath(); c.arc(x + 15, y - 34, 14, 0, TAU); c.fill();
      break;
    }
    case 'bush':
      c.fillStyle = 'rgba(10,6,20,.3)'; c.beginPath(); c.ellipse(x + 4, y + 2, 13, 5, 0, 0, TAU); c.fill();
      c.fillStyle = '#3d5230';
      c.beginPath(); c.arc(x, y - 8, 13, 0, TAU); c.arc(x - 10, y - 4, 9, 0, TAU); c.arc(x + 10, y - 5, 10, 0, TAU); c.fill();
      break;
    case 'bench':
      c.fillStyle = 'rgba(10,6,20,.3)'; c.fillRect(x - 26, y + 2, 56, 6);
      c.fillStyle = '#7a5a3a'; c.fillRect(x - 26, y - 10, 52, 8);
      c.fillStyle = '#5a4430'; c.fillRect(x - 26, y - 26, 52, 7);
      c.fillStyle = '#3a3446'; c.fillRect(x - 24, y - 4, 5, 10); c.fillRect(x + 19, y - 4, 5, 10);
      break;
    case 'bin':
      c.fillStyle = 'rgba(10,6,20,.3)'; c.beginPath(); c.ellipse(x, y + 3, 15, 5, 0, 0, TAU); c.fill();
      c.fillStyle = p.broken ? '#5a4a4a' : '#4a6a5a'; c.fillRect(x - 14, y - 24, 28, 26);
      c.fillStyle = '#3a5a4a'; c.fillRect(x - 16, y - 28, 32, 6);
      break;
    case 'sandbox':
      c.fillStyle = '#c9a86a'; c.beginPath(); c.ellipse(x, y, 44, 28, 0, 0, TAU); c.fill();
      c.strokeStyle = '#7a5a3a'; c.lineWidth = 6; c.stroke();
      break;
    case 'swing':
      c.strokeStyle = '#8a6a4a'; c.lineWidth = 5;
      c.beginPath(); c.moveTo(x - 24, y); c.lineTo(x - 16, y - 42); c.lineTo(x + 16, y - 42); c.lineTo(x + 24, y); c.stroke();
      c.strokeStyle = '#5a5468'; c.lineWidth = 2;
      const sw = Math.sin(S.t * 1.4) * 5;
      c.beginPath(); c.moveTo(x - 6 + sw, y - 42); c.lineTo(x - 6 + sw * 2, y - 14); c.moveTo(x + 6 + sw, y - 42); c.lineTo(x + 6 + sw * 2, y - 14); c.stroke();
      c.fillStyle = '#c94f4f'; c.fillRect(x - 10 + sw * 2, y - 16, 20, 5);
      break;
    case 'carousel':
      c.fillStyle = '#4a4458'; c.beginPath(); c.arc(x, y, 26, 0, TAU); c.fill();
      c.strokeStyle = '#c9a24f'; c.lineWidth = 4;
      for (let i = 0; i < 4; i++) {
        const a = S.t * 0.6 + i * Math.PI / 2;
        c.beginPath(); c.moveTo(x, y); c.lineTo(x + Math.cos(a) * 26, y + Math.sin(a) * 17); c.stroke();
      }
      break;
    case 'pipe':
      c.fillStyle = 'rgba(10,6,20,.3)'; c.fillRect(x - 44, y + 8, 92, 6);
      c.fillStyle = '#6a6478'; c.fillRect(x - 44, y - 14, 88, 24);
      c.fillStyle = '#8a8498'; c.fillRect(x - 44, y - 14, 88, 6);
      break;
    case 'barrel':
      c.fillStyle = 'rgba(10,6,20,.3)'; c.beginPath(); c.ellipse(x, y + 3, 13, 5, 0, 0, TAU); c.fill();
      c.fillStyle = p.broken ? '#6a4a3a' : '#b05a3a'; c.fillRect(x - 12, y - 26, 24, 28);
      c.fillStyle = '#d07a4a'; c.fillRect(x - 12, y - 26, 24, 4); c.fillRect(x - 12, y - 12, 24, 3);
      break;
    case 'pallet':
      c.fillStyle = '#8a6a4a'; c.fillRect(x - 22, y - 8, 44, 14);
      c.fillStyle = '#6a4a30';
      for (let i = 0; i < 4; i++) c.fillRect(x - 22 + i * 12, y - 8, 4, 14);
      break;
    case 'coil':
      c.fillStyle = 'rgba(10,6,20,.35)'; c.beginPath(); c.ellipse(x, y + 4, 22, 8, 0, 0, TAU); c.fill();
      c.strokeStyle = '#2a2a34'; c.lineWidth = 7;
      for (let i = 3; i > 0; i--) { c.beginPath(); c.ellipse(x, y - i * 3, 20 - i, 10 - i * 1.4, 0, 0, TAU); c.stroke(); }
      c.strokeStyle = '#25e8dc'; c.lineWidth = 2; c.beginPath(); c.ellipse(x, y - 10, 18, 8, 0, 0, TAU); c.stroke();
      break;
    case 'block':
      c.fillStyle = 'rgba(10,6,20,.3)'; c.fillRect(x - 22, y + 12, 48, 6);
      c.fillStyle = '#6a6478'; c.fillRect(x - 22, y - 18, 44, 32);
      c.fillStyle = '#7a7488'; c.fillRect(x - 22, y - 18, 44, 8);
      break;
    case 'cone':
      c.fillStyle = '#e8621f';
      c.beginPath(); c.moveTo(x, y - 22); c.lineTo(x + 9, y + 2); c.lineTo(x - 9, y + 2); c.closePath(); c.fill();
      c.fillStyle = '#f2f2f2'; c.fillRect(x - 6, y - 12, 12, 4);
      break;
    case 'board':
      c.fillStyle = '#4a4458'; c.fillRect(x - 26, y - 40, 52, 36);
      c.fillStyle = '#e9dcff'; c.fillRect(x - 22, y - 36, 44, 28);
      c.fillStyle = '#3a3446'; c.font = '700 7px "Trebuchet MS",sans-serif'; c.textAlign = 'center';
      wrapText(c, p.t || 'ОБЪЯВЛЕНИЕ', x, y - 26, 42, 8);
      c.textAlign = 'left';
      c.fillStyle = '#6a6478'; c.fillRect(x - 3, y - 6, 6, 8);
      break;
    case 'carcass':
      c.fillStyle = 'rgba(10,6,20,.35)'; c.fillRect(x - 40, y + 14, 84, 8);
      c.fillStyle = '#5a4a4a'; c.fillRect(x - 38, y - 18, 76, 32);
      c.fillStyle = '#3a2e2e'; c.fillRect(x - 30, y - 30, 46, 14);
      c.fillStyle = '#2a2224'; c.beginPath(); c.arc(x - 24, y + 14, 9, 0, TAU); c.arc(x + 24, y + 14, 9, 0, TAU); c.fill();
      break;
    case 'fenceH': {
      const w = p.w || 200;
      c.strokeStyle = '#6a6478'; c.lineWidth = 3;
      for (let i = 0; i <= w; i += 26) { c.beginPath(); c.moveTo(x + i, y + 6); c.lineTo(x + i, y - 30); c.stroke(); }
      c.lineWidth = 2;
      c.beginPath(); c.moveTo(x, y - 8); c.lineTo(x + w, y - 8); c.moveTo(x, y - 24); c.lineTo(x + w, y - 24); c.stroke();
      break;
    }
  }
}
function wrapText(c, text, x, y, maxW, lh) {
  const words = String(text).split(' ');
  let line = '', yy = y;
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (c.measureText(test).width > maxW && line) { c.fillText(line, x, yy); line = w; yy += lh; }
    else line = test;
  }
  c.fillText(line, x, yy);
}

/* --- люди --- */
function drawPerson(c, x, y, o) {
  const ph = o.phase || 0, dir = o.dir || 0;
  const facing = Math.cos(dir) >= 0 ? 1 : -1;
  const bob = Math.sin(ph * 2) * 1.4;
  const legA = Math.sin(ph * 2) * 6, legB = -legA;
  c.save(); c.translate(x, y);
  c.fillStyle = 'rgba(10,6,20,.38)';
  c.beginPath(); c.ellipse(3, 2, 11, 5, 0, 0, TAU); c.fill();
  c.strokeStyle = o.pants || '#2f3550'; c.lineWidth = 4.4; c.lineCap = 'round';
  c.beginPath(); c.moveTo(-2, -12); c.lineTo(-2 + legA * 0.5, 0); c.moveTo(3, -12); c.lineTo(3 + legB * 0.5, 0); c.stroke();
  c.fillStyle = o.body || '#ff8a1f';
  roundRect(0, c, -8, -30 + bob, 17, 20, 4); c.fill();
  if (o.vest) { c.fillStyle = 'rgba(255,255,255,.5)'; c.fillRect(-8, -24 + bob, 17, 2.6); c.fillRect(-8, -19 + bob, 17, 2.6); }
  c.strokeStyle = o.body || '#ff8a1f'; c.lineWidth = 4;
  const armA = Math.sin(ph * 2 + Math.PI) * 5;
  c.beginPath(); c.moveTo(-6, -26 + bob); c.lineTo(-9 + armA * 0.4, -16 + bob); c.stroke();
  c.beginPath(); c.moveTo(7, -26 + bob); c.lineTo(10 - armA * 0.4, -16 + bob); c.stroke();
  if (o.bag) { c.fillStyle = '#3a2a22'; roundRect(0, c, 6 * facing, -22 + bob, 11, 12, 3); c.fill(); c.fillStyle = '#ffd23f'; c.fillRect(6 * facing + 2, -19 + bob, 7, 2); }
  c.fillStyle = o.skin || '#e8b48a';
  c.beginPath(); c.arc(0.5, -36 + bob, 8, 0, TAU); c.fill();
  c.fillStyle = o.hair || '#4a3a2a';
  c.beginPath(); c.arc(0.5, -38 + bob, 8, Math.PI, TAU); c.fill();
  if (o.cap) { c.fillStyle = o.cap; c.beginPath(); c.arc(0.5, -39 + bob, 8.4, Math.PI, TAU); c.fill(); c.fillRect(0.5 + (facing > 0 ? 0 : -10), -40 + bob, 10, 3); }
  c.fillStyle = '#1b1226';
  c.beginPath(); c.arc(0.5 + 2.6 * facing, -36 + bob, 1.4, 0, TAU); c.fill();
  if (o.tool) { c.fillStyle = '#ffd23f'; c.fillRect(9 * facing, -25 + bob, 8, 4); }
  c.restore();
}
function drawDog(c, d) {
  const run = Math.sin(d.phase * 2) * 3;
  c.save(); c.translate(d.x, d.y);
  if (Math.cos(d.dir) < 0) c.scale(-1, 1);
  c.fillStyle = 'rgba(10,6,20,.35)'; c.beginPath(); c.ellipse(2, 2, 13, 5, 0, 0, TAU); c.fill();
  c.fillStyle = '#8a6a4a';
  roundRect(0, c, -12, -16, 24, 12, 5); c.fill();
  c.strokeStyle = '#8a6a4a'; c.lineWidth = 3; c.lineCap = 'round';
  c.beginPath(); c.moveTo(-8, -6); c.lineTo(-8 + run, 0); c.moveTo(8, -6); c.lineTo(8 - run, 0); c.stroke();
  c.beginPath(); c.arc(13, -18, 6, 0, TAU); c.fillStyle = '#8a6a4a'; c.fill();
  c.fillStyle = '#5a4430';
  c.beginPath(); c.moveTo(10, -23); c.lineTo(13, -30); c.lineTo(16, -22); c.closePath(); c.fill();
  c.strokeStyle = '#8a6a4a'; c.lineWidth = 3;
  c.beginPath(); c.moveTo(-12, -14); c.quadraticCurveTo(-20, -20 + run, -18, -10); c.stroke();
  c.fillStyle = '#1b1226'; c.beginPath(); c.arc(16, -19, 1.4, 0, TAU); c.fill();
  c.restore();
}
function drawCar(c, car) {
  c.save(); c.translate(car.x, car.y); c.rotate(car.a);
  c.fillStyle = 'rgba(10,6,20,.4)'; roundRect(0, c, -car.w / 2 + 4, -car.h / 2 + 5, car.w, car.h, 6); c.fill();
  c.fillStyle = car.c; roundRect(0, c, -car.w / 2, -car.h / 2 - 4, car.w, car.h, 6); c.fill();
  c.fillStyle = 'rgba(20,24,40,.85)';
  roundRect(0, c, -car.w / 2 + 8, -car.h / 2 + 1, car.w * 0.42, car.h - 10, 3); c.fill();
  c.fillStyle = 'rgba(255,255,255,.16)'; c.fillRect(-car.w / 2 + 2, -car.h / 2 - 2, car.w - 4, 3);
  const dark = darkness();
  if (dark > 0.2) {
    c.fillStyle = 'rgba(255,240,190,.85)';
    c.beginPath(); c.arc(car.w / 2 - 3, -car.h / 2 + 3, 3, 0, TAU); c.arc(car.w / 2 - 3, car.h / 2 - 7, 3, 0, TAU); c.fill();
    c.fillStyle = 'rgba(255,80,80,.8)';
    c.fillRect(-car.w / 2, -car.h / 2 + 1, 3, 4); c.fillRect(-car.w / 2, car.h / 2 - 9, 3, 4);
  }
  if (car.horn > 0) {
    c.fillStyle = '#ffd23f'; c.font = '900 14px "Arial Black",sans-serif'; c.textAlign = 'center';
    c.save(); c.rotate(-car.a); c.fillText('БИ-БИ!', 0, -26); c.restore(); c.textAlign = 'left';
  }
  c.restore();
}
function drawBike(c, x, y, dir, wheel, riding) {
  c.save(); c.translate(x, y); c.rotate(dir);
  c.fillStyle = 'rgba(10,6,20,.4)';
  c.beginPath(); c.ellipse(2, 4, 20, 6, 0, 0, TAU); c.fill();
  c.strokeStyle = '#2a2632'; c.lineWidth = 3.5;
  c.beginPath(); c.arc(-15, 0, 8, 0, TAU); c.stroke();
  c.beginPath(); c.arc(15, 0, 8, 0, TAU); c.stroke();
  c.strokeStyle = '#8d8499'; c.lineWidth = 1;
  for (let i = 0; i < 4; i++) {
    const a = wheel + i * Math.PI / 4;
    c.beginPath(); c.moveTo(-15 - Math.cos(a) * 7, -Math.sin(a) * 7); c.lineTo(-15 + Math.cos(a) * 7, Math.sin(a) * 7); c.stroke();
    c.beginPath(); c.moveTo(15 - Math.cos(a) * 7, -Math.sin(a) * 7); c.lineTo(15 + Math.cos(a) * 7, Math.sin(a) * 7); c.stroke();
  }
  c.strokeStyle = S.upgrades.frame ? '#25e8dc' : '#c94f4f'; c.lineWidth = 3;
  c.beginPath();
  c.moveTo(-15, 0); c.lineTo(-2, -8); c.lineTo(10, -8); c.lineTo(15, 0); c.moveTo(-2, -8); c.lineTo(2, 0); c.lineTo(15, 0);
  c.stroke();
  c.strokeStyle = '#3a3446'; c.lineWidth = 2.6;
  c.beginPath(); c.moveTo(10, -8); c.lineTo(13, -15); c.moveTo(8, -15); c.lineTo(18, -15); c.stroke();
  c.fillStyle = '#2a2632'; c.fillRect(-6, -13, 9, 4);
  if (S.upgrades.rack) { c.fillStyle = '#6a6478'; c.fillRect(-20, -12, 12, 4); }
  if (S.upgrades.light) {
    c.fillStyle = '#ffd23f'; c.beginPath(); c.arc(19, -12, 3, 0, TAU); c.fill();
    if (darkness() > 0.2) {
      c.save(); c.globalAlpha = .28; c.fillStyle = '#ffe6a0';
      c.beginPath(); c.moveTo(20, -11); c.lineTo(96, -30); c.lineTo(96, 8); c.closePath(); c.fill(); c.restore();
    }
  }
  c.restore();
  if (riding) {
    const lean = Math.sin(S.t * 6) * (S.bike.wobble * 3);
    drawPerson(c, x, y - 6 + lean * 0.3, {
      phase: wheel * 2, dir, body: '#ff8a1f', vest: true, cap: '#3a3446',
      hair: '#5a4230', bag: true, pants: '#2f3550'
    });
  }
}

/* --- главный кадр --- */
function render() {
  const c = View.c;
  c.setTransform(View.dpr, 0, 0, View.dpr, 0, 0);
  c.clearRect(0, 0, View.w, View.h);
  const dark = darkness();
  const sx = S.shake > 0.3 ? rnd(-S.shake, S.shake) : 0;
  const sy = S.shake > 0.3 ? rnd(-S.shake, S.shake) : 0;
  c.save();
  c.scale(View.zoom, View.zoom);
  c.translate(-S.cam.x + sx / View.zoom, -S.cam.y + sy / View.zoom);
  const vw = View.w / View.zoom, vh = View.h / View.zoom;
  const cull = { x: S.cam.x - 80, y: S.cam.y - 220, w: vw + 160, h: vh + 320 };

  /* земля */
  if (Ground.c) c.drawImage(Ground.c, S.cam.x - 4, S.cam.y - 4, vw + 8, vh + 8, S.cam.x - 4, S.cam.y - 4, vw + 8, vh + 8);

  /* следы торможения */
  c.save();
  for (const m of S.marks) {
    c.globalAlpha = clamp(m.life / 6, 0, 1) * 0.5;
    c.strokeStyle = '#15111f'; c.lineWidth = 4; c.lineCap = 'round';
    c.beginPath(); c.moveTo(m.x - Math.cos(m.a) * 8, m.y - Math.sin(m.a) * 8);
    c.lineTo(m.x + Math.cos(m.a) * 8, m.y + Math.sin(m.a) * 8); c.stroke();
  }
  c.restore();

  /* ямы */
  for (const hl of POTHOLES) {
    if (hl.x < cull.x || hl.x > cull.x + cull.w || hl.y < cull.y || hl.y > cull.y + cull.h) continue;
    c.fillStyle = '#1a1622';
    c.beginPath(); c.ellipse(hl.x, hl.y, hl.r, hl.r * 0.62, 0, 0, TAU); c.fill();
    c.strokeStyle = 'rgba(90,80,110,.5)'; c.lineWidth = 2; c.stroke();
  }

  /* маркер цели на земле */
  const tgt = S.mission && S.mission.target;
  if (tgt) {
    const pulse = 0.5 + 0.5 * Math.sin(S.t * 3);
    c.save();
    c.strokeStyle = 'rgba(255,210,63,' + (0.35 + pulse * 0.45) + ')'; c.lineWidth = 3;
    c.beginPath(); c.arc(tgt.x, tgt.y, 26 + pulse * 8, 0, TAU); c.stroke();
    c.fillStyle = 'rgba(255,210,63,.12)'; c.fill();
    c.restore();
  }
  /* точки поиска / тёмные опоры */
  const M = S.mission;
  if (M && M.stage === 'work' && M.def.kind === 'search' && M.data.spots) {
    for (const s of M.data.spots) {
      c.save();
      c.strokeStyle = s.searched ? 'rgba(120,110,140,.5)' : 'rgba(37,232,220,.8)';
      c.setLineDash([6, 5]); c.lineWidth = 2;
      c.beginPath(); c.arc(s.x, s.y, 34, 0, TAU); c.stroke(); c.setLineDash([]);
      c.fillStyle = s.searched ? 'rgba(120,110,140,.6)' : '#25e8dc';
      c.font = '700 11px "Trebuchet MS",sans-serif'; c.textAlign = 'center';
      c.fillText(s.label, s.x, s.y - 40); c.textAlign = 'left';
      c.restore();
    }
  }
  if (M && M.def.kind === 'final' && M.data.coils) {
    for (const coil of M.data.coils) {
      c.save();
      c.strokeStyle = coil.lost ? '#ff4d5e' : coil.saved ? '#4be36b' : '#ffd23f';
      c.lineWidth = 3; c.beginPath(); c.arc(coil.x, coil.y, 30, 0, TAU); c.stroke();
      if (!coil.saved && !coil.lost && coil.prog > 0) {
        c.strokeStyle = '#ff4d5e'; c.lineWidth = 5;
        c.beginPath(); c.arc(coil.x, coil.y, 30, -Math.PI / 2, -Math.PI / 2 + coil.prog * TAU); c.stroke();
      }
      c.restore();
      drawProp(c, { kind: 'coil', x: coil.x, y: coil.y });
    }
  }

  /* список для сортировки по Y */
  const list = [];
  for (const b of BUILDINGS) if (b.x < cull.x + cull.w && b.x + b.w > cull.x && b.y < cull.y + cull.h && b.y + b.h > cull.y) list.push({ y: b.y + b.h, d: () => drawBuilding(c, b, dark) });
  for (const k of KIOSKS) if (k.x < cull.x + cull.w && k.x + k.w > cull.x && k.y < cull.y + cull.h && k.y + k.h > cull.y) list.push({ y: k.y + k.h, d: () => drawKiosk(c, k, dark) });
  for (const p of POLES) if (p.x > cull.x && p.x < cull.x + cull.w && p.y > cull.y && p.y < cull.y + cull.h) list.push({ y: p.y, d: () => drawPole(c, p, dark) });
  for (const p of PROPS) if (p.x > cull.x - 60 && p.x < cull.x + cull.w + 60 && p.y > cull.y && p.y < cull.y + cull.h) list.push({ y: p.y, d: () => drawProp(c, p, dark) });
  for (const car of S.cars) if (car.x > cull.x - 60 && car.x < cull.x + cull.w + 60 && car.y > cull.y - 60 && car.y < cull.y + cull.h + 60) list.push({ y: car.y, d: () => drawCar(c, car) });
  for (const d of S.dogs) list.push({ y: d.y, d: () => drawDog(c, d) });
  for (const h of S.hools) list.push({
    y: h.y, d: () => {
      drawPerson(c, h.x, h.y, { phase: h.phase, dir: h.dir, body: h.type === 'thief' ? '#4a4a5a' : h.type === 'rocker' ? '#5a3a6a' : '#3a4a5a', cap: '#2a2a3a', hair: '#20202a', pants: '#22222e', tool: !!h.holds });
      if (h.say > 0) bubble(c, h.x, h.y - 52, h.line);
    }
  });
  for (const q of S.peds) {
    if (q.x < cull.x - 60 || q.x > cull.x + cull.w + 60 || q.y < cull.y - 60 || q.y > cull.y + cull.h + 60) continue;
    list.push({
      y: q.y, d: () => {
        if (q.down > 0) {
          c.save(); c.translate(q.x, q.y); c.rotate(Math.PI / 2 * clamp(q.down / 0.4, 0, 1));
          drawPerson(c, 0, 0, { phase: 0, dir: q.dir, body: q.body, hair: q.hair, cap: q.cap, pants: '#33334a', bag: q.bag });
          c.restore();
        } else {
          drawPerson(c, q.x, q.y, { phase: q.phase, dir: q.dir, body: q.body, hair: q.hair, cap: q.cap, pants: '#33334a', bag: q.bag });
        }
        if (q.say > 0) bubble(c, q.x, q.y - 52, q.line);
      }
    });
  }
  for (const g of S.grans) list.push({
    y: g.y, d: () => {
      drawPerson(c, g.x, g.y, { phase: g.phase, dir: Math.PI / 2, body: '#7a4a8a', hair: '#d8d8e0', pants: '#3a2a4a', skin: '#e2c0a4' });
      if (g.say > 0) bubble(c, g.x, g.y - 52, g.line);
    }
  });
  for (const g of S.guards) list.push({
    y: g.y, d: () => {
      c.save(); c.translate(g.x, g.y); c.rotate(g.dir);
      c.fillStyle = 'rgba(10,6,20,.4)'; c.beginPath(); c.ellipse(2, 4, 18, 6, 0, 0, TAU); c.fill();
      c.fillStyle = '#3a2a3a'; roundRect(0, c, -16, -9, 32, 18, 5); c.fill();
      c.fillStyle = '#2a2632'; c.beginPath(); c.arc(-12, 0, 6, 0, TAU); c.arc(12, 0, 6, 0, TAU); c.fill();
      c.restore();
      drawPerson(c, g.x, g.y - 10, { phase: g.phase, dir: g.dir, body: '#5a1a1a', cap: '#ff4d5e', hair: '#2a2a2a', pants: '#2a2030' });
      const bl = Math.sin(S.t * 12) > 0;
      c.fillStyle = bl ? '#ff4d5e' : '#25e8dc';
      c.beginPath(); c.arc(g.x, g.y - 44, 4, 0, TAU); c.fill();
    }
  });
  for (const n of S.npcs) list.push({
    y: n.y, d: () => {
      const st = n.kind === 'sanya'
        ? { body: '#25e8dc', cap: '#0e5a56', hair: '#3a2a1f', bag: true, vest: true }
        : { body: '#3a6a8a', hair: '#4a3a2a' };
      drawPerson(c, n.x, n.y, Object.assign({ phase: n.phase, dir: n.dir, pants: '#2a2a3a' }, st));
      if (n.say > 0) bubble(c, n.x, n.y - 54, n.line);
      if (n.kind === 'client') {
        c.fillStyle = 'rgba(37,232,220,.9)'; c.font = '700 11px "Trebuchet MS",sans-serif'; c.textAlign = 'center';
        c.fillText(CHARS[n.who] ? CHARS[n.who].name : 'КЛИЕНТ', n.x, n.y - 56); c.textAlign = 'left';
      }
    }
  });
  if (M && M.def.kind === 'final' && M.data.raiders && M.data.step === 5) {
    for (const r of M.data.raiders) if (!r.done) list.push({
      y: r.y, d: () => drawPerson(c, r.x, r.y, { phase: r.phase, dir: r.dir, body: '#4a4a5a', cap: '#2a2a3a', hair: '#20202a', pants: '#22222e' })
    });
  }
  /* игрок */
  const p = S.player;
  if (p.onBike) list.push({ y: p.y, d: () => drawBike(c, p.x, p.y, S.bike.dir, S.bike.wheel, true) });
  else {
    list.push({ y: S.bike.y, d: () => drawBike(c, S.bike.x, S.bike.y, S.bike.dir, 0, false) });
    list.push({
      y: p.y, d: () => {
        drawPerson(c, p.x, p.y, {
          phase: p.walkPhase, dir: p.dir, body: p.hurt > 0 ? '#ff4d5e' : '#ff8a1f', vest: true,
          cap: '#3a3446', hair: '#5a4230', bag: true, pants: '#2f3550', tool: p.swing > 0
        });
        if (p.swing > 0) {
          c.save(); c.translate(p.x, p.y - 20); c.rotate(p.dir + (1 - p.swing / 0.35) * 2.2);
          c.fillStyle = '#3a2a22'; roundRect(0, c, 14, -8, 20, 16, 4); c.fill();
          c.restore();
        }
      }
    });
  }
  list.sort((a, b) => a.y - b.y);
  for (const it of list) it.d();

  /* «рентген»: если Олег зашёл за высокий дом — показываем силуэт */
  if (occludedAt(p.x, p.y)) {
    c.save();
    c.globalAlpha = 0.9;
    c.setLineDash([]);
    c.beginPath(); c.arc(p.x, p.y - 20, 19, 0, TAU);
    c.strokeStyle = 'rgba(255,210,63,.9)'; c.lineWidth = 2; c.stroke();
    c.fillStyle = 'rgba(255,138,31,.35)'; c.fill();
    c.globalAlpha = 0.75;
    if (p.onBike) drawBike(c, p.x, p.y, S.bike.dir, S.bike.wheel, true);
    else drawPerson(c, p.x, p.y, { phase: p.walkPhase, dir: p.dir, body: '#ff8a1f', vest: true, cap: '#3a3446', hair: '#5a4230', bag: true, pants: '#2f3550' });
    c.restore();
  }

  /* частицы */
  for (const f of S.fx) {
    const a = clamp(f.life / f.max, 0, 1);
    if (f.kind === 'text') {
      c.save(); c.globalAlpha = a; c.fillStyle = f.color;
      c.font = '900 ' + f.s + 'px "Arial Black",sans-serif'; c.textAlign = 'center';
      c.fillText(f.text, f.x, f.y); c.restore(); c.textAlign = 'left';
    } else {
      c.globalAlpha = a; c.fillStyle = f.color;
      c.beginPath(); c.arc(f.x, f.y, f.s * a, 0, TAU); c.fill();
    }
  }
  c.globalAlpha = 1;

  /* стрелка к цели */
  if (tgt) {
    const dx = tgt.x - p.x, dy = tgt.y - p.y, d = Math.hypot(dx, dy);
    if (d > 190) {
      const a = Math.atan2(dy, dx);
      const rx = p.x + Math.cos(a) * 120, ry = p.y + Math.sin(a) * 120;
      c.save(); c.translate(rx, ry); c.rotate(a);
      c.fillStyle = 'rgba(255,210,63,.9)';
      c.beginPath(); c.moveTo(18, 0); c.lineTo(-10, -11); c.lineTo(-4, 0); c.lineTo(-10, 11); c.closePath(); c.fill();
      c.restore();
      c.fillStyle = 'rgba(255,210,63,.9)'; c.font = '700 12px "Trebuchet MS",sans-serif'; c.textAlign = 'center';
      c.fillText(Math.round(d / 10) + ' м · ' + tgt.label, rx, ry + 26); c.textAlign = 'left';
    }
  }
  c.restore();

  /* ночь и фонари */
  if (dark > 0.03) drawNight(dark);

  /* цветокоррекция заката */
  const hh = hour();
  if (hh >= 16 && hh < 21 && !S.lowFx) {
    const t = hh < 19 ? (hh - 16) / 3 : 1 - (hh - 19) / 2;
    if (t > 0.05) {
      const key = View.w + 'x' + View.h + ':' + Math.round(t * 12);
      if (View.sunsetKey !== key) {                 /* градиент кэшируем — он меняется редко */
        View.sunsetKey = key;
        const g = c.createLinearGradient(0, 0, View.w, View.h);
        g.addColorStop(0, 'rgba(255,138,31,' + (0.3 * t).toFixed(3) + ')');
        g.addColorStop(0.6, 'rgba(255,45,149,' + (0.18 * t).toFixed(3) + ')');
        g.addColorStop(1, 'rgba(122,44,255,' + (0.24 * t).toFixed(3) + ')');
        View.sunset = g;
      }
      c.save();
      c.globalCompositeOperation = 'overlay';
      c.fillStyle = View.sunset; c.fillRect(0, 0, View.w, View.h);
      c.restore();
    }
  }
  S.shake *= 0.86;
}

function occludedAt(px, py) {
  for (const b of BUILDINGS) {
    if (b.y + b.h <= py) continue;                 /* дом рисуется раньше — не мешает */
    const ox = -b.ht * 0.17, oy = -b.ht;
    if (px < b.x + ox - 6 || px > b.x + b.w + 6) continue;
    if (py < b.y + oy - 6 || py > b.y + b.h) continue;
    return true;
  }
  return false;
}
function bubble(c, x, y, text) {
  if (!text) return;
  c.save();
  c.font = '700 12px "Trebuchet MS",sans-serif';
  const w = Math.min(230, c.measureText(text).width + 18);
  c.fillStyle = 'rgba(12,7,24,.9)'; c.strokeStyle = 'rgba(255,45,149,.7)'; c.lineWidth = 2;
  roundRect(0, c, x - w / 2, y - 22, w, 26, 6); c.fill(); c.stroke();
  c.beginPath(); c.moveTo(x - 5, y + 4); c.lineTo(x + 5, y + 4); c.lineTo(x, y + 12); c.closePath(); c.fill();
  c.fillStyle = '#e9dcff'; c.textAlign = 'center';
  const disp = c.measureText(text).width > w - 18 ? text.slice(0, 30) + '…' : text;
  c.fillText(disp, x, y - 4); c.textAlign = 'left';
  c.restore();
}

function drawNight(dark) {
  const c = View.c, n = View.nc;
  n.setTransform(1, 0, 0, 1, 0, 0);
  n.clearRect(0, 0, View.night.width, View.night.height);
  n.setTransform(View.dpr, 0, 0, View.dpr, 0, 0);
  n.fillStyle = 'rgba(8,4,22,' + dark + ')';
  n.fillRect(0, 0, View.w, View.h);
  n.globalCompositeOperation = 'destination-out';
  const z = View.zoom;
  const toScreen = (x, y) => ({ x: (x - S.cam.x) * z, y: (y - S.cam.y) * z });
  /* фонари */
  for (const p of POLES) {
    if (!p.lamp) continue;
    const s = toScreen(p.x - 12, p.y - 100);
    if (s.x < -260 || s.x > View.w + 260 || s.y < -260 || s.y > View.h + 260) continue;
    const r = 165 * z;
    const g = n.createRadialGradient(s.x, s.y, 0, s.x, s.y, r);
    g.addColorStop(0, 'rgba(0,0,0,.95)'); g.addColorStop(0.55, 'rgba(0,0,0,.5)'); g.addColorStop(1, 'rgba(0,0,0,0)');
    n.fillStyle = g; n.beginPath(); n.arc(s.x, s.y, r, 0, TAU); n.fill();
  }
  /* вывески */
  for (const b of BUILDINGS) {
    if (!b.sign) continue;
    const s = toScreen(b.x + b.w / 2, b.y + b.h - b.ht * 0.7);
    if (s.x < -260 || s.x > View.w + 260 || s.y < -260 || s.y > View.h + 260) continue;
    const r = 120 * z;
    const g = n.createRadialGradient(s.x, s.y, 0, s.x, s.y, r);
    g.addColorStop(0, 'rgba(0,0,0,.7)'); g.addColorStop(1, 'rgba(0,0,0,0)');
    n.fillStyle = g; n.beginPath(); n.arc(s.x, s.y, r, 0, TAU); n.fill();
  }
  /* фары машин */
  for (const car of S.cars) {
    const s = toScreen(car.x + Math.cos(car.a) * 60, car.y + Math.sin(car.a) * 60);
    if (s.x < -200 || s.x > View.w + 200 || s.y < -200 || s.y > View.h + 200) continue;
    const r = 90 * z;
    const g = n.createRadialGradient(s.x, s.y, 0, s.x, s.y, r);
    g.addColorStop(0, 'rgba(0,0,0,.75)'); g.addColorStop(1, 'rgba(0,0,0,0)');
    n.fillStyle = g; n.beginPath(); n.arc(s.x, s.y, r, 0, TAU); n.fill();
  }
  /* сам Олег */
  const p = S.player, ps = toScreen(p.x, p.y - 10);
  const baseR = (S.upgrades.light && p.onBike ? 120 : 78) * z;
  let g = n.createRadialGradient(ps.x, ps.y, 0, ps.x, ps.y, baseR);
  g.addColorStop(0, 'rgba(0,0,0,.85)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  n.fillStyle = g; n.beginPath(); n.arc(ps.x, ps.y, baseR, 0, TAU); n.fill();
  /* фонарик */
  if (p.lampOn) {
    const len = 340 * z, half = 0.42;
    const g2 = n.createRadialGradient(ps.x, ps.y, 8, ps.x, ps.y, len);
    g2.addColorStop(0, 'rgba(0,0,0,.98)'); g2.addColorStop(0.6, 'rgba(0,0,0,.7)'); g2.addColorStop(1, 'rgba(0,0,0,0)');
    n.fillStyle = g2;
    n.beginPath(); n.moveTo(ps.x, ps.y);
    n.arc(ps.x, ps.y, len, p.dir - half, p.dir + half); n.closePath(); n.fill();
  }
  n.globalCompositeOperation = 'source-over';
  c.save();
  c.setTransform(1, 0, 0, 1, 0, 0);
  c.drawImage(View.night, 0, 0);
  c.restore();
  c.setTransform(View.dpr, 0, 0, View.dpr, 0, 0);
}

function currentInteraction() {
  const p = S.player, M = S.mission;
  const near = (x, y, r) => dist2(p.x, p.y, x, y) < r * r;
  const slow = !p.onBike || Math.abs(S.bike.speed) < 80;

  if (M && slow) {
    const d = M.def;
    if (M.stage === 'travel' && near(d.site.x, d.site.y, 74))
      return { label: 'начать работу: ' + d.site.label, fn: () => tryStartWork() };
    if (M.stage === 'verify' && near(d.site.x, d.site.y, 90))
      return { label: 'проверить оборудование', fn: () => doVerify() };
    if (M.stage === 'report' && d.client && near(d.client.x, d.client.y, 84))
      return { label: 'сдать работу: ' + d.client.name, fn: () => payoutMission() };
    if (M.stage === 'work') {
      if (d.kind === 'search' && M.data.spots) {
        for (const s of M.data.spots) if (near(s.x, s.y, 58) && !s.searched)
          return { label: 'обыскать: ' + s.label, fn: () => searchSpot(s) };
      }
      if (d.kind === 'night' && M.data.poles) {
        for (const e of M.data.poles) {
          if (!near(e.p.x, e.p.y, 74)) continue;
          const isBroken = M.data.poles.indexOf(e) === M.data.broken;
          if (M.data.found && isBroken)
            return { label: 'чинить камеру', fn: () => startCameraGame({ zone: d.zone || 'въезд' }, q => { e.p.installed = true; finishWork(q); }) };
          if (!M.data.found) return { label: 'осмотреть камеру', fn: () => inspectPole(e) };
        }
      }
      if (d.kind === 'final') {
        const st = M.data.step;
        if (st === 0 && near(d.site.x, d.site.y, 80)) return { label: 'монтаж СКУД на входе', fn: () => startFinalStep() };
        if (st >= 1 && st <= 4) {
          const cam = M.data.cams[st - 1];
          if (near(cam.p.x, cam.p.y, 80)) return { label: 'ставить камеру на опору ' + cam.p.mount, fn: () => startFinalStep() };
        }
      }
    }
  }
  for (const poi of POIS) if (near(poi.x, poi.y, poi.r + 12) && slow)
    return { label: poi.act, fn: () => openPoi(poi.id) };
  if (!p.onBike && near(S.bike.x, S.bike.y, 62)) return { label: 'сесть на велосипед', fn: () => tryMountBike() };
  if (p.onBike) return { label: 'слезть с велосипеда', fn: () => tryMountBike() };
  return null;
}
function handleAction() {
  const it = currentInteraction();
  if (it) { it.fn(); return true; }
  return false;
}
function useTool() {
  const p = S.player;
  if (!p.tools.length) { toast('Сумка пуста. «Работать нечем, зато честно»', 'bad', 1800); return; }
  const t = p.tools[clamp(p.tool, 0, p.tools.length - 1)];
  if (t === 'lamp') {
    p.lampOn = !p.lampOn;
    Audio2.click();
    toast(p.lampOn ? 'Фонарик включён' : 'Фонарик выключен', 'info', 1200);
    return;
  }
  if (p.onBike && S.bike.chain > 0) return;   /* цепь чинится в moveBike */
  if (p.swingCd > 0) return;
  p.swing = 0.35; p.swingCd = 0.7;
  p.stamina = clamp(p.stamina - 4, 0, 100);
  Audio2.noise(0.12, 0.12, 200, 1200);
  const near = S.hools.some(h => dist2(h.x, h.y, p.x, p.y) < 80 * 80) || S.dogs.some(d => dist2(d.x, d.y, p.x, p.y) < 80 * 80);
  if (!near && Math.random() < 0.4) floater(p.x, p.y - 34, pick(['Вжух!', 'Ну-ка!', 'Кыш']), '#ffd23f');
}

let hudToolSig = '';
function updateHud() {
  const p = S.player;
  $('barHp').style.width = p.health + '%'; $('numHp').textContent = Math.round(p.health);
  $('barSt').style.width = p.stamina + '%'; $('numSt').textContent = Math.round(p.stamina);
  $('barBk').style.width = S.bike.cond + '%'; $('numBk').textContent = Math.round(S.bike.cond);
  $('rowDrunk').style.display = p.drunk > 0.5 ? 'flex' : 'none';
  $('barDr').style.width = p.drunk + '%'; $('numDr').textContent = Math.round(p.drunk);
  const showQ = S.mission && (S.mission.stage === 'verify' || S.mission.stage === 'report' || (S.mission.stage === 'work' && S.mission.quality > 0));
  $('rowQual').style.display = showQ ? 'flex' : 'none';
  if (showQ) { $('barQa').style.width = S.mission.quality + '%'; $('numQa').textContent = Math.round(S.mission.quality); }

  $('numMoney').textContent = fmtMoney(p.money);
  $('numRep').textContent = 'Репутация: ' + p.rep + ' — ' + repTitle(p.rep);
  $('clock').textContent = clockStr() + '  · день ' + S.day;
  $('daypart').textContent = dayPart();
  const eyes = $('eyes').children;
  const lvl = Math.ceil(S.heat / 20);
  for (let i = 0; i < eyes.length; i++) eyes[i].className = i < lvl ? 'on' : '';

  let t;
  if (S.tutorial && !S.tutorial.done) t = { title: 'ОБУЧЕНИЕ', step: TUTORIAL[S.tutorial.step].text, hint: 'Esc — пропустить обучение' };
  else t = taskText();
  $('taskTitle').textContent = t.title;
  $('taskStep').textContent = t.step;
  $('taskHint').textContent = t.hint || '';
  const M = S.mission;
  if (M && M.def.time && M.stage !== 'brief' && M.stage !== 'done' && M.timer > -999 && (M.stage === 'travel' || M.stage === 'work')) {
    $('taskTimer').style.display = 'block';
    const sec = Math.max(0, Math.ceil(M.timer));
    $('taskTimer').textContent = 'ОСТАЛОСЬ ' + pad2(Math.floor(sec / 60)) + ':' + pad2(sec % 60);
    $('taskTimer').style.color = sec < 45 ? '#ff4d5e' : '#ffd23f';
  } else $('taskTimer').style.display = 'none';

  /* инструменты */
  const sig = p.tools.join(',') + '|' + p.tool + '|' + p.lampOn;
  if (sig !== hudToolSig) {
    hudToolSig = sig;
    const box = $('hudBC'); box.innerHTML = '';
    const cap = bagCapacity();
    for (let i = 0; i < cap; i++) {
      const id = p.tools[i];
      const el = document.createElement('div');
      el.className = 'slot' + (i === p.tool && id ? ' on' : '') + (id ? '' : ' empty');
      el.innerHTML = '<em>' + (i + 1) + '</em>';
      if (id) {
        const cv = document.createElement('canvas');
        cv.width = 88; cv.height = 68;
        const cc = cv.getContext('2d');
        cc.scale(2, 2);
        drawToolIcon(cc, 22, 18, id, id === 'lamp' && p.lampOn);
        el.appendChild(cv);
        const u = document.createElement('u'); u.textContent = TOOLS[id].short; el.appendChild(u);
      }
      el.addEventListener('click', () => { if (p.tools[i]) { p.tool = i; hudToolSig = ''; Audio2.click(); } });
      box.appendChild(el);
    }
  }
  drawMinimap();
}
function drawToolIcon(c, x, y, id, on) {
  c.save(); c.translate(x, y);
  c.lineCap = 'round';
  switch (id) {
    case 'screw':
      c.fillStyle = '#ffd23f'; roundRect(0, c, -10, -6, 14, 12, 3); c.fill();
      c.fillStyle = '#8d8499'; c.fillRect(4, -3, 10, 6);
      c.fillStyle = '#3a3446'; c.fillRect(-8, 4, 8, 8); break;
    case 'tester':
      c.fillStyle = '#4be36b'; roundRect(0, c, -9, -9, 18, 18, 3); c.fill();
      c.fillStyle = '#0b0518'; c.fillRect(-6, -6, 12, 7);
      c.strokeStyle = '#ff4d5e'; c.lineWidth = 2; c.beginPath(); c.moveTo(-6, 6); c.lineTo(-12, 12); c.stroke();
      c.strokeStyle = '#25e8dc'; c.beginPath(); c.moveTo(6, 6); c.lineTo(12, 12); c.stroke(); break;
    case 'ladder':
      c.strokeStyle = '#c9a24f'; c.lineWidth = 2.6;
      c.beginPath(); c.moveTo(-7, -11); c.lineTo(-4, 11); c.moveTo(7, -11); c.lineTo(4, 11); c.stroke();
      c.lineWidth = 2;
      for (let i = 0; i < 4; i++) { const yy = -8 + i * 6; c.beginPath(); c.moveTo(-6.4 + i * 0.4, yy); c.lineTo(6.4 - i * 0.4, yy); c.stroke(); } break;
    case 'cable':
      c.strokeStyle = '#25e8dc'; c.lineWidth = 3;
      c.beginPath(); c.ellipse(0, 0, 10, 7, 0, 0, TAU); c.stroke();
      c.strokeStyle = '#ff2d95'; c.lineWidth = 2;
      c.beginPath(); c.ellipse(0, -3, 7, 5, 0, 0, TAU); c.stroke(); break;
    case 'drill':
      c.fillStyle = '#ff8a1f'; roundRect(0, c, -10, -8, 13, 11, 3); c.fill();
      c.fillStyle = '#8d8499'; c.fillRect(3, -4, 12, 3);
      c.fillStyle = '#3a3446'; c.fillRect(-8, 3, 7, 9); break;
    case 'ties':
      c.strokeStyle = '#e9dcff'; c.lineWidth = 2;
      for (let i = -1; i <= 1; i++) { c.beginPath(); c.moveTo(-10, i * 5); c.quadraticCurveTo(0, i * 5 - 5, 10, i * 5); c.stroke(); } break;
    case 'lamp':
      c.fillStyle = on ? '#ffd23f' : '#8d8499'; roundRect(0, c, -11, -5, 16, 10, 3); c.fill();
      c.fillStyle = on ? 'rgba(255,235,150,.95)' : '#3a3446';
      c.beginPath(); c.moveTo(5, -6); c.lineTo(15, -11); c.lineTo(15, 11); c.lineTo(5, 6); c.closePath(); c.fill(); break;
  }
  c.restore();
}
function drawMinimap() {
  const cv = $('minimap'), c = cv.getContext('2d');
  const w = cv.width, h = cv.height;
  c.clearRect(0, 0, w, h);
  if (Ground.mini) c.drawImage(Ground.mini, 0, 0, w, h);
  const sx = w / WORLD.w, sy = h / WORLD.h;
  for (const poi of POIS) {
    c.fillStyle = poi.color;
    c.beginPath(); c.arc(poi.x * sx, poi.y * sy, 2.6, 0, TAU); c.fill();
  }
  for (const g of S.guards) { c.fillStyle = '#ff4d5e'; c.beginPath(); c.arc(g.x * sx, g.y * sy, 2.4, 0, TAU); c.fill(); }
  const tgt = S.mission && S.mission.target;
  if (tgt) {
    const pulse = 0.5 + 0.5 * Math.sin(S.t * 4);
    c.strokeStyle = '#ffd23f'; c.lineWidth = 1.6;
    c.beginPath(); c.arc(tgt.x * sx, tgt.y * sy, 3 + pulse * 3, 0, TAU); c.stroke();
    c.fillStyle = '#ffd23f'; c.beginPath(); c.arc(tgt.x * sx, tgt.y * sy, 2, 0, TAU); c.fill();
  }
  const p = S.player;
  c.fillStyle = '#fff';
  c.save(); c.translate(p.x * sx, p.y * sy); c.rotate(p.onBike ? S.bike.dir : p.dir);
  c.beginPath(); c.moveTo(5, 0); c.lineTo(-3, -3.4); c.lineTo(-3, 3.4); c.closePath(); c.fill();
  c.restore();
  /* рамка обзора */
  c.strokeStyle = 'rgba(255,255,255,.25)'; c.lineWidth = 1;

const Radio = { text: '', x: 0, w: 0, timer: 0 };
function updateRadio(dt) {
  Radio.timer -= dt;
  if (Radio.timer <= 0 || !Radio.text) {
    Radio.timer = 13;
    const st = Audio2.stations[Audio2.station];
    Radio.text = (Math.random() < 0.45 ? pick(DJ) : pick(ADS)) + '   ///   ' + st.name + '   ///   ';
    $('tick').textContent = Radio.text + Radio.text;
    Radio.x = $('tickWrap').offsetWidth;
    Radio.w = $('tick').offsetWidth / 2;
  }
  Radio.x -= dt * 62;
  if (Radio.x < -Radio.w) Radio.x += Radio.w;
  $('tick').style.transform = 'translateX(' + Math.round(Radio.x) + 'px)';
  $('stationName').textContent = Audio2.stations[Audio2.station].name;
}

function saveGame(silent) {
  const p = S.player;
  const data = {
    v: 1, ts: Date.now(),
    p: { x: p.x, y: p.y, health: p.health, stamina: p.stamina, drunk: p.drunk, money: p.money, rep: p.rep, tools: p.tools.slice(), tool: p.tool },
    bike: { x: S.bike.x, y: S.bike.y, cond: S.bike.cond },
    clock: S.clock, day: S.day, heat: S.heat,
    missionIndex: S.missionIndex, missionsDone: S.missionsDone.slice(),
    free: S.free, freeCount: S.freeCount,
    missionStage: S.mission ? S.mission.stage : null,
    missionQuality: S.mission ? S.mission.quality : 0,
    upgrades: Object.assign({}, S.upgrades),
    stats: Object.assign({}, S.stats),
    flags: Object.assign({}, S.flags),
    poles: POLES.map(pl => !!pl.installed),
    station: Audio2.station
  };
  const ok = Save.write(data);
  if (!ok && !silent) toast('Не удалось сохранить: ' + (Save.lastError || 'localStorage недоступен'), 'bad', 4000);
  else if (!silent) toast('Прогресс сохранён', 'good', 1400);
  return ok;
}
function loadGame() {
  const d = Save.read();
  if (!d) return false;
  try {
    resetWorld(false);
    const p = S.player;
    Object.assign(p, {
      x: d.p.x, y: d.p.y, health: d.p.health, stamina: d.p.stamina, drunk: d.p.drunk || 0,
      money: d.p.money, rep: d.p.rep, tools: (d.p.tools || []).filter(t => TOOLS[t]), tool: d.p.tool || 0
    });
    S.bike.x = d.bike.x; S.bike.y = d.bike.y; S.bike.cond = d.bike.cond;
    S.clock = d.clock; S.day = d.day || 1; S.heat = d.heat || 0;
    S.missionIndex = d.missionIndex || 0;
    S.missionsDone = d.missionsDone || [];
    S.free = !!d.free; S.freeCount = d.freeCount || 0;
    S.upgrades = d.upgrades || {};
    S.stats = Object.assign(S.stats, d.stats || {});
    S.flags = Object.assign(S.flags, d.flags || {});
    if (Array.isArray(d.poles)) d.poles.forEach((v, i) => { if (POLES[i]) POLES[i].installed = v; });
    if (typeof d.station === 'number') Audio2.station = clamp(d.station, 0, Audio2.stations.length - 1);
    S.cam.x = p.x - View.w / View.zoom / 2; S.cam.y = p.y - View.h / View.zoom / 2;
    S.flags.tutorialDone = true; S.tutorial = null;
    S.mission = null;
    S.phoneRing = 2.5;                 /* Тамара перезвонит и выдаст текущую заявку */
    hudToolSig = '';
    return true;
  } catch (e) {
    toast('Сохранение повреждено, начинаем заново', 'bad', 3600);
    Save.wipe();
    return false;
  }
}

function shopSheet(shopId, title, subtitle, extra, back) {
  const items = SHOP_ITEMS.filter(i => i.shop === shopId);
  const cards = items.map(i => {
    const owned = i.up && S.upgrades[i.id === 'consum' ? 'consum' : i.id];
    const canBuy = !owned && i.can() && S.player.money >= i.price;
    return '<div class="card' + (owned ? ' owned' : '') + '"><b>' + i.name + '</b><span>' + i.desc + '</span>' +
      '<div class="price">' + fmtMoney(i.price) + '</div>' +
      '<button class="btn sm ' + (canBuy ? 'c' : '') + '" id="buy_' + i.id + '"' + (canBuy ? '' : ' disabled') + '>' +
      (owned ? 'Уже есть' : !i.can() ? 'Не нужно' : S.player.money < i.price ? 'Не хватает денег' : 'Купить') + '</button></div>';
  }).join('');
  showSheet('<h2>' + title + '</h2><div class="sub">' + subtitle + '</div>' +
    '<p>В кармане: <b style="color:#ffd23f">' + fmtMoney(S.player.money) + '</b></p>' +
    (extra || '') +
    '<div class="shopGrid">' + cards + '</div>' +
    '<div class="btns"><button class="btn c" id="bBack">Выйти (Esc)</button></div>', 'shop');
  items.forEach(i => wire('buy_' + i.id, () => {
    if (S.player.money < i.price || !i.can()) return;
    addMoney(-i.price);
    i.buy();
    Audio2.cash();
    toast('Куплено: ' + i.name, 'good');
    saveGame(true);
    shopSheet(shopId, title, subtitle, typeof extra === 'function' ? extra() : extra, back);
  }));
  wire('bBack', back || closeSheet);
}

function endGame(win, reason) {
  if (S.ended) return;
  S.ended = win ? 'win' : 'lose';
  Mini.close(); Dlg.closeAll();
  if (win) Audio2.win(); else Audio2.lose();
  const avgQ = S.missionsDone.length ? Math.round(S.missionsDone.reduce((a, b) => a + b.q, 0) / S.missionsDone.length) : 0;
  const rank = avgQ >= 88 ? 'МАСТЕР УЧАСТКА' : avgQ >= 72 ? 'КРЕПКИЙ МОНТАЖНИК' : avgQ >= 55 ? 'РАБОТАЕТ — И ЛАДНО' : 'ЕСТЬ КУДА РАСТИ';
  const stats = '<div class="stats">' +
    '<i>Заявок сдано</i><b>' + S.missionsDone.length + ' из ' + MISSIONS.length + '</b>' +
    '<i>Среднее качество</i><b>' + avgQ + '%</b>' +
    '<i>Заработано</i><b>' + fmtMoney(S.stats.earned) + '</b>' +
    '<i>В кармане осталось</i><b>' + fmtMoney(S.player.money) + '</b>' +
    '<i>Репутация</i><b>' + S.player.rep + ' — ' + repTitle(S.player.rep) + '</b>' +
    '<i>Трезвых сдач</i><b>' + S.stats.sober + '</b>' +
    '<i>Аварий</i><b>' + S.stats.crashes + '</b>' +
    '<i>Штрафов от ЧОП</i><b>' + S.stats.fines + '</b>' +
    '</div>';
  if (win) {
    showSheet('<h1>Смена сдана</h1><div class="sub">звание по итогам: ' + rank + '</div>' +
      '<p><b>Борисыч:</b> «Олег. Объект работает, заказчик доволен, кабель на месте. Я даже не знаю, к чему придраться. Иди домой, завтра новая заявка».</p>' +
      '<p><b>Тамара:</b> «И телефон не выключай. Я всё равно дозвонюсь».</p>' + stats +
      '<div class="note">Сюжет пройден. Можно остаться в районе: Тамара будет присылать бесконечные заявки на двери и камеры, оплата растёт с каждой.</div>' +
      '<div class="btns"><button class="btn c" id="bFree">Остаться на смене</button>' +
      '<button class="btn p" id="bAgain">Новая смена</button><button class="btn" id="bMenu">В меню</button></div>' + DISCLAIMER, 'win');
    wire('bFree', startFreeMode);
  } else {
    showSheet('<h1>Смена сорвана</h1><div class="sub">' + rank + '</div>' +
      '<p>' + (reason || 'Что-то пошло не так, как обычно — просто чуть сильнее.') + '</p>' +
      '<p><b>Тамара:</b> «Олег, отдохни. И завтра без самодеятельности».</p>' + stats +
      '<div class="btns"><button class="btn p" id="bAgain">Попробовать заново</button><button class="btn c" id="bMenu">В меню</button></div>', 'lose');
  }
  wire('bAgain', () => startNewGame(true));
  wire('bMenu', screenMenu);
  if (win) { S.flags.won = true; saveGame(true); } else Save.wipe();
}

function startFreeMode() {
  S.free = true; S.ended = null;
  closeSheet();
  S.screen = 'play';
  S.phoneRing = 2.5;
  saveGame(true);
  Dlg.one('tamara', 'Олег, раз ты не ушёл — работаем дальше. Заявки не кончаются, они просто ждут своей очереди.');
  toast('Свободные заявки: Тамара скоро позвонит', 'good', 3000);
}

/* 32. Обучение                                                         */
/* ------------------------------------------------------------------ */
const TUTORIAL = [
  { text: 'Пройдись: W A S D или стрелки', check: t => t.moved > 240 },
  { text: 'Ускорься: зажми Shift на ходу', check: t => t.sprint > 0.9 },
  { text: 'Велосипед рядом — подойди и нажми E', check: () => S.player.onBike },
  { text: 'Прокатись немного вперёд', check: t => t.rode > 420 },
  { text: 'Притормози: Space', check: t => t.braked },
  { text: 'Открой карту района: M (закрыть — M или Esc)', check: t => t.mapOpened },
  { text: 'Всё. Тамара уже набирает номер…', check: t => t.wait > 1.6 }
];
function updateTutorial(dt) {
  const T = S.tutorial, p = S.player;
  T.wait = (T.wait || 0) + dt;
  const sp = Math.hypot(p.vx, p.vy);
  if (!p.onBike) T.moved += sp * dt;
  if (Input.any(K.sprint) && sp > 40) T.sprint += dt;
  if (p.onBike) T.rode += Math.abs(S.bike.speed) * dt;
  if (p.onBike && Input.any(K.brake) && Math.abs(S.bike.speed) > 40) T.braked = true;
  if (S.screen === 'map') T.mapOpened = true;
  if (TUTORIAL[T.step].check(T)) {
    T.step++; T.wait = 0;
    Audio2.ok();
    if (T.step >= TUTORIAL.length) {
      T.done = true; S.tutorial = null; S.flags.tutorialDone = true;
      S.phoneRing = 1.4;
      toast('Обучение пройдено. Смена начинается', 'good', 2600);
      saveGame(true);
    } else toast('Дальше: ' + TUTORIAL[T.step].text, 'info', 2400);
  }
}
function skipTutorial() {
  if (!S.tutorial) return false;
  S.tutorial = null; S.flags.tutorialDone = true; S.phoneRing = 1.2;
  toast('Обучение пропущено', 'info');
  return true;
}

function resetWorld(fresh) {
  S.player = newPlayer();
  S.bike = newBike();
  S.heat = 0; S.fx.length = 0; S.marks.length = 0; S.npcs.length = 0; S.guards.length = 0; S.peds.length = 0;
  S.mission = null; S.missionIndex = 0; S.missionsDone = []; S.free = false; S.freeCount = 0;
  S.partner = { cooldown: 0, eta: 0, active: 0, forgot: false };
  S.partnerBonus = false;
  S.clock = START_HOUR * 3600; S.day = 1;
  S.ended = null; S.phoneRing = 0; S.autosave = 0;
  S.stats = { earned: 0, crashes: 0, fixed: 0, sober: 0, bestQ: 0, fines: 0, dist: 0 };
  S.flags = { tutorialDone: false, everDrunk: false, warnedDrunk: false, beggarPaid: 0 };
  S.upgrades = {};
  spawnTraffic(); spawnDogs(); spawnHools(); spawnGrans(); spawnPeds();
  for (const p of POLES) p.installed = false;
  for (const k of KIOSKS) k.broken = false;
  for (const p of PROPS) p.broken = false;
  hudToolSig = '';
  S.cam.x = clamp(S.player.x - View.w / View.zoom / 2, 0, WORLD.w - View.w / View.zoom);
  S.cam.y = clamp(S.player.y - View.h / View.zoom / 2, 0, WORLD.h - View.h / View.zoom);
  if (fresh) S.tutorial = null;
}
function startNewGame(withTutorial) {
  Mini.close(); Dlg.closeAll();
  resetWorld(true);
  closeSheet();
  S.screen = 'play';
  Audio2.init(); Audio2.resume();
  if (withTutorial) {
    S.tutorial = { step: 0, moved: 0, sprint: 0, rode: 0, braked: false, mapOpened: false, wait: 0 };
    Dlg.seq([
      { who: 'oleg', text: 'Пять вечера. Город розовеет, спина ноет, смена только начинается.' },
      { who: 'tamara', text: 'Олег, ты живой? Отлично. Разомнись, проверь велосипед — и жди заявку. Она уже едет к тебе быстрее, чем ты к ней.' },
      { who: 'oleg', text: 'Понял. Разминка, велосипед, надежда.' }
    ], () => toast('Обучение: ' + TUTORIAL[0].text, 'info', 3000));
  } else S.phoneRing = 1.5;
  saveGame(true);
}

/* ------------------------------------------------------------------ */
/* 34. Обновление мира                                                  */
/* ------------------------------------------------------------------ */
function updatePrompt() {
  const it = currentInteraction();
  const el = $('prompt');
  if (it && !Dlg.open) {
    el.style.display = 'block';
    $('promptText').innerHTML = '<b>E</b> — ' + it.label;
  } else el.style.display = 'none';
}
function updateFx(dt) {
  for (let i = S.fx.length - 1; i >= 0; i--) {
    const f = S.fx[i];
    f.life -= dt;
    if (f.life <= 0) { S.fx.splice(i, 1); continue; }
    f.x += f.vx * dt; f.y += f.vy * dt;
    if (f.kind !== 'text') { f.vx *= Math.exp(-2.6 * dt); f.vy *= Math.exp(-2.6 * dt); f.vy += 40 * dt; }
  }
  for (let i = S.marks.length - 1; i >= 0; i--) { S.marks[i].life -= dt; if (S.marks[i].life <= 0) S.marks.splice(i, 1); }
  if (S.marks.length > 160) S.marks.splice(0, S.marks.length - 160);
}
function updateWorld(dt) {
  const p = S.player;
  S.clock += dt * (86400 / DAY_LEN);
  if (S.clock >= 86400) { S.clock -= 86400; S.day++; toast('Новый день. День ' + S.day, 'info', 2200); }

  p.invuln = Math.max(0, p.invuln - dt);
  p.hurt = Math.max(0, p.hurt - dt);
  p.swing = Math.max(0, p.swing - dt);
  p.swingCd = Math.max(0, p.swingCd - dt);
  const wasDrunk = p.drunk;
  p.drunk = clamp(p.drunk - BAL.soberRate * dt, 0, 100);
  if (wasDrunk > 0 && p.drunk <= 0) toast('Голова прояснилась. Работать можно', 'good', 2400);
  if (p.drunk > 60 && Math.random() < 0.35 * dt) floater(p.x, p.y - 36, pick(['…', 'Оп', 'Куда руль?']), '#8a2be2');

  if (p.onBike) moveBike(dt); else movePlayerOnFoot(dt);

  updateCars(dt); updateDogs(dt); updateHools(dt); updatePeds(dt); updatePartner(dt); updateHeat(dt);
  for (const g of S.grans) g.say = Math.max(0, g.say - dt);
  updateMission(dt);

  /* вор доводит дело до конца, если Олег стоит рядом */
  for (const h of S.hools) {
    if (h.type !== 'thief' || h.gone || h.holds) continue;
    const d = dist(h.x, h.y, p.x, p.y);
    if (d < 34 && h.cool <= 0 && h.flee <= 0 && !Dlg.open && p.tools.length) {
      h.contact = (h.contact || 0) + dt * (S.upgrades.bag ? 0.55 : 1);
      if (h.contact > 1.6) { h.contact = 0; stealTool(h); }
    } else h.contact = 0;
  }

  if (!S.mission && S.phoneRing > 0 && !Dlg.open) {
    S.phoneRing -= dt;
    if (S.phoneRing <= 0) offerMission(S.missionIndex);
  }
  S.autosave += dt;
  if (S.autosave > 20) { S.autosave = 0; saveGame(true); }

  if (S.tutorial && !S.tutorial.done) updateTutorial(dt);
  updatePrompt();
}

/* ------------------------------------------------------------------ */
/* 35. Клавиши вне игрового движения                                    */
/* ------------------------------------------------------------------ */
function handleKeys() {
  if (Input.anyHit(K.pause)) {
    if (Dlg.open && Dlg.opts) { /* на вопрос надо ответить */ }
    else if (S.screen === 'menu' || S.screen === 'win' || S.screen === 'lose') { /* остаёмся */ }
    else if (S.screen === 'pause') resumeFromPause();
    else if ($('screens').classList.contains('show')) closeSheet();
    else if (S.screen === 'play' || S.screen === 'mini') screenPause();
    Audio2.click();
    return;
  }
  if (Dlg.open) return;
  if (S.screen === 'map' && Input.anyHit(K.map)) { closeSheet(); return; }
  if (S.screen === 'journal' && Input.anyHit(K.phone)) { closeSheet(); return; }
  if (S.screen !== 'play') return;

  if (Input.anyHit(K.map)) { screenMap(); return; }
  if (Input.anyHit(K.phone)) { screenJournal(); return; }
  if (Input.anyHit(K.radio)) { toast('Радио: ' + Audio2.nextStation(), 'info', 1600); Radio.timer = 0; }
  if (Input.anyHit(K.partner)) callPartner();
  if (Input.anyHit(K.act)) handleAction();
  if (Input.anyHit(K.tool)) useTool();
  for (let i = 0; i < 8; i++) {
    if (Input.pressed('Digit' + (i + 1)) && S.player.tools[i]) { S.player.tool = i; hudToolSig = ''; Audio2.click(); }
  }
}

/* ------------------------------------------------------------------ */
/* 36. Главный цикл                                                     */
/* ------------------------------------------------------------------ */
let lastTs = 0, crashed = false, hardErrors = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  if (crashed) return;
  const dt = clamp((ts - lastTs) / 1000, 0, 0.05);
  lastTs = ts;
  try { step(dt || 0.016); } catch (e) { fatal(e, true); }
}
function step(dt) {
  S.t += dt;
  /* если машина не тянет — один раз подсказываем про экономный режим */
  if (!S.lowFx && !S.flags.perfHinted && S.screen === 'play') {
    S.perfT = (S.perfT || 0) + dt;
    S.perfN = (S.perfN || 0) + 1;
    if (S.perfT > 6) {
      if (S.perfN / S.perfT < 34) {
        S.flags.perfHinted = true;
        toast('Подтормаживает? Esc → Настройки → «Эффекты: экономно»', 'info', 5000);
      }
      S.perfT = 0; S.perfN = 0;
    }
  }
  Dlg.update(dt);
  updateRadio(dt);
  if (S.screen === 'play' && !Dlg.open) updateWorld(dt);
  else if (S.screen === 'mini' && !Dlg.open) Mini.update(dt);
  else if (Dlg.open) $('prompt').style.display = 'none';
  updateFx(dt);
  updateCamera(dt);
  render();
  if (S.screen === 'mini' || Mini.g) Mini.draw();
  updateHud();
  handleKeys();
  Input.endFrame();
}
function fatal(err, hard) {
  const msg = (err && (err.stack || err.message)) || String(err);
  if (hard) {
    hardErrors++;
    if (hardErrors > 40) { crashed = true; }
  }
  $('errtext').textContent = msg + (crashed
    ? '\n\nИгра остановлена. Перезапусти — сохранение обычно цело.'
    : '\n\nИгра продолжает работать. Если что-то ведёт себя странно — перезапусти смену.');
  $('errbox').style.display = 'block';
  if (!$('errRestart')) {
    const wrap = document.createElement('div');
    wrap.style.marginTop = '10px';
    const b = document.createElement('button');
    b.id = 'errRestart'; b.className = 'btn sm y'; b.textContent = 'Перезапустить игру';
    b.addEventListener('click', () => location.reload());
    const h = document.createElement('button');
    h.className = 'btn sm'; h.textContent = 'Скрыть'; h.style.marginLeft = '8px';
    h.addEventListener('click', () => { $('errbox').style.display = 'none'; });
    wrap.appendChild(b); wrap.appendChild(h);
    $('errbox').appendChild(wrap);
  }
  try { console.error('[Монтаж-Сити]', err); } catch (e) { }
}

/* ------------------------------------------------------------------ */
/* 37. Старт                                                            */
/* ------------------------------------------------------------------ */
function boot() {
  try {
    View.cv = $('world'); View.c = View.cv.getContext('2d');
    View.night = document.createElement('canvas');
    View.nc = View.night.getContext('2d');
    Input.init();
    buildSolids();
    bakeGround();
    resizeView();
    resetWorld(true);
    window.addEventListener('resize', () => { resizeView(); });
    window.addEventListener('orientationchange', () => setTimeout(resizeView, 300));
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) { if (S.screen === 'play') { saveGame(true); } }
      else lastTs = performance.now();
    });
    window.addEventListener('beforeunload', () => { if (S.screen === 'play' && !S.ended) saveGame(true); });
    window.addEventListener('error', e => fatal(e.error || e.message, false));
    window.addEventListener('unhandledrejection', e => fatal(e.reason || 'unhandled rejection', false));
    /* звук включаем по первому жесту — так требует браузер */
    const kick = () => { Audio2.init(); Audio2.resume(); };
    window.addEventListener('pointerdown', kick, { once: false });
    window.addEventListener('keydown', kick, { once: false });
    $('loading').style.display = 'none';
    screenMenu();
    requestAnimationFrame(frame);
  } catch (e) { fatal(e, true); }
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

})();
</script>
