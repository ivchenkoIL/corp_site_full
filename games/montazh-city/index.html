<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Монтаж-Сити: Трудная смена</title>
<meta name="description" content="Сатирическая 2D-игра про вымышленного монтажника СКУД и видеонаблюдения Олега Левинцова. Один файл, Canvas, без внешних библиотек.">
<style>
:root{
  --pink:#ff2d95; --pink-d:#a3005c;
  --cyan:#25e8dc; --cyan-d:#0b6f6a;
  --violet:#8a2be2; --violet-d:#3a1060;
  --orange:#ff8a1f; --yellow:#ffd23f;
  --ink:#100a1c; --ink2:#1b1030; --ink3:#291642;
  --paper:#f7ecff; --dim:#b9a6d6;
  --good:#4be36b; --bad:#ff4d5e;
  --ui: "Trebuchet MS", "Segoe UI", Tahoma, Verdana, sans-serif;
  --head: "Arial Black", "Arial Bold", Impact, "Haettenschweiler", sans-serif;
  --mono: "Consolas", "Courier New", monospace;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#07040e;color:var(--paper);font-family:var(--ui)}
body{user-select:none}
#stage{position:fixed;inset:0;overflow:hidden}
canvas{display:block}
#world{position:absolute;inset:0;width:100%;height:100%;image-rendering:auto}
#scan{position:absolute;inset:0;pointer-events:none;z-index:6;
  background:repeating-linear-gradient(180deg,rgba(0,0,0,.16) 0 1px,rgba(0,0,0,0) 1px 3px);
  mix-blend-mode:multiply;opacity:.55}
#vign{position:absolute;inset:0;pointer-events:none;z-index:5;
  background:radial-gradient(120% 90% at 50% 45%,rgba(0,0,0,0) 45%,rgba(6,2,16,.55) 100%)}

/* ---------- HUD ---------- */
#hud{position:absolute;inset:0;z-index:8;pointer-events:none;font-size:13px}
.panel{
  background:linear-gradient(180deg,rgba(41,22,66,.92),rgba(16,10,28,.94));
  border:2px solid rgba(255,45,149,.55);
  border-radius:6px;
  box-shadow:0 0 0 1px rgba(37,232,220,.25) inset, 0 6px 18px rgba(0,0,0,.55), 0 0 22px rgba(255,45,149,.16);
  padding:8px 10px;
}
#hudTL{position:absolute;left:12px;top:12px;width:236px}
#hudTR{position:absolute;right:12px;top:12px;width:236px;text-align:right}
#hudBL{position:absolute;left:12px;bottom:12px;width:340px;max-width:44vw}
#hudBR{position:absolute;right:12px;bottom:12px;width:196px}
#hudBC{position:absolute;left:50%;transform:translateX(-50%);bottom:12px;display:flex;gap:6px}

.row{display:flex;align-items:center;gap:7px;margin:3px 0}
.lab{font:700 10px/1 var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);min-width:52px}
.bar{position:relative;flex:1;height:11px;background:#0d0718;border:1px solid rgba(185,166,214,.35);border-radius:3px;overflow:hidden}
.bar>i{position:absolute;left:0;top:0;bottom:0;width:0%;transition:width .16s linear;display:block}
.bar.hp>i{background:linear-gradient(90deg,#ff4d5e,#ff8a1f)}
.bar.st>i{background:linear-gradient(90deg,#25e8dc,#4be36b)}
.bar.bk>i{background:linear-gradient(90deg,#ffd23f,#ff8a1f)}
.bar.dr>i{background:linear-gradient(90deg,#8a2be2,#ff2d95)}
.bar.qa>i{background:linear-gradient(90deg,#8a2be2,#25e8dc)}
.bar>b{position:absolute;right:3px;top:-1px;font:700 9px/13px var(--mono);color:#fff;text-shadow:0 1px 2px #000}

.money{font:900 26px/1 var(--head);color:var(--yellow);text-shadow:0 0 12px rgba(255,210,63,.55),0 2px 0 #6b3d00;letter-spacing:.02em}
.rep{font:700 12px/1.3 var(--ui);color:var(--cyan)}
#eyes{margin-top:5px;letter-spacing:2px;font-size:15px}
#eyes span{opacity:.22;filter:grayscale(1)}
#eyes span.on{opacity:1;filter:none;text-shadow:0 0 8px #ff4d5e}
#clock{font:700 12px/1 var(--mono);color:var(--paper);opacity:.9}
#daypart{font:700 9px/1 var(--ui);letter-spacing:.16em;color:var(--dim);text-transform:uppercase}

#taskTitle{font:900 15px/1.15 var(--head);color:var(--pink);text-transform:uppercase;letter-spacing:.02em;text-shadow:0 0 10px rgba(255,45,149,.45)}
#taskStep{font:600 12px/1.35 var(--ui);color:var(--paper);margin-top:3px}
#taskHint{font:600 11px/1.3 var(--ui);color:var(--cyan);margin-top:3px;min-height:14px}
#taskTimer{font:900 16px/1 var(--mono);color:var(--bad);margin-top:4px;display:none}

#minimap{width:100%;height:auto;display:block;border:1px solid rgba(37,232,220,.35);border-radius:4px;background:#0a0614}
#mmLabel{font:700 9px/1 var(--ui);letter-spacing:.14em;color:var(--dim);text-transform:uppercase;margin-bottom:5px;text-align:center}

.slot{width:44px;height:44px;border-radius:5px;border:2px solid rgba(185,166,214,.3);
  background:linear-gradient(180deg,rgba(41,22,66,.9),rgba(13,7,24,.94));position:relative;overflow:hidden}
.slot.on{border-color:var(--yellow);box-shadow:0 0 14px rgba(255,210,63,.45)}
.slot.empty{opacity:.35}
.slot em{position:absolute;left:3px;top:1px;font:700 9px/1 var(--mono);color:var(--dim);font-style:normal}
.slot canvas{position:absolute;left:0;top:6px;width:44px;height:34px}
.slot u{position:absolute;left:0;right:0;bottom:0;font:700 8px/10px var(--ui);text-align:center;text-decoration:none;color:var(--paper);
  background:rgba(0,0,0,.5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- radio ticker ---------- */
#radio{position:absolute;left:50%;transform:translateX(-50%);top:12px;width:min(560px,46vw);z-index:8;pointer-events:none}
#radio .panel{padding:5px 10px;display:flex;align-items:center;gap:9px;overflow:hidden}
#stationName{font:900 11px/1 var(--head);color:var(--cyan);text-transform:uppercase;white-space:nowrap;letter-spacing:.04em}
#tickWrap{flex:1;overflow:hidden;height:15px;position:relative}
#tick{position:absolute;white-space:nowrap;font:600 12px/15px var(--ui);color:var(--yellow);will-change:transform}
#radioKey{font:700 9px/1 var(--mono);color:var(--dim);white-space:nowrap}

/* ---------- toasts ---------- */
#toasts{position:absolute;left:50%;transform:translateX(-50%);top:74px;z-index:9;width:min(520px,80vw);
  display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{padding:7px 14px;border-radius:20px;font:700 13px/1.2 var(--ui);
  background:linear-gradient(180deg,rgba(255,45,149,.95),rgba(122,20,90,.95));
  border:1px solid rgba(255,255,255,.35);box-shadow:0 4px 16px rgba(0,0,0,.5);animation:pop .25s ease-out}
.toast.good{background:linear-gradient(180deg,rgba(75,227,107,.95),rgba(16,110,52,.95));color:#06210e}
.toast.bad{background:linear-gradient(180deg,rgba(255,77,94,.95),rgba(120,10,25,.95))}
.toast.info{background:linear-gradient(180deg,rgba(37,232,220,.95),rgba(11,111,106,.95));color:#03211f}
@keyframes pop{from{transform:translateY(-8px) scale(.94);opacity:0}to{transform:none;opacity:1}}

/* ---------- prompt ---------- */
#prompt{position:absolute;left:50%;bottom:104px;transform:translateX(-50%);z-index:8;display:none;pointer-events:none}
#prompt .panel{padding:6px 14px;font:700 13px/1.2 var(--ui);border-color:rgba(37,232,220,.6)}
#prompt b{color:var(--yellow)}

/* ---------- dialog ---------- */
#dialog{position:absolute;left:50%;transform:translateX(-50%);bottom:16px;width:min(880px,94vw);z-index:12;display:none}
#dialog .panel{display:flex;gap:12px;align-items:stretch;border-color:rgba(37,232,220,.6)}
#portrait{width:88px;height:88px;flex:0 0 88px;border-radius:5px;background:#0b0618;border:1px solid rgba(255,45,149,.5)}
#dlgBody{flex:1;min-width:0}
#dlgName{font:900 15px/1 var(--head);color:var(--cyan);text-transform:uppercase;letter-spacing:.04em}
#dlgText{font:600 15px/1.4 var(--ui);margin-top:6px;min-height:44px;white-space:pre-wrap}
#dlgOpts{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.opt{pointer-events:auto;text-align:left;font:700 13px/1.2 var(--ui);color:var(--paper);cursor:pointer;
  background:linear-gradient(180deg,rgba(58,16,96,.9),rgba(20,10,36,.9));border:1px solid rgba(185,166,214,.4);
  border-radius:4px;padding:7px 10px}
.opt:hover,.opt:focus{border-color:var(--yellow);color:var(--yellow);outline:none}
.opt s{text-decoration:none;color:var(--dim);font-weight:700}
#dlgNext{font:700 11px/1 var(--mono);color:var(--dim);text-align:right;margin-top:6px}

/* ---------- screens ---------- */
#screens{position:absolute;inset:0;z-index:20;display:none;align-items:center;justify-content:center;
  background:radial-gradient(120% 100% at 50% 0%,rgba(122,44,255,.35),rgba(7,4,14,.92) 70%);backdrop-filter:blur(2px)}
#screens.show{display:flex}
.sheet{width:min(920px,94vw);max-height:92vh;overflow:auto;padding:20px 24px;
  background:linear-gradient(180deg,rgba(41,22,66,.97),rgba(12,7,22,.98));
  border:2px solid var(--pink);border-radius:10px;
  box-shadow:0 0 0 1px rgba(37,232,220,.3) inset,0 20px 60px rgba(0,0,0,.7),0 0 60px rgba(255,45,149,.25)}
.sheet h1{font:900 clamp(28px,5vw,52px)/0.95 var(--head);margin:0 0 2px;text-transform:uppercase;
  background:linear-gradient(180deg,#fff,var(--yellow) 45%,var(--pink));-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;filter:drop-shadow(0 3px 0 rgba(122,20,90,.9)) drop-shadow(0 0 22px rgba(255,45,149,.5))}
.sheet h2{font:900 clamp(18px,2.6vw,26px)/1 var(--head);margin:0 0 12px;color:var(--cyan);text-transform:uppercase;letter-spacing:.06em}
.sheet h3{font:900 14px/1 var(--head);margin:16px 0 6px;color:var(--pink);text-transform:uppercase;letter-spacing:.08em}
.sub{font:700 12px/1.4 var(--ui);color:var(--dim);letter-spacing:.1em;text-transform:uppercase;margin-bottom:14px}
.sheet p{font:400 14px/1.5 var(--ui);margin:6px 0}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
button{font-family:var(--ui);font-size:14px}
.btn{cursor:pointer;font:900 14px/1 var(--head);text-transform:uppercase;letter-spacing:.04em;color:#fff;
  padding:12px 18px;border-radius:6px;border:2px solid rgba(255,255,255,.28);
  background:linear-gradient(180deg,var(--violet),#2a0a4c);box-shadow:0 4px 0 #180530,0 6px 18px rgba(0,0,0,.45);
  transition:transform .06s linear,filter .1s linear}
.btn:hover{filter:brightness(1.18)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #180530}
.btn.p{background:linear-gradient(180deg,var(--pink),#8c0048);box-shadow:0 4px 0 #55002c,0 6px 18px rgba(0,0,0,.45)}
.btn.c{background:linear-gradient(180deg,var(--cyan),#0a5c58);color:#04201f;box-shadow:0 4px 0 #063d3a,0 6px 18px rgba(0,0,0,.45)}
.btn.y{background:linear-gradient(180deg,var(--yellow),#a06a00);color:#2a1a00;box-shadow:0 4px 0 #573900,0 6px 18px rgba(0,0,0,.45)}
.btn.sm{padding:8px 12px;font-size:12px}
.btn[disabled]{opacity:.42;cursor:not-allowed;filter:grayscale(.6)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:760px){.cols{grid-template-columns:1fr}}
.keys{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font:600 13px/1.3 var(--ui)}
.keys kbd{font:700 11px/1 var(--mono);background:#0d0718;border:1px solid rgba(185,166,214,.45);
  border-bottom-width:3px;border-radius:4px;padding:5px 7px;color:var(--yellow);white-space:nowrap}
.note{font:600 12px/1.45 var(--ui);color:var(--dim);border-left:3px solid var(--violet);padding:6px 10px;margin:10px 0;background:rgba(122,44,255,.1)}
.shopGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.card{padding:10px 12px;border-radius:6px;border:1px solid rgba(185,166,214,.32);background:rgba(13,7,24,.7);display:flex;flex-direction:column;gap:6px}
.card b{font:900 13px/1.15 var(--head);color:var(--yellow);text-transform:uppercase}
.card span{font:400 12px/1.35 var(--ui);color:var(--paper);flex:1}
.card .price{font:900 15px/1 var(--mono);color:var(--cyan)}
.card.owned{border-color:var(--good);opacity:.85}
.stats{display:grid;grid-template-columns:1fr auto;gap:2px 14px;font:600 13px/1.5 var(--ui);max-width:420px}
.stats i{font-style:normal;color:var(--dim)}
.stats b{font-family:var(--mono);color:var(--yellow)}
#mapCanvas{width:100%;height:auto;border:2px solid rgba(37,232,220,.5);border-radius:6px;background:#0a0614}
.legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:4px 12px;font:600 12px/1.5 var(--ui);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
.tag{display:inline-block;font:700 10px/1 var(--ui);letter-spacing:.1em;text-transform:uppercase;
  padding:4px 7px;border-radius:3px;background:rgba(37,232,220,.16);color:var(--cyan);border:1px solid rgba(37,232,220,.4)}
.tag.w{background:rgba(255,210,63,.16);color:var(--yellow);border-color:rgba(255,210,63,.4)}
.tag.b{background:rgba(255,77,94,.16);color:var(--bad);border-color:rgba(255,77,94,.4)}
.disclaimer{font:400 11px/1.5 var(--ui);color:#8d7cab;margin-top:14px;border-top:1px solid rgba(185,166,214,.2);padding-top:10px}
.slider{display:flex;align-items:center;gap:10px;font:600 13px var(--ui);margin:6px 0}
.slider input{width:200px}
.jobList{display:flex;flex-direction:column;gap:6px}
.job{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:5px;border:1px solid rgba(185,166,214,.28);background:rgba(13,7,24,.65)}
.job.done{border-color:rgba(75,227,107,.5)}
.job.cur{border-color:var(--pink);box-shadow:0 0 14px rgba(255,45,149,.25)}
.job b{font:900 13px/1.15 var(--head);text-transform:uppercase;flex:1}
.job small{font:600 11px/1.2 var(--ui);color:var(--dim)}

/* ---------- minigame ---------- */
#mini{position:absolute;inset:0;z-index:16;display:none;background:radial-gradient(120% 100% at 50% 0%,rgba(20,8,40,.9),rgba(5,3,12,.97))}
#mini.show{display:block}
#miniCanvas{position:absolute;left:0;top:0;width:100%;height:100%}
#miniTop{position:absolute;left:0;right:0;top:0;padding:10px 16px;display:flex;gap:14px;align-items:center;pointer-events:none}
#miniTitle{font:900 clamp(16px,2.4vw,24px)/1 var(--head);color:var(--pink);text-transform:uppercase;
  text-shadow:0 2px 0 #55002c,0 0 20px rgba(255,45,149,.5)}
#miniPhase{font:700 12px/1 var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--cyan)}
#miniQ{margin-left:auto;min-width:180px}
#miniBottom{position:absolute;left:0;right:0;bottom:0;padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#miniHint{font:600 13px/1.35 var(--ui);color:var(--paper);flex:1;min-width:200px}
#miniHint b{color:var(--yellow)}
#miniBtns{display:flex;gap:8px;flex-wrap:wrap}

#errbox{position:absolute;inset:auto 16px 16px 16px;z-index:40;display:none;padding:12px 14px;border-radius:8px;
  background:rgba(80,0,14,.96);border:2px solid var(--bad);font:600 12px/1.45 var(--mono);max-height:40vh;overflow:auto}
#errbox b{display:block;font:900 13px var(--head);color:#fff;margin-bottom:6px}
#loading{position:absolute;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:#07040e;
  font:900 18px var(--head);color:var(--pink);text-transform:uppercase;letter-spacing:.2em}
</style>
</head>
<body>
<div id="stage">
  <canvas id="world"></canvas>
  <div id="vign"></div>
  <div id="scan"></div>

  <div id="hud">
    <div id="hudTL" class="panel">
      <div class="row"><span class="lab">Здоровье</span><span class="bar hp"><i id="barHp"></i><b id="numHp">100</b></span></div>
      <div class="row"><span class="lab">Силы</span><span class="bar st"><i id="barSt"></i><b id="numSt">100</b></span></div>
      <div class="row"><span class="lab">Велик</span><span class="bar bk"><i id="barBk"></i><b id="numBk">100</b></span></div>
      <div class="row" id="rowDrunk" style="display:none"><span class="lab">Хмель</span><span class="bar dr"><i id="barDr"></i><b id="numDr">0</b></span></div>
      <div class="row" id="rowQual" style="display:none"><span class="lab">Монтаж</span><span class="bar qa"><i id="barQa"></i><b id="numQa">0</b></span></div>
    </div>

    <div id="hudTR" class="panel">
      <div class="money" id="numMoney">0 ₽</div>
      <div class="rep" id="numRep">Репутация: 0 — стажёр</div>
      <div id="clock">08:00</div>
      <div id="daypart">утро</div>
      <div id="eyes" title="Уровень внимания"><span>👁</span><span>👁</span><span>👁</span><span>👁</span><span>👁</span></div>
    </div>

    <div id="hudBL" class="panel">
      <div id="taskTitle">Смена не начата</div>
      <div id="taskStep">—</div>
      <div id="taskHint"></div>
      <div id="taskTimer">00:00</div>
    </div>

    <div id="hudBR" class="panel">
      <div id="mmLabel">Район «Заводская Слобода»</div>
      <canvas id="minimap" width="180" height="140"></canvas>
    </div>

    <div id="hudBC"></div>
  </div>

  <div id="radio"><div class="panel">
    <span id="stationName">РАДИО ЗАКАТ</span>
    <span id="tickWrap"><span id="tick"></span></span>
    <span id="radioKey">Q</span>
  </div></div>

  <div id="toasts"></div>
  <div id="prompt"><div class="panel"><span id="promptText"></span></div></div>

  <div id="dialog"><div class="panel">
    <canvas id="portrait" width="88" height="88"></canvas>
    <div id="dlgBody">
      <div id="dlgName">ТАМАРА</div>
      <div id="dlgText"></div>
      <div id="dlgOpts"></div>
      <div id="dlgNext">Space / E — далее</div>
    </div>
  </div></div>

  <div id="mini">
    <canvas id="miniCanvas"></canvas>
    <div id="miniTop">
      <span id="miniTitle">МОНТАЖ</span>
      <span id="miniPhase">этап 1</span>
      <span id="miniQ" class="panel" style="pointer-events:none">
        <div class="row" style="margin:0"><span class="lab">Качество</span><span class="bar qa"><i id="miniQBar"></i><b id="miniQNum">0</b></span></div>
      </span>
    </div>
    <div id="miniBottom" class="panel">
      <span id="miniHint">—</span>
      <span id="miniBtns"></span>
    </div>
  </div>

  <div id="screens"><div class="sheet" id="sheet"></div></div>

  <div id="errbox"><b>Что-то отвалилось (как обычно)</b><span id="errtext"></span></div>
  <div id="loading">Загрузка смены…</div>
</div>
<script>
/* =====================================================================
   МОНТАЖ-СИТИ: ТРУДНАЯ СМЕНА
   Сатирическая игра про вымышленного монтажника Олега Левинцова.
   Все персонажи, организации и события вымышлены.
   Один файл, чистый JS + Canvas 2D + Web Audio. Без внешних зависимостей.
   ===================================================================== */
(function () {
'use strict';

/* ------------------------------------------------------------------ */
/* 0. Мелкие утилиты                                                    */
/* ------------------------------------------------------------------ */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
const dist2 = (ax, ay, bx, by) => (ax - bx) * (ax - bx) + (ay - by) * (ay - by);
const rnd = (a, b) => a + Math.random() * (b - a);
const rndi = (a, b) => Math.floor(rnd(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const angLerp = (a, b, t) => { let d = ((b - a + Math.PI) % TAU + TAU) % TAU - Math.PI; return a + d * t; };
const fmtMoney = v => Math.round(v).toLocaleString('ru-RU') + ' ₽';
const pad2 = n => (n < 10 ? '0' : '') + n;
const $ = id => document.getElementById(id);

function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* ------------------------------------------------------------------ */
/* 1. Константы мира и баланс                                          */
/* ------------------------------------------------------------------ */
const WORLD = { w: 3200, h: 2400 };
const ROAD_W = 168;
const ROADS_H = [300, 1200, 2100];

const Audio2 = {
  ctx: null, master: null, sfxGain: null, musGain: null,
  ready: false, muted: false, sfxVol: 0.6, musVol: 0.35,
  station: 0, _next: 0, _step: 0, _timer: null,

  init() {
    if (this.ready) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      this.master = this.ctx.createGain(); this.master.gain.value = 0.9;
      this.sfxGain = this.ctx.createGain(); this.sfxGain.gain.value = this.sfxVol;
      this.musGain = this.ctx.createGain(); this.musGain.gain.value = this.musVol;
      this.sfxGain.connect(this.master); this.musGain.connect(this.master);
      this.master.connect(this.ctx.destination);
      this.ready = true;
      this._timer = setInterval(() => this._pump(), 90);
    } catch (e) { this.ready = false; this.ctx = null; }
  },
  resume() { if (this.ready && this.ctx && this.ctx.state === 'suspended') this.ctx.resume().catch(() => {}); },
  setSfx(v) { this.sfxVol = v; if (this.ready) this.sfxGain.gain.value = this.muted ? 0 : v; },
  setMus(v) { this.musVol = v; if (this.ready) this.musGain.gain.value = this.muted ? 0 : v; },
  mute(m) { this.muted = m; if (!this.ready) return; this.sfxGain.gain.value = m ? 0 : this.sfxVol; this.musGain.gain.value = m ? 0 : this.musVol; },

  tone(freq, dur, type, vol, slideTo, delay) {
    if (!this.ready || this.muted) return;
    const t0 = this.ctx.currentTime + (delay || 0);
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type || 'square'; o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30, slideTo), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.001, vol || 0.2), t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(this.sfxGain); o.start(t0); o.stop(t0 + dur + 0.03);
  },
  noise(dur, vol, lo, hi, delay) {
    if (!this.ready || this.muted) return;
    const t0 = this.ctx.currentTime + (delay || 0);
    const n = Math.floor(this.ctx.sampleRate * dur);
    const buf = this.ctx.createBuffer(1, Math.max(1, n), this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = this.ctx.createBufferSource(); s.buffer = buf;
    const f = this.ctx.createBiquadFilter(); f.type = 'bandpass';
    f.frequency.value = (lo + hi) / 2; f.Q.value = 0.9;
    const g = this.ctx.createGain(); g.gain.value = vol || 0.2;
    s.connect(f); f.connect(g); g.connect(this.sfxGain); s.start(t0); s.stop(t0 + dur + 0.02);
  },

  click()   { this.tone(680, 0.05, 'square', 0.16); },
  select()  { this.tone(420, 0.05, 'square', 0.13); this.tone(640, 0.06, 'square', 0.11, null, 0.05); },
  ok()      { this.tone(560, 0.08, 'triangle', 0.2); this.tone(760, 0.1, 'triangle', 0.18, null, 0.07); this.tone(980, 0.16, 'triangle', 0.16, null, 0.15); },
  nope()    { this.tone(200, 0.16, 'sawtooth', 0.18, 90); },
  spark()   { this.noise(0.16, 0.3, 1800, 6500); this.tone(1400, 0.07, 'square', 0.12, 300); },
  drill()   { this.noise(0.22, 0.16, 300, 1400); this.tone(120, 0.2, 'sawtooth', 0.1, 180); },
  screwdr() { this.noise(0.14, 0.1, 500, 2200); this.tone(320, 0.12, 'square', 0.07, 420); },
  crash()   { this.noise(0.32, 0.34, 90, 900); this.tone(90, 0.3, 'sawtooth', 0.2, 40); },
  thud()    { this.tone(110, 0.14, 'sine', 0.24, 55); this.noise(0.1, 0.12, 100, 500); },
  bark()    { this.tone(300, 0.09, 'sawtooth', 0.18, 180); this.tone(240, 0.1, 'sawtooth', 0.15, 140, 0.1); },
  cash()    { [880, 1180, 1480].forEach((f, i) => this.tone(f, 0.13, 'triangle', 0.17, null, i * 0.07)); },
  lock()    { this.tone(150, 0.06, 'square', 0.22); this.tone(900, 0.05, 'square', 0.12, null, 0.06); },
  bell()    { this.tone(1240, 0.4, 'sine', 0.15, 1180); this.tone(1860, 0.3, 'sine', 0.07, null, 0.02); },
  phone()   { for (let i = 0; i < 3; i++) { this.tone(880, 0.09, 'square', 0.14, null, i * 0.18); this.tone(1180, 0.09, 'square', 0.12, null, i * 0.18 + 0.09); } },
  siren()   { this.tone(700, 0.28, 'sawtooth', 0.12, 1100); this.tone(1100, 0.28, 'sawtooth', 0.12, 700, 0.28); },
  gulp()    { this.tone(220, 0.12, 'sine', 0.16, 120); this.tone(160, 0.14, 'sine', 0.14, 90, 0.12); },
  win()     { [523, 659, 784, 1046, 1318].forEach((f, i) => this.tone(f, 0.26, 'triangle', 0.19, null, i * 0.14)); },
  lose()    { [440, 392, 330, 262, 196].forEach((f, i) => this.tone(f, 0.3, 'sawtooth', 0.16, null, i * 0.17)); },
  skid()    { this.noise(0.26, 0.15, 400, 2600); },

  /* --- радио: три станции, всё сочинено процедурно --- */
  stations: [
    { name: 'ЗАКАТ 101.4', bpm: 108, wave: 'sawtooth',
      chords: [[57, 60, 64], [53, 57, 60], [48, 52, 55], [55, 59, 62]],
      lead: [76, 74, 72, 69, 71, 72, 74, 69], drums: 1 },
    { name: 'ПРОМЗОНА FM', bpm: 132, wave: 'square',
      chords: [[50, 53, 57], [50, 53, 57], [46, 50, 53], [48, 52, 55]],
      lead: [62, 65, 69, 65, 62, 60, 62, 57], drums: 2 },
    { name: 'ГАРАЖ-ВОЛНА 88.2', bpm: 92, wave: 'triangle',
      chords: [[45, 48, 52], [50, 53, 57], [43, 47, 50], [45, 48, 52]],
      lead: [69, 67, 64, 62, 64, 67, 69, 71], drums: 0 },
    { name: 'ТИШИНА', bpm: 0, chords: [], lead: [], drums: 0 }
  ],
  mtof(m) { return 440 * Math.pow(2, (m - 69) / 12); },
  _pump() {
    if (!this.ready || this.muted || this.musVol <= 0.001) return;
    const st = this.stations[this.station];
    if (!st || !st.bpm) return;
    if (this.ctx.state !== 'running') return;
    const spb = 60 / st.bpm / 2;              // восьмые
    const now = this.ctx.currentTime;
    if (this._next < now) this._next = now + 0.05;
    while (this._next < now + 0.35) {
      const s = this._step, t = this._next;
      const ch = st.chords[(s >> 3) % st.chords.length];
      if (s % 8 === 0) ch.forEach((n, i) => this._mnote(this.mtof(n), spb * 3.4, st.wave, 0.055 - i * 0.006, t));
      if (s % 2 === 0) this._mnote(this.mtof(ch[0] - 12), spb * 1.5, 'triangle', 0.085, t);
      const ld = st.lead[s % st.lead.length];
      if (s % 2 === 1) this._mnote(this.mtof(ld), spb * 0.8, 'square', 0.032, t);
      if (st.drums) {
        if (s % 4 === 0) this._mkick(t);
        if (st.drums > 1 && s % 4 === 2) this._mhat(t, 0.05);
        if (s % 8 === 4) this._msnare(t);
        if (s % 2 === 1) this._mhat(t, 0.022);
      }
      this._next += spb; this._step++;
    }
  },
  _mnote(f, d, w, v, t) {
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = w; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(v, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(this.musGain); o.start(t); o.stop(t + d + 0.02);
  },
  _mkick(t) {
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(45, t + 0.13);
    g.gain.setValueAtTime(0.16, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
    o.connect(g); g.connect(this.musGain); o.start(t); o.stop(t + 0.18);
  },
  _mhat(t, v) { this._mnoise(t, 0.035, v, 6000); },
  _msnare(t) { this._mnoise(t, 0.12, 0.08, 1800); },
  _mnoise(t, d, v, freq) {
    const n = Math.floor(this.ctx.sampleRate * d);
    const buf = this.ctx.createBuffer(1, Math.max(1, n), this.ctx.sampleRate);
    const arr = buf.getChannelData(0);
    for (let i = 0; i < n; i++) arr[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = this.ctx.createBufferSource(); s.buffer = buf;
    const f = this.ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = freq;
    const g = this.ctx.createGain(); g.gain.value = v;
    s.connect(f); f.connect(g); g.connect(this.musGain); s.start(t); s.stop(t + d + 0.02);
  },
  nextStation() {
    this.station = (this.station + 1) % this.stations.length;
    this._step = 0; this._next = 0;
    return this.stations[this.station].name;
  }
};

/* 3. Сохранение в localStorage                                        */
/* ------------------------------------------------------------------ */
const SAVE_KEY = 'montazh_city_save_v1';
const Save = {
  available: true, lastError: '',
  test() {
    try { localStorage.setItem(SAVE_KEY + '_t', '1'); localStorage.removeItem(SAVE_KEY + '_t'); this.available = true; }
    catch (e) { this.available = false; this.lastError = String(e && e.message || e); }
    return this.available;
  },
  write(data) {
    if (!this.available) return false;
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(data)); return true; }
    catch (e) { this.available = false; this.lastError = String(e && e.message || e); return false; }
  },
  read() {
    if (!this.available) return null;
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return null;
      const d = JSON.parse(raw);
      if (!d || typeof d !== 'object' || d.v !== 1) return null;
      return d;
    } catch (e) { this.lastError = String(e && e.message || e); return null; }
  },
  wipe() { try { localStorage.removeItem(SAVE_KEY); return true; } catch (e) { return false; } },
  has() { try { return !!localStorage.getItem(SAVE_KEY); } catch (e) { return false; } }
};
Save.test();

const Input = {
  down: Object.create(null), hit: Object.create(null),
  mx: 0, my: 0, mdown: false, mclick: false, mup: false,
  blockKeys: { ArrowUp: 1, ArrowDown: 1, ArrowLeft: 1, ArrowRight: 1, Space: 1, Tab: 1, KeyE: 1, KeyF: 1, KeyM: 1, KeyQ: 1, KeyR: 1, KeyC: 1 },
  init() {
    window.addEventListener('keydown', e => {
      if (e.repeat) { if (this.blockKeys[e.code]) e.preventDefault(); return; }
      const tag = (e.target && e.target.tagName) || '';
      if (tag === 'INPUT' || tag === 'TEXTAREA') return;
      this.down[e.code] = true; this.hit[e.code] = true;
      if (this.blockKeys[e.code]) e.preventDefault();
      Audio2.resume();
    });
    window.addEventListener('keyup', e => { this.down[e.code] = false; });
    window.addEventListener('blur', () => { this.down = Object.create(null); this.mdown = false; });
    const stage = $('stage');
    const upd = e => {
      const r = stage.getBoundingClientRect();
      const p = (e.touches && e.touches[0]) || e;
      this.mx = p.clientX - r.left; this.my = p.clientY - r.top;
    };
    stage.addEventListener('mousemove', upd);
    stage.addEventListener('mousedown', e => { upd(e); this.mdown = true; this.mclick = true; Audio2.resume(); });
    window.addEventListener('mouseup', () => { this.mdown = false; this.mup = true; });
    stage.addEventListener('touchstart', e => { upd(e); this.mdown = true; this.mclick = true; Audio2.resume(); }, { passive: true });
    stage.addEventListener('touchmove', e => upd(e), { passive: true });
    stage.addEventListener('touchend', () => { this.mdown = false; this.mup = true; }, { passive: true });
    window.addEventListener('contextmenu', e => { if (e.target && e.target.id === 'world') e.preventDefault(); });
  },
  pressed(code) { return !!this.hit[code]; },
  any(list) { for (const c of list) if (this.down[c]) return true; return false; },
  anyHit(list) { for (const c of list) if (this.hit[c]) return true; return false; },
  endFrame() { this.hit = Object.create(null); this.mclick = false; this.mup = false; }
};

/* 6. Коллизии: статическая сетка                                       */
/* ------------------------------------------------------------------ */
const Solids = { list: [], grid: null, cell: 200, cols: 0, rows: 0 };
function buildSolids() {
  Solids.list.length = 0;
  for (const b of BUILDINGS) Solids.list.push({ x: b.x, y: b.y, w: b.w, h: b.h, kind: 'building', ref: b });
  for (const k of KIOSKS) Solids.list.push({ x: k.x, y: k.y, w: k.w, h: k.h, kind: 'kiosk', ref: k, fragile: true });
  for (const p of PROPS) {
    if (p.kind === 'fenceH') Solids.list.push({ x: p.x, y: p.y, w: p.w || 200, h: 10, kind: 'fence', ref: p, fragile: true });
    else if (p.kind === 'block') Solids.list.push({ x: p.x - 22, y: p.y - 14, w: 44, h: 28, kind: 'prop', ref: p });
    else if (p.kind === 'sandbox') Solids.list.push({ x: p.x - 46, y: p.y - 30, w: 92, h: 60, kind: 'soft', ref: p, soft: true });
    else if (p.kind === 'carcass') Solids.list.push({ x: p.x - 40, y: p.y - 20, w: 80, h: 40, kind: 'prop', ref: p });
    else if (p.kind === 'tree') Solids.list.push({ x: p.x - 11, y: p.y - 8, w: 22, h: 16, kind: 'prop', ref: p });
    else if (p.kind === 'pipe') Solids.list.push({ x: p.x - 44, y: p.y - 12, w: 88, h: 24, kind: 'prop', ref: p });
    else if (p.kind === 'barrel') Solids.list.push({ x: p.x - 14, y: p.y - 10, w: 28, h: 20, kind: 'prop', ref: p, fragile: true });
    else if (p.kind === 'bin') Solids.list.push({ x: p.x - 16, y: p.y - 11, w: 32, h: 22, kind: 'prop', ref: p, fragile: true });
  }
  for (const p of POLES) Solids.list.push({ x: p.x - 9, y: p.y - 7, w: 18, h: 14, kind: 'pole', ref: p });
  /* внешние стены района */
  const T = 40;
  Solids.list.push({ x: -T, y: -T, w: WORLD.w + T * 2, h: T, kind: 'edge' });
  Solids.list.push({ x: -T, y: WORLD.h, w: WORLD.w + T * 2, h: T, kind: 'edge' });
  Solids.list.push({ x: -T, y: 0, w: T, h: WORLD.h, kind: 'edge' });
  Solids.list.push({ x: WORLD.w, y: 0, w: T, h: WORLD.h, kind: 'edge' });

  Solids.cols = Math.ceil(WORLD.w / Solids.cell) + 2;
  Solids.rows = Math.ceil(WORLD.h / Solids.cell) + 2;
  Solids.grid = new Array(Solids.cols * Solids.rows);
  for (let i = 0; i < Solids.grid.length; i++) Solids.grid[i] = [];
  for (const s of Solids.list) {
    const x0 = Math.max(0, Math.floor((s.x + Solids.cell) / Solids.cell));
    const x1 = Math.min(Solids.cols - 1, Math.floor((s.x + s.w + Solids.cell) / Solids.cell));
    const y0 = Math.max(0, Math.floor((s.y + Solids.cell) / Solids.cell));
    const y1 = Math.min(Solids.rows - 1, Math.floor((s.y + s.h + Solids.cell) / Solids.cell));
    for (let gy = y0; gy <= y1; gy++) for (let gx = x0; gx <= x1; gx++) Solids.grid[gy * Solids.cols + gx].push(s);
  }
}
function solidsNear(x, y, r) {
  const out = [], c = Solids.cell;
  const x0 = Math.max(0, Math.floor((x - r + c) / c)), x1 = Math.min(Solids.cols - 1, Math.floor((x + r + c) / c));
  const y0 = Math.max(0, Math.floor((y - r + c) / c)), y1 = Math.min(Solids.rows - 1, Math.floor((y + r + c) / c));
  for (let gy = y0; gy <= y1; gy++) for (let gx = x0; gx <= x1; gx++) {
    const cellArr = Solids.grid[gy * Solids.cols + gx];
    for (const s of cellArr) if (out.indexOf(s) < 0) out.push(s);
  }
  return out;
}
/* круг против прямоугольника; возвращает вектор выталкивания или null */
function circleRect(cx, cy, r, s) {
  const nx = clamp(cx, s.x, s.x + s.w), ny = clamp(cy, s.y, s.y + s.h);
  let dx = cx - nx, dy = cy - ny;
  let d2 = dx * dx + dy * dy;
  if (d2 > r * r) return null;
  let d = Math.sqrt(d2);
  if (d < 0.0001) {                       // центр внутри — выталкиваем по ближайшей грани
    const left = cx - s.x, right = s.x + s.w - cx, top = cy - s.y, bot = s.y + s.h - cy;
    const m = Math.min(left, right, top, bot);
    if (m === left) return { nx: -1, ny: 0, push: left + r };
    if (m === right) return { nx: 1, ny: 0, push: right + r };
    if (m === top) return { nx: 0, ny: -1, push: top + r };
    return { nx: 0, ny: 1, push: bot + r };
  }
  return { nx: dx / d, ny: dy / d, push: r - d };
}
function isRoad(x, y) {
  for (const r of ROADS_H) if (Math.abs(y - r) < ROAD_W / 2) return true;
  for (const r of ROADS_V) if (Math.abs(x - r) < ROAD_W / 2) return true;
  return false;
}
function freeSpot(x, y, r) {
  for (const s of solidsNear(x, y, r + 6)) if (circleRect(x, y, r, s)) return false;
  return true;
}

/* 7. Запекание земли и мини-карты                                      */

const Ground = { c: null, x: null, mini: null, miniW: 320, miniH: 240 };
function bakeGround() {
  const c = document.createElement('canvas');
  c.width = WORLD.w; c.height = WORLD.h;
  const g = c.getContext('2d');
  const R = mulberry32(1337);

  /* базовая земля */
  const bg = g.createLinearGradient(0, 0, WORLD.w * 0.4, WORLD.h);
  bg.addColorStop(0, '#463850'); bg.addColorStop(0.5, '#372c42'); bg.addColorStop(1, '#2b2136');
  g.fillStyle = bg; g.fillRect(0, 0, WORLD.w, WORLD.h);

  /* дворовая «зелень» */
  g.globalAlpha = 0.5;
  for (let i = 0; i < 220; i++) {
    const x = R() * WORLD.w, y = R() * WORLD.h;
    if (isRoad(x, y)) continue;
    g.fillStyle = R() < .5 ? '#51663c' : '#3d5230';
    g.beginPath(); g.ellipse(x, y, 40 + R() * 120, 26 + R() * 70, R() * Math.PI, 0, TAU); g.fill();
  }
  g.globalAlpha = 1;

  /* промзона — бетон */
  g.fillStyle = '#4a4756'; g.fillRect(1684, 384, 1032, 732);
  g.fillStyle = '#474455'; g.fillRect(1684, 1284, 1032, 732);
  g.globalAlpha = .25; g.strokeStyle = '#2f2c3a'; g.lineWidth = 3;
  for (let x = 1700; x < 2716; x += 120) { g.beginPath(); g.moveTo(x, 384); g.lineTo(x, 1116); g.stroke(); }
  for (let y = 400; y < 1116; y += 120) { g.beginPath(); g.moveTo(1684, y); g.lineTo(2716, y); g.stroke(); }
  g.globalAlpha = 1;

  /* тротуары */
  g.fillStyle = '#5b5468';
  for (const y of ROADS_H) { g.fillRect(0, y - ROAD_W / 2 - 22, WORLD.w, 22); g.fillRect(0, y + ROAD_W / 2, WORLD.w, 22); }
  for (const x of ROADS_V) { g.fillRect(x - ROAD_W / 2 - 22, 0, 22, WORLD.h); g.fillRect(x + ROAD_W / 2, 0, 22, WORLD.h); }
  g.strokeStyle = 'rgba(20,16,28,.5)'; g.lineWidth = 1;
  for (const y of ROADS_H) for (let x = 0; x < WORLD.w; x += 40) {
    g.beginPath(); g.moveTo(x, y - ROAD_W / 2 - 22); g.lineTo(x, y - ROAD_W / 2); g.stroke();
    g.beginPath(); g.moveTo(x, y + ROAD_W / 2); g.lineTo(x, y + ROAD_W / 2 + 22); g.stroke();
  }
  for (const x of ROADS_V) for (let y = 0; y < WORLD.h; y += 40) {
    g.beginPath(); g.moveTo(x - ROAD_W / 2 - 22, y); g.lineTo(x - ROAD_W / 2, y); g.stroke();
    g.beginPath(); g.moveTo(x + ROAD_W / 2, y); g.lineTo(x + ROAD_W / 2 + 22, y); g.stroke();
  }

  /* асфальт */
  g.fillStyle = '#2c2836';
  for (const y of ROADS_H) g.fillRect(0, y - ROAD_W / 2, WORLD.w, ROAD_W);
  for (const x of ROADS_V) g.fillRect(x - ROAD_W / 2, 0, ROAD_W, WORLD.h);

  /* разметка */
  g.strokeStyle = 'rgba(255,210,63,.55)'; g.lineWidth = 4; g.setLineDash([34, 26]);
  for (const y of ROADS_H) { g.beginPath(); g.moveTo(0, y); g.lineTo(WORLD.w, y); g.stroke(); }
  for (const x of ROADS_V) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, WORLD.h); g.stroke(); }
  g.setLineDash([]);
  g.strokeStyle = 'rgba(230,225,245,.3)'; g.lineWidth = 3;
  for (const y of ROADS_H) { [-1, 1].forEach(s => { g.beginPath(); g.moveTo(0, y + s * (ROAD_W / 2 - 8)); g.lineTo(WORLD.w, y + s * (ROAD_W / 2 - 8)); g.stroke(); }); }
  for (const x of ROADS_V) { [-1, 1].forEach(s => { g.beginPath(); g.moveTo(x + s * (ROAD_W / 2 - 8), 0); g.lineTo(x + s * (ROAD_W / 2 - 8), WORLD.h); g.stroke(); }); }

  /* «зебры» на перекрёстках */
  g.fillStyle = 'rgba(240,235,255,.42)';
  for (const y of ROADS_H) for (const x of ROADS_V) {
    for (let i = 0; i < 6; i++) {
      g.fillRect(x - ROAD_W / 2 - 20, y - 62 + i * 22, 16, 14);
      g.fillRect(x + ROAD_W / 2 + 4, y - 62 + i * 22, 16, 14);
      g.fillRect(x - 62 + i * 22, y - ROAD_W / 2 - 20, 14, 16);
      g.fillRect(x - 62 + i * 22, y + ROAD_W / 2 + 4, 14, 16);
    }
  }

  /* парковка у большого объекта */
  g.fillStyle = '#3b3846'; g.fillRect(1700, 1500, 230, 400);
  g.strokeStyle = 'rgba(255,255,255,.35)'; g.lineWidth = 3;
  for (let i = 0; i <= 5; i++) { g.beginPath(); g.moveTo(1700, 1520 + i * 72); g.lineTo(1930, 1520 + i * 72); g.stroke(); }

  /* спортплощадка во дворе */
  g.strokeStyle = 'rgba(37,232,220,.35)'; g.lineWidth = 4;
  g.strokeRect(620, 760, 220, 150);
  g.beginPath(); g.arc(730, 835, 44, 0, TAU); g.stroke();

  /* трещины, люки, лужи, пятна */
  for (let i = 0; i < 420; i++) {
    const x = R() * WORLD.w, y = R() * WORLD.h;
    g.strokeStyle = 'rgba(18,14,26,' + (0.1 + R() * 0.22) + ')'; g.lineWidth = 1 + R() * 2;
    g.beginPath(); g.moveTo(x, y);
    let cx = x, cy = y;
    for (let k = 0; k < 3; k++) { cx += (R() - .5) * 60; cy += (R() - .5) * 60; g.lineTo(cx, cy); }
    g.stroke();
  }
  for (let i = 0; i < 46; i++) {
    const x = R() * WORLD.w, y = R() * WORLD.h;
    if (!isRoad(x, y)) continue;
    g.fillStyle = '#1f1c28'; g.beginPath(); g.arc(x, y, 13, 0, TAU); g.fill();
    g.strokeStyle = '#4a4557'; g.lineWidth = 2; g.stroke();
  }
  for (let i = 0; i < 60; i++) {
    const x = R() * WORLD.w, y = R() * WORLD.h;
    g.fillStyle = 'rgba(60,90,120,' + (0.06 + R() * 0.12) + ')';
    g.beginPath(); g.ellipse(x, y, 20 + R() * 60, 12 + R() * 30, R() * Math.PI, 0, TAU); g.fill();
  }
  /* «песок» и крошка */
  for (let i = 0; i < 5200; i++) {
    const x = R() * WORLD.w, y = R() * WORLD.h;
    g.fillStyle = 'rgba(255,255,255,' + (0.015 + R() * 0.05) + ')';
    g.fillRect(x, y, 1 + (R() < .2 ? 1 : 0), 1);
  }
  /* тёплый закатный подмес */
  const warm = g.createLinearGradient(0, 0, WORLD.w, WORLD.h);
  warm.addColorStop(0, 'rgba(255,138,31,.17)');
  warm.addColorStop(0.55, 'rgba(122,44,255,.13)');
  warm.addColorStop(1, 'rgba(255,45,149,.16)');
  g.fillStyle = warm; g.fillRect(0, 0, WORLD.w, WORLD.h);

  Ground.c = c; Ground.x = g;

  /* мини-карта (статический слой) */
  const m = document.createElement('canvas');
  m.width = Ground.miniW; m.height = Ground.miniH;
  const mg = m.getContext('2d');
  const sx = m.width / WORLD.w, sy = m.height / WORLD.h;
  mg.fillStyle = '#171225'; mg.fillRect(0, 0, m.width, m.height);
  mg.fillStyle = '#2f2b3d';
  for (const y of ROADS_H) mg.fillRect(0, (y - ROAD_W / 2) * sy, m.width, ROAD_W * sy);
  for (const x of ROADS_V) mg.fillRect((x - ROAD_W / 2) * sx, 0, ROAD_W * sx, m.height);
  for (const b of BUILDINGS) {
    mg.fillStyle = b.kind === 'panel' ? '#5a4a72' : b.kind === 'industrial' ? '#4a5566' : b.kind === 'garage' ? '#4a4152' : '#6b4a7a';
    mg.fillRect(b.x * sx, b.y * sy, b.w * sx, b.h * sy);
  }
  Ground.mini = m;
}

/* 9. Время суток                                                       */
/* ------------------------------------------------------------------ */
function hour() { return S.clock / 3600; }
function clockStr() {
  const h = Math.floor(S.clock / 3600) % 24, m = Math.floor(S.clock / 60) % 60;
  return pad2(h) + ':' + pad2(m);
}
function dayPart() {
  const h = hour();
  if (h < 5) return 'ночь';
  if (h < 11) return 'утро';
  if (h < 17) return 'день';
  if (h < 21) return 'закат';
  return 'ночь';
}
function darkness() {
  const h = hour();
  if (h >= 21 || h < 5) return 0.72;
  if (h >= 19) return lerp(0.3, 0.72, (h - 19) / 2);
  if (h >= 17) return lerp(0.08, 0.3, (h - 17) / 2);
  if (h < 6) return lerp(0.72, 0.3, (h - 5));
  if (h < 7.5) return lerp(0.3, 0, (h - 6) / 1.5);
  return 0;
}
function setHour(h) { S.clock = ((h % 24) + 24) % 24 * 3600; }

function fx(x, y, kind, n, color) {
  n = n || 8;
  if (S.lowFx) n = Math.max(2, Math.round(n / 2));
  if (S.fx.length > 420) return;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * TAU, sp = kind === 'spark' ? rnd(60, 260) : rnd(20, 130);
    S.fx.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - (kind === 'dust' ? 20 : 0),
      life: rnd(0.3, 0.9), max: 0.9, kind, color: color || (kind === 'spark' ? '#ffd23f' : '#c9bcdd'),
      s: kind === 'spark' ? rnd(1.5, 3.5) : rnd(2, 6)
    });
  }
}
function floater(x, y, text, color) {
  S.fx.push({ x, y, vx: 0, vy: -34, life: 1.25, max: 1.25, kind: 'text', text, color: color || '#ffd23f', s: 14 });
}
function shake(v) { S.shake = Math.min(26, S.shake + v); }
function toast(text, cls, ms) {
  const box = $('toasts');
  const el = document.createElement('div');
  el.className = 'toast ' + (cls || '');
  el.textContent = text;
  box.appendChild(el);
  setTimeout(() => { el.style.transition = 'opacity .4s'; el.style.opacity = '0'; setTimeout(() => el.remove(), 420); }, ms || 2600);
  while (box.children.length > 5) box.removeChild(box.firstChild);
}

  if (why) toast(why + ': ' + (v > 0 ? '+' : '') + fmtMoney(v), v > 0 ? 'good' : 'bad');
}
function addRep(v, why) {
  S.player.rep = clamp(S.player.rep + v, -30, 120);
  if (why) toast(why + ' (репутация ' + (v > 0 ? '+' : '') + v + ')', v > 0 ? 'good' : 'bad');
  if (S.player.rep <= -25) endGame(false, 'Борисыч устал. «Олег, ты хороший человек, но объекты после тебя — как после града». Тебя перевели на склад считать стяжки.');
}
function hurt(v, why) {
  const p = S.player;
  if (p.invuln > 0) return;
  p.health = clamp(p.health - v, 0, 100);
  p.hurt = 0.45; p.invuln = 0.55;
  shake(v * 0.6);
  if (p.health <= 0) endGame(false, why || 'Олег переоценил себя и недооценил бордюр. Смена окончена больничным.');
}
function addHeat(v, reason) {
  S.heat = clamp(S.heat + v, 0, BAL.heatMax);
  if (v >= 8 && reason) toast(reason, 'bad', 2000);
}
function witnessed(x, y) {
  let seen = false;
  for (const g of S.grans) if (dist2(g.x, g.y, x, y) < 330 * 330) { seen = true; g.say = 3.2; g.line = pick(GRAN_LINES); }
  if (seen) addHeat(11, 'Бабушки у подъезда всё видели');
  return seen;
}

/* ------------------------------------------------------------------ */
/* 12. Игрок: ходьба и велосипед                                        */
/* ------------------------------------------------------------------ */
function inputVec() {
  let ix = 0, iy = 0;
  if (Input.any(K.left)) ix -= 1;
  if (Input.any(K.right)) ix += 1;
  if (Input.any(K.up)) iy -= 1;
  if (Input.any(K.down)) iy += 1;
  const p = S.player;
  if (p.drunk > 45) {                       // пьяный руль живёт своей жизнью
    const sw = Math.sin(S.t * 0.9) > 0.72 ? -1 : 1;
    ix *= sw;
  }
  const l = Math.hypot(ix, iy);
  if (l > 0) { ix /= l; iy /= l; }
  return { x: ix, y: iy, len: l };
}

function movePlayerOnFoot(dt) {
  const p = S.player, v = inputVec();
  const drunkF = p.drunk / 100;
  const sprint = Input.any(K.sprint) && p.stamina > 3 && v.len > 0;
  let maxSp = sprint ? BAL.walkSprint : BAL.walkMax;
  maxSp *= (1 - drunkF * 0.22) * (p.stamina < 15 ? 0.72 : 1) * (p.health < 30 ? 0.85 : 1);
  if (p.carry) maxSp *= 0.86;

  if (Input.anyHit(K.brake) && p.dodgeCd <= 0 && p.stamina >= BAL.dodgeCost && v.len > 0) {
    p.dodge = 0.26; p.dodgeCd = 0.85; p.stamina -= BAL.dodgeCost; p.invuln = 0.34;
    p.vx = v.x * 430; p.vy = v.y * 430; Audio2.noise(0.12, 0.13, 300, 1800);
    fx(p.x, p.y + 8, 'dust', 7);
  }
  const accel = BAL.walkAccel * (p.dodge > 0 ? 0.2 : 1);
  p.vx += v.x * accel * dt; p.vy += v.y * accel * dt;
  if (drunkF > 0.15) {                       // шатает
    p.vx += Math.sin(S.t * 3.1) * 44 * drunkF * dt * 60 / 60;
    p.vy += Math.cos(S.t * 2.3) * 40 * drunkF * dt * 60 / 60;
  }
  const sp = Math.hypot(p.vx, p.vy);
  const lim = p.dodge > 0 ? 470 : maxSp;
  if (sp > lim) { p.vx = p.vx / sp * lim; p.vy = p.vy / sp * lim; }
  const fr = Math.exp(-BAL.walkFric * dt);
  p.vx *= fr; p.vy *= fr;

  if (sprint) p.stamina = clamp(p.stamina - BAL.staminaDrain * dt, 0, 100);
  else p.stamina = clamp(p.stamina + BAL.staminaRegen * (v.len > 0 ? 0.45 : 1) * dt * staminaMult(), 0, 100);

  if (v.len > 0) { p.dir = angLerp(p.dir, Math.atan2(v.y, v.x), 1 - Math.exp(-18 * dt)); p.walkPhase += sp * dt * 0.045; }
  moveWithCollision(p, dt, p.r, false);
  p.dodge = Math.max(0, p.dodge - dt); p.dodgeCd = Math.max(0, p.dodgeCd - dt);
}

function staminaMult() {
  let m = 1;
  if (S.upgrades.thermos) m += 0.35;
  if (S.upgrades.saddle) m += 0.2;
  if (S.player.drunk > 30) m -= 0.3;
  return Math.max(0.3, m);
}

function moveBike(dt) {
  const p = S.player, b = S.bike, v = inputVec();
  const drunkF = p.drunk / 100;
  const cond = b.cond / 100;
  const boost = Input.any(K.sprint) && p.stamina > 2;
  let maxSp = (boost ? BAL.bikeBoost : BAL.bikeMax) * (0.62 + 0.38 * cond);
  if (S.upgrades.frame) maxSp *= 1.14;
  if (S.upgrades.tires) maxSp *= 1.05;
  maxSp *= (1 - drunkF * 0.18) * (p.stamina < 12 ? 0.75 : 1);

  let thr = 0;
  if (Input.any(K.up)) thr = 1;
  if (Input.any(K.down)) thr = -0.55;
  let steer = 0;
  if (Input.any(K.left)) steer -= 1;
  if (Input.any(K.right)) steer += 1;
  if (drunkF > 0.45 && Math.sin(S.t * 0.9) > 0.72) steer *= -1;

  b.speed += thr * BAL.bikeAccel * (0.6 + 0.4 * cond) * dt;
  if (Input.any(K.brake)) {
    const before = b.speed;
    b.speed -= Math.sign(b.speed) * BAL.bikeBrake * dt;
    if (Math.abs(before) > 120 && Math.random() < 0.4) {
      S.marks.push({ x: b.x, y: b.y, a: b.dir, life: 6 });
      if (Math.random() < 0.25) Audio2.skid();
    }
    if (Math.sign(before) !== Math.sign(b.speed)) b.speed = 0;
  }
  b.speed *= Math.exp(-BAL.bikeDrag * dt);
  b.speed = clamp(b.speed, -110, maxSp);

  const turnRate = BAL.bikeTurn * (S.upgrades.tires ? 1.16 : 1) * clamp(Math.abs(b.speed) / 130, 0, 1.25);
  b.dir += steer * turnRate * dt * Math.sign(b.speed || 1);
  b.wobble = lerp(b.wobble, drunkF * 0.5 + (1 - cond) * 0.3, dt * 3);
  b.dir += Math.sin(S.t * 5.5) * b.wobble * 0.5 * dt;

  if (boost && Math.abs(b.speed) > 60) p.stamina = clamp(p.stamina - BAL.staminaDrain * 0.85 * dt, 0, 100);
  else p.stamina = clamp(p.stamina + BAL.staminaRegen * 0.55 * dt * staminaMult(), 0, 100);

  /* слетевшая цепь */
  if (b.cond < 45 && b.chain <= 0 && Math.random() < 0.06 * dt * (1 - cond)) {
    b.chain = 1; toast('Слетела цепь! F — поправить', 'bad');
    Audio2.nope();
  }
  if (b.chain > 0) {
    b.speed *= Math.exp(-3.4 * dt);
    if (Input.anyHit(K.tool)) {
      b.chain = 0; toast('Цепь на месте. «Она просто хотела внимания»', 'good');
      Audio2.screwdr(); p.stamina = clamp(p.stamina - 6, 0, 100);
    }
  }

  p.vx = Math.cos(b.dir) * b.speed; p.vy = Math.sin(b.dir) * b.speed;
  b.wheel += b.speed * dt * 0.06;
  S.stats.dist += Math.abs(b.speed) * dt;

  moveWithCollision(p, dt, p.r + 3, true);
  b.x = p.x; b.y = p.y;

  /* ямы */
  for (const h of POTHOLES) {
    if (dist2(p.x, p.y, h.x, h.y) < (h.r + 8) * (h.r + 8) && Math.abs(b.speed) > 90) {
      if (!h.cd || S.t - h.cd > 1.4) {
        h.cd = S.t;
        b.speed *= 0.55; damageBike(rnd(3, 8)); shake(7); Audio2.thud();
        p.stamina = clamp(p.stamina - 5, 0, 100);
        fx(p.x, p.y + 6, 'dust', 8);
        if (Math.random() < 0.3) floater(p.x, p.y - 30, pick(['Ой', 'Яма!', 'Ах ты ж', 'Спасибо, город']), '#ff8a1f');
      }
    }
  }
}

function damageBike(v) {
  S.bike.cond = clamp(S.bike.cond - v, 0, 100);
  if (S.bike.cond < 20) toast('Велосипед скрипит как обвинение', 'bad', 1800);
}

/* движение с разрешением столкновений */
function moveWithCollision(e, dt, r, isBike) {
  const px = e.x, py = e.y;
  e.x += e.vx * dt; e.y += e.vy * dt;
  const near = solidsNear(e.x, e.y, r + 4);
  let hitHard = null, impact = 0;
  for (const s of near) {
    const c = circleRect(e.x, e.y, r, s);
    if (!c) continue;
    if (s.soft) continue;
    e.x += c.nx * c.push; e.y += c.ny * c.push;
    const vn = e.vx * c.nx + e.vy * c.ny;
    if (vn < 0) {
      const bounce = isBike ? 0.18 : 0.05;
      e.vx -= (1 + bounce) * vn * c.nx; e.vy -= (1 + bounce) * vn * c.ny;
      if (-vn > impact) { impact = -vn; hitHard = s; }
    }
  }
  if (hitHard && impact > 130) {
    const sp = impact;
    if (isBike) {
      S.bike.speed *= 0.25;
      damageBike(sp * 0.028);
      hurt(sp * 0.016, 'Олег познакомился со стеной ближе, чем планировал.');
      S.stats.crashes++;
      Audio2.crash(); shake(9);
      fx(e.x, e.y, 'spark', 9);
      if (hitHard.fragile) breakProp(hitHard);
      else if (hitHard.kind === 'building' && Math.random() < 0.5) floater(e.x, e.y - 30, 'Дом не двигается', '#ff8a1f');
    } else {
      Audio2.thud(); shake(3);
    }
  } else if (hitHard && impact > 40 && isBike) {
    Audio2.thud(); shake(2);
    if (hitHard.fragile && impact > 90) breakProp(hitHard);
  }
  if (e.x < 12) { e.x = 12; e.vx = 0; }
  if (e.y < 12) { e.y = 12; e.vy = 0; }
  if (e.x > WORLD.w - 12) { e.x = WORLD.w - 12; e.vx = 0; }
  if (e.y > WORLD.h - 12) { e.y = WORLD.h - 12; e.vy = 0; }
  return { impact, hit: hitHard, moved: dist(px, py, e.x, e.y) };
}

function breakProp(s) {
  if (s.ref && s.ref.broken) return;
  if (s.ref) s.ref.broken = true;
  fx(s.x + s.w / 2, s.y + s.h / 2, 'spark', 12, '#ff8a1f');
  Audio2.crash();
  const cost = s.kind === 'kiosk' ? 45 : 15;
  addHeat(s.kind === 'kiosk' ? 26 : 12, s.kind === 'kiosk' ? 'Ты снёс киоск. Владелец уже звонит всем' : 'Порча чужого имущества');
  witnessed(s.x, s.y);
  addMoney(-cost, 'Ущерб');
  toast(pick(['«Это был не я, это был бордюр»', '«Оно само стояло на пути»', '«Запишите на бригаду»']), 'bad', 2200);
}

/* посадка/высадка */
function tryMountBike() {
  const p = S.player, b = S.bike;
  if (p.onBike) {
    p.onBike = false; b.parked = true; b.speed = 0;
    let ang = p.dir + Math.PI / 2, ok = false, nx = p.x, ny = p.y;
    for (let i = 0; i < 8; i++) {
      const a = ang + i * (TAU / 8);
      const tx = p.x + Math.cos(a) * 26, ty = p.y + Math.sin(a) * 26;
      if (freeSpot(tx, ty, 12)) { nx = tx; ny = ty; ok = true; break; }
    }
    b.x = nx; b.y = ny; b.dir = p.dir;
    Audio2.click(); toast('Слез с велосипеда', 'info', 1300);
    return true;
  }
  if (dist2(p.x, p.y, b.x, b.y) < 62 * 62) {
    p.onBike = true; b.parked = false; b.dir = p.dir; b.speed = 0; b.x = p.x; b.y = p.y;
    Audio2.select(); toast(pick(['«Велосипед служебный. То есть мой, но используется по службе»', 'На колёсах веселее', 'Поехали']), 'info', 2000);
    return true;
  }
  return false;
}

const Dlg = {
  open: false, who: '', text: '', shown: 0, opts: null, queue: [], onEnd: null, lock: 0,
  seq(list, onEnd) {
    this.queue = list.slice();
    this.onEnd = onEnd || null;
    this._next();
  },
  one(who, text, opts, onEnd) { this.seq([{ who, text, opts }], onEnd); },
  _next() {
    if (!this.queue.length) { this._close(); if (this.onEnd) { const f = this.onEnd; this.onEnd = null; f(); } return; }
    const e = this.queue.shift();
    this.open = true; this.who = e.who; this.text = e.text; this.shown = 0; this.opts = e.opts || null; this.lock = 0.18;
    $('dialog').style.display = 'block';
    $('dlgName').textContent = CHARS[e.who] ? CHARS[e.who].name : e.who;
    $('dlgText').textContent = '';
    drawPortrait(e.who);
    this._renderOpts();
    if (this.opts) Audio2.select(); else Audio2.click();
  },
  _renderOpts() {
    const box = $('dlgOpts'); box.innerHTML = '';
    $('dlgNext').textContent = this.opts ? 'Цифры 1–5 или мышь' : 'Space / E — далее';
    if (!this.opts) return;
    this.opts.forEach((o, i) => {
      const b = document.createElement('button');
      b.className = 'opt'; b.type = 'button';
      b.innerHTML = '<s>' + (i + 1) + '.</s> ' + o.label + (o.hint ? ' <s>— ' + o.hint + '</s>' : '');
      b.disabled = !!o.disabled;
      if (o.disabled) b.style.opacity = '.45';
      b.addEventListener('click', () => this.choose(i));
      box.appendChild(b);
    });
  },
  choose(i) {
    if (!this.opts || !this.opts[i] || this.opts[i].disabled) return;
    const o = this.opts[i];
    Audio2.click();
    const rest = this.queue.slice(); const end = this.onEnd;
    this.queue = []; this.onEnd = null; this._close();
    if (o.fn) o.fn();
    if (!this.open && rest.length) { this.queue = rest; this.onEnd = end; this._next(); }
  },
  _close() { this.open = false; this.opts = null; $('dialog').style.display = 'none'; },
  closeAll() { this.queue = []; this.onEnd = null; this._close(); },
  update(dt) {
    if (!this.open) return;
    this.lock = Math.max(0, this.lock - dt);
    if (this.shown < this.text.length) {
      this.shown = Math.min(this.text.length, this.shown + dt * 74);
      $('dlgText').textContent = this.text.slice(0, Math.floor(this.shown));
    }
    if (this.lock > 0) return;
    if (this.opts) {
      for (let i = 0; i < this.opts.length; i++)
        if (Input.pressed('Digit' + (i + 1)) || Input.pressed('Numpad' + (i + 1))) { this.choose(i); return; }
      return;
    }
    if (Input.anyHit(K.act) || Input.anyHit(K.brake) || (Input.mclick && Input.my > S.view.h - 190)) {
      delete Input.hit['KeyE']; delete Input.hit['Space'];
      if (this.shown < this.text.length) { this.shown = this.text.length; $('dlgText').textContent = this.text; }
      else this._next();
    }
  }
};

  x.beginPath(); x.moveTo(-11, -15); x.lineTo(-3, -13); x.moveTo(3, -13); x.lineTo(11, -15); x.stroke();
  x.strokeStyle = '#7a3a3a'; x.beginPath(); x.moveTo(-6, 3); x.quadraticCurveTo(0, who === 'oleg' ? 1 : 6, 6, 3); x.stroke();
  if (P.beard) { x.fillStyle = P.hair; x.globalAlpha = .55; x.beginPath(); x.ellipse(0, 6, 13, 9, 0, 0, Math.PI); x.fill(); x.globalAlpha = 1; }
  x.restore();
  x.strokeStyle = 'rgba(255,255,255,.14)'; x.lineWidth = 1; x.strokeRect(.5, .5, w - 1, h - 1);
}

function updateCars(dt) {
  const p = S.player;
  for (const c of S.cars) {
    c.x += Math.cos(c.a) * c.sp * dt;
    c.y += Math.sin(c.a) * c.sp * dt;
    if (c.x < -80) c.x = WORLD.w + 60; if (c.x > WORLD.w + 80) c.x = -60;
    if (c.y < -80) c.y = WORLD.h + 60; if (c.y > WORLD.h + 80) c.y = -60;
    const d = dist(c.x, c.y, p.x, p.y);
    if (d < 150 && c.horn <= 0 && Math.random() < 0.5 * dt) {
      c.horn = 0.6; Audio2.tone(rnd(300, 420), 0.24, 'square', 0.09);
    }
    c.horn = Math.max(0, c.horn - dt);
    /* если Олег прямо по курсу — водитель всё же тормозит */
    if (c.base === undefined) c.base = c.sp;
    const ahead = (p.x - c.x) * Math.cos(c.a) + (p.y - c.y) * Math.sin(c.a);
    const side = Math.abs(-(p.x - c.x) * Math.sin(c.a) + (p.y - c.y) * Math.cos(c.a));
    if (ahead > 0 && ahead < 130 && side < 26) c.sp = lerp(c.sp, c.base * 0.18, 1 - Math.exp(-5 * dt));
    else c.sp = lerp(c.sp, c.base, 1 - Math.exp(-1.6 * dt));
    if (d < 34 && p.invuln <= 0) {
      const kn = 300;
      const a = Math.atan2(p.y - c.y, p.x - c.x);
      p.vx = Math.cos(a) * kn; p.vy = Math.sin(a) * kn;
      hurt(p.onBike ? 20 : 14, 'Машина оказалась быстрее и тяжелее. Смена окончена.');
      if (p.onBike) { S.bike.speed = 0; damageBike(16); p.onBike = false; S.bike.parked = true; S.bike.x = p.x - 24; S.bike.y = p.y + 12; }
      Audio2.crash(); shake(14); S.stats.crashes++;
      toast(pick(['«Куда прёшь, монтаж!»', '«Я тут вообще-то еду»', 'Водитель показал жест из ПДД, которого нет в ПДД']), 'bad');
    }
  }
}

function updateDogs(dt) {
  const p = S.player;
  for (const d of S.dogs) {
    d.t -= dt; d.bark -= dt; d.bite = Math.max(0, d.bite - dt); d.scare = Math.max(0, d.scare - dt);
    const dp = dist(d.x, d.y, p.x, p.y);
    if (d.scare > 0) {
      const a = Math.atan2(d.y - p.y, d.x - p.x);
      d.vx = Math.cos(a) * 150; d.vy = Math.sin(a) * 150; d.state = 'flee';
    } else if (dp < 230 && dist(d.hx, d.hy, d.x, d.y) < 640 && !Dlg.open) {
      d.state = 'chase';
      const a = Math.atan2(p.y - d.y, p.x - d.x);
      const spd = p.onBike ? 168 : 138;
      d.vx = Math.cos(a) * spd; d.vy = Math.sin(a) * spd;
      if (d.bark <= 0) { d.bark = rnd(1.2, 3); if (dp < 420) Audio2.bark(); }
      if (dp < 24 && d.bite <= 0 && p.invuln <= 0) {
        d.bite = 1.6; hurt(6, 'Собака оказалась принципиальной.');
        p.stamina = clamp(p.stamina - 9, 0, 100);
        floater(p.x, p.y - 30, 'Ай!', '#ff4d5e');
        Audio2.bark(); addHeat(2);
      }
    } else {
      if (d.t <= 0) {
        d.t = rnd(1.4, 3.6);
        const a = Math.atan2(d.hy - d.y, d.hx - d.x) + rnd(-1.6, 1.6);
        const far = dist(d.hx, d.hy, d.x, d.y) > 220;
        const sp = rnd(30, 70);
        d.vx = Math.cos(far ? Math.atan2(d.hy - d.y, d.hx - d.x) : a) * sp;
        d.vy = Math.sin(far ? Math.atan2(d.hy - d.y, d.hx - d.x) : a) * sp;
      }
      d.state = 'wander';
    }
    /* отпугнуть сумкой */
    if (S.player.swing > 0 && dp < 78) { d.scare = 4.5; floater(d.x, d.y - 20, 'Тяв?!', '#ffd23f'); }
    d.x += d.vx * dt; d.y += d.vy * dt;
    d.phase += Math.hypot(d.vx, d.vy) * dt * 0.06;
    if (Math.hypot(d.vx, d.vy) > 1) d.dir = Math.atan2(d.vy, d.vx);
    for (const s of solidsNear(d.x, d.y, 12)) {
      const c = circleRect(d.x, d.y, 9, s);
      if (c && !s.soft) { d.x += c.nx * c.push; d.y += c.ny * c.push; d.vx *= .3; d.vy *= .3; }
    }
    d.x = clamp(d.x, 14, WORLD.w - 14); d.y = clamp(d.y, 14, WORLD.h - 14);
    d.vx *= Math.exp(-1.4 * dt); d.vy *= Math.exp(-1.4 * dt);
  }
}

function updateHools(dt) {
  const p = S.player;
  for (const h of S.hools) {
    h.t -= dt; h.cool = Math.max(0, h.cool - dt); h.say = Math.max(0, h.say - dt);
    h.flee = Math.max(0, h.flee - dt);
    const dp = dist(h.x, h.y, p.x, p.y);
    if (h.gone) {
      h.x += h.vx * dt; h.y += h.vy * dt;
      h.phase += Math.hypot(h.vx, h.vy) * dt * 0.05;
      if (Math.hypot(h.vx, h.vy) > 1) h.dir = Math.atan2(h.vy, h.vx);
      if (dist(h.x, h.y, h.hx, h.hy) > 360) { h.x = h.hx; h.y = h.hy; h.gone = false; h.cool = 25; h.vx = h.vy = 0; }
      continue;
    }

    if (h.flee > 0) {
      const a = Math.atan2(h.y - p.y, h.x - p.x);
      h.vx = Math.cos(a) * 130; h.vy = Math.sin(a) * 130;
    } else if (h.state === 'chase' && dp < 420) {
      const a = Math.atan2(p.y - h.y, p.x - h.x);
      const sp = h.type === 'thief' ? 128 : 104;
      h.vx = Math.cos(a) * sp; h.vy = Math.sin(a) * sp;
    } else {
      if (h.t <= 0) {
        h.t = rnd(1.8, 4.2);
        const far = dist(h.hx, h.hy, h.x, h.y) > 150;
        const a = far ? Math.atan2(h.hy - h.y, h.hx - h.x) : rnd(0, TAU);
        h.vx = Math.cos(a) * rnd(18, 44); h.vy = Math.sin(a) * rnd(18, 44);
      }
      /* заметил Олега */
      if (dp < 190 && h.cool <= 0 && !Dlg.open && S.screen === 'play') {
        if (h.type === 'thief' && p.tools.length > 0) h.state = 'chase';
        else if (h.type === 'beggar' && dp < 120) h.state = 'chase';
        if (h.say <= 0 && dp < 200) { h.say = 3; h.line = pick(HOOL_LINES[h.type]); }
      }
      if (dp > 430) h.state = 'idle';
    }
    /* контакт */
    if (dp < 30 && h.cool <= 0 && !Dlg.open && S.screen === 'play' && h.flee <= 0) {
      const fast = p.onBike && Math.abs(S.bike.speed) > 210;
      if (fast) {
        h.cool = 6; h.state = 'idle';
        floater(h.x, h.y - 26, pick(['Э!', 'Куда!', 'Гони, гони...']), '#ff2d95');
        Audio2.nope();
      } else { startEncounter(h); }
    }
    if (p.swing > 0 && dp < 74 && h.flee <= 0) {
      h.flee = 5; h.cool = 8; h.state = 'idle';
      floater(h.x, h.y - 24, pick(['Ай!', 'Ладно-ладно!', 'Мы пошли']), '#ffd23f');
      Audio2.thud();
    }
    h.x += h.vx * dt; h.y += h.vy * dt;
    h.phase += Math.hypot(h.vx, h.vy) * dt * 0.05;
    if (Math.hypot(h.vx, h.vy) > 1) h.dir = Math.atan2(h.vy, h.vx);
    for (const s of solidsNear(h.x, h.y, 14)) {
      const c = circleRect(h.x, h.y, 11, s);
      if (c && !s.soft) { h.x += c.nx * c.push; h.y += c.ny * c.push; h.vx *= .4; h.vy *= .4; }
    }
    h.x = clamp(h.x, 14, WORLD.w - 14); h.y = clamp(h.y, 14, WORLD.h - 14);
    h.vx *= Math.exp(-1.1 * dt); h.vy *= Math.exp(-1.1 * dt);
  }
}

function updatePeds(dt) {
  const p = S.player;
  const bikeFast = p.onBike && Math.abs(S.bike.speed) > 150;
  for (const q of S.peds) {
    q.say = Math.max(0, q.say - dt);
    q.hop = Math.max(0, q.hop - dt);
    if (q.down > 0) {                                  /* сбитый прохожий встаёт */
      q.down -= dt;
      if (q.down <= 0) { q.say = 3; q.line = pick(['Ну спасибо.', 'Я это запомню.', 'Права купил?']); }
      continue;
    }
    const d = dist(q.x, q.y, p.x, p.y);
    if (d > 1300) {                                    /* далеко — считаем дёшево, без сетки коллизий */
      q.t -= dt;
      if (q.t <= 0) {
        q.t = rnd(3, 7);
        const a = dist(q.x, q.y, q.hx, q.hy) > 260 ? Math.atan2(q.hy - q.y, q.hx - q.x) : rnd(0, TAU);
        q.vx = Math.cos(a) * q.sp; q.vy = Math.sin(a) * q.sp;
      }
      q.x = clamp(q.x + q.vx * dt, 14, WORLD.w - 14);
      q.y = clamp(q.y + q.vy * dt, 14, WORLD.h - 14);
      q.vx *= Math.exp(-1.6 * dt); q.vy *= Math.exp(-1.6 * dt);
      continue;
    }
    /* отскок от несущегося велосипеда */
    if (bikeFast && d < 78 && q.hop <= 0) {
      const a = Math.atan2(q.y - p.y, q.x - p.x);
      q.vx = Math.cos(a) * 190; q.vy = Math.sin(a) * 190; q.hop = 1.1;
      if (q.say <= 0) { q.say = 2; q.line = pick(['Э!', 'Куда несёшься!', 'Тут пешеходы!']); }
    } else if (q.hop <= 0) {
      q.t -= dt;
      if (q.t <= 0) {
        q.t = rnd(2.2, 5.5);
        const far = dist(q.x, q.y, q.hx, q.hy) > 260;
        const a = far ? Math.atan2(q.hy - q.y, q.hx - q.x) : rnd(0, TAU);
        q.vx = Math.cos(a) * q.sp; q.vy = Math.sin(a) * q.sp;
      }
      if (d < 150 && q.say <= 0 && Math.random() < 0.12 * dt * 60 / 60) { q.say = 3; q.line = pick(PED_LINES); }
    }
    /* наезд */
    if (d < 22 && bikeFast && q.down <= 0) {
      q.down = 3.2;
      const a = Math.atan2(q.y - p.y, q.x - p.x);
      q.vx = Math.cos(a) * 120; q.vy = Math.sin(a) * 120;
      S.bike.speed *= 0.45;
      hurt(4, 'Олег сбил прохожего и сам не устоял.');
      shake(7); Audio2.thud();
      addHeat(20, 'Ты сбил прохожего — во дворе это обсудят');
      witnessed(q.x, q.y);
      floater(q.x, q.y - 34, pick(['Ой!', 'Ай!', 'Куда!']), '#ff4d5e');
      toast(pick(['«Я извинился. Мысленно»', '«Пешеход появился внезапно. Как всегда»']), 'bad', 2400);
    }
    q.x += q.vx * dt; q.y += q.vy * dt;
    q.phase += Math.hypot(q.vx, q.vy) * dt * 0.05;
    if (Math.hypot(q.vx, q.vy) > 1) q.dir = Math.atan2(q.vy, q.vx);
    for (const sol of solidsNear(q.x, q.y, 14)) {
      const c = circleRect(q.x, q.y, 10, sol);
      if (c && !sol.soft) { q.x += c.nx * c.push; q.y += c.ny * c.push; q.vx *= .3; q.vy *= .3; }
    }
    q.x = clamp(q.x, 14, WORLD.w - 14); q.y = clamp(q.y, 14, WORLD.h - 14);
    q.vx *= Math.exp(-1.6 * dt); q.vy *= Math.exp(-1.6 * dt);
  }
}

function startEncounter(h) {
  const p = S.player;
  h.state = 'talk'; h.vx = h.vy = 0;
  const partnerReady = S.partner.cooldown <= 0 && S.partner.active <= 0;
  const charm = clamp(20 + p.rep * 1.4 - p.drunk * 0.5, 5, 92);
  const opts = [
    {
      label: 'Поговорить по-человечески', hint: 'шанс ' + Math.round(charm) + '%',
      fn: () => {
        if (Math.random() * 100 < charm) {
          h.flee = 6; h.cool = 30; h.state = 'idle';
          addRep(1, 'Разошлись словами');
          Dlg.one('oleg', pick([
            'Слушай, у меня смена. У тебя двор. Давай не мешать друг другу.',
            'Хочешь, покажу, как камера пишет? Вон та. Уже пишет.',
            'Я тут по заявке. Скажу Тамаре — она вас всех по именам знает.'
          ]));
        } else {
          h.cool = 4;
          addHeat(4);
          Dlg.one('hool', pick(['Не, ну ты не понял. Мелочь давай.', 'Слова — это хорошо. Полтинник — лучше.']));
        }
      }
    },
    {
      label: 'Дать 50 ₽ и ехать дальше', hint: p.money >= 50 ? '−50 ₽' : 'нет денег', disabled: p.money < 50,
      fn: () => {
        addMoney(-50); h.flee = 7; h.cool = 45; h.state = 'idle';
        S.flags.beggarPaid++;
        Dlg.one('hool', pick(['Уважаю. Опору покараулю.', 'Вот это по-соседски.', 'Ты нормальный. Камеру не трону.']));
      }
    },
    {
      label: 'Отмахнуться сумкой с инструментом', hint: 'шумно, внимание +',
      fn: () => {
        p.swing = 0.35; p.swingCd = 1;
        Audio2.thud(); shake(6);
        addHeat(16, 'Во дворе шумно — внимание растёт');
        witnessed(p.x, p.y);
        if (Math.random() < 0.7) {
          h.flee = 7; h.cool = 30; h.state = 'idle';
          Dlg.one('hool', 'Ты чего сумкой машешь, там же инструмент казённый!');
        } else {
          hurt(9, 'Спор во дворе закончился не в пользу Олега.');
          h.cool = 12; h.flee = 3;
          Dlg.one('oleg', 'Сумка тяжёлая. Но и они не картонные.');
        }
      }
    },
    {
      label: 'Вызвать напарника Саню', hint: partnerReady ? 'приедет через ~10 с' : 'занят',
      disabled: !partnerReady,
      fn: () => { callPartner(); h.flee = 6; h.cool = 25; h.state = 'idle'; }
    },
    {
      label: 'Уехать / убежать', hint: 'быстро и без последствий',
      fn: () => {
        h.cool = 10; h.state = 'idle'; h.flee = 0;
        p.stamina = clamp(p.stamina - 10, 0, 100);
        Dlg.one('oleg', pick(['Отступление — это тоже маршрут.', 'У меня заявка, а не дискуссия.']));
      }
    }
  ];
  const intro = h.type === 'thief' && p.tools.length
    ? pick(HOOL_LINES.thief) + ' У тебя ' + TOOLS[p.tools[0]].name.toLowerCase() + ' лишний, смотрю.'
    : pick(HOOL_LINES[h.type]);
  Dlg.one('hool', intro, opts);
  /* вор может успеть цапнуть инструмент, если Олег тормозит */
  if (h.type === 'thief') h.wantSteal = true;
}

function stealTool(h) {
  const p = S.player;
  if (!p.tools.length) return;
  const idx = Math.floor(Math.random() * p.tools.length);
  const t = p.tools.splice(idx, 1)[0];
  p.tool = clamp(p.tool, 0, Math.max(0, p.tools.length - 1));
  h.holds = t; h.gone = true; h.flee = 0;
  const a = Math.atan2(h.hy - h.y, h.hx - h.x) + rnd(-0.6, 0.6);
  h.vx = Math.cos(a) * 90; h.vy = Math.sin(a) * 90;
  toast('Щипач увёл: ' + TOOLS[t].name + '!', 'bad', 3200);
  Audio2.nope();
  Dlg.one('oleg', '«' + TOOLS[t].name + ' положи! Он сам тебя выбрал неправильно».');
}

function callPartner() {
  if (S.partner.cooldown > 0 || S.partner.active > 0) { toast('Саня пока недоступен', 'bad', 1600); return false; }
  S.partner.eta = 10; S.partner.cooldown = 150;
  S.partner.forgot = Math.random() < 0.45;
  Audio2.phone();
  toast('Саня едет. Обещал 5 минут — значит 10', 'info', 2600);
  return true;
}
function updatePartner(dt) {
  const P = S.partner;
  if (P.cooldown > 0) P.cooldown -= dt;
  if (P.eta > 0) {
    P.eta -= dt;
    if (P.eta <= 0) {
      P.active = 26;
      const p = S.player;
      let sx = p.x + rnd(-60, 60), sy = p.y + rnd(-60, 60);
      if (!freeSpot(sx, sy, 12)) { sx = p.x + 30; sy = p.y + 30; }
      S.npcs.push({ kind: 'sanya', x: sx, y: sy, vx: 0, vy: 0, phase: 0, dir: 0, life: 26, say: 4, line: P.forgot ? 'Приехал! Правда, стремянку забыл.' : 'Я тут. Держи лестницу, я подстрахую.' });
      for (const h of S.hools) if (dist2(h.x, h.y, p.x, p.y) < 300 * 300) { h.flee = 8; h.cool = 40; h.state = 'idle'; }
      Audio2.ok();
      const line = P.forgot
        ? 'Я приехал! Тестер взял, стремянку — нет. Зато настроение привёз.'
        : 'Готов. Что держим — лестницу или оборону?';
      Dlg.one('sanya', line);
      if (!P.forgot) {
        S.partnerBonus = true;
        if (S.mission && S.mission.stage === 'work') toast('Саня страхует: качество монтажа +8', 'good');
      }
    }
  }
  if (P.active > 0) {
    P.active -= dt;
    if (P.active <= 0) { S.partnerBonus = false; S.npcs = S.npcs.filter(n => n.kind !== 'sanya'); }
  }
  for (const n of S.npcs) {
    if (n.kind !== 'sanya') continue;
    const p = S.player;
    const d = dist(n.x, n.y, p.x, p.y);
    if (d > 90) {
      const a = Math.atan2(p.y - n.y, p.x - n.x);
      n.vx = Math.cos(a) * 120; n.vy = Math.sin(a) * 120;
    } else { n.vx *= 0.85; n.vy *= 0.85; }
    n.x += n.vx * dt; n.y += n.vy * dt;
    n.phase += Math.hypot(n.vx, n.vy) * dt * 0.05;
    if (Math.hypot(n.vx, n.vy) > 1) n.dir = Math.atan2(n.vy, n.vx);
    n.say = Math.max(0, n.say - dt);
  }
}

/* 19. ЧОП «Бдительный сосед» — уровень внимания                        */
/* ------------------------------------------------------------------ */
function updateHeat(dt) {
  S.heat = clamp(S.heat - BAL.heatDecay * dt * (S.player.onBike ? 0.8 : 1), 0, BAL.heatMax);
  const want = S.heat >= 70 ? 2 : S.heat >= 42 ? 1 : 0;
  while (S.guards.length < want) {
    const p = S.player;
    let gx = p.x, gy = p.y, best = -1;
    for (let i = 0; i < 10; i++) {                 /* ищем точку подальше от Олега */
      const a = rnd(0, TAU), r = 620;
      const tx = clamp(p.x + Math.cos(a) * r, 40, WORLD.w - 40);
      const ty = clamp(p.y + Math.sin(a) * r, 40, WORLD.h - 40);
      const d = dist(tx, ty, p.x, p.y);
      if (d > best) { best = d; gx = tx; gy = ty; }
      if (d > 520) break;
    }
    S.guards.push({ x: gx, y: gy, vx: 0, vy: 0, dir: 0, phase: 0, siren: 0, catchCd: 0 });
    toast('ЧОП «Бдительный сосед» выехал по вызову', 'bad', 3000);
    Audio2.siren();
  }
  while (S.guards.length > want) S.guards.pop();

  for (const g of S.guards) {
    const p = S.player;
    const a = Math.atan2(p.y - g.y, p.x - g.x);
    const sp = 210 + S.heat * 0.9;
    g.vx = lerp(g.vx, Math.cos(a) * sp, 1 - Math.exp(-2.4 * dt));
    g.vy = lerp(g.vy, Math.sin(a) * sp, 1 - Math.exp(-2.4 * dt));
    g.x += g.vx * dt; g.y += g.vy * dt;
    g.dir = angLerp(g.dir, a, 1 - Math.exp(-8 * dt));
    g.phase += dt * 6;
    for (const s of solidsNear(g.x, g.y, 16)) {
      const c = circleRect(g.x, g.y, 13, s);
      if (c && !s.soft) { g.x += c.nx * c.push; g.y += c.ny * c.push; }
    }
    g.siren -= dt;
    if (g.siren <= 0 && dist(g.x, g.y, p.x, p.y) < 700) { g.siren = 1.6; Audio2.siren(); }
    g.catchCd = Math.max(0, g.catchCd - dt);
    if (dist(g.x, g.y, p.x, p.y) < 30 && g.catchCd <= 0 && !Dlg.open) {
      g.catchCd = 8;
      const fine = Math.round(clamp(120 + S.heat * 5, 120, 700));
      addMoney(-fine, 'Штраф от ЧОП');
      S.stats.fines++;
      S.heat = 18;
      S.player.vx = -g.vx * 0.6; S.player.vy = -g.vy * 0.6;
      if (S.player.onBike) S.bike.speed *= 0.3;
      Dlg.one('guard', pick([
        'Вы кто? Монтажник? А наряд-допуск? А совесть? Штраф ' + fine + ' рублей, распишитесь мысленно.',
        'Бабушки жаловались. Бабушки не ошибаются. ' + fine + ' рублей.',
        'Я вас не задерживаю. Я вас штрафую. Это разные вещи.'
      ]));
    }
  }
}

function workStepText() {

    return 'Сдать объект заказчику';

  if (d.kind === 'final' && m.data.step === 5) return 'Подъезжай к бухте и жми F — отогнать';
  return 'Качество: ' + Math.round(m.quality) + '%';
}

/* цель на карте */
function missionTarget() {
  const m = S.mission; if (!m) return null;
  const d = m.def;
  if (m.stage === 'tools') { const p = POIS.find(p => p.id === 'warehouse'); return { x: p.x, y: p.y, label: 'Склад' }; }
  if (m.stage === 'travel') return { x: d.site.x, y: d.site.y, label: 'Объект' };
  if (m.stage === 'work') {
    if (d.kind === 'final') {
      const st = m.data.step;
      if (st === 0) return { x: d.site.x, y: d.site.y, label: 'Вход' };
      if (st >= 1 && st <= 4) { const c = m.data.cams[st - 1]; return { x: c.p.x, y: c.p.y, label: 'Опора М' + st }; }
      if (st === 5 && m.data.coils && m.data.coils.length) {
        const c = m.data.coils.find(c => !c.saved && !c.lost);
        if (c) return { x: c.x, y: c.y, label: 'Кабель' };
      }
      return { x: d.site.x, y: d.site.y, label: 'Объект' };
    }
    if (d.kind === 'night' && m.data.found) { const pl = m.data.poles[m.data.broken]; return { x: pl.p.x, y: pl.p.y, label: 'Камера' }; }
    return { x: d.site.x, y: d.site.y, label: 'Объект' };
  }
  if (m.stage === 'verify') return { x: d.site.x, y: d.site.y, label: 'Проверка' };
  if (m.stage === 'report') return { x: d.client.x, y: d.client.y, label: 'Сдача' };
  return null;
}

/* ------------------------------------------------------------------ */
/* 21. Выполнение этапов                                                */
/* ------------------------------------------------------------------ */
function updateMission(dt) {
  const m = S.mission; if (!m) return;
  if (m.def.time && (m.stage === 'travel' || m.stage === 'work') && m.stage !== 'brief') {
    m.timer -= dt;
    if (m.timer <= 0 && !m.data.late) {
      m.data.late = true;
      Audio2.nope();
      Dlg.one('tamara', 'Олег, приёмка закончилась. Нина Пална сказала слово, которое я не буду повторять в эфир. Доделывай, но премии не будет.');
    }
  }
  m.target = missionTarget();
  if (m.def.kind === 'final' && m.stage === 'work' && m.data.step === 5) updateCableDefense(dt);
}

function tryStartWork() {
  const m = S.mission; if (!m) return false;
  const d = m.def, p = S.player;
  const mt = missingTools(d.tools);
  if (mt.length) {
    Dlg.one('oleg', 'Не хватает: ' + mt.map(t => TOOLS[t].name).join(', ') + '. Без этого — только вид сделать.', [
      { label: 'Съездить на склад', fn: () => { m.stage = 'tools'; } },
      { label: 'Вызвать Саню (вдруг привезёт)', hint: S.partner.cooldown <= 0 ? 'C' : 'занят', disabled: S.partner.cooldown > 0, fn: () => { callPartner(); } },
      { label: 'Ладно, потом', fn: () => {} }
    ]);
    return true;
  }
  if (p.drunk > 20 && !m.data.drunkWarned) {
    m.data.drunkWarned = true;
    addRep(-3, 'Приехал на объект «после обеда»');
    Dlg.one('client', pick([
      'Молодой человек, вы дышите куда-то мимо. Работать-то будете?',
      'От вас пахнет не монтажом. Я всё скажу вашему начальству.'
    ]));
  }
  if (d.kind === 'door') { startDoorGame(q => finishWork(q)); return true; }
  if (d.kind === 'camera') {
    startCameraGame({ zone: d.zone || 'контрольная зона' }, q => {
      const pole = POLES.filter(pl => pl.mount).sort((a, b) => dist2(a.x, a.y, d.site.x, d.site.y) - dist2(b.x, b.y, d.site.x, d.site.y))[0];
      if (pole) { pole.installed = true; pole.camAng = 0.5; }
      finishWork(q);
    });
    return true;
  }
  if (d.kind === 'search') { m.stage = 'work'; toast('Обыщи двор: E у подозрительных мест', 'info', 3000); return true; }
  if (d.kind === 'night') { m.stage = 'work'; toast('Ищи мёртвую камеру. Фонарик — F', 'info', 3000); return true; }
  if (d.kind === 'final') { m.stage = 'work'; startFinalStep(); return true; }
  return false;
}

function finishWork(q) {
  const m = S.mission; if (!m) return;
  m.quality = clamp(q, 0, 100);
  S.stats.bestQ = Math.max(S.stats.bestQ, m.quality);
  m.stage = 'verify';
  toast('Монтаж завершён. Качество ' + Math.round(m.quality) + '%. Теперь проверка (E)', 'info', 3200);
  saveGame();
}

function payoutMission() {
  const m = S.mission, d = m.def, p = S.player;
  const q = m.quality;
  let pay = d.pay * (0.55 + 0.75 * q / 100);
  const lines = [];
  if (m.data.late) { pay *= 0.5; lines.push('Опоздание: −50%'); }
  if (p.drunk > 20) { pay *= 0.7; lines.push('Состояние «после обеда»: −30%'); }
  if (p.drunk <= 0.5) { pay *= 1.12; lines.push('Трезвая смена: +12%'); S.stats.sober++; }
  if (S.heat > 60) { pay *= 0.9; lines.push('Шум во дворе: −10%'); }
  pay = Math.round(pay);
  let rep = q >= 88 ? 6 : q >= 72 ? 4 : q >= 55 ? 2 : q >= 40 ? 0 : -3;
  if (m.data.late) rep -= 2;
  if (p.drunk > 20) rep -= 3;

  addMoney(pay, 'Оплата за «' + d.title + '»');
  addRep(rep, rep >= 0 ? 'Работа принята' : 'Работа принята с оговорками');
  S.missionsDone.push({ id: d.id, q: Math.round(q), pay, late: !!m.data.late });
  S.stats.fixed++;

  const bonus = q >= 90 && !m.data.late && p.drunk <= 0.5 ? Math.round(d.pay * 0.25) : 0;
  const summary = [
    { who: d.client && d.client.who !== 'tamara' ? d.client.who : 'tamara', text: d.done },
    {
      who: 'boris', text: (q >= 88
        ? 'Смотрел объект. Придраться не к чему, а хочется. Молодец, Олег.'
        : q >= 60
        ? 'Нормально. Не блестяще, но работает. Так и запишем: «работает».'
        : 'Олег. Оно работает, но как-то по-олеговски. Переделывать не заставлю, но ты подумай.')
        + (bonus ? ' Держи премию ' + bonus + ' ₽.' : '')
        + (lines.length ? '\n\nПо расчёту: ' + lines.join('; ') + '.' : '')
    }
  ];
  if (bonus) addMoney(bonus, 'Премия от Борисыча');

  m.stage = 'done';
  Dlg.seq(summary, () => {
    S.missionIndex++;
    S.mission = null;
    saveGame();
    if (S.missionIndex >= MISSIONS.length) { endGame(true); return; }
    S.phoneRing = rnd(6, 10);
    toast('Тамара скоро позвонит с новой заявкой (R — журнал)', 'info', 3400);
  });
}
